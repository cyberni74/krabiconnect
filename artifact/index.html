ห้องบัลลังก์ ใส่ยาแก้พิษลงถ้วยขณะที่มัลวอร์ยังเสียสมาธิ`,"Befreie Ser Aldric im Kerker: Wein mit Schlafkraut (Berta) macht Knorr müde, der Schlüssel hängt am Haken.":`ช่วยเซอร์อัลดริกในคุกใต้ดิน: ไวน์ผสมสมุนไพรกล่อมประสาท (เบอร์ตา) ทำให้คนอร์ง่วง กุญแจแขวนอยู่ที่ตะขอ`,"Finde das Geheimfach hinter dem Wandteppich im Thronsaal. Die Runenfolge kennt Ser Aldric.":`หาช่องลับหลังผ้าทอผนังในห้องบัลลังก์ เซอร์อัลดริกรู้ลำดับอักษรรูน`,"Klage Malvor an: Giftflasche, Aldrics Zeugnis und der genesene König.":`กล่าวหามัลวอร์: ขวดพิษ คำให้การของอัลดริก และกษัตริย์ที่หายดีแล้ว`,"Sprich mit Ser Roderic.":`คุยกับเซอร์โรเดอริก`,"Rotes Buch":`หนังสือสีแดง`,"Das rote Buch: 'Vom Blut der Könige'. Es ist warm, als hätte es gerade jemand zugeklappt.":`หนังสือสีแดง: 'ว่าด้วยเลือดของราชา' มันอุ่น ราวกับเพิ่งมีใครปิดมันลง`,"Schwarzes Buch":`หนังสือสีดำ`,"Das schwarze Buch: 'Nachtbuch der Raben'. Auf dem Einband ein Totenkopf, der freundlicher guckt als der Hausmeister.":`หนังสือสีดำ: 'บันทึกราตรีของอีกา' บนปกมีหัวกะโหลกที่หน้าตาใจดีกว่าภารโรงซะอีก`,"Blaues Buch":`หนังสือสีน้ำเงิน`,"Das blaue Buch: 'Himmelskunde für Anfänger'. Nur der Titel ist für Anfänger.":`หนังสือสีน้ำเงิน: 'ดาราศาสตร์สำหรับมือใหม่' มือใหม่เฉพาะชื่อเรื่องนั่นแหละ`,"Grünes Buch":`หนังสือสีเขียว`,"Das grüne Buch: 'Moos, Moder und Moral'. Es riecht nach Wald und Rechthaberei.":`หนังสือสีเขียว: 'ตะไคร่ ความเน่า และศีลธรรม' กลิ่นป่ากับความดื้อรั้นถือตัวว่าถูกเสมอ`,"Die Bücher sind eingerastet. Ich lasse sie in Ruhe, sie sind in Frieden.":`หนังสือล็อกเข้าที่แล้ว ปล่อยมันไว้เถอะ ให้มันสงบสุขไป`,"Das vierte Buch klickt. In der Wand rastet etwas ein. Der große Bücherschrank hinten knackt wie ein altes Knie.":`หนังสือเล่มที่สี่ดังคลิก มีบางอย่างในผนังล็อกเข้าที่ ตู้หนังสือใหญ่ด้านหลังลั่นเอี๊ยดอ๊าดเหมือนเข่าคนแก่`,"Klack. Alle Bücher springen zurück, als hätte ich ihnen die Würde genommen.":`กึก หนังสือทุกเล่มดีดกลับ ราวกับฉันไปแย่งศักดิ์ศรีของมันมา`,"Falsch herum, Junge. Bücher haben eine Ordnung. Wie Sterne und Steuern.":`ผิดทางแล้วหนุ่มน้อย หนังสือมีลำดับของมัน เหมือนดวงดาวกับภาษี`,"Das Ding wiegt weniger als ein Gedanke, oder mehr als ein Gewissen. Jedenfalls gehört es nicht auf die Waage.":`ของสิ่งนี้เบากว่าความคิด หรือไม่ก็หนักกว่าความรู้สึกผิด ยังไงก็ไม่ควรเอาขึ้นตาชั่ง`,"Die Waage ist im Gleichgewicht. Wer jetzt noch etwas drauflegt, ist selber schuld.":`ตาชั่งสมดุลแล้ว ใครวางอะไรเพิ่มอีกก็ซวยเอง`,"Die Schalen schwingen, zittern, und stehen still. Gleichgewicht. Auf dem Beutel links steht 'V' und rechts liegen genau fünf Pfund Wahrheit.":`จานชั่งแกว่ง สั่น แล้วนิ่ง สมดุล ถุงด้านซ้ายมีตัว 'V' ส่วนด้านขวาคือความจริงหนักห้าปอนด์พอดี`,"Die Waage ist zufrieden. Ich bin es ein bisschen auch.":`ตาชั่งพอใจแล้ว ฉันก็พอใจนิดหน่อยเหมือนกัน`,"Zu viel! Die rechte Schale kippt. Bran, das ist keine Metzgerei.":`มากไป! จานขวาเอียงแล้ว Bran นี่ไม่ใช่ร้านขายเนื้อนะ`,"Myrddins Bibliothek":`ห้องสมุดของ Myrddin`,"Zum Burghof":`ไปลานปราสาท`,"Magier Myrddin":`จอมเวทย์ Myrddin`,"Myrddin, Magier des Ordens. Ein Bart, in dem sich Spinnen und Sterne verirren. Seine Augen glühen leise, wenn er lügt. Oder nachdenkt.":`Myrddin จอมเวทย์แห่งภราดรภาพ เคราของเขามีทั้งแมงมุมและดวงดาวหลงอยู่ ตาเรืองแสงจางๆ เวลาโกหก หรือไม่ก็เวลาคิด`,"Ein Gegengift. Moorhexe, Schierlingsbann, ein Hauch Wehmut. Sehr gut gebraut.":`ยาถอนพิษ แม่มดหนองน้ำ ยาต้านเฮมล็อก กับความเศร้าอีกนิด ต้มได้ดีมาก`,"Aber wie willst du es in den König bekommen? Der Kanzler reicht ihm jeden Abend den Kelch. Persönlich.":`แต่จะป้อนให้กษัตริย์ได้ยังไงล่ะ ทุกเย็นท่านอัครเสนาบดีเป็นคนยื่นถ้วยให้ด้วยตัวเอง`,"Lenke Malvor ab. Ein Mann, der liest, schaut nicht auf Kelche. Und Hexenzeug schreckt ihn ab, merk dir das.":`หันเหความสนใจ Malvor ซะ คนที่กำลังอ่านหนังสือจะไม่มองถ้วย แล้วของแม่มดทำให้เขากลัว จำไว้ล่ะ`,"Myrddin: Ein Moortalisman! Er riecht nach Kröte. Behalte ihn. Ich brauche meine Nase noch.":`Myrddin: เครื่องรางแห่งหนองน้ำ! กลิ่นเหมือนคางคกเลย เก็บไว้เองเถอะ จมูกฉันยังต้องใช้อยู่`,"Myrddin: Mein Siegel. Es steht dir besser als mir.":`Myrddin: ตราของข้า เหมาะกับเจ้ามากกว่าข้าอีก`,"Myrddin: Hübsch geschmiedet. Schief, aber ehrlich. Wie die meisten Wahrheiten.":`Myrddin: ตีออกมาสวยดี เบี้ยวนิดๆ แต่ซื่อตรง เหมือนความจริงส่วนใหญ่`,"Ah. Der Totengräberjunge. Roderic hat mich vorgewarnt. 'Schlicht, stur, vom Moor gezeichnet.' Ich mag solche.":`อ้อ เด็กขุดหลุมศพ Roderic เตือนข้ามาแล้ว 'เรียบง่าย ดื้อ มีรอยหนองน้ำติดตัว' ข้าชอบคนแบบนี้`,"Die Prüfung der Weisheit besteht aus drei Dingen: Ordne die Bücher, wiege die Wahrheit, beantworte die Tür.":`บททดสอบแห่งปัญญามีสามอย่าง จัดหนังสือให้เป็นระเบียบ ชั่งความจริง และตอบประตู`,"Ich habe alle drei Prüfungen bestanden.":`ฉันผ่านบททดสอบครบทั้งสามแล้ว`,"Bücher geordnet, Wahrheit gewogen, Tür beantwortet. Du bist weniger dumm, als du aussiehst.":`จัดหนังสือแล้ว ชั่งความจริงแล้ว ตอบประตูแล้ว เจ้าโง่น้อยกว่าที่หน้าตาดูนะ`,"Hier, das Siegel der Weisheit. Es trägt ein offenes Auge. Du solltest deins auch geöffnet halten.":`นี่ ตราแห่งปัญญา มีรูปตาที่เปิดอยู่ เจ้าก็ควรลืมตาไว้เหมือนกัน`,"Und etwas, das ich dir schulde: Kanzler Malvor vergiftet den König. Ich rieche es seit Wochen. Ich habe nur keinen Beweis.":`แล้วมีอีกอย่างที่ข้าติดค้างเจ้า อัครเสนาบดี Malvor วางยาพิษกษัตริย์ ข้าได้กลิ่นมาหลายสัปดาห์แล้ว แต่ไม่มีหลักฐาน`,"Hinter dem Wandteppich im Thronsaal hat er ein Geheimfach. Mehr weiß ich nicht. Das Fach hat vier Runenknöpfe. Man müsste die Reihenfolge kennen.":`หลังผ้าทอผนังในท้องพระโรงมีช่องลับ ข้ารู้แค่นั้น ช่องนั้นมีปุ่มอักขระสี่ปุ่ม ต้องรู้ลำดับถึงจะเปิดได้`,"Wie funktioniert die Prüfung?":`บททดสอบนี้ทำยังไง?`,"Erstens: Vier Bücher liegen auf dem Tisch. Zieh sie in der richtigen Reihenfolge. Das öffnet den Geheimschrank.":`หนึ่ง มีหนังสือสี่เล่มวางอยู่บนโต๊ะ ดึงตามลำดับที่ถูกต้อง แล้วตู้ลับจะเปิด`,"Zweitens: Die Waage links. Gleiche die linke Schale mit Gewichten aus dem Messkasten aus.":`สอง ตาชั่งทางซ้าย ถ่วงจานซ้ายให้สมดุลด้วยตุ้มน้ำหนักจากกล่องเครื่องวัด`,"Drittens: Der Geheimschrank stellt eine Frage. Antworte, und er öffnet sich. Ein Tipp: In der Bibliothek verbirgt sich alles in Büchern.":`สาม ตู้ลับจะถามคำถาม ตอบแล้วมันจะเปิด คำใบ้ คือในห้องสมุด ทุกอย่างซ่อนอยู่ในหนังสือ`,"Welche Reihenfolge haben die Bücher?":`หนังสือเรียงลำดับยังไง?`,"Ich verrate nicht, nur: Lies das Zeitalter-Buch auf dem Pult. Und sieh dir den Globus an. Er weiß, wo die Welt anfängt.":`ข้าไม่บอกหรอก แค่ไปอ่านหนังสือยุคสมัยบนแท่นอ่าน แล้วดูลูกโลกด้วย มันรู้ว่าโลกเริ่มต้นที่ไหน`,"Die Farben sind kein Zufall. Das Rot trägt Wärme, das Schwarz Kälte, das Blau Weite, das Grün Wucherung.":`สีทั้งหลายไม่ใช่เรื่องบังเอิญ แดงให้ความร้อน ดำให้ความเย็น น้ำเงินให้ความกว้างใหญ่ เขียวให้การเติบโตงอกเงย`,"Und die Waage?":`แล้วตาชั่งล่ะ?`,"Links der Beutel mit der Aufschrift. Rechts legst du Gewichte. Die Eichtafel daneben sagt, was ein Schädel wiegt.":`ทางซ้ายคือถุงที่มีข้อความ ทางขวาเจ้าวางตุ้มน้ำหนัก แผ่นมาตรฐานข้างๆ บอกว่ากะโหลกหนักเท่าไหร่`,"Aber hüte dich: Ein Becher ist nicht nur ein Becher. Er wiegt etwas. Und ein Knochen auch.":`แต่ระวังไว้ ถ้วยไม่ใช่แค่ถ้วย มันมีน้ำหนัก กระดูกก็เหมือนกัน`,"Zum Rätsel der Tür ...":`ส่วนปริศนาของประตู ...`,"Die Tür fragt, was mehr wird, je mehr man nimmt. Ich sage nur: Ich gehe viel davon. Im Alter braucht man mehr davon.":`ประตูถามว่า อะไรยิ่งเอาออกยิ่งเพิ่มขึ้น ข้าบอกได้แค่ว่า ข้าเดินไปเยอะเลย พอแก่แล้วยิ่งต้องใช้เยอะ`,"Tipp: Wer geht, hinterlässt sie. Wer bleibt, hat sie nicht.":`คำใบ้ คนที่จากไปทิ้งมันไว้ คนที่อยู่ไม่มี`,"Was wisst Ihr über den Kanzler?":`ท่านรู้อะไรเกี่ยวกับอัครเสนาบดีบ้าง?`,"Malvor wollte schon früh Macht. Er misst alles in Gold und alle in Nützlichkeit.":`Malvor ต้องการอำนาจตั้งแต่เด็ก เขาวัดทุกอย่างด้วยทอง และวัดทุกคนด้วยประโยชน์`,"Wenn er den König vergiftet hat, hat er das Gift selbst gemischt. Er rührt nur, was er selbst bereitet.":`ถ้าเขาวางยากษัตริย์ เขาก็ผสมพิษเองกับมือ เขาคนนี้คนอื่นปรุงให้ไม่เคยแตะ มีแต่ของที่ตัวเองปรุง`,"Der König ist krank, nicht wahr?":`กษัตริย์ป่วยใช่ไหม?`,"Er ist nicht krank, er wird kränker gemacht. Schierling, in kleinen Dosen. Jeden Abend im Wein.":`ไม่ได้ป่วยหรอก แต่ถูกทำให้ป่วยหนักขึ้นเรื่อยๆ ยาพิษเฮมล็อกทีละนิด ใส่ในไวน์ทุกเย็น`,"Gegen Schierling hilft ein Trank aus Moorwasser, Rabenfeder und Alraune. Hast du so etwas?":`ยาแก้เฮมล็อกคือยาจากน้ำหนองน้ำ ขนอีกา และแมนเดรก เจ้ามีอะไรแบบนั้นไหม?`,"Ich hätte da etwas Türkisfarbenes. Eine Hexe hat es gebraut.":`ฉันมีของสีเทอร์ควอยซ์อยู่อย่างหนึ่ง แม่มดต้มให้`,"Dann zeig es mir. Gib es mir kurz in die Hand.":`งั้นเอามาให้ข้าดูหน่อย ส่งมาใส่มือข้าแป๊บนึง`,"Was ist das für ein Turm?":`นั่นหอคอยอะไรครับ?`,"Mein Turm. Hunderttausend Bücher, tausend Staubflocken pro Buch und eine Geschichte für jeden, der nicht schläft.":`หอคอยของข้า หนังสือแสนเล่ม ฝุ่นพันก้อนต่อเล่ม และเรื่องเล่าสำหรับทุกคนที่นอนไม่หลับ`,"Der Orden bezahlt mich dafür, dass ich ihnen nicht erkläre, was ich weiß.":`ภราดรภาพจ่ายเงินข้า เพื่อให้ข้าไม่ต้องอธิบายว่าข้ารู้อะไร`,"Gib auf die Sterne acht. Sie sind die einzigen, die nie lügen.":`ระวังดวงดาวไว้ พวกมันเป็นสิ่งเดียวที่ไม่เคยโกหก`,Waage:`ตาชั่ง`,"Die Waage steht im Gleichgewicht. Links hängt ein Beutel mit einem 'V'. Rechts liegt die Lösung.":`ตาชั่งอยู่ในสมดุล ทางซ้ายแขวนถุงที่มีตัว 'V' ทางขวาคือเฉลย`,"Eine Waage. Links hängt ein schwerer Beutel mit einem aufgestickten 'V'. Die linke Schale sinkt. Es fehlt etwas auf der rechten.":`ตาชั่งอันหนึ่ง ทางซ้ายแขวนถุงหนักที่ปักตัว 'V' จานซ้ายจมลง ฝั่งขวายังขาดอะไรไปสักอย่าง`,"Ich muss Gewichte auflegen oder wegnehmen. Mit der Hand wiegt man nur das Gewissen.":`ต้องวางหรือเอาตุ้มน้ำหนักออก ใช้มือชั่งได้แค่ความรู้สึกผิด`,"Ich lege Dinge auf die rechte Schale, bis sie zur linken passt. Der Messkasten hat Gewichte.":`ฉันวางของลงจานขวาจนมันเท่ากับจานซ้าย กล่องเครื่องวัดมีตุ้มน้ำหนักอยู่`,"Es liegt nichts auf der Schale.":`ไม่มีอะไรบนจานเลย`,"Ich nehme alles wieder weg. Myrddin hat das Gleichgewicht schon gesehen. Es zählt.":`ฉันเอาทุกอย่างออกหมด Myrddin เห็นสมดุลไปแล้ว นับแล้ว`,"Ich räume die Schale leer. Ordnung ist der Anfang der Weisheit. Oder des Mittagessens.":`ฉันเก็บจานให้ว่าง ความเป็นระเบียบคือจุดเริ่มต้นของปัญญา หรือไม่ก็ของมื้อเที่ยง`,Eichtafel:`แผ่นมาตรฐาน`,"Eine kleine Messingtafel: 'Eichgewichte: Totenschädel III. Zinnbecher II. Knochen I.' Darunter, kleiner: 'Der Beutel V.'":`แผ่นทองเหลืองเล็กๆ: 'น้ำหนักมาตรฐาน กะโหลกศีรษะ III ถ้วยดีบุก II กระดูก I' ข้างล่าง ตัวเล็กกว่า: 'ถุง V'`,Messkasten:`กล่องเครื่องวัด`,"Ein Kasten mit Gewichten und Makabrem. Myrddin wiegt nichts mit Metall, wenn er einen Schädel haben kann.":`กล่องใส่ตุ้มน้ำหนักกับของน่าขนลุก Myrddin ไม่ชั่งอะไรด้วยโลหะหรอก ถ้ามีกะโหลกให้ใช้`,"Alle Gewichte sind weg. Myrddin wird das bemerken.":`ตุ้มน้ำหนักหายหมดแล้ว Myrddin ต้องสังเกตเห็นแน่`,Lesetisch:`โต๊ะอ่านหนังสือ`,"Ein langer Lesetisch mit Kerzen. Vier Bücher liegen aufgereiht. Man spürt, dass hier Reihenfolge gilt.":`โต๊ะอ่านหนังสือยาวมีเทียนตั้งอยู่ หนังสือสี่เล่มวางเรียงเป็นแถว รู้สึกได้เลยว่าที่นี่ลำดับสำคัญ`,"Ein Tisch. Zu schwer, zu festgeschraubt, zu viel Geschichte.":`โต๊ะตัวหนึ่ง หนักเกิน ยึดแน่นเกิน ประวัติศาสตร์เยอะเกิน`,"Ich ziehe es. Es klickt. Wegnehmen geht nicht, es steckt in einem Mechanismus.":`ฉันดึงมัน มันดังคลิก เอาออกไม่ได้ มันติดอยู่ในกลไก`,Lesepult:`แท่นอ่าน`,"Ein Pult mit einem aufgeschlagenen Folianten: 'Das Buch der Zeitalter'. Eine Zeile ist unterstrichen: 'Am Anfang war das Blut, dann kam die Nacht, dann der Himmel, zuletzt das Moos.'":`แท่นวางหนังสือเล่มใหญ่ที่เปิดอยู่: 'หนังสือแห่งยุคสมัย' มีบรรทัดหนึ่งขีดเส้นใต้ไว้: 'ในเบื้องต้นคือเลือด แล้วมาถึงราตรี แล้วท้องฟ้า สุดท้ายคือตะไคร่'`,"Ich blättere. Staub. Fußnoten. Eine Fußnote zu einer Fußnote. Weise Leute lieben das.":`ฉันพลิกดู ฝุ่น เชิงอรรถ เชิงอรรถของเชิงอรรถ คนฉลาดชอบแบบนี้แหละ`,"Das Pult bleibt. Der Foliant auch. Beide wiegen mehr als mein Mut.":`แท่นอ่านอยู่ตรงนี้ หนังสือก็ด้วย ทั้งคู่หนักกว่าความกล้าของฉัน`,Globus:`ลูกโลก`,"Ein alter Globus. Rot für die Feuerberge, schwarz für den Norden, blau für die Meere, grün für die Moore.":`ลูกโลกเก่า แดงคือภูเขาไฟ ดำคือทางเหนือ น้ำเงินคือทะเล เขียวคือหนองน้ำ`,"Ich drehe den Globus. Auf dem Sockel kratzt eine Randnotiz in Myrddins Schrift: 'Glut, Nacht, Tiefe, Moos. So wurde die Welt.'":`ฉันหมุนลูกโลก บนฐานมีบันทึกขอบกระดาษขีดไว้ด้วยลายมือ Myrddin: 'ถ่านไฟ ราตรี ห้วงลึก ตะไคร่ โลกเกิดขึ้นมาแบบนี้'`,"Die Welt im Rucksack? Das bringt Unglück.":`เอาโลกใส่เป้เหรอ? ซวยแน่`,Bücherschrank:`ตู้หนังสือ`,"Der Schrank steht offen. Eine Treppe führt in die Dunkelheit, wo sie vermutlich Myrddins Geheimnisse sammelt.":`ตู้เปิดอยู่ บันไดนำลงไปในความมืด ที่ซึ่งคงเป็นที่เก็บความลับของ Myrddin`,"Der Bücherschrank ist entriegelt. Er scheint zu flüstern: eine Frage.":`ตู้หนังสือปลดล็อกแล้ว ดูเหมือนมันกระซิบอยู่ เป็นคำถาม`,"Ein Bücherschrank, etwas zu tief. Aus der Fuge zieht kalte Luft. Dahinter ist mehr als Pergament.":`ตู้หนังสือที่ลึกไปหน่อย ลมเย็นพัดออกมาจากรอยแยก ข้างหลังมีอะไรมากกว่ากระดาษหนัง`,"Zu schwer, zu groß, zu geheimnisvoll.":`หนักเกิน ใหญ่เกิน ลึกลับเกิน`,"Er steht offen. Ich muss nur noch hindurch. Dunkelheit, Staub und ein Fläschchen.":`มันเปิดอยู่ แค่ต้องเดินผ่านเข้าไป ความมืด ฝุ่น และขวดเล็กๆ ใบหนึ่ง`,"Verschlossen. Ich schiebe, ich rüttle, ich flehe. Irgendwo muss ein Mechanismus sein. Die Bücher am Tisch vielleicht?":`ล็อกอยู่ ฉันผลัก เขย่า อ้อนวอน ต้องมีกลไกอยู่ที่ไหนสักแห่ง หนังสือบนโต๊ะบางทีอาจจะใช่?`,"Der Schrank knarzt. Eine Stimme aus dem Holz: 'Je mehr man nimmt, desto mehr bleibt zurück. Was ist es?'":`ตู้ลั่นเอี๊ยด เสียงดังมาจากเนื้อไม้: 'ยิ่งเอาออกมากเท่าไหร่ ยิ่งเหลืออยู่ข้างหลังมากเท่านั้น นั่นคืออะไร?'`,Schritte:`รอยเท้า`,Gold:`ทอง`,Wein:`ไวน์`,Schulden:`หนี้`,Zeit:`เวลา`,"Weg mit dem Schrank!":`ทิ้งตู้ไปเลย!`,"'Schritte. Ja.' Der Schrank schwingt auf. Dahinter: eine Treppe, ein Fläschchen und ein Hauch Moder.":`'รอยเท้า ใช่แล้ว' ตู้เปิดออก ข้างหลังมีบันได ขวดเล็กๆ และกลิ่นอับชื้นจางๆ`,"'Gold? Je mehr man nimmt, desto weniger bleibt. Denk nach.'":`'ทอง? ยิ่งเอาออกมาก ยิ่งเหลือน้อย คิดดูดีๆ'`,"'Wein? Nur bei mir.'":`'ไวน์? ก็เฉพาะที่ข้าเท่านั้นแหละ'`,"'Schulden? Ja, auch. Aber das ist nicht die Antwort.'":`'หนี้? ใช่ ก็ด้วย แต่ไม่ใช่คำตอบ'`,"'Zeit? Fast schön. Aber nicht richtig.'":`'เวลา? เกือบสวย แต่ไม่ถูก'`,"'Beleidigungen sind keine Antworten. Ich notiere es.'":`'คำด่าไม่ใช่คำตอบ ข้าจดไว้แล้วนะ'`,"Ein Fläschchen Weihwasser, das Myrddin gegen Dämonen aufbewahrt. Er wird es nicht vermissen. Er hat Dämonen genug.":`ขวดน้ำมนต์ที่ Myrddin เก็บไว้ไล่ปีศาจ เขาไม่คิดถึงมันหรอก เขามีปีศาจเหลือเฟืออยู่แล้ว`,Apothekerschrank:`ตู้ยา`,"Myrddins Apothekerschrank. Zwei Schubladen, in denen Dinge liegen, die einmal lebendig waren. Oder noch sind.":`ตู้ยาของ Myrddin ลิ้นชักสองช่องที่มีของที่เคยมีชีวิตอยู่ หรือยังมีอยู่ก็ไม่แน่`,Sessel:`เก้าอี้นวม`,"Ein Ledersessel mit Mulde. Hier sitzt Myrddin und schläft, während er nachdenkt.":`เก้าอี้นวมหนังที่มีรอยเว้า Myrddin นั่งหลับตรงนี้ระหว่างที่ใช้ความคิด`,"Ich setze mich. Der Sessel schluckt mich. Als ich aufstehe, habe ich sieben Minuten und eine Idee verloren.":`ฉันนั่งลง เก้าอี้กลืนฉันเข้าไป พอลุกขึ้น ฉันเสียไปเจ็ดนาทีกับหนึ่งไอเดีย`,"Ein Sessel. Den nehme ich höchstens im Traum.":`เก้าอี้ตัวหนึ่ง เอาไว้นั่งในฝันก็พอ`,Kamin:`เตาผิง`,"Ein Kamin mit grünem Feuer. Es wärmt nicht, aber es leuchtet. Wie Hoffnung.":`เตาผิงที่มีไฟสีเขียว ไม่อุ่นแต่ส่องสว่าง เหมือนความหวัง`,"Ich halte die Hand ins Feuer. Es ist kalt. Das macht es noch unheimlicher.":`ฉันยื่นมือเข้าไปในไฟ มันเย็น ยิ่งน่าขนลุกเข้าไปอีก`,"Pergament ins grüne Feuer? Es wäre ein Mord an der Geschichte. Ich lasse es.":`เอากระดาษหนังใส่ไฟเขียวเหรอ? เท่ากับฆ่าประวัติศาสตร์ ไม่เอาดีกว่า`,"Ich zünde den Stummel an. Er brennt grün. Ich glaube, das ist nicht gut.":`ฉันจุดเทียนก้อนเล็ก มันไหม้เป็นสีเขียว ฉันว่านี่ไม่ดีแน่`,Armillarsphäre:`อาร์มิลลารีสเฟียร์`,"Eine goldene Sphäre aus Ringen, die langsam kreist. Sie zeigt die Bahnen der Gestirne. Oder Myrddins Gedankengänge.":`ทรงกลมทองคำที่ทำจากวงแหวน หมุนช้าๆ แสดงวงโคจรของดวงดาว หรือไม่ก็ความคิดของ Myrddin`,Sternenkarte:`แผนที่ดวงดาว`,"Die Sternbilder an der Decke: Rabe, Drache, Waage, Schwert. Der Drache ist größer gemalt als die anderen.":`กลุ่มดาวบนเพดาน: อีกา มังกร ตาชั่ง ดาบ มังกรถูกวาดใหญ่กว่าตัวอื่น`,"Ein hohes Fenster mit Blick auf Sterne und die Silhouette einer Burg. Ich bin froh, dass sie keine Gesichter hat.":`หน้าต่างบานสูงมองเห็นดวงดาวและเงาของปราสาท ดีนะที่มันไม่มีหน้า`,Wendeltreppe:`บันไดเวียน`,"Eine Wendeltreppe, die in den Dachboden des Turms führt. Dort wohnen die Bücher, die zu gefährlich für unten sind.":`บันไดเวียนที่ขึ้นไปชั้นใต้หลังคาของหอคอย ที่นั่นเป็นที่อยู่ของหนังสือที่อันตรายเกินกว่าจะเก็บข้างล่าง`,"Schädel im Regal":`กะโหลกบนชั้น`,"Ein Schädel zwischen den Büchern. Er hat mehr gelesen als ich.":`กะโหลกหนึ่งอันอยู่ระหว่างหนังสือ มันอ่านมากกว่าฉันอีก`,Bücherregale:`ชั้นหนังสือ`,"Tausend Bücher. Titel wie 'Von den Wirkungen des Nichtstuns' und 'Vierzig Arten, einen Trank zu verpfuschen'.":`หนังสือเป็นพันเล่ม ชื่ออย่าง 'ว่าด้วยผลของการไม่ทำอะไรเลย' และ 'สี่สิบวิธีทำยาเสีย'`,"Na, Totengräber. Du schuftest wie ein Esel. Dabei kann man das auch einfacher haben.":`ไง คนขุดหลุมศพ ทำงานหนักเหมือนลา ทั้งที่มันทำให้ง่ายกว่านี้ได้นะ`,"Fünf Silberlinge, und du gibst Roderic gegenüber an, dass ICH deine Aufgaben erledigt habe. Und umgekehrt.":`ห้าเหรียญเงิน แล้วแกบอก Roderic ว่าฉันเป็นคนทำงานแทนแก และกลับกัน`,"Nein danke. Ich verdiene mir meine Ritterehre selbst.":`ไม่ล่ะขอบคุณ ฉันหาเกียรติอัศวินด้วยตัวเอง`,"Fünf Silberlinge? Her damit.":`ห้าเหรียญเงิน? เอามานี่`,"Wie viel genau?":`เท่าไหร่กันแน่?`,"Fünf. Sieben, wenn du dich beeilst. Mein Vater kauft auch Ehre. Im Dutzend billiger.":`ห้า เจ็ดถ้าแกรีบ พ่อฉันซื้อเกียรติด้วย ซื้อเป็นโหลถูกกว่า`,"Du bist ein Narr. Ein ehrlicher. Das ist noch schlimmer.":`แกมันคนโง่ แต่เป็นคนซื่อ ซึ่งแย่กว่าอีก`,"Mein Bauch sagt ja. Mein Gewissen sagt nein. Mein Gewissen hat die lauteren Argumente.":`ท้องบอกว่าเอา มโนธรรมบอกว่าไม่ มโนธรรมมีเหตุผลที่ดังกว่า`,"Hübsch. Du bist ein Mann nach meinem Geschmack. Käuflich.":`เยี่ยม แกถูกใจฉัน รับซื้อได้`,"Das Silber brennt in der Tasche. Ich fühle mich wie ein Dieb mit Genehmigung.":`เหรียญเงินแผดเผาในกระเป๋า ฉันรู้สึกเป็นขโมยที่มีใบอนุญาต`,"Eine Sache noch. Die wichtigste. Du wirst gleich einen Besuch bekommen.":`อีกเรื่องหนึ่ง เรื่องสำคัญที่สุด อีกเดี๋ยวแกจะมีแขกมาหา`,"Eduard grinst wie ein Fuchs im Hühnerstall. Hat er dir etwas gegeben?":`Eduard ยิ้มเหมือนจิ้งจอกในเล้าไก่ เขาให้อะไรเจ้าไหม?`,"Silber. Ich hab es genommen. Es tut mir leid.":`เงินครับ ผมรับมาแล้ว ผมเสียใจ`,"Dann bring es ihm zurück. Demut heißt nicht, nie zu fallen, sondern aufzustehen.":`งั้นเอาไปคืนเขา ความถ่อมตนไม่ใช่การไม่เคยล้ม แต่คือการลุกขึ้นมาใหม่`,"Eduard sieht zufrieden aus. Du hast sein Silber, nicht wahr? Gib es zurück oder an die Armen, dann reden wir.":`Eduard ดูพอใจ เจ้าได้เงินเขามาใช่ไหม? คืนไปหรือให้คนจน แล้วค่อยคุยกัน`,"Pferd beschlagen, Rüstung gerichtet, Gefangene gespeist, Hof gefegt. Und das Silber stehen lassen.":`ม้าใส่เกือกแล้ว เกราะจัดเรียบร้อย นักโทษได้กินแล้ว ลานกวาดแล้ว และปล่อยเงินไว้ที่เดิม`,"Das ist Demut. Du hast die erste Prüfung bestanden, Bran. Ich staune. Das tue ich selten.":`นี่แหละความถ่อมตน เจ้าผ่านบททดสอบแรกแล้ว Bran ข้าทึ่งนะ ซึ่งข้าไม่ค่อยเป็น`,"Nun zur Weisheit: Der Magier Myrddin im Bibliotheksturm, rechts hinten. Er prüft nicht mit dem Schwert. Das macht ihn gefährlicher.":`ทีนี้ถึงปัญญา จอมเวทย์ Myrddin ในหอคอยห้องสมุด ด้านหลังขวา เขาไม่ทดสอบด้วยดาบ ซึ่งทำให้อันตรายกว่า`,"Burghof von Grauwacht":`ลานปราสาท Grauwacht`,"Zum Burgtor":`ไปประตูปราสาท`,Rüstkammer:`คลังอาวุธ`,"Die Rüstkammer ist abgeschlossen. Ich sollte zuerst den Ordensmeister begrüßen.":`คลังอาวุธล็อกอยู่ ฉันควรไปทักทายท่านผู้นำภราดรภาพก่อน`,"Zum Thronsaal":`ไปท้องพระโรง`,"Die Palaswache kreuzt die Hellebarde: 'Audienz nur für Anwärter, die Demut bewiesen haben. Frag Ser Roderic.'":`ทหารรักษาวังไขว้หอก: 'เข้าเฝ้าได้เฉพาะผู้สมัครที่พิสูจน์ความถ่อมตนแล้ว ไปถาม Ser Roderic'`,Bibliotheksturm:`หอคอยห้องสมุด`,"Der Turm ist für Anwärter nach der Begrüßung des Ordensmeisters. Ich hole die zuerst.":`หอคอยสำหรับผู้สมัครหลังจากทักทายท่านผู้นำภราดรภาพแล้ว ฉันจะไปหาท่านก่อน`,Kerkerluke:`ฝาประตูคุกใต้ดิน`,"Eine Eisenluke im Hof. Darunter der Kerker. Von dort kommt ein Geruch, den kein Gärtner möchte.":`ฝาเหล็กในลาน ข้างใต้คือคุกใต้ดิน มีกลิ่นลอยขึ้นมาที่ไม่มีคนสวนคนไหนอยากได้`,"Die Luke ist größer als meine Zukunft.":`ฝานี่ใหญ่กว่าอนาคตของฉันอีก`,"Der Kerker? Ich möchte erst den Ordensmeister fragen, ob das erlaubt ist.":`คุกใต้ดินเหรอ? ขอถามท่านผู้นำภราดรภาพก่อนว่าอนุญาตไหม`,"Streitross Donnerhuf":`ม้าศึก Donnerhuf`,"Donnerhuf mit vier gesunden Hufen. Er sieht sogar dankbar aus. Für ein Pferd.":`Donnerhuf กับกีบสี่ข้างที่แข็งแรง ดูขอบคุณด้วยซ้ำ สำหรับม้าน่ะนะ`,"Ein Streitross mit drei Schuhen. Der vierte Huf scharrt unglücklich im Stroh.":`ม้าศึกที่มีเกือกแค่สามข้าง กีบที่สี่เขี่ยฟางอย่างไม่มีความสุข`,"Na, Donnerhuf. Gute Hufe, schlechter Charakter?":`ไง Donnerhuf กีบดี นิสัยแย่ใช่ไหม?`,"Hallo, Donnerhuf. Ich bin nur ein harmloser Totengräber.":`สวัสดี Donnerhuf ฉันเป็นแค่คนขุดหลุมศพที่ไม่มีพิษภัย`,"Donnerhuf schnaubt. Er ist offenbar nicht für Konversation gezüchtet.":`Donnerhuf พ่นลมหายใจ เห็นชัดว่าไม่ได้ถูกเพาะมาเพื่อการสนทนา`,"Er hat seinen Apfel schon. Er schaut, als wolle er einen zweiten.":`มันได้แอปเปิลไปแล้ว แต่มองเหมือนอยากได้ลูกที่สอง`,"Crunch. Donnerhuf wird weich wie Butter. Zumindest für einen Apfel lang.":`กรุบ Donnerhuf อ่อนเหมือนเนย อย่างน้อยก็ตราบเท่าแอปเปิลหนึ่งลูก`,"Er hat vier Schuhe. Sein Selbstwertgefühl ist wiederhergestellt.":`มันมีเกือกสี่ข้างแล้ว ความภูมิใจในตัวเองกลับมาแล้ว`,"Ich nähere mich dem Huf. Donnerhuf tritt aus. Ich fliege durch die Luft und lande in einem Heuhaufen.":`ฉันเข้าไปใกล้กีบ Donnerhuf เตะ ฉันลอยกลางอากาศแล้วตกลงในกองฟาง`,"Vielleicht erst mit etwas Süßem bestechen.":`ลองติดสินบนด้วยของหวานก่อนดีกว่า`,"Womit soll ich nageln? Mit der Faust? Ein Hammer wäre gut. Pip hat doch eine Werkbank.":`จะตอกด้วยอะไร? ด้วยกำปั้นเหรอ? ต้องมีค้อน Pip มีโต๊ะทำงานไม่ใช่เหรอ`,"Ein Hufeisen ohne Nägel ist ein Schmuckstück. Ich brauche einen Nagel.":`เกือกม้าไม่มีตะปูก็เป็นแค่เครื่องประดับ ฉันต้องมีตะปู`,"Klong, klong, klong. Donnerhuf steht auf vier Schuhen und prüft den Boden wie ein Adliger den Bodensatz.":`กึง กึง กึง Donnerhuf ยืนบนเกือกสี่ข้าง ตรวจพื้นเหมือนขุนนางตรวจตะกอนก้นแก้ว`,"Das hat noch niemand geschafft! Er hat dich nicht mal gebissen! Nimm das Seil, ich hab zwei.":`ไม่เคยมีใครทำได้มาก่อน! มันไม่ได้กัดเจ้าด้วยซ้ำ! เอาเชือกไป ข้ามีสองเส้น`,"Das Pferd frisst keine Nägel. Dafür gibt es Hufschmiede.":`ม้าไม่กินตะปู เรื่องนั้นมีช่างตีเกือกอยู่แล้ว`,"Stallmeister Pip":`หัวหน้าคอกม้า Pip`,"Pip, der Stallmeister. Zwölf Jahre alt, zwei Zähne Lücke, das Selbstbewusstsein eines Bischofs.":`Pip หัวหน้าคอกม้า อายุสิบสองขวบ ฟันหลอสองซี่ ความมั่นใจเท่าบิชอป`,"Neu hier? Ich bin Pip, der Stallmeister. Das sage ich, weil mir sonst keiner glaubt.":`มาใหม่เหรอ? ข้า Pip หัวหน้าคอกม้า ที่บอกเพราะไม่งั้นไม่มีใครเชื่อ`,"Was ist mit dem Pferd los?":`ม้าเป็นอะไรเหรอ?`,"Donnerhuf hat sein Eisen verloren. Irgendwo im Stall, glaube ich. Vielleicht im Futtertrog.":`Donnerhuf เกือกหลุด น่าจะอยู่ในคอกสักที่ บางทีในรางหญ้า`,"Aber er tritt. Er tritt jeden, der nicht nach Apfel riecht. Berta hat Äpfel.":`แต่มันเตะ เตะทุกคนที่ไม่มีกลิ่นแอปเปิล Berta มีแอปเปิล`,"Wo finde ich Werkzeug?":`หาเครื่องมือได้ที่ไหน?`,"Auf meiner Werkbank da vorn: Hammer, Nägel und anderes Zeug. Pass auf die Zange auf. Sie beißt.":`บนโต๊ะทำงานข้าตรงนั้น ค้อน ตะปู กับของอื่นๆ ระวังคีมนะ มันกัด`,"Wer ist Ser Eduard?":`Ser Eduard คือใคร?`,"Der Knappe, der immer den besten Platz in der Schlange hat. Er mag mich nicht. Ich mag ihn nicht. So sind wir Freunde.":`สกวายร์ที่ได้ที่ดีที่สุดในแถวเสมอ เขาไม่ชอบข้า ข้าไม่ชอบเขา เราเลยเป็นเพื่อนกัน`,"Hast du ein Seil?":`มีเชือกไหม?`,"Klar. Aber nur für Leute, die dem Pferd helfen. Das ist die Regel. Meine Regel.":`มีสิ แต่ให้แค่คนที่ช่วยม้า เป็นกฎ กฎของข้า`,"Wie ist der Kanzler?":`อัครเสนาบดีเป็นยังไง?`,"Malvor? Der guckt, als würde er mir Karotten wegnehmen. Aber er riecht immer nach Wein. Er rührt selbst den Kelch des Königs.":`Malvor เหรอ? มองเหมือนจะมาเอาแครอทข้าไป แต่ตัวเขากลิ่นไวน์ตลอด เขากวนถ้วยของกษัตริย์เอง`,"Wenn du tritt kriegst, sag nicht, ich hätte dich gewarnt. Doch, sag es.":`ถ้าโดนเตะ อย่าบอกว่าข้าไม่เตือนนะ เอ้อ บอกก็ได้`,"Ser Roderic":`Ser Roderic`,"Ser Roderic, Ordensmeister. Silberhaar, Raben auf dem Brustpanzer, und Augen, die schon alles gesehen und dann vergessen haben, warum.":`Ser Roderic ท่านผู้นำภราดรภาพ ผมสีเงิน อีกาบนเกราะอก และดวงตาที่เห็นมาหมดแล้วแล้วลืมไปว่าทำไม`,"Du bist Bran aus Aschenfurt. Hauptmann Grimm hat mir einen Raben geschickt. Er schreibt, du seist 'hartnäckig, schmutzig und ehrlich'.":`เจ้าคือ Bran จาก Aschenfurt กัปตัน Grimm ส่งอีกามาบอกข้า เขียนว่าเจ้า 'ดื้อ สกปรก และซื่อตรง'`,"Das trifft es. Mehr oder weniger.":`ตรงเป๊ะ มากบ้างน้อยบ้าง`,"Der Orden kennt drei Eide: Demut, Weisheit, Mut. Mut wirst du am Vulkan zeigen. Aber das ist später.":`ภราดรภาพมีคำสาบานสามอย่าง ความถ่อมตน ปัญญา ความกล้า ความกล้าเจ้าจะแสดงที่ภูเขาไฟ แต่นั่นทีหลัง`,"Heute: Demut und Weisheit. Fang mit der Demut an. Hier ist deine Liste.":`วันนี้ ความถ่อมตนกับปัญญา เริ่มจากความถ่อมตน นี่รายการของเจ้า`,"Erstens: Das Pferd Donnerhuf beschlagen. Zweitens: Die Ordensrüstung in der Rüstkammer herrichten. Drittens: Suppe zu den Gefangenen bringen.":`หนึ่ง ใส่เกือกให้ม้า Donnerhuf สอง จัดเกราะภราดรภาพในคลังอาวุธ สาม เอาซุปไปให้นักโทษ`,"Viertens: Den Hof fegen. Und fünftens, aber das erfährst du von selbst.":`สี่ กวาดลาน และห้า แต่อันนี้เจ้าจะรู้เอง`,"Wie steht meine Aufgabenliste?":`รายการงานของฉันเป็นยังไงแล้ว?`,"Donnerhuf beschlagen":`ใส่เกือกให้ Donnerhuf`,"Ordensrüstung in der Rüstkammer richten":`จัดเกราะภราดรภาพในคลังอาวุธ`,"Suppe zu den Gefangenen bringen":`เอาซุปไปให้นักโทษ`,"Hof fegen":`กวาดลาน`,"Ich habe alle Aufgaben erledigt.":`ฉันทำงานครบทุกอย่างแล้ว`,"Was ist das für ein Orden?":`ภราดรภาพนี้คืออะไร?`,"Der Orden der Raben schützt die Schwachen, bewacht die Toten und verwaltet die Schulden der Lebenden.":`ภราดรภาพอีกาปกป้องผู้อ่อนแอ เฝ้าคนตาย และจัดการหนี้ของคนเป็น`,"Meistens ist das Letzte das Anstrengendste.":`ส่วนใหญ่อย่างสุดท้ายนี่แหละเหนื่อยที่สุด`,"Wie geht es dem König?":`กษัตริย์เป็นยังไงบ้าง?`,"Schlecht. Schon seit Wochen. Die Ärzte sagen Fieber. Die Köchin sagt Schierling. Ich sage nichts, aus Gewohnheit.":`แย่ มาหลายสัปดาห์แล้ว หมอบอกไข้ แม่ครัวบอกเฮมล็อก ข้าไม่พูดอะไร เป็นนิสัย`,"Der Kanzler lässt niemanden zu ihm außer sich selbst.":`อัครเสนาบดีไม่ยอมให้ใครเข้าหาท่านนอกจากตัวเอง`,"Wo ist Ser Aldric?":`Ser Aldric อยู่ไหน?`,"Aldric? Mein bester Mann. Vor Wochen zur Grenze gesandt, seither kein Wort. Der Kanzler sagt: gefallen.":`Aldric เหรอ? คนที่ดีที่สุดของข้า ส่งไปชายแดนเมื่อหลายสัปดาห์ก่อน ตั้งแต่นั้นไม่มีข่าว อัครเสนาบดีว่าตายในสนามรบ`,"Ich sage: Aldric fällt nicht. Er stolpert höchstens, und das auch nur auf Befehl.":`ข้าว่า Aldric ไม่ตาย เขาอย่างมากก็สะดุด แล้วก็เฉพาะเวลาสั่งเท่านั้น`,"Wo kann ich suchen?":`ฉันหาได้ที่ไหน?`,"Der Burghof gehört dir. Rüstkammer links, Bibliothek rechts, Kerkerluke vorn. Der Thronsaal steht dir offen, wenn du demütig warst.":`ลานปราสาทเป็นของเจ้า คลังอาวุธซ้าย ห้องสมุดขวา ฝาคุกข้างหน้า ท้องพระโรงเปิดให้เจ้าถ้าเจ้าถ่อมตนแล้ว`,"Was soll ich in der Rüstkammer?":`ไปคลังอาวุธทำอะไร?`,"Der Rüstungsständer ist leer. Brustpanzer, Helm, Armschienen liegen irgendwo. Ordnung ist die Demut des Soldaten.":`ที่แขวนเกราะว่างอยู่ เกราะอก หมวก ปลอกแขนกระจายอยู่ที่ไหนสักแห่ง ความเป็นระเบียบคือความถ่อมตนของทหาร`,"Und poliere den alten Schild, wenn du schon da bist. Du wirst nicht oft einen Spiegel in der Hand haben.":`แล้วขัดโล่เก่าด้วย ในเมื่อไปอยู่แล้ว เจ้าไม่ค่อยได้ถือกระจกหรอก`,"Geh. Und schlafe nicht im Stehen. Das tun nur Pferde und Hauptleute.":`ไปได้แล้ว และอย่านอนหลับตอนยืน มีแต่ม้ากับกัปตันที่ทำ`,"Köchin Berta":`แม่ครัว Berta`,"Köchin Berta, Löffel in der Hand, Fleck auf der Schürze. Man traut ihr die Pest nicht zu, aber das Kochen schon.":`แม่ครัว Berta ถือทัพพี มีรอยเปื้อนบนผ้ากันเปื้อน ใครจะเชื่อว่านางก่อโรคระบาด แต่ทำอาหารนี่เชื่อได้`,"Mein Löffel! Zum zweiten Mal gefunden, zum zweiten Mal gerührt.":`ทัพพีของฉัน! เจอครั้งที่สอง กวนครั้งที่สอง`,"MEIN LÖFFEL! Der gute Löffel! Wo hast du den gefunden?":`ทัพพีของฉัน! ทัพพีอันดี! เจ้าไปเจอที่ไหนมา?`,"Im Heukarren? Dieser Pip! Ich schlage ihn mit seinem eigenen Heu.":`ในเกวียนฟางเหรอ? เจ้า Pip นี่! ข้าจะตีมันด้วยฟางของมันเอง`,"Hier. Ein Krug Wein, und Schlafkraut gegen die Albträume des Königs. Ich habe immer zu viel davon.":`นี่ ไวน์หนึ่งเหยือก กับสมุนไพรนอนหลับแก้ฝันร้ายของกษัตริย์ ข้ามีมากเกินไปเสมอ`,"Silber? Behalt es, du siehst aus, als bräuchtest du es.":`เงินเหรอ? เก็บไว้เถอะ ดูเจ้าเหมือนต้องใช้`,"Für die Armenspeise? Von Eduards Silber? Das schmeckt wie Gerechtigkeit mit Salz.":`สำหรับอาหารคนจนเหรอ? จากเงินของ Eduard? รสชาติเหมือนความยุติธรรมโรยเกลือ`,"Besser bei den Armen als in meiner Tasche.":`อยู่กับคนจนดีกว่าอยู่ในกระเป๋าฉัน`,"Ah, ein Neuer! Zu dünn. Setz dich nicht, ich habe nichts, was dich satt macht.":`อ้อ คนใหม่! ผอมเกิน อย่านั่งนะ ข้าไม่มีอะไรให้เจ้าอิ่มหรอก`,"Roderic schickt mich. Suppe für die Gefangenen.":`Roderic ส่งมา ซุปสำหรับนักโทษ`,"Die armen Seelen im Keller! Nimm einen Becher und fülle ihn aus dem Kessel.":`วิญญาณน่าสงสารในห้องใต้ดิน! เอาถ้วยไปตักจากหม้อซะ`,"Hier, ein Becher. Verbeult, aber er hält. Wie ich.":`นี่ ถ้วยหนึ่งใบ บุบแต่ทนทาน เหมือนข้า`,"Habt Ihr einen Apfel für Donnerhuf?":`ท่านมีแอปเปิลให้ Donnerhuf ไหม?`,"Für dieses Biest? Einen. Und wenn er dich beißt, mir nicht die Schuld geben.":`สำหรับตัวร้ายนั่นเหรอ? ลูกเดียว ถ้ามันกัดเจ้า อย่ามาโทษข้า`,"Habt Ihr noch einen Apfel?":`ท่านมีแอปเปิลอีกไหม?`,"Du hast ihn verloren? Du bist wie mein Mann. Hier.":`ทำหายเหรอ? เจ้าเหมือนผัวข้าเลย นี่`,"Ihr habt etwas verloren?":`ท่านทำอะไรหายเหรอ?`,"Mein Rührlöffel! Seit dem Dienstag weg. Pip bestreitet alles. Das ist ein Geständnis.":`ทัพพีกวนของข้า! หายตั้งแต่วันอังคาร Pip ปฏิเสธทุกอย่าง นั่นคือการสารภาพ`,"Der Kerl wohnt im Heu. Ich wette, er hat ihn zum Wenden benutzt.":`เจ้าหนูนั่นอยู่ในฟาง ข้าพนันได้ว่ามันเอาไปใช้พลิกฟาง`,"Habt Ihr noch Wein?":`ท่านมีไวน์อีกไหม?`,"Schon wieder? Du trinkst für zwei. Hier.":`อีกแล้วเหรอ? เจ้าดื่มแทนสองคน นี่`,"Habt Ihr noch Schlafkraut?":`ท่านมีสมุนไพรนอนหลับอีกไหม?`,"Da. Aber wenn du den König damit einschläferst, bin ich es nicht gewesen.":`นี่ แต่ถ้าเอาไปทำให้กษัตริย์หลับ ข้าไม่ได้เป็นคนทำนะ`,"Wie geht's dem König?":`กษัตริย์เป็นยังไงบ้าง?`,"Er isst nichts mehr. Er trinkt nur Wein, den der Kanzler selbst einschenkt. Jeden Abend.":`ท่านไม่กินอะไรอีกแล้ว ดื่มแต่ไวน์ที่อัครเสนาบดีรินให้เอง ทุกเย็น`,"Das Fieber kommt immer gegen Mitternacht. Als hätte es einen Plan.":`ไข้มาตอนเที่ยงคืนเสมอ เหมือนมันมีแผน`,"Was haltet Ihr vom Kanzler?":`ท่านคิดยังไงกับอัครเสนาบดี?`,"Ein Mann, der nie hungrig aussieht. Das ist verdächtig. Wer nicht isst, hat etwas anderes im Kopf.":`คนที่ไม่เคยดูหิว น่าสงสัย คนไม่กินมีอย่างอื่นอยู่ในหัว`,"Was ist mit Ser Eduard?":`แล้ว Ser Eduard ล่ะ?`,"Der? Er isst alles, bezahlt nichts und lobt trotzdem nie. Wie ein Adliger.":`เขาเหรอ? กินทุกอย่าง ไม่จ่ายอะไร แล้วก็ไม่เคยชมสักที เหมือนขุนนาง`,"Iss was, Junge. Der Orden braucht Ritter, keine Gespenster.":`กินอะไรหน่อยสิ หนุ่ม ภราดรภาพต้องการอัศวิน ไม่ใช่ผี`,"Ser Eduard":`Ser Eduard`,"Ser Eduard, Knappe. Glänzende Stiefel, glänzende Zähne, glänzende Aussichten. Sein Vater hat Land und Meinungen.":`Ser Eduard สกวายร์ รองเท้าบู๊ตมันวาว ฟันมันวาว อนาคตมันวาว พ่อเขามีที่ดินกับความคิดเห็น`,"Silber? Du brauchst es dringender als ich. Das ist wahr, leider.":`เงินเหรอ? เจ้าต้องการมากกว่าข้า จริงนะ น่าเสียดาย`,"Du gibst es zurück? Das Geschäft ist geplatzt? Wie unhöflich!":`เจ้าจะคืนเหรอ? ดีลล่มเหรอ? หยาบคายจริง!`,"Ein Geschäft, das ich nie hätte machen sollen.":`ดีลที่ฉันไม่ควรทำตั้งแต่แรก`,"Du bist der Neue aus dem Dorf. Du riechst nach Erde. Das ist kein Vorwurf. Eher eine Beobachtung.":`เจ้าคือเด็กใหม่จากหมู่บ้าน กลิ่นดินติดตัว ไม่ได้ตำหนิหรอก แค่สังเกต`,"Wie kommt man hier zum Ritter?":`จะเป็นอัศวินที่นี่ได้ยังไง?`,"Mit Beziehungen. Und mit Geld. Und notfalls mit Talent, aber das ist teuer.":`ด้วยเส้นสาย ด้วยเงิน และถ้าจำเป็นก็ด้วยพรสวรรค์ แต่อันนั้นแพง`,"Was machst du hier?":`เจ้ามาทำอะไรที่นี่?`,"Ich warte auf die Rüstung, die mir mein Vater schickt. Die alte hat einen Kratzer. Einen. Skandalös.":`รอเกราะที่พ่อส่งมาให้ อันเก่ามีรอยขีด รอยเดียว น่าอับอายสุดๆ`,"Du hast mir was angeboten ...":`เจ้าเคยเสนออะไรบางอย่างให้ข้า ...`,"Hast du die Aufgaben schon erledigt?":`เจ้าทำงานเสร็จหรือยัง?`,"Ich? Wozu gibt es Knechte? Ich lasse arbeiten, das nennt man Führung.":`ข้าเหรอ? จะมีคนรับใช้ไว้ทำไม ข้าสั่งงาน เขาเรียกว่าความเป็นผู้นำ`,"Was weißt du über den Kanzler?":`เจ้ารู้อะไรเกี่ยวกับอัครเสนาบดี?`,"Malvor? Der will Burggraf werden, schätze ich. Oder König. Aber wer will das nicht?":`Malvor เหรอ? อยากเป็นเจ้าเมืองมั้ง หรือกษัตริย์ แต่ใครล่ะไม่อยาก?`,"Kümmere dich nicht um mich, ich bin beschäftigt. Mit Nichtstun.":`ไม่ต้องสนใจข้า ข้ายุ่งอยู่ กับการไม่ทำอะไร`,Palaswache:`ทหารรักษาวัง`,"Eine Wache am Fuß der Treppe. Sie steht seit Stunden so, dass die Sehnen knacken.":`ทหารยามที่เชิงบันได ยืนมาหลายชั่วโมงจนเอ็นลั่น`,"Ordensmeister Roderic hat dich angekündigt. Geh hinauf. Aber fass nichts an.":`ท่านผู้นำภราดรภาพ Roderic แจ้งมาแล้วว่าเจ้ามา ขึ้นไปได้ แต่อย่าแตะอะไร`,"Der Thronsaal ist nur für Anwärter, die Demut bewiesen haben. Frag Roderic. Nicht mich. Ich bin nur eine Treppe mit Beinen.":`ท้องพระโรงสำหรับผู้สมัครที่พิสูจน์ความถ่อมตนแล้วเท่านั้น ไปถาม Roderic ไม่ใช่ข้า ข้าเป็นแค่บันไดที่มีขา`,Übungspuppe:`หุ่นซ้อม`,"Eine Strohpuppe mit Schild. Sie hat mehr Hiebe überlebt als ich Mahlzeiten.":`หุ่นฟางมีโล่ มันรอดจากการฟาดมากกว่าที่ฉันรอดจากมื้ออาหาร`,"Ich boxe sie. Das Stroh lacht nicht, aber ich bin sicher, es denkt es sich.":`ฉันชกมัน ฟางไม่หัวเราะ แต่ฉันมั่นใจว่ามันคิดอยู่ในใจ`,"Ein Hieb. Die Puppe wackelt. Ich auch.":`ฟาดหนึ่งที หุ่นโยก ฉันก็เหมือนกัน`,"Noch ein Hieb. Stroh fliegt. Ich habe Schwung.":`อีกที ฟางปลิว ฉันมีแรงส่ง`,"Dritter Hieb. Ein Ding fällt aus dem Stroh. Die Puppe ist schwer beleidigt.":`ที่สาม มีของตกจากฟาง หุ่นโกรธจัด`,"Die Puppe hat sich ergeben. Ich auch, vor Müdigkeit.":`หุ่นยอมแพ้แล้ว ฉันก็ด้วย เพราะเหนื่อย`,"Eine Gürtelschnalle aus der Puppe. Sie hat gekämpft und Schmuck behalten.":`หัวเข็มขัดจากหุ่น มันสู้มา และยังเก็บเครื่องประดับไว้ได้`,Suppenkessel:`หม้อซุป`,"Ein Kessel, in dem etwas brodelt. Es ist braun, riecht nach Kohl und Absicht.":`หม้อที่มีบางอย่างเดือดอยู่ สีน้ำตาล กลิ่นกะหล่ำกับเจตนาร้าย`,"Ich rühre mit dem Finger? Nein. Berta würde mich mit dem Löffel erschlagen.":`กวนด้วยนิ้วเหรอ? ไม่ล่ะ Berta จะตีฉันด้วยทัพพีตาย`,"Finger weg vom Kessel! Wenn du Suppe willst, sag, wofür.":`อย่าแตะหม้อ! ถ้าอยากได้ซุป บอกมาว่าเอาไปทำอะไร`,"Der Becher ist voll. Suppe vom Feinsten. Fast.":`ถ้วยเต็มแล้ว ซุปชั้นเลิศ เกือบนะ`,"Wein in die Suppe? Das würde sie süß machen. Ich lasse es.":`ใส่ไวน์ลงซุปเหรอ? จะหวานไป ไม่เอาดีกว่า`,"Ich fülle den Becher. Die Suppe dampft, riecht nach Kohl und Resten. Ein Fest für Gefangene.":`ฉันตักใส่ถ้วย ซุปมีควัน กลิ่นกะหล่ำกับของเหลือ งานเลี้ยงสำหรับนักโทษ`,"Der Burgbrunnen. Das Wasser ist kalt, tief und gesprächig. Das Echo antwortet höflicher als der Kanzler.":`บ่อน้ำของปราสาท น้ำเย็น ลึก และช่างพูด เสียงสะท้อนตอบสุภาพกว่าอัครเสนาบดี`,"Ich trinke noch einmal. Es schmeckt nach Stein und Demut.":`ฉันดื่มอีกที รสชาติเหมือนหินกับความถ่อมตน`,"Ich trinke einen Schluck. Das Wasser ist eiskalt und nach Stein schmeckt es.":`ฉันดื่มอึกหนึ่ง น้ำเย็นเฉียบ และมีรสหิน`,"Den Brunnen nehme ich nicht mit. Er hat Wurzeln.":`บ่อน้ำเอาไปไม่ได้ มันมีราก`,"Ich tauche den Lappen kurz ein. Er wird nass und gewinnt dadurch nicht an Würde.":`ฉันจุ่มผ้าลงไปแป๊บ ผ้าเปียก แต่ไม่ได้ดูมีศักดิ์ศรีขึ้น`,"Ich habe keinen Eimer mehr. Der Brunnen schon.":`ฉันไม่มีถังแล้ว แต่บ่อน้ำยังมี`,Futtertrog:`รางหญ้า`,"Ein Trog mit altem Heu. Man erkennt etwas Rundes, Glänzendes darin. Oder ist das nur die Hoffnung?":`รางที่มีฟางเก่า เห็นบางอย่างกลมๆ แวววาวอยู่ข้างใน หรือแค่ความหวัง?`,"Nur Heu und ein Mäuseskelett.":`มีแค่ฟางกับโครงหนู`,"Pips Werkbank. Hammer, Zangen, Nägel und ein Schlüssel an einem Haken. Alles in einer Unordnung, die System hat.":`โต๊ะทำงานของ Pip ค้อน คีม ตะปู และกุญแจแขวนบนตะขอ ทั้งหมดรกอย่างมีระบบ`,"Die Werkbank ist leer. Pip wird wütend.":`โต๊ะทำงานว่างเปล่า Pip จะโกรธ`,"Ein Korb voller Lumpen. Einer davon ist sauber. Das ist suspekt.":`ตะกร้าเต็มไปด้วยผ้าขี้ริ้ว ผืนหนึ่งสะอาด น่าสงสัย`,"Nur noch Staub.":`เหลือแค่ฝุ่น`,Heukarren:`เกวียนฟาง`,"Ein Heukarren. Im Heu steckt eine Forke und sonst alles, was Pip verloren glaubt.":`เกวียนฟาง มีส้อมคราดปักอยู่ในฟาง และทุกอย่างที่ Pip คิดว่าหาย`,"Nur Heu. Aber ich habe es gründlich durchwühlt.":`มีแค่ฟาง แต่ฉันคุ้ยจนทั่วแล้ว`,"Ein Besen aus Reisig. Er wartet darauf, jemanden zu demütigen. Heute: mich.":`ไม้กวาดจากกิ่งไม้ มันรอที่จะทำให้ใครสักคนอับอาย วันนี้คือฉัน`,"Der Hof ist gefegt. Er sieht aus, als hätte ihn nie jemand betreten.":`ลานกวาดเสร็จแล้ว ดูเหมือนไม่เคยมีใครเหยียบเลย`,"Ich fege den Hof. Staub, Stroh, Stolz.":`ฉันกวาดลานบ้าน ฝุ่น ฟาง แล้วก็ศักดิ์ศรี`,"Noch eine Ecke. Der Hof ist größer, als er aussieht.":`อีกมุมนึง ลานนี้ใหญ่กว่าที่เห็นเยอะ`,"Fertig. Im Staub lag ein Holzkreuz. Der Orden hat auch Dinge, die er nicht vermisst.":`เสร็จแล้ว ในฝุ่นมีไม้กางเขนอันหนึ่งนอนอยู่ คณะนี้ก็มีของที่ไม่เคยคิดถึงเหมือนกันแฮะ`,"Der Besen bleibt hier. Ich will den Hof nicht im Stich lassen.":`ไม้กวาดอยู่ตรงนี้แหละ ฉันไม่อยากทิ้งลานบ้านไปเฉยๆ`,"Ein Holzkreuz vom Boden. Gefunden beim Fegen. Auch Demut wirft Beute ab.":`ไม้กางเขนจากพื้น เจอตอนกวาด แม้แต่ความถ่อมตัวก็ยังมีของตกรางวัลให้`,"Ein Fliegenpilz am Brunnenrand. Hübsch und tödlich, wie der Hof.":`เห็ดแมลงวันข้างขอบบ่อน้ำ สวยแล้วก็ถึงตาย เหมือนลานบ้านนี้เลย`,Stall:`คอกม้า`,"Der Stall. Dunkel, warm, voller Heu und schlechter Laune.":`คอกม้า มืด อุ่น เต็มไปด้วยหญ้าแห้งกับอารมณ์เสีย`,"Der Turm der Bibliothek. Fenster, in denen nachts Licht brennt, das nicht von Kerzen kommt.":`หอคอยของห้องสมุด หน้าต่างที่ตอนกลางคืนมีแสงสว่างที่ไม่ใช่แสงเทียน`,Palas:`พาลัส`,"Das Portal des Palas. Dahinter der Thronsaal und ein König, der nicht mehr aufsteht.":`ประตูใหญ่ของพาลัส ข้างในคือท้องพระโรงกับกษัตริย์ที่ลุกขึ้นไม่ไหวอีกแล้ว`,"Ein blaues Banner mit Raben. Offensichtlich lieben sie ihn hier.":`ธงสีน้ำเงินรูปอีกา เห็นได้ชัดว่าที่นี่เขารักมันกันจริงๆ`,"Noch ein Banner. Es hängt schief, damit man merkt, dass es echt ist.":`ธงอีกผืน แขวนเอียงๆ จะได้รู้ว่าของจริง`,"Das Gitter hängt oben. Ich kurbele es nicht ohne Not wieder herunter.":`ลูกกรงค้างอยู่ข้างบน ฉันไม่หมุนมันลงมาอีกถ้าไม่จำเป็นหรอก`,"Die Welle dreht sich ins Leere. Da sitzt kein Griff dran. Irgendetwas Langes, Festes wäre gut.":`เพลาหมุนว่างเปล่า ไม่มีด้ามจับ ขอของยาวๆ แข็งๆ สักชิ้นก็ดี`,"Die Winde kreischt, ruckt und gibt auf. Sie braucht Schmiere, und zwar viel.":`รอกร้องเอี๊ยดอ๊าด กระตุก แล้วยอมแพ้ มันต้องการจาระบี และต้องการเยอะด้วย`,"Klinge, Segen, Bürge. Gut. Wilm, hilf dem Jungen. Und fass nicht den Hauptmann an.":`ดาบ พร และผู้ค้ำประกัน ดี Wilm ช่วยเด็กนี่ด้วย แล้วอย่าไปแตะผู้กองล่ะ`,"Es rattert, es quietscht, und das Gitter schwebt nach oben. Ich bin selbst überrascht.":`มีเสียงกรอกแกรก เสียงเอี๊ยด แล้วลูกกรงก็ลอยขึ้น ฉันเองก็ยังแปลกใจ`,"Das Tor ist offen. Willkommen auf Burg Grauwacht, Anwärter. Benimm dich.":`ประตูเปิดแล้ว ยินดีต้อนรับสู่ปราสาท Grauwacht ผู้สมัคร ประพฤติตัวดีๆ ล่ะ`,"Wilm grölt, der Hauptmann brüllt. Das ist meine Chance.":`Wilmร้องเพลงเสียงดัง ผู้กองตะโกนเสียงลั่น นี่แหละโอกาสของฉัน`,"WILM! Du singst im Dienst! Du singst FALSCH im Dienst!":`Wilm! แกร้องเพลงตอนเข้าเวร! แกร้องเพี้ยนตอนเข้าเวร!`,"Hicks. Die Gedanken sind frei, Herr Hauptmann!":`ฮิก ความคิดนั้นเป็นอิสระ ท่านผู้กอง!`,"Das Gitter rutscht hoch. Niemand sieht her. Ich huste einmal und gehe.":`ลูกกรงเลื่อนขึ้น ไม่มีใครมอง ฉันไอทีหนึ่งแล้วเดินไป`,"Finger weg von der Winde, Junge! Erst die Beweise, dann die Kurbelei!":`ห้ามแตะรอก เจ้าหนู! หลักฐานก่อน แล้วค่อยหมุน!`,"Damit hättest du alles. Bleibt das Fallgitter: Die Winde klemmt seit Michaeli.":`แบบนี้ก็ครบหมดแล้ว เหลือแต่ลูกกรง รอกติดมาตั้งแต่วันไมเคิล`,"Fix sie, dann lasse ich dich rauf. Wilm hat die Kurbel versoffen. Frag nicht.":`ซ่อมมันซะ แล้วข้าจะให้เจ้าขึ้นไป Wilmเอาด้ามหมุนไปแลกเหล้าหมดแล้ว อย่าถามเลย`,"Ein Beweis. Bleiben ":`หลักฐานชิ้นหนึ่ง เหลืออีก `,"Das Tor von Burg Grauwacht":`ประตูปราสาท Grauwacht`,"Zurück ins Moor":`กลับไปที่หนองน้ำ`,"Zurück ins Moor? Nie wieder. Das Moor hat mich genug gemocht.":`กลับไปหนองน้ำเหรอ? ไม่มีทาง หนองน้ำชอบฉันมากพอแล้ว`,Fallgitter:`ลูกกรงประตู`,"Ein Fallgitter mit Zähnen wie ein Hecht. Dahinter ein dunkler Torweg, der nicht freundlicher aussieht.":`ลูกกรงที่มีฟันเหมือนปลาไพค์ ข้างหลังเป็นทางเดินใต้ประตูมืดๆ ที่ดูไม่เป็นมิตรขึ้นเลย`,"Es ist ein Gitter und ich bin ein Junge. Das wird nichts.":`มันเป็นลูกกรง ส่วนฉันเป็นเด็กผู้ชาย ไม่มีทางสำเร็จหรอก`,"Ich rüttle daran. Es rüttelt nicht zurück. Es braucht die Winde.":`ฉันเขย่ามัน มันไม่เขย่ากลับ ต้องใช้รอก`,"Ein Seil um das Gitter? Dann stehe ich vor einem Gitter mit Seil. Das ist kein Fortschritt.":`ผูกเชือกรอบลูกกรงเหรอ? แล้วฉันก็จะยืนอยู่หน้าลูกกรงที่มีเชือกผูก ไม่ใช่ความก้าวหน้าเลย`,"Mein Schwert gegen Eisenstäbe? Das Schwert hat einen Namen und ich möchte ihn nicht beleidigen.":`ดาบฉันสู้กับซี่เหล็กเหรอ? ดาบมีชื่อ ฉันไม่อยากดูหมิ่นมัน`,Torwinde:`รอกประตู`,"Die Winde hält das Gitter oben. Sie knarzt zufrieden.":`รอกยึดลูกกรงไว้ข้างบน มันครางเอี๊ยดอย่างพอใจ`,"Eine mächtige Winde mit rostiger Kette. Die Kurbel fehlt. Nur ein Stumpf ragt heraus.":`รอกใหญ่โตพร้อมโซ่สนิมเขรอะ ไม่มีด้ามหมุน เหลือแค่ตอโผล่ออกมา`,"Mit Griff, aber die Zahnräder sind trocken wie ein Beichtvater.":`มีด้ามจับแล้ว แต่เฟืองแห้งเหมือนพระสารภาพบาป`,"Die Winde ist geschmiert und bereit.":`รอกหยอดจาระบีแล้ว พร้อมใช้งาน`,"Die Winde ist an den Boden genagelt. Von Leuten mit mehr Nägeln als Ideen.":`รอกถูกตอกติดพื้น โดยคนที่มีตะปูมากกว่าความคิด`,"Da steckt schon eine Stange drin.":`มีแท่งเสียบอยู่แล้ว`,"Die Eisenstange passt in die Nabe wie ein Zahn in die Lücke. Eine Kurbel! Fast.":`แท่งเหล็กเข้าไปในดุมพอดีเหมือนฟันเข้าช่อง ด้ามหมุนแล้ว! เกือบๆ`,"Mehr Pech braucht niemand. Ich auch nicht.":`ไม่มีใครต้องการยางมะตอยเพิ่มอีก ฉันก็ด้วย`,"Pech ist kein Schmierfett, aber es ist zäh und schwarz. Die Zahnräder schlucken es gierig.":`ยางมะตอยไม่ใช่จาระบี แต่มันเหนียวแล้วก็ดำ เฟืองกลืนมันอย่างตะกละ`,"Das Seil ist länger als die Kette. Aber wie die Kette will es nicht kurbeln.":`เชือกยาวกว่าโซ่ แต่เหมือนโซ่ มันไม่ยอมหมุน`,"Wein in die Zahnräder? Wilm würde weinen. Ich auch.":`เหล้าองุ่นใส่เฟืองเหรอ? Wilmคงร้องไห้ ฉันก็ด้วย`,"Das Schwert als Kurbel? Es ist zu kurz, zu scharf und zu wertvoll.":`ดาบเป็นด้ามหมุนเหรอ? มันสั้นไป คมไป แล้วก็มีค่าเกินไป`,"Hauptmann Grimm":`ผู้กอง Grimm`,"Hauptmann Grimm. Er sieht aus, als hätte er schon dreimal die Pest überlebt und es jedes Mal persönlich genommen.":`ผู้กอง Grimm ดูเหมือนรอดจากกาฬโรคมาแล้วสามหน แล้วก็เอามาโกรธเป็นการส่วนตัวทุกครั้ง`,"Die Klinge. Selbst geschmiedet? Schief, aber scharf.":`ดาบ ตีเองเหรอ? เบี้ยวแต่คม`,"Der Orden nimmt Handwerker lieber als Poeten. Weiter.":`คณะชอบช่างฝีมือมากกว่ากวี ไปต่อ`,"Ich habe es gesehen. Steck es weg.":`ข้าเห็นแล้ว เก็บไป`,"Der Segensbrief der Kirche. Das Siegel stimmt.":`จดหมายอวยพรของโบสถ์ ตราประทับถูกต้อง`,"Pater Anselm segnet selten. Er muss Mitleid mit dir gehabt haben.":`บาทหลวง Anselm ไม่ค่อยอวยพรให้ใคร ท่านคงสงสารเจ้าแน่ๆ`,"Das Siegel ist echt. Ich habe es mir gemerkt.":`ตราประทับของจริง ข้าจำไว้แล้ว`,"Ser Halvards Handschrift. Der alte Sturkopf bürgt für einen Grünschnabel?":`ลายมือของท่าน Halvard ไอ้ดื้อด้านแก่ๆ ค้ำประกันให้เด็กอ่อนหัดเนี่ยนะ?`,"Lebt er noch? Nein, sag nichts. Ich möchte es mir schönreden.":`ท่านยังมีชีวิตอยู่ไหม? ไม่ ไม่ต้องบอก ข้าอยากหลอกตัวเองให้สบายใจ`,"Halvards Brief. Ja. Genug davon.":`จดหมายของ Halvard ใช่ พอแล้ว`,"WEG DAMIT! Hexenzeug am Burgtor! Wilm, mach das Kreuzzeichen!":`เอาไปให้พ้น! ของแม่มดที่ประตูปราสาท! Wilm ทำสัญลักษณ์กางเขนซะ!`,"Ich kann es nicht, ich bin Linkshänder.":`ข้าทำไม่ได้ ข้าถนัดซ้าย`,"Steck es ein. Und rede mit niemandem darüber.":`เก็บเข้าไป แล้วอย่าพูดกับใครเรื่องนี้`,"Ein Trank, der leuchtet? Für den König, vermute ich.":`ยาที่เรืองแสงได้? สำหรับกษัตริย์สินะ ข้าเดา`,"Dann beeil dich. Aber trag ihn nicht offen: Der Kanzler mag keine fremden Fläschchen am Hof.":`งั้นก็รีบไป แต่อย่าถือออกหน้าออกตา ท่านเสนาบดีไม่ชอบขวดแปลกหน้าในราชสำนัก`,"Grimm: Eine Fackel? Wir haben hier viele. Aber danke, dass du dich um unser Licht sorgst.":`Grimm: คบเพลิงเหรอ? ที่นี่มีเยอะแยะ แต่ขอบใจที่ห่วงแสงสว่างของเรา`,"Halt! Wer da? Name, Stand, Absicht. In dieser Reihenfolge, und ohne Gedichte.":`หยุด! ใครน่ะ! ชื่อ ฐานะ เจตนา เรียงตามนี้ แล้วห้ามมีกลอน`,"Bran, Totengräberlehrling aus Aschenfurt. Ich will zur Prüfung des Rabenordens.":`Bran ลูกมือคนขุดหลุมศพจาก Aschenfurt ข้าอยากมาสอบเข้าคณะอัศวินแห่งอีกา`,"Totengräber. Das spart uns später die Kosten. Aber die Regeln gelten.":`คนขุดหลุมศพ ประหยัดค่าใช้จ่ายให้เราทีหลัง แต่กฎก็คือกฎ`,"Klinge, Segen, Bürge. Zeig sie vor, dann sehen wir weiter.":`ดาบ พร ผู้ค้ำประกัน เอาออกมาโชว์ แล้วค่อยว่ากัน`,"Was genau muss ich vorzeigen?":`ต้องโชว์อะไรบ้างกันแน่?`,"Eine Klinge, den Segen der Kirche und einen Bürgen. Das hast du in Aschenfurt schon gehört.":`ดาบหนึ่งเล่ม พรของโบสถ์ และผู้ค้ำประกันหนึ่งคน เจ้าก็ได้ยินมาแล้วตั้งแต่ที่ Aschenfurt`,"Zeig es mir einfach. Gib mir die Dinge.":`โชว์ข้ามาเลย เอาของมาให้ข้า`,"Ich bin ein Bote des Königs.":`ข้าเป็นผู้ส่งสารของกษัตริย์`,"Aha. Dann zeig mir das königliche Siegel.":`อ๋อ งั้นโชว์ตราประทับหลวงมาสิ`,"Ich hatte es hier. Irgendwo. Es war da.":`ข้ามีอยู่ตรงนี้ ที่ไหนสักแห่ง มันอยู่ตรงนั้น`,"Ich schlafe seit drei Nächten schlecht, aber so schlecht schlafe ich nicht.":`ข้านอนไม่หลับมาสามคืนแล้ว แต่ไม่ถึงขนาดนอนไม่หลับขนาดนั้นหรอก`,"Was ist mit dem Fallgitter?":`แล้วลูกกรงล่ะ?`,"Das Gitter hängt, die Winde klemmt, die Kurbel ist weg. Wilm behauptet, sie sei ihm 'abhandengekommen'.":`ลูกกรงค้าง รอกติด ด้ามหมุนหาย Wilmอ้างว่ามัน 'หายไปเอง'`,"Wenn du sie flickst, kurbeln wir. Kram in der Wachstube, Schubkarre, Fass. Schau dich um.":`ถ้าเจ้าซ่อมได้ เราก็หมุน ของจุกจิกอยู่ในห้องยาม รถเข็น ถัง ลองดูรอบๆ`,"Erst die Beweise. Dann reden wir über Gitter.":`หลักฐานก่อน แล้วค่อยคุยเรื่องลูกกรง`,"Wie steht es in der Burg?":`ในปราสาทเป็นยังไงบ้าง?`,"Der König ist krank. Der Kanzler regiert. Die Köchin gibt der Suppe die Schuld.":`กษัตริย์ป่วย เสนาบดีปกครอง แม่ครัวโทษซุป`,"Ich gebe der Pest die Schuld. Aber das ist nur mein Dienstgrad.":`ข้าโทษกาฬโรค แต่นั่นก็แค่ยศของข้า`,"Wer ist der Kanzler?":`เสนาบดีคือใคร?`,"Malvor. Ein Mann mit schönen Händen und leerem Blick. Er lässt alle Briefe durch seine Hände gehen.":`Malvor ผู้ชายมือสวยแต่สายตาว่างเปล่า เขาให้จดหมายทุกฉบับผ่านมือเขา`,"Ich sage nichts weiter. Meine Stiefel haben Ohren.":`ข้าไม่พูดอะไรอีก รองเท้าบู๊ตข้ามีหู`,"Ihr seht müde aus, Hauptmann.":`ท่านดูเหนื่อยนะ ท่านผู้กอง`,"Ich bin müde, seit der König krank ist. Und der König war schon vorher müde. Das ist ansteckend.":`ข้าเหนื่อยตั้งแต่กษัตริย์ป่วย แล้วกษัตริย์ก็เหนื่อยมาตั้งแต่ก่อนนั้น มันติดต่อกัน`,"Wenn du reinkommst, halt dich an die Mauern. Die sind ehrlich.":`ถ้าเข้าไปได้ เกาะกำแพงไว้ กำแพงซื่อสัตย์`,"Wache Wilm":`ยาม Wilm`,"Wilm lehnt an der Mauer und singt der Hellebarde etwas vor. Sie hört geduldig zu.":`Wilmพิงกำแพงร้องเพลงให้หอกยาวฟัง มันฟังอย่างอดทน`,"Wache Wilm. Er riecht nach Wein, den er nie getrunken haben will.":`ยาม Wilm ตัวเหม็นเหล้าองุ่นที่เขาไม่ยอมรับว่าเคยดื่ม`,"Hicks. Heute nicht mehr. Morgen vielleicht doppelt.":`ฮิก วันนี้พอแล้ว พรุ่งนี้อาจสองเท่า`,"Ist das Wein? Für mich? Medizin, ganz bestimmt. Gegen Dienst.":`นั่นเหล้าองุ่นเหรอ? ให้ข้าเหรอ? ยาแน่นอน ยาแก้เข้าเวร`,"Hicks. Das Leben ist schön! Soll ich ein Lied singen? ICH SINGE EIN LIED!":`ฮิก ชีวิตช่างงดงาม! ให้ร้องเพลงไหม? ข้าร้องเพลงล่ะนะ!`,"Er singt. Es ist kein Lied. Aber es ist laut.":`เขาร้อง มันไม่ใช่เพลง แต่ดัง`,"Suppe? Davon wird man nur satt. Ich will glücklich werden.":`ซุปเหรอ? กินแล้วอิ่มอย่างเดียว ข้าอยากมีความสุข`,"Ein leerer Becher? Das ist keine Spende, das ist eine Beleidigung.":`แก้วเปล่าเหรอ? นี่ไม่ใช่การบริจาค นี่คือการดูหมิ่น`,"Psst. Wenn der Hauptmann fragt: Ich stehe aufrecht und nüchtern. Beides.":`ชู่ว ถ้าผู้กองถาม ข้ายืนตรงและไม่เมา ทั้งสองอย่าง`,"Wilm, Torwache. Ich habe vier Dienstjahre und zwei Kinder, von denen eines von mir ist.":`Wilm ยามประตู ข้ารับราชการสี่ปี มีลูกสองคน หนึ่งในนั้นเป็นลูกข้า`,"Was stimmt mit der Winde nicht?":`รอกมันเป็นอะไรเหรอ?`,"Die klemmt. Rost, Pech, Bosheit. Die Kurbel hat der Winter geholt. Oder ich.":`ติด สนิม ยางมะตอย ความอาฆาต ด้ามหมุนฤดูหนาวขโมยไป หรือไม่ก็ข้า`,"Ein Stück Eisen, lang und stark, sollte reichen. Die Schubkarre da hinten ist voll damit.":`เหล็กชิ้นยาวๆ แข็งๆ ก็น่าจะพอ รถเข็นข้างหลังนั่นมีเต็มเลย`,"Brauche ich Schmiere für die Winde?":`ฉันต้องใช้จาระบีสำหรับรอกไหม?`,"Schmiere? Unser Pechfass! Pech ist zäh und stinkt. Wie unser Hauptmann.":`จาระบีเหรอ? ถังยางมะตอยของเรานี่ไง ยางมะตอยเหนียวแล้วก็เหม็น เหมือนผู้กองเรา`,"Du siehst durstig aus.":`ดูเหมือนท่านจะหิวน้ำนะ`,"Durstig? Ich? Ein Mann des Dienstes, der niemals trinkt? Ha.":`หิวน้ำเหรอ? ข้าเนี่ยนะ? ผู้ซื่อสัตย์ต่อหน้าที่ที่ไม่เคยดื่มเนี่ยนะ? ฮ่า`,"Gut, da steht das Weinfass des Hauptmanns. Ein Becher hängt unterm Wachtisch. Ich habe nichts gesagt.":`ดี ถังเหล้าองุ่นของผู้กองตั้งอยู่นั่น แก้วแขวนอยู่ใต้โต๊ะยาม ข้าไม่ได้พูดอะไร`,"Wie ist der Hauptmann so?":`ผู้กองเป็นคนยังไงเหรอ?`,"Grimm? Der beste. Er brüllt nur, wenn ihn jemand sieht, der ihn dafür bezahlt.":`Grimm เหรอ? ดีที่สุด เขาตะโกนเฉพาะตอนมีคนเห็นที่จ่ายเงินให้เขาตะโกน`,"Wie läuft's in der Burg?":`ในปราสาทเป็นไงบ้าง?`,"Der König liegt im Bett. Der Kanzler im Ohr des Königs. Und die Köchin in Dauerfehde mit dem Knappen Eduard.":`กษัตริย์นอนบนเตียง เสนาบดีอยู่ข้างหูกษัตริย์ แล้วแม่ครัวก็ทะเลาะไม่เลิกกับเด็กรับใช้ Eduard`,"Wenn der Hauptmann fragt: Du warst nie hier.":`ถ้าผู้กองถาม เจ้าไม่เคยมาที่นี่`,Wachtisch:`โต๊ะยาม`,"Ein Tisch mit Bechern, Würfeln und einem Kerzenstumpf. Dienstvorschrift sieht anders aus.":`โต๊ะที่มีแก้ว ลูกเต๋า และเทียนตอสั้นๆ ระเบียบการเข้าเวรไม่ได้เป็นแบบนี้`,"Leergefegt. Wilm ist gründlich.":`โล่งเตียน Wilm ละเอียดจริงๆ`,Schubkarre:`รถเข็น`,"Eine Schubkarre voller Krempel. Mauerkalk, Moos, und das Leid vieler Wachen.":`รถเข็นเต็มไปด้วยของจิปาถะ ปูนฉาบกำแพง ตะไคร่ และความทุกข์ของยามหลายคน`,"Nur Dreck.":`มีแต่สิ่งสกปรก`,"Ein Fass voll schwarzem Pech. Für die Verteidigung der Burg. Oder für Hexen, je nach Laune.":`ถังเต็มไปด้วยยางมะตอยสีดำ สำหรับป้องกันปราสาท หรือเอาไว้สำหรับแม่มด แล้วแต่อารมณ์`,"Genug Pech für heute. Ich habe schon genug davon im Leben.":`ยางมะตอยพอสำหรับวันนี้แล้ว ชีวิตนี้ฉันมีมันมากพอแล้ว`,"Ich kratze einen Klumpen heraus. Er klebt. Er klebt wirklich.":`ฉันขูดก้อนหนึ่งออกมา มันติด มันติดจริงๆ`,"Pech. Es blubbert zufrieden.":`ยางมะตอย มันเดือดปุดๆ อย่างพอใจ`,"Ich nehme einen Pechklumpen. Meine Finger kleben jetzt für alle Ewigkeit.":`ฉันเอายางมะตอยไปก้อนหนึ่ง นิ้วฉันติดไปชั่วนิรันดร์แล้ว`,"Die Fackel an das Pechfass? Dann brennt Burg Grauwacht, und ich war's. Besser nicht.":`เอาคบเพลิงจ่อถังยางมะตอยเหรอ? ปราสาท Grauwacht จะไหม้ แล้วเป็นฝีมือฉัน ไม่ดีกว่า`,"Ein grünliches Fass mit Zapfhahn. Auf dem Deckel steht 'Eigentum des Hauptmanns' und darunter 'Wilm war nicht hier'.":`ถังสีเขียวๆ มีก๊อก บนฝาเขียนว่า 'ทรัพย์สินของผู้กอง' และข้างล่างว่า 'Wilm ไม่ได้มาที่นี่'`,"Ich drehe am Hahn. Nichts kommt. Ich bräuchte ein Gefäß.":`ฉันบิดก๊อก ไม่มีอะไรออกมา ต้องมีภาชนะ`,"Der Becher ist voll. Mehr passt nicht hinein. Leider.":`แก้วเต็มแล้ว ใส่ไม่ได้อีก น่าเสียดาย`,"Da ist noch Suppe drin. Suppe und Wein vertragen sich nicht. Nur in der Küche.":`ในนั้นยังมีซุปอยู่ ซุปกับเหล้าองุ่นไม่เข้ากัน ยกเว้นในครัว`,"Der Becher füllt sich mit dunklem Roten. Ich verschütte nur einen Tropfen. Ein Opfer für die Götter.":`แก้วเต็มไปด้วยเหล้าแดงเข้ม ฉันหกแค่หยดเดียว เป็นเครื่องบูชาให้เทพเจ้า`,"Ein Haufen Steine, bereit für Belagerer. Oder für Wilm, wenn der Hauptmann schreit.":`กองหิน พร้อมสำหรับผู้บุกล้อม หรือสำหรับ Wilm เวลาผู้กองตะโกน`,"Ich nehme keine Steine. Ich habe schon genug Sorgen.":`ฉันไม่เอาหิน ฉันมีเรื่องกังวลพอแล้ว`,"Ein Messingknopf. Von einem Soldatenrock, der längst ... na ja.":`กระดุมทองเหลือง จากเสื้อทหารที่นานแล้ว ก็... เอาเถอะ`,"Ein Zahn. Ob der Hauptmann ihn vermisst?":`ฟันซี่หนึ่ง ผู้กองจะคิดถึงมันไหมนะ?`,Rabenbanner:`ธงอีกา`,"Ein schwarzes Banner mit weißem Raben. Der Orden hängt seine Wappen höher als seine Hoffnung.":`ธงสีดำรูปอีกาสีขาว คณะแขวนตราไว้สูงกว่าความหวังของตัวเอง`,"Noch ein Rabe. Offensichtlich ist die Burg stolz auf ihre Vogelzucht.":`อีกาอีกตัว เห็นได้ชัดว่าปราสาทภูมิใจกับการเลี้ยงนกของตัวเอง`,Wandfackel:`คบเพลิงติดผนัง`,"Eine Fackel an der Mauer. Sie brennt, damit die Wachen sich wärmen und die Diebe sehen, wo sie hinmüssen.":`คบเพลิงที่กำแพง มันลุกไหม้เพื่อให้ยามอุ่น และให้ขโมยเห็นว่าต้องไปทางไหน`,"Die zweite Fackel. Sie flackert, als würde sie lügen.":`คบเพลิงอันที่สอง มันกะพริบเหมือนกำลังโกหก`,"Die Burg Grauwacht auf ihrem Felsen. Hunderte Fenster, aber nur wenige erleuchtet. Die Pest spart Kerzen.":`ปราสาท Grauwacht บนโขดหิน หน้าต่างเป็นร้อยบาน แต่สว่างแค่ไม่กี่บาน กาฬโรคประหยัดเทียน`,Wimpel:`ธงประจำ`,"Ein Wimpel am Mast. Er hängt traurig, als wüsste er mehr als wir.":`ธงประจำที่เสา มันห้อยอย่างเศร้า ราวกับรู้มากกว่าเรา`,Wehrgang:`ทางเดินบนกำแพง`,"Die Zinnen. Von dort oben haben schon viele ihre letzte Aussicht genossen.":`ช่องกำแพง จากตรงนั้นหลายคนเคยชมวิวครั้งสุดท้ายของตัวเอง`,Burggraben:`คูเมือง`,"Der Graben. Wasser, Schlamm, und ein Gerücht von einer Leiche. Man kann nicht alles haben.":`คูน้ำ น้ำ โคลน และข่าวลือเรื่องศพ จะเอาทุกอย่างไม่ได้หรอก`,"Danke, ich bin satt. Das erste Mal seit Wochen.":`ขอบคุณ ฉันอิ่มแล้ว ครั้งแรกในรอบหลายสัปดาห์`,"Ein leerer Becher? Ich bin hungrig, nicht höflich.":`แก้วเปล่าเหรอ? ข้าหิว ไม่ได้สุภาพ`,"Suppe! Kohl, Zwiebel und eine Ahnung von Fleisch. Ich habe Brot gesehen, das mir besser gefallen hat. Aber das hier ist ein Festmahl.":`ซุป! กะหล่ำ หัวหอม และเค้าลางของเนื้อ ข้าเคยเห็นขนมปังที่ถูกใจกว่านี้ แต่นี่คืองานเลี้ยงเลย`,"Roderic hat mir aufgetragen, Gefangene zu speisen. Ich hätte nie gedacht, dass es um Euch geht.":`Roderic สั่งให้ข้าเลี้ยงนักโทษ ข้าไม่เคยคิดเลยว่าเป็นท่าน`,"Der Schlüssel! Bran, du Teufelskerl. Ich war schon dabei, mit der Ratte zu verhandeln.":`กุญแจ! Bran เจ้าตัวแสบ ข้ากำลังจะเจรจากับหนูอยู่แล้ว`,"Hör zu: Malvor hat mich eingesperrt, weil ich ihn beim Gift-Mischen sah. Der König ist nicht krank, er wird vergiftet.":`ฟังนะ Malvor ขังข้าเพราะข้าเห็นเขาผสมยาพิษ กษัตริย์ไม่ได้ป่วย กำลังถูกวางยา`,"Sein Versteck ist ein Geheimfach hinterm Wandteppich im Thronsaal. Die Knöpfe: 'Rabe, Kreuz, Rabe, Lamm', hat er im Suff gemurmelt.":`ที่ซ่อนของเขาคือช่องลับหลังผ้าทอในท้องพระโรง ปุ่มคือ 'อีกา กางเขน อีกา ลูกแกะ' เขาพึมพำตอนเมา`,"Ich gehe hinauf in den Thronsaal und warte dort. Wenn du ihn anklagst, bezeuge ich alles.":`ข้าจะขึ้นไปท้องพระโรงแล้วรออยู่ที่นั่น ถ้าเจ้าฟ้องเขา ข้าจะเป็นพยานทุกอย่าง`,"Ein Zeuge, ein Spruch und ein Fach. Fehlt nur noch der Kelch.":`พยานหนึ่งคน คำหนึ่งประโยค และช่องลับหนึ่งช่อง เหลือแค่ถ้วย`,"Aldric humpelt die Treppe hinauf. Der Kerker wirkt plötzlich leerer.":`Aldric ขาลากขึ้นบันไดไป คุกใต้ดินดูว่างเปล่าลงทันที`,"Kerker von Grauwacht":`คุกใต้ดินของ Grauwacht`,"Treppe zum Burghof":`บันไดสู่ลานปราสาท`,"Wärter Knorr":`ผู้คุม Knorr`,"Knorr schnarcht wie ein Ochse im Winter. Aus dem Maul hängt ein Faden Spucke. Er träumt von Wein.":`Knorr กรนเหมือนวัวในฤดูหนาว น้ำลายยืดห้อยจากปาก เขาฝันถึงเหล้าองุ่น`,"Wärter Knorr. Rund, rot und im Besitz eines Schlüsselbunds, das lauter klimpert als sein Gewissen.":`ผู้คุม Knorr กลม แดง และถือพวงกุญแจที่กรุ๊งกริ๊งดังกว่าสำนึกของเขา`,"Er schläft. Man weckt keinen Wärter, der friedlich schläft. Das ist ein ungeschriebenes Gesetz.":`เขาหลับอยู่ ไม่มีใครปลุกผู้คุมที่หลับสบาย นั่นเป็นกฎที่ไม่ได้เขียนไว้`,"Wein! Für mich? Von wem? Egal. Prost auf den Kanzler, der uns alle ... hicks ... bezahlt.":`เหล้าองุ่น! ให้ข้าเหรอ? จากใคร? ช่างเถอะ ดื่มให้เสนาบดีที่จ่ายเงินพวกเรา... ฮิก... ทุกคน`,"Knorr trinkt in einem Zug. Er blinzelt, schwankt, summt, und sackt langsam auf den Schemel. Dann kommt das Schnarchen.":`Knorr ดื่มรวดเดียว เขากะพริบตา โงนเงน ฮัมเพลง แล้วค่อยๆ ทรุดลงบนเก้าอี้ตัวเตี้ย จากนั้นก็เสียงกรน`,"Das Schlafkraut wirkt. Der Schlüssel am Haken gehört mir.":`สมุนไพรนอนหลับได้ผล กุญแจที่ตะขอเป็นของฉันแล้ว`,"Wein! Du bist ein Gentleman, Junge. Hicks. Ich sag dir was: Der Kanzler besucht den Gefangenen jede Woche.":`เหล้าองุ่น! เจ้าเป็นสุภาพบุรุษ เจ้าหนู ฮิก ข้าจะบอกให้ เสนาบดีมาเยี่ยมนักโทษทุกสัปดาห์`,"Er sagt, er kontrolliert die Haft. Ich sage: Er hat Angst vor einem Mann in Ketten. Hicks. Aber ich sage nichts.":`เขาว่าเขามาตรวจการคุมขัง ข้าว่าเขากลัวคนที่ใส่โซ่ ฮิก แต่ข้าไม่พูดอะไร`,"Er ist betrunken, aber nicht müde genug. Es muss etwas Stärkeres her. Berta hat Schlafkraut ...":`เขาเมา แต่ยังไม่ง่วงพอ ต้องใช้ของแรงกว่านี้ Berta มีสมุนไพรนอนหลับ...`,"Knorr: Kraut? Ich bin doch kein Kaninchen! Gib mir was zum Trinken, Junge.":`Knorr: สมุนไพรเหรอ? ข้าไม่ใช่กระต่ายนะ! เอาอะไรให้ข้าดื่มหน่อย เจ้าหนู`,"Wein im Becher! Ein Gentleman! Hicks. Aber das reicht nicht, um mich umzuhauen. Ich vertrage mehr als das Königshaus.":`เหล้าองุ่นในแก้ว! สุภาพบุรุษ! ฮิก แต่แค่นี้ยังล้มข้าไม่ได้ ข้าทนได้มากกว่าราชวงศ์อีก`,"Ein leerer Becher? Ich bin Wärter, nicht Wasserträger.":`แก้วเปล่าเหรอ? ข้าเป็นผู้คุม ไม่ใช่คนแบกน้ำ`,"Knorr schnarcht. Es ist das ehrlichste Gespräch, das ich seit Tagen hatte.":`Knorr กรน นี่เป็นบทสนทนาที่ซื่อสัตย์ที่สุดที่ฉันมีในรอบหลายวัน`,"Wer kommt da? Besuch? Ich habe keine Besuchszeiten. Ich habe nur Zeiten, in denen ich nicht besoffen bin. Und die sind selten.":`ใครมาน่ะ? แขกเหรอ? ข้าไม่มีเวลาเยี่ยม ข้ามีแต่เวลาที่ข้าไม่เมา แล้วก็หายาก`,"Wer ist im Kerker?":`ใครอยู่ในคุก?`,"Ein Ritter, den keiner kennt. Die Ratten sind meine Freunde. Und ein Skelett in der Zelle da hinten, das zahlt keine Miete.":`อัศวินที่ไม่มีใครรู้จัก หนูคือเพื่อนข้า แล้วก็โครงกระดูกในห้องขังข้างหลังนั่น ไม่จ่ายค่าเช่า`,"Darf ich den Gefangenen Suppe bringen?":`ข้านำซุปให้นักโทษได้ไหม?`,"Suppe? Meinetwegen. Aber ich bekomme einen Schluck vom Kanzlerwein, wenn der Gefangene satt wird. Das ist Brauch.":`ซุปเหรอ? ตามใจ แต่ข้าขอจิบเหล้าองุ่นของเสนาบดี ถ้านักโทษอิ่ม นั่นคือธรรมเนียม`,"Kann ich den Gefangenen sprechen?":`ข้าคุยกับนักโทษได้ไหม?`,"Von mir aus. Er kann nirgendwohin. Und ich will nicht wissen, was ihr redet.":`ตามสบาย เขาไปไหนไม่ได้ แล้วข้าก็ไม่อยากรู้ว่าพวกเจ้าคุยอะไรกัน`,"Was ist das für ein Schlüsselbund?":`นั่นพวงกุญแจอะไรเหรอ?`,"Hier? Der Schlüssel der Zelle hängt am Haken dort drüben, hinterm Tisch. Ich trage nur den Bund, damit ich wichtig aussehe.":`ตรงนี้เหรอ? กุญแจห้องขังแขวนอยู่ที่ตะขอตรงโน้น หลังโต๊ะ ข้าถือแค่พวง จะได้ดูสำคัญ`,"Was trinkt Ihr da?":`ท่านดื่มอะไรอยู่?`,"Medizin. Gegen Langeweile, Nüchternheit und Familie. Hast du Medizin dabei? Ich würde sie nehmen.":`ยา แก้เบื่อ แก้สร่างเมา แก้ครอบครัว เจ้ามียาติดตัวมาไหม? ข้าจะกินเลย`,"Der Kanzler besucht den Gefangenen?":`เสนาบดีมาเยี่ยมนักโทษเหรอ?`,"Hicks. Immer nachts. Er bringt Wein und Papiere. Und er geht ohne beides. Aber ich sage nichts.":`ฮิก ตอนกลางคืนเสมอ เขาเอาเหล้าองุ่นกับเอกสารมา แล้วกลับไปโดยไม่มีทั้งสองอย่าง แต่ข้าไม่พูดอะไร`,"Wenn du Wein siehst, bring ihn mit. Wenn nicht, bring dich selbst. Hicks.":`ถ้าเห็นเหล้าองุ่น เอามาด้วย ถ้าไม่มี เอาตัวเจ้ามาเอง ฮิก`,Schlüsselhaken:`ตะขอกุญแจ`,"Ein Schlüsselhaken mit vier Ringen. Drei Haken sind leer, der vierte auch.":`ตะขอกุญแจสี่ห่วง สามตะขอว่าง ตะขอที่สี่ก็ว่างเหมือนกัน`,"Ein Brett mit vier riesigen Schlüsseln. Einer glänzt, der Zellenschlüssel. Knorr beobachtet ihn wie eine Henne ihr Ei.":`กระดานที่มีกุญแจยักษ์สี่ดอก ดอกหนึ่งเงาวับ กุญแจห้องขัง Knorr จ้องมันเหมือนแม่ไก่เฝ้าไข่`,"Der Haken ist leer. Ich habe schon alles, was ich wollte. Und noch ein Stück schlechtes Gewissen.":`ตะขอว่างเปล่า ฉันได้ทุกอย่างที่ต้องการแล้ว กับความรู้สึกผิดอีกนิด`,"Pfoten weg vom Haken, Bursche! Die Schlüssel zähle ich jeden Abend. Zweimal.":`เอามือออกจากตะขอ เจ้าหนู! ข้านับกุญแจทุกเย็น สองรอบ`,"Er sieht aus, als wäre er betrunken, aber er hat Augen wie ein Habicht. Ich muss ihn erst ausschalten.":`เขาดูเหมือนเมา แต่ตาเหมือนเหยี่ยว ฉันต้องจัดการเขาก่อน`,"Der Zellenschlüssel kommt mit einem leisen Klirren. Er ist schwer. Und für einen Moment auch ich.":`กุญแจห้องขังมาพร้อมเสียงกรุ๊งกริ๊งเบาๆ มันหนัก และชั่วขณะหนึ่ง ฉันก็หนักด้วย`,"Ich fasse an den Haken. Er hängt, wie Haken eben hängen.":`ฉันแตะตะขอ มันห้อยอยู่ เหมือนตะขอทั่วไปห้อย`,Zelle:`ห้องขัง`,"Die Zelle steht offen. Das Stroh liegt noch, wo der Gefangene lag.":`ห้องขังเปิดอยู่ ฟางยังอยู่ตรงที่นักโทษเคยนอน`,"Eine Zelle mit Gitter und Schloss. Dahinter steht ein Mann in zerlumpter Rüstung.":`ห้องขังมีลูกกรงและกุญแจ ข้างหลังมีชายคนหนึ่งในเกราะขาดวิ่น`,"Offen. Ein trauriger Raum, aber ein ehrlicher.":`เปิดอยู่ ห้องที่น่าเศร้า แต่ซื่อสัตย์`,"Verschlossen. Das Schloss hat die Größe meines Kopfes. Es braucht einen Schlüssel von gleichem Format.":`ล็อกอยู่ ตัวล็อกใหญ่เท่าหัวฉัน ต้องใช้กุญแจขนาดเดียวกัน`,"Offen ist offen.":`เปิดก็คือเปิด`,"Ich drücke die Stange gegen das Schloss. Es biegt sich. Nicht das Schloss.":`ฉันกดแท่งเข้ากับตัวล็อก มันงอ ไม่ใช่ตัวล็อก`,"Ser Aldric":`ท่าน Aldric`,"Ein Ritter in zerrissener Rüstung. Ketten an den Händen, aber der Blick ist ungebrochen. Er sieht aus wie jemand, der zu lange nicht geschlafen hat und zu viel gedacht.":`อัศวินในเกราะขาดวิ่น มือใส่โซ่ แต่สายตาไม่แตกสลาย เขาดูเหมือนคนที่นอนไม่พอและคิดมากเกินไป`,"Aldric: Ein Trank? Für den König? Dann trink ihn nicht selbst. Er soll in den Kelch.":`Aldric: ยาเหรอ? สำหรับกษัตริย์? งั้นอย่าดื่มเอง ให้ใส่ในถ้วย`,"Aldric: Wein? Behalte ihn. Ein Wärter, der Wein will, ist ein besserer Verbündeter als ich.":`Aldric: เหล้าองุ่นเหรอ? เก็บไว้ ผู้คุมที่อยากได้เหล้าองุ่นเป็นพันธมิตรที่ดีกว่าข้า`,"Ein Junge? Hat Knorr dich hereingelassen oder hast du dich nur verlaufen?":`เด็กเหรอ? Knorr ให้เจ้าเข้ามา หรือเจ้าแค่หลงทาง?`,"Bran aus Aschenfurt, Anwärter des Ordens. Wer seid Ihr?":`Bran จาก Aschenfurt ผู้สมัครของคณะ ท่านคือใคร?`,"Ser Aldric vom Raben. Roderic hat mich vor Wochen zur Grenze gesandt. Ich kam nie an. Ich bin hier.":`ท่าน Aldric แห่งอีกา Roderic ส่งข้าไปชายแดนเมื่อหลายสัปดาห์ก่อน ข้าไปไม่ถึง ข้าอยู่ที่นี่`,"Warum seid Ihr eingesperrt?":`ทำไมท่านถึงถูกขัง?`,"Ich sah Malvor in der Küche, wie er etwas Schwarzes in den Wein des Königs goss. Am nächsten Tag war ich hier.":`ข้าเห็น Malvor ในครัว เขาเทของสีดำลงในเหล้าองุ่นของกษัตริย์ วันรุ่งขึ้นข้าก็อยู่ที่นี่`,"Habt Ihr Hunger?":`ท่านหิวไหม?`,"Hunger? Ich habe seit Tagen nur Ratten gehört. Wenn du etwas Warmes hast, ich wäre dir ewig dankbar.":`หิวเหรอ? หลายวันแล้วข้าได้ยินแต่เสียงหนู ถ้าเจ้ามีของอุ่นๆ ข้าจะซาบซึ้งไปชั่วชีวิต`,"Wie komme ich an den Schlüssel?":`ฉันจะเอากุญแจได้ยังไง?`,"Er hängt dort am Haken. Knorr hütet ihn mit seinem Leben. Und seinem Bierkrug. Der ist sein Schwachpunkt.":`มันแขวนอยู่ที่ตะขอตรงนั้น Knorr เฝ้ามันด้วยชีวิต และแก้วเบียร์ของเขา นั่นคือจุดอ่อนของเขา`,"Gib ihm Wein. Viel Wein. Und etwas Schlafkraut, falls Berta welches hat. Dann ist er ein sanftes Lamm.":`ให้เหล้าองุ่นเขา เยอะๆ แล้วก็สมุนไพรนอนหลับสักหน่อย ถ้า Berta มี แล้วเขาจะเป็นลูกแกะเชื่องๆ`,"Was wisst Ihr über Malvor?":`ท่านรู้อะไรเกี่ยวกับ Malvor?`,"Er will das Drachenhorn. Den Vulkan Kharn, das Ei, die Macht. Er baut an einem Plan.":`เขาต้องการเขามังกร ภูเขาไฟ Kharn ไข่ อำนาจ เขากำลังวางแผนอยู่`,"Sein Geheimfach hat vier Runenknöpfe: Rabe, Kreuz, Rabe, Lamm. Das hat er im Rausch gemurmelt, als er hier war.":`ช่องลับของเขามีปุ่มรูนสี่ปุ่ม อีกา กางเขน อีกา ลูกแกะ เขาพึมพำตอนเมาเวลามาที่นี่`,"Seid Ihr verletzt?":`ท่านบาดเจ็บไหม?`,"Nur mein Stolz. Und ein Zahn. Aber den habe ich schon verschmerzt.":`แค่ศักดิ์ศรี กับฟันหนึ่งซี่ แต่อันนั้นข้าทำใจได้แล้ว`,"Beeil dich. Der König hat nicht mehr viele Abende.":`รีบหน่อย กษัตริย์เหลือเย็นไม่มากแล้ว`,"Ein Tisch mit Würfeln, Kerzenstummel und Krümeln. Ein Wärterleben in Stillleben.":`โต๊ะที่มีลูกเต๋า เทียนตอสั้น และเศษขนม ชีวิตผู้คุมในภาพนิ่ง`,"Leer. Knorr hat alles verfuttert.":`ว่างเปล่า Knorr กินหมดแล้ว`,"Eine Kiste mit abgegriffenem Schloss. Man spürt: Hier liegt, was Gefangene verloren haben.":`หีบที่ตัวล็อกสึกจากการจับ รู้สึกได้ว่าที่นี่เก็บของที่นักโทษทำหาย`,"Leer. Selbst Armut war hier schon zu Besuch.":`ว่างเปล่า แม้ความจนก็เคยมาเยือนที่นี่แล้ว`,"Knorrs Weinfass. Der Hahn tropft. Der Boden ist klebrig, die Luft süßlich.":`ถังเหล้าองุ่นของ Knorr ก๊อกหยด พื้นเหนียว อากาศหวานเลี่ยน`,"Der Hahn tropft einen Tropfen. Ich fange ihn mit der Zunge. Das ist kein Gewinn.":`ก๊อกหยดหนึ่งหยด ฉันรับด้วยลิ้น ไม่ได้อะไรขึ้นมาเลย`,"Das Fass ist größer als meine Moral.":`ถังนี่ใหญ่กว่าศีลธรรมของฉัน`,"Der Hahn ist trocken. Knorr hat ihn schon leergesaugt.":`ก๊อกแห้งแล้ว Knorr ดูดจนหมด`,Skelett:`โครงกระดูก`,"Ein Ritterskelett, an die Wand gelehnt. Es grinst, weil ihm nichts Besseres einfällt. Der letzte Gefangene, der nicht mehr redet.":`โครงกระดูกอัศวินพิงกำแพง มันยิ้มเพราะคิดอะไรดีกว่านี้ไม่ออก นักโทษคนสุดท้ายที่ไม่พูดอีกแล้ว`,"Ich nehme seinen Helm nicht. Der hat schon sein Schicksal.":`ฉันไม่เอาหมวกเกราะของเขา มันมีชะตากรรมของมันแล้ว`,"Er antwortet nicht. Höflich, aber ohne Substanz.":`เขาไม่ตอบ สุภาพ แต่ไร้เนื้อหา`,"Ein Haufen Knochen vor der Zelle. Man hat sie nicht entsorgt, nur sortiert.":`กองกระดูกหน้าห้องขัง เขาไม่ได้กำจัดมัน แค่คัดแยก`,"Ich nehme keine Knochen. Nur Respekt.":`ฉันไม่เอากระดูก เอาแค่ความเคารพ`,"Leere Zelle":`ห้องขังว่าง`,"Eine leere Zelle. Auf dem Boden liegt Stroh, in der Ecke ein Eimer. Auch Verzweiflung wohnt hier nur zur Miete.":`ห้องขังว่าง บนพื้นมีฟาง มุมห้องมีถัง แม้ความสิ้นหวังก็อยู่ที่นี่แค่เช่า`,Wachnische:`ช่องยาม`,"Eine gemauerte Nische mit Steinbank. Hier sitzt der Wärter, wenn er nicht gerade liegt.":`ซอกก่ออิฐมีม้านั่งหิน ผู้คุมนั่งตรงนี้ตอนไม่ได้นอน`,"Eisenketten an der Wand. Sie halten niemanden mehr, aber sie erinnern sich noch gut.":`โซ่เหล็กที่กำแพง ไม่ได้ขังใครแล้ว แต่ยังจำได้ดี`,"Ketten mit Fußschellen. Sie sind so gepflegt wie Knorrs Schlüsselbund. Dazu hat er Zeit.":`โซ่พร้อมกุญแจเท้า ดูแลดีพอๆ กับพวงกุญแจของ Knorr เขามีเวลาให้กับมัน`,Fackel:`คบเพลิง`,"Eine Fackel, die mehr rußt als leuchtet. Der Kerker spart an Licht, weil er an Hoffnung spart.":`คบเพลิงที่ควันดำมากกว่าแสง คุกประหยัดแสงเพราะประหยัดความหวัง`,"Noch eine Fackel. Sie flackert, als wollte sie flüchten.":`คบเพลิงอีกอัน มันกะพริบราวกับอยากหนี`,Treppe:`บันได`,"Die Treppe in den Burghof. Von oben fällt ein Streifen Tageslicht, das so tut, als gäbe es noch Hoffnung.":`บันไดสู่ลานปราสาท จากข้างบนมีแสงกลางวันเป็นริ้ว ทำเป็นว่ายังมีความหวัง`,"Das Teil sitzt schon. Doppelt hält nicht besser.":`ชิ้นนี้ใส่เข้าที่แล้ว ใส่สองครั้งก็ไม่ได้ดีขึ้น`,"Ein Helm auf einem nackten Gestell? Das sieht aus wie ein Vogelhäuschen. Erst den Brustpanzer.":`หมวกเกราะบนโครงเปล่าเหรอ? ดูเหมือนบ้านนก ต้องใส่เกราะอกก่อน`,"Die Armschienen brauchen etwas, woran sie hängen können. Erst Brustpanzer, dann Helm.":`เกราะแขนต้องมีที่ให้แขวน เกราะอกก่อน แล้วค่อยหมวกเกราะ`,"Die Ordensrüstung steht komplett da. Sie ist leerer als der Ritter, der sie trägt. Aber sie glänzt.":`เกราะของคณะตั้งครบชุดแล้ว มันว่างกว่าอัศวินที่สวมมัน แต่เงาวับ`,Rüstungsständer:`ขาตั้งเกราะ`,"Ein hölzerner Rüstungsständer. Er ist leer und wartet. Wie ein Wirt am Wochenende.":`ขาตั้งเกราะไม้ ว่างเปล่าและรออยู่ เหมือนเจ้าของโรงเตี๊ยมวันหยุดสุดสัปดาห์`,"Der Brustpanzer sitzt. Ohne Kopf sieht der Ständer aus wie ein Ritter nach der Schlacht.":`เกราะอกเข้าที่แล้ว ไม่มีหัว ขาตั้งดูเหมือนอัศวินหลังการรบ`,"Brustpanzer und Helm. Es fehlt noch der Arm. Die Haltung ist verzweifelt.":`เกราะอกกับหมวกเกราะ ยังขาดแขน ท่าทางดูสิ้นหวัง`,"Der Ständer trägt die ganze Ordensrüstung. Ein Ritter, dem nur noch das Leben fehlt.":`ขาตั้งแบกเกราะของคณะทั้งชุด อัศวินที่ขาดแค่ชีวิต`,"Der Ständer ist schwerer als ein Pferd. Und weniger kooperativ.":`ขาตั้งหนักกว่าม้า และให้ความร่วมมือน้อยกว่า`,"Die Rüstung steht. Ich sollte sie nicht anfassen. Roderic würde es merken.":`เกราะตั้งอยู่ ฉันไม่ควรแตะ Roderic จะรู้`,"Ich zupfe am Ständer. Er zupft nicht zurück. Er braucht Stahl.":`ฉันดึงขาตั้ง มันไม่ดึงกลับ ต้องใช้เหล็กกล้า`,"Der Brustpanzer rastet auf dem Holzkreuz ein. Es klingt wie ein Pfarrer, der den Segen vergisst.":`เกราะอกลงล็อกบนไม้กางเขน เสียงเหมือนพระที่ลืมอวยพร`,"Der Helm landet oben auf dem Pfahl. Er sitzt schief, bis ich ihn richte. Ordnung ist Demut.":`หมวกเกราะลงบนเสาข้างบน มันเอียงจนฉันจัดให้ตรง ความเป็นระเบียบคือความถ่อมตัว`,"Ich hänge die Armschienen an die Querstange. Klirr, klirr. Die Rüstung ist vollständig.":`ฉันแขวนเกราะแขนบนคานขวาง กริ๊งๆ เกราะครบชุดแล้ว`,"Ein Schild an den Ständer? Der Ständer hat keine Arme dafür. Das Schild braucht eine andere Aufgabe.":`โล่ติดขาตั้งเหรอ? ขาตั้งไม่มีแขนสำหรับมัน โล่ต้องมีงานอื่น`,"Das Spiegelschild gehört nicht an den Ständer. Ich brauche es noch.":`โล่กระจกไม่ได้อยู่ที่ขาตั้ง ฉันยังต้องใช้มัน`,"Sand auf die Rüstung? Das macht sie nur stumpf. Besser den Schild bearbeiten.":`ทรายบนเกราะเหรอ? มันทำให้เกราะด้านเท่านั้น ไปจัดการโล่ดีกว่า`,"Eine schwere Kommode aus Eichenholz. Zwei Schubladen. Die untere hat ein Schloss, das eine eigene Meinung hat.":`ตู้ลิ้นชักไม้โอ๊กหนัก ลิ้นชักสองอัน อันล่างมีตัวล็อกที่มีความคิดเป็นของตัวเอง`,"Verschlossen. Das Schloss sieht aus, als bräuchte es einen eisernen Schlüssel.":`ล็อกอยู่ ตัวล็อกดูเหมือนต้องใช้กุญแจเหล็ก`,"Der Schlüssel dreht sich. Die Schublade gleitet auf, wie von einem Trauerzug geschoben.":`กุญแจหมุน ลิ้นชักเลื่อนเปิดเหมือนถูกขบวนศพผลักมา`,Waffentruhe:`หีบอาวุธ`,"Eine eisenbeschlagene Truhe. Der Deckel ist schwer, das Schloss aufgebrochen, die Hoffnung eingerostet.":`หีบหุ้มเหล็ก ฝาหนัก ตัวล็อกพังแล้ว ความหวังขึ้นสนิม`,"Leer, bis auf Rostflocken.":`ว่างเปล่า เว้นแต่เกล็ดสนิม`,Sandkiste:`หีบทราย`,"Eine Kiste voll feinem Sand. Hier poliert man Rüstungen. Oder gräbt man Schatzkarten.":`หีบเต็มไปด้วยทรายละเอียด ที่นี่ขัดเกราะ หรือขุดแผนที่ขุมทรัพย์`,"Nur Staub, wo einmal Sand war.":`มีแต่ฝุ่นตรงที่เคยเป็นทราย`,Waffenständer:`ขาตั้งอาวุธ`,"Ein Ständer mit Speeren und Schwertern. Alles stumpf, verrostet und zum Üben. So wie ich.":`ขาตั้งหอกและดาบ ทื่อ ขึ้นสนิม ไว้ซ้อม เหมือนฉัน`,"Ich ziehe an einem Schwert. Es steckt fest. Der Ständer hat mehr Willenskraft als ich.":`ฉันดึงดาบเล่มหนึ่ง มันติดแน่น ขาตั้งมีกำลังใจมากกว่าฉัน`,"Ich lege mein Schwert dazu? Dann sieht es aus wie die anderen. Sie sind alle schlechter.":`ฉันวางดาบฉันไว้ด้วยเหรอ? แล้วมันจะดูเหมือนเล่มอื่นๆ พวกมันแย่กว่าทุกเล่ม`,"Ein Kerzenständer mit drei Stümpfen. Das Wachs ist so oft heruntergelaufen wie meine Hoffnung.":`เชิงเทียนที่มีตอสามอัน ขี้ผึ้งไหลลงมาบ่อยพอๆ กับความหวังของฉัน`,"Zu hoch, zu schwer, zu sinnlos.":`สูงไป หนักไป ไร้ความหมายไป`,Fahnenständer:`ขาตั้งธง`,"Ein Raben-Banner am Ständer. Es hängt schlaff. Es wartet auf Wind oder Befehle.":`ธงอีกาที่ขาตั้ง มันห้อยหย่อน รอลมหรือคำสั่ง`,"Ein krummer Nagel. In einer Rüstkammer gibt es nie genug davon.":`ตะปูคด ในคลังเกราะมีไม่พอเสมอ`,"Eine Tonscherbe. Sie war mal ein Krug. Jetzt ist sie ein Zeuge.":`เศษดินเผา เคยเป็นเหยือก ตอนนี้เป็นพยาน`,Schwertregal:`ชั้นดาบ`,"Ein Regal voller Schwerter. Alle stumpf, alle ordentlich, alle ohne Besitzer. Wie bei einem Begräbnis.":`ชั้นเต็มไปด้วยดาบ ทื่อทุกเล่ม เป็นระเบียบทุกเล่ม ไม่มีเจ้าของทุกเล่ม เหมือนงานศพ`,Speerregal:`ชั้นหอก`,"Speere. Lang, spitz, unbeliebt bei Pferden.":`หอก ยาว แหลม ม้าไม่ชอบ`,Hellebardenregal:`ชั้นหอกง้าว`,"Hellebarden. Halb Axt, halb Speer, ganz Ausrede.":`หอกง้าว ครึ่งขวาน ครึ่งหอก ข้ออ้างเต็มตัว`,Axtregal:`ชั้นขวาน`,"Äxte und Streitkolben. Der Orden liebt Werkzeuge, die keine Fragen stellen.":`ขวานและกระบองศึก คณะรักเครื่องมือที่ไม่ถามคำถาม`,Ordenswappen:`ตราคณะ`,"Das Wappen des Ordens: Lilie, Rabe, Schild. Alles, was man braucht, um Feinde zu verwirren.":`ตราของคณะ ดอกลิลลี่ อีกา โล่ ทุกอย่างที่ต้องใช้ทำให้ศัตรูงง`,"Ein hohes Fenster, hinter dem der Mond hängt. Er schaut zu und urteilt.":`หน้าต่างสูงที่มีพระจันทร์แขวนอยู่ข้างหลัง มันมอง และตัดสิน`,"Ein blaues Banner mit Löwe. Er blickt, als wüsste er, wer das Schwert vergessen hat.":`ธงสีน้ำเงินรูปสิงโต มันมองเหมือนรู้ว่าใครลืมดาบ`,"Ein rotes Banner. Es verrät nichts außer dem Geschmack der Ahnen.":`ธงสีแดง มันไม่บอกอะไรนอกจากรสนิยมของบรรพบุรุษ`,"Dunkler Durchgang":`ทางเดินมืด`,"Ein Durchgang ins Dunkel. Er führt zu den Vorräten, sagt ein Schild. Es gibt keins. Ich ahne es nur.":`ทางเดินสู่ความมืด ป้ายบอกว่าไปยังคลังเสบียง ไม่มีป้ายหรอก ฉันแค่เดา`,"Ein rührendes Schriftstück. Ritter schreiben stets so, als stürben sie morgen. Hier, Euer Brief.":`จดหมายซึ้งดีนะ อัศวินน่ะเขียนเหมือนพรุ่งนี้จะตายทุกที นี่ จดหมายของท่าน`,"Der Kelch ist leer getrunken. Es liegt nichts mehr zu tun. Außer Anklage.":`ถ้วยดื่มจนเกลี้ยงแล้ว ไม่มีอะไรให้ทำอีก นอกจากฟ้องร้อง`,"Was machst du am Kelch Seiner Majestät, Bursche? Wachen!":`เจ้าทำอะไรกับถ้วยของฝ่าบาท เจ้าหนู ทหารยาม!`,"Zwei Hellebarden schieben mich höflich, aber nachdrücklich zur Tür. Ich fliege nicht, aber fast.":`ทวนขวานสองเล่มเข็นข้าไปที่ประตูอย่างสุภาพแต่หนักแน่น ข้าไม่ได้บิน แต่ก็เกือบ`,"Das war zu auffällig. Ich muss Malvor erst ablenken. Etwas zum Lesen? Oder etwas zum Fürchten?":`มันโจ่งแจ้งเกินไป ต้องเบี่ยงความสนใจของ Malvor ก่อน มีอะไรให้อ่านไหม หรือมีอะไรให้กลัวดี`,"Ein Schwung türkis ins Rot. Der Wein leuchtet kurz, wie ein Geheimnis, und wird wieder dunkel. Der Kelch sieht unschuldig aus.":`สีเทอร์ควอยซ์หยดลงไปในสีแดง ไวน์เรืองแสงวูบหนึ่งเหมือนความลับ แล้วก็มืดลงอีกครั้ง ถ้วยดูบริสุทธิ์ไร้เดียงสา`,"Majestät, Euer Abendtrunk. Wie jeden Tag.":`ฝ่าบาท เครื่องดื่มยามเย็นของพระองค์ เหมือนทุกวันพ่ะย่ะค่ะ`,"Hmm. Schmeckt ... anders. Bitter und süß. Wie die Jugend, die ich verlor.":`อืม... รสชาติ... แปลกไป ขมแล้วก็หวาน เหมือนวัยหนุ่มที่ข้าสูญเสียไป`,"Merkwürdig. Die Kälte in meinen Fingern weicht. Als erwachte ich aus einem langen Winter.":`แปลกจริง ความเย็นในนิ้วมือข้าจางลง เหมือนตื่นขึ้นจากฤดูหนาวอันยาวนาน`,"Eure Majestät ist verwirrt. Ich lasse nach dem Arzt schicken.":`ฝ่าบาททรงสับสนไปแล้ว หม่อมฉันจะให้คนไปตามหมอ`,"Es wirkt. Und Malvor kneift die Augen zusammen. Ich sollte seine Maske jetzt abreißen.":`ได้ผลแฮะ แล้ว Malvor ก็หรี่ตา ข้าควรจะฉีกหน้ากากเขาออกตอนนี้เลย`,"Der vierte Knopf versinkt. Im Stein knackt es, das Fach springt auf. Dahinter liegt etwas Schwarzes, Kleines.":`ปุ่มที่สี่จมลง หินมีเสียงกึก ช่องลับเด้งเปิด ข้างในมีของสีดำชิ้นเล็กๆ วางอยู่`,"Der Knopf sinkt ein und bleibt unten. Ein leises Klicken im Stein.":`ปุ่มจมลงแล้วค้างอยู่ข้างล่าง มีเสียงคลิกเบาๆ อยู่ในหิน`,"Die Knöpfe springen heraus. Hinter mir räuspert sich eine Wache.":`ปุ่มเด้งกลับออกมา ข้างหลังข้ามีทหารยามกระแอมขึ้นมา`,"Was war das für ein Klacken?":`เสียงกริ๊กอะไรน่ะ`,"Mäuse, Herr Wache. Sehr, sehr große Mäuse.":`หนูครับ ท่านทหาร หนูตัวใหญ่ ใหญ่มากเลย`,"Eine Anklage? Gegen mich? Der König ist krank, mein Junge. Wer glaubt dir Gift, wenn ein Mann vom Fieber geplagt wird?":`ฟ้องร้อง จะฟ้องข้าเนี่ยนะ กษัตริย์ทรงประชวรนะ เจ้าหนู ใครจะเชื่อเรื่องยาพิษ ในเมื่อคนไข้เพ้อไข้อยู่`,"Er hat recht. Erst muss der König bei Verstand sein.":`เขาพูดถูก กษัตริย์ต้องมีสติสัมปชัญญะครบก่อน`,"Diese Flasche lag in Eurem Geheimfach hinterm Wandteppich.":`ขวดนี้อยู่ในช่องลับของท่านหลังผ้าทอแขวนผนัง`,"Ser Aldric, den Ihr im Kerker versteckt habt, kann gegen Euch aussagen.":`Ser Aldric ที่ท่านซ่อนไว้ในคุกใต้ดิน เป็นพยานปรักปรำท่านได้`,"Der König lebt und ist klar im Kopf. Euer Gift hilft nicht mehr.":`กษัตริย์ยังมีชีวิตและสติสมบูรณ์ ยาพิษของท่านไม่ได้ผลอีกแล้ว`,"Ihr habt den König vergiftet! (ohne Beweis)":`ท่านวางยาพิษกษัตริย์! (ไม่มีหลักฐาน)`,"Ich überlege noch.":`ขอคิดดูก่อน`,"Wie amüsant! Wo sind deine Beweise, Totengräberjunge? Wachen, bringt dem Bengel etwas zum Nachdenken. Einen Becher Wasser.":`น่าขันจริง! หลักฐานเจ้าอยู่ไหน เจ้าหนูขุดศพ ทหาร เอาเจ้าเด็กเปรตนี่ไปให้มันได้คิดหน่อย พร้อมน้ำหนึ่งแก้ว`,"Ein Bluff reicht nicht. Ich brauche Beweise.":`แค่ขู่ลวงไม่พอ ข้าต้องมีหลักฐาน`,"Eine Flasche? Man findet überall Flaschen. Ich bin ein Mann mit Interessen. Medizin, Hobbys.":`ขวดน่ะหรือ ขวดมีให้เห็นเกลื่อนไปหมด ข้าเป็นคนมีความสนใจหลากหลาย ยารักษา งานอดิเรก`,"Die Flasche trägt einen Totenkopf. Und die Rune Malvors am Boden. Du solltest dich erklären, Kanzler.":`ขวดนี้มีรูปหัวกะโหลก แล้วที่ก้นขวดมีรูนของ Malvor ท่านอธิบายหน่อยเถอะ ท่านอัครมหาเสนาบดี`,"Ich bezeuge es. Er ließ mich einsperren, nachdem ich ihn beim Mischen sah. Er nannte es 'Arzneimittel'.":`ข้าขอเป็นพยาน เขาสั่งขังข้าหลังจากที่ข้าเห็นเขาผสมยา เขาเรียกมันว่า 'ยาบำรุง'`,"Ein Verräter, verbittert und müde. Sein Wort wiegt nichts.":`คนทรยศ ขมขื่นและอ่อนล้า คำพูดเขาไร้น้ำหนัก`,"Mein Kopf ist klar wie Quellwasser. Und ich erinnere mich an jedes Wort, das du mir seit Wochen eingeflüstert hast, Malvor.":`หัวข้าแจ่มใสเหมือนน้ำพุ และข้าจำได้ทุกคำที่เจ้ากระซิบข้างหูข้ามาหลายสัปดาห์ Malvor`,"Das ... ist unmöglich. Der Trank war ...":`นั่น... เป็นไปไม่ได้ ยานั่น...`,"Genug. Ihr seid alle blind. Ein sterbender Greis, ein Magier mit Staub im Kopf, ein Grubenjunge. Ihr versteht nichts.":`พอได้แล้ว พวกเจ้าตาบอดกันหมด ชายแก่ใกล้ตาย พ่อมดหัวเต็มไปด้วยฝุ่น เด็กขุดหลุม พวกเจ้าไม่เข้าใจอะไรเลย`,"Das Reich braucht einen Herrn, der führt. Das Ei des Drachen Aschenschlund liegt in meiner Tasche, das Horn ist im Vulkan versteckt.":`อาณาจักรต้องการผู้นำที่เด็ดขาด ไข่ของมังกร Aschenschlund อยู่ในกระเป๋าข้า ส่วนเขาสัตว์ซ่อนอยู่ในภูเขาไฟ`,"Wer das Horn bläst, gebietet dem Drachen. Und wer dem Drachen gebietet, gebietet allen. Folgt mir, wenn ihr leben wollt!":`ใครเป่าเขาสัตว์ ผู้นั้นบัญชามังกรได้ และใครบัญชามังกรได้ ผู้นั้นบัญชาทุกคน ตามข้ามา ถ้าอยากมีชีวิตรอด!`,"Wachen, ihm nach! ... Zu spät. Er ist fort. Zum Vulkan, ich ahne es.":`ทหาร ตามมันไป! ... สายไปแล้ว มันหนีไปแล้ว ไปที่ภูเขาไฟ ข้าเดาได้`,"Majestät! Ich komme, so schnell der Orden eben ist. Was ist geschehen?":`ฝ่าบาท! หม่อมฉันมาเร็วที่สุดเท่าที่ภาคีจะไปได้ เกิดอะไรขึ้น`,"Malvor hat mich vergiftet und will das Drachenhorn. Der Junge hat mich gerettet. Sende die Anwärter zum Vulkan, Roderic.":`Malvor วางยาพิษข้าและต้องการเขามังกร เด็กคนนี้ช่วยชีวิตข้าไว้ ส่งผู้สมัครไปที่ภูเขาไฟ Roderic`,"Bran. Weisheit und Demut hast du bewiesen. Es bleibt der Mut. Sprich mit mir, wenn du bereit bist.":`Bran เจ้าพิสูจน์ปัญญาและความถ่อมตนแล้ว ที่เหลือคือความกล้า มาคุยกับข้าเมื่อเจ้าพร้อม`,"Thronsaal von Grauwacht":`ท้องพระโรงแห่ง Grauwacht`,"Ein Diener drückt mir den Brief in die Hand. 'Der Kanzler hat gelesen. Er lässt ausrichten: rührend.'":`คนรับใช้ยัดจดหมายใส่มือข้า 'ท่านเสนาบดีอ่านแล้ว ท่านฝากบอกว่า ซึ้งดี'`,"König Aldemar":`กษัตริย์ Aldemar`,"König Aldemar steht auf seinen Stock gestützt. Die Farbe kehrt in sein Gesicht zurück. Sein Blick ist wieder der eines Königs.":`กษัตริย์ Aldemar ยืนพิงไม้เท้า สีเลือดฝาดกลับคืนสู่ใบหน้า สายพระเนตรกลับเป็นของกษัตริย์อีกครั้ง`,"König Aldemar. Dünn wie eine Kerze, bleich wie das Wachs. Er stützt sich auf einen Stock und auf die Gunst seines Kanzlers.":`กษัตริย์ Aldemar ผอมเหมือนเทียน ซีดเหมือนขี้ผึ้ง ทรงพิงไม้เท้า และพิงความเมตตาของเสนาบดี`,"Was hast du da? Ein Trank? Ich bin müde, mein Junge. Gib es mir nicht vor den Augen meines Kanzlers.":`เจ้าถืออะไรอยู่ ยาหรือ ข้าเหนื่อยแล้ว เจ้าหนู อย่าเอามาให้ข้าต่อหน้าเสนาบดีเลย`,"Er will es trinken, aber Malvor darf es nicht sehen. Der Kelch ... das ist die Gelegenheit.":`เขาอยากดื่ม แต่ห้ามให้ Malvor เห็น ถ้วยนั่น... นี่แหละโอกาส`,"Die Flasche mit dem Totenkopf? Stelle sie dem Kanzler vor. Aber nicht, bevor mein Kopf klar ist.":`ขวดที่มีหัวกะโหลกน่ะหรือ เอาไปแสดงต่อเสนาบดีเถอะ แต่ไม่ใช่ก่อนที่หัวข้าจะแจ่มใส`,"Ein Anwärter. Wie lange es her ist, dass einer kam. Ich war auch einmal jung und dumm.":`ผู้สมัครคนหนึ่ง นานแค่ไหนแล้วที่ไม่มีใครมา ข้าก็เคยหนุ่มและโง่เหมือนกัน`,"Majestät, wie geht es Euch?":`ฝ่าบาท พระองค์ทรงเป็นอย่างไรบ้าง`,"Schlecht. Jede Nacht fiebert mein Blut. Der Kanzler pflegt mich. Er ist ... aufmerksam. Allzu aufmerksam.":`แย่ ทุกคืนเลือดข้าเป็นไข้ เสนาบดีดูแลข้า เขา... เอาใจใส่ เอาใจใส่เกินไปด้วยซ้ำ`,"Ich glaube, man vergiftet Euch.":`ข้าคิดว่ามีคนวางยาพิษพระองค์`,"Psst. Ich ahne es. Aber ohne Beweis kann ich nichts tun. Wer außer dem Kanzler kennt die Küche?":`ชู่ว์ ข้าก็เดาได้ แต่ไม่มีหลักฐานก็ทำอะไรไม่ได้ นอกจากเสนาบดีแล้ว ใครรู้เรื่องในครัวบ้าง`,"Was ist Euer Orden für Euch?":`ภาคีของท่านเป็นอะไรสำหรับท่าน`,"Der Orden ist mein Gewissen mit Schwertern. Er sagt nein, wenn ich ja sagen will.":`ภาคีคือมโนธรรมของข้าที่ถือดาบ มันพูดว่าไม่ ในตอนที่ข้าอยากพูดว่าใช่`,"Was wisst Ihr über Drachen?":`ท่านรู้อะไรเกี่ยวกับมังกรบ้าง`,"Aschenschlund schläft seit hundert Jahren im Vulkan Kharn. Er hütet kein Gold, sondern sein Ei.":`Aschenschlund หลับอยู่ในภูเขาไฟ Kharn มาร้อยปีแล้ว มันไม่ได้เฝ้าทอง แต่เฝ้าไข่ของมัน`,"Wer das Ei raubt, weckt den Zorn. Wer es zurückbringt, wird Gnade ernten. So sagt die Legende.":`ใครขโมยไข่ ก็ปลุกความโกรธ ใครเอากลับมาคืน ก็จะได้รับความเมตตา ตำนานว่าไว้อย่างนั้น`,"Danke, Majestät. Ich fühle mich geehrt.":`ขอบพระทัยพ่ะย่ะค่ะ ข้ารู้สึกเป็นเกียรติ`,"Ich bin es,
