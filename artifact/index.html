{await ft(e,`Bran! Mein Lehrling, mein Sorgenkind. Was treibt dich in die Kapelle, außer dem Segen, den du nicht brauchst?`),await O(e,`Ich will Ritter werden, Meister.`),await ft(e,`Ritter. Hm. Als Totengräber hast du wenigstens am Ende noch Arbeit. Als Ritter bist du die Arbeit.`)}),await A(e,()=>[{text:`Braucht Ihr Hilfe beim Graben?`,show:()=>!L(e,`c1_oswin_bezahlt`),run:async()=>{L(e,`c1_oswin_job`)?yt(e)<3?await ft(e,`Du hast ${yt(e)} von 3 Gräbern ausgehoben. Die Toten warten nicht, auch wenn sie es gut können.`):(e.remove(`schaufel`),e.add(`schaufel`),e.add(`silber`),e.set(`c1_oswin_bezahlt`,!0),e.honor(1),e.sfx(`coin`),await ft(e,`Drei Gräber, sauber und tief. Du hast Talent, Junge. Das ist keine Schande, auch wenn es sich so anfühlt. Hier, zwei Silber.`),await e.say(`Zwei Silbermünzen. Für einen Totengräberlehrling ist das ein Vermögen. Und ehrlich verdient.`)):(e.set(`c1_oswin_job`,!0),await ft(e,`Und wie! Der Friedhof ist voll. Also graben wir in der Kapelle, unter den Bodenplatten. Drei Gräber, Junge, bis zum Abend.`),await ft(e,`Hier, meine Reserveschaufel. Zwei Silber für dich, wenn alle drei fertig sind. Und die Ehre, Gottes Boden zu öffnen.`),e.add(`schaufel`),e.sfx(`pickup`),await e.say(`Oswin drückt mir die Schaufel in die Hand. Sie ist warm von seiner Hand und kalt von der Arbeit.`))}},{text:`Was wisst Ihr über die Gruft?`,run:async()=>{await ft(e,`Unter der Falltür? Die alten Ritter liegen da. Und ein Wächter, der sich nie hingelegt hat.`),await ft(e,`Ein Skelett im Panzer, steht stramm wie Brandt. Er wacht über den Reliquienschrein. Wenn du etwas nimmst, ohne ihn zu besänftigen, wird er unfreundlich.`),await ft(e,`Ich sage immer: Weihwasser auf den Schädel und leise hinaus. Hat bei Brandt auch funktioniert.`)}},{text:`Habt Ihr eine Fackel für mich?`,done:()=>e.has(`fackel`),run:async()=>{await ft(e,`Eine Fackel? Nein, aber ich weiß, wie man eine macht. Einen Stab, Pech vom Dorfplatz, und Feuer. Am Waldrand liegt genug Holz.`),await ft(e,`Und denk dran: Pech brennt nicht ewig. In der Gruft hast du Licht für ein paar Handgriffe. Dann musst du wieder hoch und neu anzünden.`)}},{text:`Warum seid Ihr noch hier in Aschenfurt?`,run:async()=>{await ft(e,`Weil die Toten bleiben. Und wo Tote sind, braucht man Totengräber. Es ist das einzige Geschäft ohne Konkurrenz und ohne Reklamationen.`)}},{text:`Was haltet Ihr vom Rabenorden?`,run:async()=>{await ft(e,`Ehrenwerte Männer. Sie sind immer bestens beritten, wenn sie vor der Pest fliehen. Aber es gibt auch gute darunter, wie Halvard. Der hat mir mal ein Grab bezahlt, für einen Fremden.`)}},j(`Pass auf deinen Rücken auf. Es gibt nur einen.`,`oswin`,e,`Bis später, Meister.`)])}}),{id:`altar`,name:`Altar`,sprite:null,x:480,y:335,hit:[372,262,216,82],at:{x:480,y:372},look:`Der Altar, kalt und schmucklos. Der Kelch ist leer, die Kerzen auch. Es fehlt der Glaube. Und der Wein.`,use:`Ich berühre den Altar. Er ist so kalt wie der Papst in Rom. Ich lasse ihn in Ruhe.`,take:`Vom Altar etwas nehmen? In dieser Kapelle? Nicht mit meinem Karma.`},{id:`fenster_rabe`,name:`Fenster: Rabe`,sprite:null,x:402,y:240,hit:[372,60,62,180],at:{x:402,y:372},look:`Das Glasfenster zeigt einen schwarzen Raben mit klugem Blick. Er ist der erste im Reigen der drei. Der Wächter.`},{id:`fenster_lamm`,name:`Fenster: Lamm`,sprite:null,x:480,y:240,hit:[446,80,68,160],at:{x:480,y:372},look:`Das Glasfenster zeigt ein weißes Lamm mit Heiligenschein. In der Mitte, sanft und geduldig.`},{id:`fenster_kreuz`,name:`Fenster: Kreuz`,sprite:null,x:558,y:240,hit:[526,70,64,170],at:{x:558,y:372},look:`Das Glasfenster zeigt ein goldenes Kreuz, das über allem leuchtet. Das Letzte der drei Zeichen, der Abschluss.`},{id:`banner_l`,name:`Banner`,sprite:null,x:200,y:260,hit:[180,55,40,210],at:{x:200,y:372},look:`Ein verblichenes blaues Banner mit einer Lilie. Der Rand ist ausgefranst, die Hoffnung auch.`},{id:`banner_r`,name:`Banner`,sprite:null,x:762,y:260,hit:[740,55,40,210],at:{x:762,y:372},look:`Ein zweites Banner, ebenso zerschlissen. Motten haben Schlimmeres angerichtet als die Pest.`},{id:`kerzen_wand`,name:`Wandleuchter`,sprite:null,x:130,y:220,hit:[105,170,55,70],at:{x:130,y:372},look:`Ein Wandleuchter mit drei Kerzen. Sie flackern tapfer. Eine der drei ist bereits ein Märtyrer.`},...Fe({id:`sakristei`,name:`Sakristeischrank`,sprites:[`sakristei_zu`,`sakristei_s_oben`,`sakristei_s_unten`,`sakristei_fach`],x:195,y:385,at:{x:235,y:395},look:Ze(e=>L(e,`c1_rune_offen`)?`Der Sakristeischrank, offen. Das Runenschloss ist ein Häufchen Eisen. Drei Fächer wollen durchsucht werden.`:`Ein hoher Sakristeischrank mit drei Runenknöpfen, Rabe, Lamm und Kreuz. Das Schloss reagiert nur auf die richtige Reihenfolge.`),drawers:[{hit:[.08,.7,.84,.12],name:`Obere Schublade`,contents:[`gruftschluessel`,`gaensefeder`,`haarlocke`],lock:{key:`__rune`,text:`Die Schublade rührt sich nicht. Das Runenschloss hält sie fest.`}},{hit:[.08,.84,.84,.12],name:`Untere Schublade`,contents:[`flasche_leer`,`pergamentfetzen`],lock:{key:`__rune`,text:`Auch diese Schublade bleibt zu. Das Runenschloss.`}},{hit:[.1,.32,.8,.34],name:`Fach`,contents:[`weihrauch`,`rosenkranz`],lock:{key:`__rune`,text:`Das Fach ist verschlossen. Das Runenschloss.`},look:`Das Fach hinter der Tür. Es duftet nach altem Weihrauch.`}]}),gt(`R`,`knopf_rabe`,166),gt(`L`,`knopf_lamm`,195),gt(`K`,`knopf_kreuz`,224),{id:`becken`,name:`Weihwasserbecken`,sprite:e=>L(e,`c1_becken_voll`)?`weihwasser_voll`:`weihwasser_leer`,x:335,y:385,look:e=>L(e,`c1_becken_voll`)?`Das Weihwasserbecken, gefüllt mit klarem Wasser. Es schimmert leicht. Ein Wunder, oder der Mond.`:`Das Weihwasserbecken, trocken wie Anselms Humor. Am Grund klebt ein Rest Moos.`,take:`Das Becken ist aus Stein und schwerer als meine Sünden.`,use:e=>L(e,`c1_becken_voll`)?`Ich tauche zwei Finger ins Wasser und bekreuzige mich. Es tut nicht weh. Das ist ein gutes Zeichen.`:`Ich greife hinein. Nur Staub. Ohne Wasser wird das nichts mit dem Segen.`,useWith:{eimer_wasser:async e=>{if(L(e,`c1_becken_voll`))return e.say(`Das Becken ist schon voll. Mehr Segen passt nicht hinein.`);await e.pose(`use`,600),e.sfx(`splash`),e.remove(`eimer_wasser`),e.add(`eimer`),e.set(`c1_becken_voll`,!0),await e.say(`Ich gieße das Wasser in das Becken. Es leuchtet kurz silbern auf, als hätte jemand im Himmel genickt.`),await e.say(`Mit einer leeren Flasche kann ich nun Weihwasser schöpfen.`)},flasche_leer:async e=>{if(!L(e,`c1_becken_voll`))return e.say(`Das Becken ist leer. Ich kann keine Flasche mit Staub füllen. Das wäre Betrug am Glauben.`);await e.pose(`use`,500),e.sfx(`magic`),e.remove(`flasche_leer`),e.add(`weihwasser`),await e.say(`Ich tauche die Flasche ein und verkorke sie. Weihwasser, geschimmert wie Mondlicht auf Stein.`)},weihwasser:`Das Weihwasser zurückgießen? Es ist kein Wein, und ich kein Alkoholiker des Glaubens.`,eimer:`Ein leerer Eimer. Ich brauche Wasser, am besten aus dem Brunnen auf dem Dorfplatz.`}},{id:`pult`,name:`Bibelpult`,sprite:`pult_bibel`,x:585,y:388,look:`Ein Lesepult mit einer riesigen, aufgeschlagenen Bibel. Zwischen den Seiten steckt ein Lesezeichen.`,use:async e=>{await e.say(`Ich blättere. Latein, Latein, noch mehr Latein. Beim Lesezeichen halte ich an.`),await e.say(`„Et corvus vigilabat, et agnus patiebatur, et crux consummabat.“ Mein Latein reicht für „Rabe“, „Lamm“ und „Kreuz“.`),await e.say(`Wieder diese Reihenfolge. Anscheinend meinen es die Heiligen ernst.`)},take:`Die Bibel wiegt mehr als ich. Und sie ist nicht mein Eigentum.`},N({id:`beichtstuhl`,name:`Beichtstuhl`,x:735,y:388,sprites:{closed:`beichtstuhl`,open:`beichtstuhl`},contents:[`kreuzanhaenger`],title:`Beichtstuhl`,look:`Ein Beichtstuhl aus dunklem Holz, mit Vorhang. Hier haben Menschen ihre Sünden abgelegt. Manche haben auch etwas vergessen.`,emptyText:`Nur ein Abdruck auf der Bank und der Nachhall hundert gemurmelter Sünden.`,onOpen:async e=>{await e.say(`Ich ziehe den Vorhang zur Seite. Auf der Bank liegt etwas, das ein Beichtender vergessen hat.`)}}),{id:`kerzenstaender`,name:`Kerzenständer`,sprite:`kerzenstaender`,x:285,y:392,look:`Ein dreiarmiger Kerzenständer aus schwarzem Eisen. Drei Kerzen brennen, eine davon unter Protest.`,use:`Die Flammen tanzen. Ich könnte hier eine Fackel entzünden, wenn ich eine hätte.`,take:`Der Kerzenständer ist zu schwer, und Pater Anselm schaut mich an wie ein Pfarrer einen Dieb.`,useWith:{fackel:async e=>{await Ue(e,`Ich halte die Fackel an die Kerzenflamme. Sie fängt sofort. Das Licht tanzt an den Gewölben.`)},holzstab:`Ein Holzstab an die Kerzenflamme? Der brennt ab, und mit ihm meine Idee. Erst Pech dran.`}},{id:`opferstock`,name:`Opferstock`,sprite:`opferstock`,x:650,y:396,look:`Ein Opferstock, mit Eisen beschlagen. Ein Schlitz zum Einwerfen, nichts zum Herausnehmen. Ein Konzept, das ich nur bewundern kann.`,use:`Ich schüttle ihn. Es klirrt einmal. Ein Messingknopf, vermute ich. Jemand hat Hoffnung gespendet.`,take:`Den Opferstock stehlen? Ich bin Totengräber, kein Kirchenräuber. Noch nicht.`,give:{silber:async e=>{if(L(e,`c1_almosen`))return e.say(`Ich habe schon gespendet. Der Rest bleibt in meiner Tasche, schon aus Selbstschutz.`);e.remove(`silber`),e.set(`c1_almosen`,!0),e.honor(1),e.sfx(`coin`),await e.say(`Ich werfe die Münzen in den Schlitz. Es klingt hell und hoffnungsvoll.`),await dt(e,`Gott segne dich, mein Sohn. Und dein Silber. Die Kirche braucht es mehr als du.`)}},useWith:{silber:async e=>{if(L(e,`c1_almosen`))return e.say(`Ich habe schon gespendet. Der Rest bleibt in meiner Tasche, schon aus Selbstschutz.`);e.remove(`silber`),e.set(`c1_almosen`,!0),e.honor(1),e.sfx(`coin`),await e.say(`Ich werfe die Münzen in den Schlitz. Es klingt hell und hoffnungsvoll.`),await dt(e,`Gott segne dich, mein Sohn. Und dein Silber. Die Kirche braucht es mehr als du.`)}}},{id:`besen`,name:`Besen`,sprite:`besen`,x:122,y:395,hit:[100,255,44,140],look:`Ein Besen, lehnt an der Wand. Pater Anselm kehrt damit Sünden unter den Teppich. Es gibt keinen Teppich.`,take:`Ich nehme den Besen mit? Anselm würde mich verfluchen. Er hängt sehr an seinen Putzmitteln.`,use:`Ich kehre ein bisschen. Der Staub zieht um, mehr nicht.`},{id:`kelch_tisch`,name:`Kelchtisch`,sprite:`tischchen_kelch`,x:540,y:392,look:`Ein kleines Tischchen mit einem Messkelch. Der Kelch ist leer, seit der Wein im Bauch des Paters landete. Wie das bei Kelchen so ist.`,take:`Den Kelch nehmen? Das wäre Kirchenraub, und der Gestank von Weihrauch würde mich verraten.`,use:`Ich schaue in den Kelch. Ein einsamer Tropfen. Der Rest ist Erinnerung.`},{id:`falltuer`,name:`Falltür zur Gruft`,sprite:e=>L(e,`c1_falltuer_offen`)?`falltuer_offen`:`falltuer_zu`,x:495,y:428,hit:[440,385,110,50],at:{x:495,y:405},primary:`walk`,look:e=>L(e,`c1_falltuer_offen`)?`Die Falltür steht offen. Von unten weht kalter Gruftatem. Es riecht nach Stein, Jahrhunderten und Spinnen.`:`Eine schwere Falltür im Kapellenboden, mit einem Vorhängeschloss gesichert. Darunter beginnt die Gruft.`,use:async e=>{if(!L(e,`c1_falltuer_offen`))return e.say(`Verschlossen. Ich brauche den Gruftschlüssel, silbern, mit Rabenkopf. Pater Anselm hat ihn irgendwo eingeschlossen.`);await e.goto(`gruft`,140,405,1)},walk:async e=>{if(!L(e,`c1_falltuer_offen`))return e.say(`Verschlossen. Ich brauche den Gruftschlüssel, silbern, mit Rabenkopf. Pater Anselm hat ihn irgendwo eingeschlossen.`);e.sfx(`door`),await e.goto(`gruft`,140,405,1)},useWith:{gruftschluessel:async e=>{if(L(e,`c1_falltuer_offen`))return e.say(`Die Falltür ist schon offen.`);e.sfx(`unlock`),await e.pose(`use`,500),e.set(`c1_falltuer_offen`,!0),e.sfx(`creak`),await e.say(`Der Schlüssel dreht sich, das Schloss springt auf. Ich hebe die Falltür an: Eine Treppe führt hinab in die Dunkelheit.`),await e.say(`Ich sollte Licht mitnehmen. Und vielleicht einen Gruß an die Hausherren.`)},eisenschluessel:`Der eiserne Schlüssel ist viel zu klein für dieses Schloss. Hier ist Silber gefragt, mit Rabenkopf.`,kohlekiste_schluessel:`Der kleine Kohlekistenschlüssel passt nicht. Das Schloss will etwas Edleres.`}},bt(1,640,424),bt(2,730,428),bt(3,820,422),M({id:`k_kerzenrest`,item:`kerzenstummel`,x:360,y:425,say:`Ein Kerzenstummel. Anselm sammelt diese. Er wird es nie erfahren.`,at:{x:360,y:425}})]},Ct=e=>Be(e,`c1_forge`),R=(e,...t)=>D(e,`gero`,...t);async function wt(e){e.remove(`eimer_wasser`),e.add(`eimer`)}async function Tt(e){if(!L(e,`c1_blasebalg_heil`))return e.sfx(`wrong`),e.say(`Der Blasebalg faucht, aber die Luft pfeift durch ein Loch in der Seite. Ein Windstoß für die Maus, keiner für die Esse. Das Loch muss zu: ein Stück Leder darüber, mit Nadel und Zwirn festnähen.`);let t=Ct(e);if(t<2)return e.say(`Luft in einen kalten Kamin? Nur Asche fliegt mir ins Gesicht. Zuerst muss etwas brennen.`);if(t>2)return e.say(`Die Esse glüht schon weiß. Weiter mit dem Klingenbruch.`);for(let t=0;t<3;t++)await e.pose(`use`,350),e.sfx(`fire`);e.set(`c1_forge`,3),e.flash(`#ff8030`,500),await e.say(`Fffwuuuuusch! Die Esse glüht weiß wie ein Heiligenschein. Meine Augenbrauen sind kürzer als vorher.`),await R(e,`Na endlich. Jetzt hat sie Hitze. Leg den Klingenbruch hinein und lass ihn singen.`)}async function Et(e){let t=Ct(e);if(!e.has(`hammer`))return e.say(`Mit der bloßen Faust? Der Amboss gewinnt immer.`);if(t<4)return e.sfx(`clank`),t===0?e.say(`Ich schlage auf den kalten Amboss. Es klingt nach Arbeit und fühlt sich nach Handgelenk an.`):e.say(`Es gibt nichts zu schmieden. Erst muss das Eisen glühen. Auf kaltes Metall zu hauen bringt nur Funken in den Ohren.`);if(t>4)return e.say(`Die Klinge ist fertig geformt. Weitere Schläge machen sie nur schiefer.`);await e.pose(`swing`,600),e.sfx(`hammer`);let n=e.inc(`c1_hits`);await e.say([`Klong! Funken sprühen, die Klinge stöhnt.`,`Klong! Das Eisen beginnt, die Form eines Schwerts anzunehmen.`,`Klong! Die Schneide wird gerade. Mein Arm weniger.`,`Klong! Der letzte Schlag. Die Klinge liegt da wie ein Gedanke, der endlich zu Ende gedacht ist.`][Math.min(n,4)-1]),n>=4&&(e.set(`c1_forge`,5),await R(e,`Nicht schön, aber sie wird halten. Jetzt ab ins Wasser, bevor sie es sich anders überlegt.`))}async function Dt(e){let t=Ct(e);if(t<5)return e.say(`Das Fass ist voller Wasser und voller Möglichkeiten. Im Moment habe ich nichts, was sich löschen ließe.`);if(t>5)return e.say(`Die Klinge ist längst abgeschreckt. Nochmal baden hilft ihr nicht.`);if(!L(e,`c1_fass_voll`))return e.sfx(`wrong`),R(e,`Halt! Das Fass ist leer! Wasser her, du Hornochse, sonst reißt dir die Klinge!`);await e.pose(`use`,600),e.sfx(`splash`),e.set(`c1_forge`,6),L(e,`c1_gesegnet`)?await e.say(`Zzzzischhh! Das Wasser singt, ein goldener Dampf steigt auf. Mir wird ganz fromm zumute.`):await e.say(`Zzzzischhh! Dampf, Zischen, Triumph. Die Klinge ist abgeschreckt und dunkel wie ein Entschluss.`),await R(e,`Gut. Jetzt zum Schleifstein. Kurbeln, Junge, kurbeln!`)}async function Ot(e){let t=Ct(e);if(L(e,`c1_gesegnet`))return e.say(`Die Klinge ist schon gesegnet. Mehr Segen verträgt kein Schwert, nur ein Pfarrer.`);if(t<5||t>6)return e.say(`Weihwasser auf ein Fass? Es gibt nichts, das ich segnen könnte. Außer meiner Schmiede, und die ist ein verlorener Fall.`);if(!L(e,`c1_fass_voll`))return e.say(`Das Fass ist trocken. Ich kippe Weihwasser doch nicht auf den Boden. Gero würde schreien. Der Pater auch.`);e.remove(`weihwasser`),e.add(`flasche_leer`),e.set(`c1_gesegnet`,!0),e.sfx(`magic`),e.flash(`#cfe8ff`,600),await e.say(`Ich kippe das Weihwasser ins Löschfass. Es perlt golden und riecht nach Stein und Kirche.`),await R(e,`Was zum... das ist Ketzerei! Das ist Verschwendung! ... Das ist, Moment, das ist ziemlich klug.`),await R(e,`Eine gesegnete Klinge. Die schlägt auch Dinge, die man mit Eisen nicht schlägt. Frag mich nicht, woher ich das weiß.`)}var kt={id:`schmiede`,title:`Die Schmiede`,bg:`schmiede`,walk:I.schmiede.walk,scale:I.schmiede.scale,ambient:`forge`,fx:[{kind:`embers`,n:.9},{kind:`smoke`,area:[240,120,240,120],n:.6}],things:[Re(`right`,{id:`to_dorf`,name:`Zum Dorfplatz`,to:`dorfplatz`,x:110,y:405,facing:1,look:`Der Ausgang zum Dorfplatz. Draußen ist es kälter, aber weniger heiß für meine Augenbrauen.`}),P({id:`gero`,name:`Meister Gero`,x:705,y:408,facing:-1,frames:{idle:`gero_idle`,talk:`gero_talk`},look:`Meister Gero, der Schmied. Brummig, bärtig, mit Armen wie Brückenpfeiler, aber die Hand will nicht mehr.`,talk:async e=>{L(e,`c1_met_gero`)||(e.set(`c1_met_gero`,!0),await R(e,`Was willst du, Bursche? Kohle ist keine da, Eisen ist keins da, und die Laune ist auch aufgebraucht.`),await O(e,`Ich brauche ein Schwert. Ich will in den Rabenorden.`),await R(e,`Ha! Ein Totengräber. Ich habe schon Särge für größere Träume gezimmert.`),await R(e,`Hör zu. Ich kann seit dem Unfall keinen Hammer mehr heben. Aber ich weiß noch jeden Handgriff.`),await R(e,`Du schmiedest. Ich sage dir, was du tust. Dafür zwei Silber, oder du pumpst mir zehn Mal den Blasebalg, wenn es fertig ist. Abgemacht?`),await O(e,`Abgemacht.`)),await A(e,()=>[{text:`Wie schmiedet man ein Schwert?`,done:()=>L(e,`have_blade`),run:async()=>{let t=Ct(e);t===0&&!L(e,`unlocked_kohlekiste`)?await R(e,`Zuerst Feuer. Kohle liegt in der Kohlekiste. Den Schlüssel dazu habe ich irgendwo in meinem Werkzeugschrank verstaut. Unten oder in der Mitte, such halt.`):t===0?await R(e,`Kohle in die Esse. Dann anzünden, dafür brauchst du Feuerstein und Schlageisen. Auch im Schrank.`):t===1?await R(e,`Angezündet muss sie werden. Feuerstein, Junge. Der liegt im Werkzeugschrank, wo auch sonst.`):t===2&&!L(e,`c1_blasebalg_heil`)?await R(e,`Jetzt brauchst du Wind. Aber mein Blasebalg hat ein Loch. Flick es mit Leder und Zwirn. Ein alter Stiefel tut es. Irgendwo liegt immer einer im Heu.`):t===2?await R(e,`Pump den Blasebalg, dreimal mindestens, bis die Esse weiß glüht.`):t===3?await R(e,`Jetzt der Klingenbruch. Ich hatte mal einen, aber der liegt in der Gruft unter der Kapelle, bei den Toten. Frag nicht. Leg ihn in die Glut.`):t===4?await R(e,`Hammer, Amboss. Vier saubere Schläge. Der Hammer liegt auf der Werkbank. Wie kann man ihn übersehen?`):t===5?await R(e,`Ins Löschfass damit, aber das Fass braucht Wasser. Frisches, vom Brunnen. Die Klinge reißt sonst.`):t===6?await R(e,`Zum Schleifstein. Kurbeln, bis es funkt.`):await R(e,`Fertig ist sie. Zahl mich oder pump mir den Blasebalg. Dann gehört sie dir.`)}},{text:`Was kostet mich das?`,done:()=>L(e,`c1_gero_bezahlt`),run:async()=>{await R(e,`Zwei Silber, oder zehn Mal pumpen. Mir ist beides recht. Mein Rücken zieht das Pumpen vor, mein Magen das Silber.`),await R(e,`Wenn du Dreckiges anbietest, etwa einen Beutel vom Karren, sage ich nichts. Ich sehe nur, dass er schwer ist.`)}},{text:`Wo ist Euer Klingenbruch?`,show:()=>Ct(e)>=3&&!e.has(`klingenbruch`)&&Ct(e)<4,run:async()=>{await R(e,`Der alte Klingenbruch? In der Gruft unter der Kapelle, auf einem Sarkophag. Ein Ritter hat ihn dort liegen lassen, als er starb. Ich habe ihn nie zurückgeholt, weil ich Skelette nicht mag.`),await R(e,`Die Falltür hat einen Schlüssel. Pater Anselm hat ihn im Sakristeischrank eingeschlossen.`)}},{text:`Habt Ihr etwas zur Gruft zu sagen?`,run:async()=>{await R(e,`Die Gruft ist feucht, finster und voller Ritter, die sich nicht gern stören lassen. Nimm eine Fackel mit. Und etwas Weihwasser.`),await R(e,`Für die Fackel brauchst du einen Stab, etwas Pech und Feuerstein. Pech steht auf dem Dorfplatz im Fass, das schlägt alles Mögliche in den Boden.`)}},{text:`Das Weihwasser: kann man damit etwas anfangen?`,show:()=>e.has(`weihwasser`)&&!L(e,`c1_gesegnet`),run:async()=>{await R(e,`Weihwasser? Ins Löschfass gegossen, wenn die Klinge geformt ist? Das wäre... nun, nicht nützlich. Mäßig nützlich. Äußerst nützlich, wenn man Dinge jagt, die sich nicht gern erschlagen lassen.`)}},{text:`Ich will bezahlen. Zwei Silber.`,show:()=>L(e,`c1_klinge_fertig`)&&!L(e,`c1_gero_bezahlt`)&&e.has(`silber`),run:async()=>{e.remove(`silber`),e.set(`c1_gero_bezahlt`,!0),e.sfx(`coin`),await R(e,`Zwei Silber. Gut. Dann gehört sie dir. Geh mir aus dem Licht, Ritterlein.`)}},{text:`Nehmt diesen Beutel. (Münzbeutel)`,show:()=>L(e,`c1_klinge_fertig`)&&!L(e,`c1_gero_bezahlt`)&&e.has(`muenzbeutel`),run:async()=>{e.remove(`muenzbeutel`),e.set(`c1_gero_bezahlt`,!0),e.sfx(`coin`),await R(e,`Hm. Der Beutel vom Karren. Schweres Totengeld, kein Silber. Ich frage nicht.`),await R(e,`Ich rieche Erde daran. Na gut. Das reicht. Die Klinge gehört dir. Und geh mir aus den Augen.`)}},{text:`Ich pumpe den Blasebalg zehn Mal.`,show:()=>L(e,`c1_klinge_fertig`)&&!L(e,`c1_gero_bezahlt`)&&L(e,`c1_blasebalg_heil`),run:async()=>{await e.say(`Ich nehme den Blasebalg und pumpe. Eins. Zwei. Drei.`),await e.pose(`use`,500),await e.say(`Vier. Fünf. Sechs. Mein Rücken meldet Widerspruch an.`),await e.pose(`use`,500),await e.say(`Sieben. Acht. Neun. Zehn.`),await R(e,`Sieh an, der Junge hat Rückgrat. Fast so viel wie ich früher. Die Klinge gehört dir.`),e.set(`c1_gero_bezahlt`,!0)}},{text:`Erzählt mir etwas über Aschenfurt.`,run:async()=>{await R(e,`Aschenfurt war mal eine Stadt. Jetzt ist es ein Friedhof mit Gewerbe. Ich lebe vom Hufbeschlag und von Särgen, wenn Oswin keine Nägel hat.`),await R(e,`Die alte Hilda will immer, dass ich ihr Fieber heile. Ich bin Schmied, keine Hexe. Aber die Hexe im Moor, die kann es.`)}},{text:`Habt Ihr noch Hinweise zur Kiste auf dem Dorfplatz?`,done:()=>L(e,`unlocked_kiste_dorf`),show:()=>!!e.flag(`c1_kiste_bekannt`),run:async()=>{await R(e,`Kunz' Kiste? Den Schlüssel dazu hat er mir damals im Suff gegeben. Ich habe ihn weggelegt. In die unterste Schublade, glaube ich, zu den toten Ratten und anderem Gerümpel.`)}},j(`Wenn du das Schwert verhunzt, melde dich nie wieder.`,`gero`,e,`Auf Wiedersehen.`)])},give:{silber:async e=>{if(L(e,`c1_gero_bezahlt`))return R(e,`Ich habe schon bekommen, was mir zusteht. Behalte dein Silber für schlechte Zeiten, also für immer.`);if(!L(e,`c1_klinge_fertig`))return R(e,`Erst die Arbeit, dann das Geld. Zuerst die Klinge, Junge.`);e.remove(`silber`),e.set(`c1_gero_bezahlt`,!0),e.sfx(`coin`),await R(e,`Zwei Silber. Du bist ehrlicher als der Bürgermeister. Die Klinge ist dein.`)},muenzbeutel:async e=>{if(L(e,`c1_gero_bezahlt`))return R(e,`Ich habe schon bekommen, was mir zusteht.`);if(!L(e,`c1_klinge_fertig`))return R(e,`Erst die Klinge, dann die Bezahlung, und frag nicht, woher der Beutel kommt.`);e.remove(`muenzbeutel`),e.set(`c1_gero_bezahlt`,!0),e.sfx(`coin`),await R(e,`Totengeld. Ich nehme es und frage nicht. Die Klinge ist dein.`)},hildas_brosche:`„Eine Brosche? Das ist ein Geschenk, Junge. Und Geschenke verkauft man nicht, auch nicht an Schmiede.“`,wurst:`Gero riecht an der Wurst und seufzt. „Behalt sie. Ich habe einen Magen, der nur Zorn verdaut.“`}}),{id:`esse`,name:`Esse`,sprite:e=>[`esse_kalt`,`esse_kohle`,`esse_feuer`,`esse_glut`,`esse_glut`,`esse_feuer`,`esse_feuer`,`esse_feuer`][Math.min(7,Ct(e))],x:340,y:330,scale:1.3,at:{x:340,y:355},look:e=>{let t=Ct(e);return t===0?`Die Esse, kalt wie Geros Humor. Ohne Brennstoff passiert hier nichts.`:t===1?`Kohle liegt in der Esse. Es fehlt ein Funke.`:t===2?`Die Kohle brennt, aber nur gemütlich. Für Eisen braucht es Wind: den Blasebalg.`:t===3?`Die Esse glüht weiß. Jetzt gehört ein Stück Eisen hinein.`:t===4?`Der Klingenbruch glüht orange in der Glut. Zeit für den Amboss.`:`Die Esse brennt ruhig vor sich hin. Das Wichtigste ist erledigt.`},use:e=>{let t=Ct(e);return t===0?`Ich halte die Hand hinein. Kalt. Ich bräuchte Brennstoff. Kohle, am besten.`:t===1?`Ich puste hinein. Staub, kein Feuer. Ich brauche Feuerstein.`:t===2?`Es brennt. Aber die Glut ist träge. Mit dem Blasebalg wird sie heiß.`:t===3?`Weißglut. Ich lege besser etwas Brauchbares hinein, bevor sie sich langweilt.`:t===4?`Das Eisen glüht. Der Amboss wartet. Der Hammer auch.`:`Die Esse ist zufrieden. Ich lasse sie.`},take:`Eine ganze Esse? Selbst Gero würde mich auslachen. Und der kann nicht lachen.`,useWith:{kohle:async e=>{if(Ct(e)>=1)return e.say(`Es liegt schon Kohle drin. Mehr würde die Esse nur beleidigen.`);e.remove(`kohle`),e.set(`c1_forge`,1),e.sfx(`pickup`),await e.pose(`use`,500),await e.say(`Ich lege die Kohle in die Esse. Schwarz auf schwarz, aber voller Hoffnung.`)},feuerstein:async e=>{let t=Ct(e);if(t===0)return e.say(`Ich schlage Funken, aber nichts fängt Feuer. Ich brauche etwas zum Brennen. Kohle.`);if(t>=2)return e.say(`Sie brennt doch schon. Funken sparen, Junge.`);e.set(`c1_forge`,2),e.sfx(`fire`),await e.pose(`use`,500),await e.say(`Klick. Klick. Funke. Die Kohle fängt, glimmt und faucht. Aschenfurt hat ein Feuer mehr, immerhin eins, das nicht von der Pest kommt.`),await R(e,`Gut. Aber das ist nur ein Kamin. Für Stahl braucht es Wind: Der Blasebalg hat leider ein Loch.`)},fackel:async e=>{if(Ct(e)<2)return e.say(`Die Esse ist noch kalt. Wie soll ich da meine Fackel anzünden?`);await Ue(e,`Ich halte die Fackel in die Glut. Sie fängt sofort. Das Licht tanzt über die Wände.`)},klingenbruch:async e=>{let t=Ct(e);if(t<3)return e.sfx(`wrong`),R(e,`Halt! Den Bruch in eine lauwarme Esse? Das gibt Pfusch! Erst Weißglut, du Dummkopf.`);if(t>3)return e.say(`Der Klingenbruch liegt längst in der Glut oder ist schon eine Klinge. Ich habe keinen zweiten.`);e.remove(`klingenbruch`),e.set(`c1_forge`,4),e.sfx(`clank`),await e.pose(`use`,500),await e.say(`Ich lege den rostigen Klingenbruch in die Glut. Der Rost fällt ab wie schlechte Gewissen.`),await e.say(`Das Eisen wird rot, orange und dann gelb. Ich warte, bis es singt.`),await R(e,`Gut so. Jetzt zum Amboss, solange es glüht. Hammer ist auf der Werkbank.`)},eimer_wasser:`Die Esse löschen? Gero würde mich löschen. Und das Feuer wäre dann wohl das kleinere Problem.`,weihwasser:`Weihwasser auf die Esse? Ein Zischen, eine Wolke, und Gero schnaubt. Das hebe ich mir lieber auf.`,schwert:`Das Schwert ist schon fertig. Zurück in die Glut? Dann fängt Gero von vorn an.`,holzstab:`Ich halte den Holzstab in die Glut. Er brennt ab wie meine Geduld. Besser nicht.`}},{id:`blasebalg`,name:`Blasebalg`,sprite:e=>L(e,`c1_blasebalg_heil`)?`blasebalg_heil`:`blasebalg_kaputt`,x:448,y:352,look:e=>L(e,`c1_blasebalg_heil`)?`Der Blasebalg, notdürftig mit Stiefelleder geflickt. Er hält. Meistens.`:`Ein riesiger Blasebalg mit einem Loch von der Größe einer Faust. Ein Stück Leder darüber, mit Nadel und Zwirn festgenäht, und er hält. Benutze Stiefel oder Nadel und Zwirn darauf.`,take:`Zu schwer, zu groß, zu festgenagelt.`,use:e=>Tt(e),useWith:{stiefel_alt:async e=>{if(L(e,`c1_blasebalg_heil`))return e.say(`Der Blasebalg ist schon geflickt.`);if(!e.has(`nadel_zwirn`))return e.say(`Das Leder passt. Aber womit nähe ich es fest? Ich brauche Nadel und Zwirn.`);await At(e)},nadel_zwirn:async e=>{if(L(e,`c1_blasebalg_heil`))return e.say(`Der Blasebalg ist schon geflickt.`);if(!e.has(`stiefel_alt`))return e.say(`Nadel und Zwirn habe ich. Aber wo ist das Leder? Ein Flicken aus Luft hält nicht.`);await At(e)},schwert:`Mit dem Schwert in den Blasebalg stechen? Das Loch ist schon groß genug.`}},{id:`amboss`,name:`Amboss`,sprite:`amboss`,x:365,y:405,look:e=>Ct(e)===4?`Der Amboss, bereit für glühendes Eisen und kräftige Arme.`:`Ein Amboss, schwer wie ein schlechtes Gewissen. Er hat mehr Schläge hinter sich als ich Mahlzeiten.`,take:`Der Amboss rührt sich nicht. Er ist ein Amboss. Nehmen ist nicht sein Beruf.`,use:e=>Et(e),useWith:{hammer:e=>Et(e),klingenbruch:`Den Klingenbruch kalt auf den Amboss legen? Er bleibt, was er ist: Schrott. Erst muss er glühen.`}},{id:`loeschfass`,name:`Löschfass`,sprite:`loeschfass`,x:218,y:350,look:e=>L(e,`c1_fass_voll`)?`Das Löschfass, bis zum Rand voll mit klarem Wasser. Ein stilles, gefährliches Bad.`:`Das Löschfass. Ein feuchter Rest am Boden, mehr nicht. Gero hat seit Wochen kein Wasser mehr geschleppt.`,take:`Es ist ein Fass. Es ist voll oder leer, und trotzdem viel zu schwer.`,use:e=>Dt(e),useWith:{eimer_wasser:async e=>{if(L(e,`c1_fass_voll`))return e.say(`Das Fass ist randvoll. Mehr Wasser macht es nur nass.`);await e.pose(`use`,600),e.sfx(`splash`),await wt(e),e.set(`c1_fass_voll`,!0),await e.say(`Ich kippe den Eimer ins Löschfass. Plätschern, Wellen, Zufriedenheit. Jetzt ist es bereit.`)},eimer:`Der Eimer ist leer. Ein leerer Eimer in ein leeres Fass zu kippen, das ist Philosophie, aber kein Löschwasser.`,weihwasser:e=>Ot(e),schwert:`Das Schwert ist schon abgeschreckt, oder noch gar nicht da. Ich lasse es im Trockenen.`}},{id:`schleifstein`,name:`Schleifstein`,sprite:`schleifstein`,x:130,y:385,look:`Ein Schleifstein mit Kurbel. Er sieht aus wie ein Mühlstein, der Karriere in der Waffenindustrie gemacht hat.`,take:`Der Stein wiegt mehr als ich. Ich lasse ihn arbeiten.`,use:async e=>{let t=Ct(e);if(t<6)return t===0?e.say(`Ich drehe die Kurbel. Der Stein kreischt nur vor Leere. Er will eine Klinge.`):e.say(`Ohne fertige, abgeschreckte Klinge hat der Stein nichts zu schleifen.`);if(t>=7)return e.say(`Die Klinge ist fertig. Der Schleifstein ruht sich aus, der Faulpelz.`);await e.pose(`use`,800),e.sfx(`clank`),await e.say(`Ich drehe die Kurbel. Funken sprühen wie ein kleines Feuerwerk. Das Schwert wird immer schärfer.`),e.sfx(`magic`),e.set(`c1_forge`,7),e.set(`c1_klinge_fertig`,!0),await e.say(`Fertig. Mein Schwert liegt blank auf der Werkbank. Es ist nicht schön, aber ehrlich.`),L(e,`c1_gero_bezahlt`)?await R(e,`Nimm sie, Junge. Aber lass sie nicht am Esel fallen.`):await R(e,`Nicht so schnell, Bursche! Erst die Bezahlung: zwei Silber oder zehn Mal pumpen, dann gehört sie dir.`)}},{id:`schwert_bank`,name:`Schwert`,sprite:`schwert`,dir:`items`,x:620,y:305,at:{x:620,y:345},hidden:e=>!L(e,`c1_klinge_fertig`)||L(e,`taken_schwert_bank`),primary:`take`,look:`Mein Schwert. Blank und schief wie mein Selbstvertrauen.`,take:async e=>{if(!L(e,`c1_gero_bezahlt`)){e.sfx(`wrong`),await R(e,`Finger weg! Erst bezahlen. Zwei Silber oder zehn Mal Blasebalg.`);return}await e.pose(`pick`,600),e.sfx(`fanfare`),e.add(`schwert`),e.set(`taken_schwert_bank`,!0),e.set(`have_blade`,!0),await e.say(`Ich nehme das Schwert. Es liegt gut in der Hand. Der erste Schritt zum Ritter ist getan.`)}},{id:`werkbank`,name:`Werkbank`,sprite:`werkbank`,x:620,y:345,at:{x:620,y:372},look:`Eine breite Werkbank mit Brandflecken und Messerspuren. Hier liegt alles, was ein Schmied braucht, und einiges, was er nicht braucht.`,use:`Ich wische mit der Hand über das Holz. Staub, Rußflecken, ein vergessener Nagel. Nichts, was mir hilft.`,take:`Die Werkbank bleibt, wo sie ist. Sie ist die Einzige in Aschenfurt, die noch Arbeit hat.`},M({id:`s_hammer`,item:`hammer`,x:580,y:306,at:{x:590,y:372},say:`Ein schwerer Schmiedehammer. Er ist glatt vom Schweiß unzähliger Hände. Gero beobachtet mich.`,guard:e=>L(e,`c1_met_gero`)?null:`Ich sollte erst mit dem Schmied reden, bevor ich seine Werkzeuge einsacke.`}),...Fe({id:`schrank`,name:`Werkzeugschrank`,sprites:[`werkzeugschrank_zu`,`werkzeugschrank_s1`,`werkzeugschrank_s2`,`werkzeugschrank_s3`],x:760,y:380,at:{x:760,y:400},drawers:[{hit:[.08,.1,.84,.25],contents:[`nadel_zwirn`,`kreide`,`zinnbecher`],look:`Die oberste Schublade. Sie klemmt ein bisschen, aber sie gibt nach.`},{hit:[.08,.38,.84,.25],contents:[`feuerstein`,`kohlekiste_schluessel`,`rattenfalle`],look:`Die mittlere Schublade. Sie riecht nach Öl und Schicksal.`},{hit:[.08,.66,.84,.25],contents:[`eisenschluessel`,`tote_ratte`,`messingknopf`],look:`Die unterste Schublade. Ein Rattennest, das sich als Schublade tarnt.`}],look:`Ein großer Werkzeugschrank mit drei Schubladen. Gero sagt, es herrsche eine Ordnung. Die Ordnung ist das Chaos.`}),N({id:`kohlekiste`,name:`Kohlekiste`,x:200,y:412,sprites:{closed:`kohlekiste`,open:`kohlekiste_offen`},contents:[`kohle`],lock:{key:`kohlekiste_schluessel`,text:`Die Kohlekiste ist abgeschlossen. Gero ist geizig, selbst mit Kohle.`,openText:`Das kleine Schloss klickt. Dunkel und bereit.`},emptyText:`Leer. Nur ein bisschen Kohlenstaub und das Echo meiner Hoffnung.`,look:Ze(e=>L(e,`unlocked_kohlekiste`)?`Die Kohlekiste, offen. Es liegen drei Klumpen darin. Mehr gibt es nicht.`:`Eine verschlossene Kohlekiste. Mit einem kleinen Schloss gesichert. Kohle ist hier kostbarer als Gold.`)}),{...N({id:`lumpenkorb`,name:`Lumpenkorb`,x:470,y:436,sprites:{closed:`lumpenkorb`,open:`lumpenkorb`},contents:[`holzloeffel`,`spindel`],look:`Ein Korb voller Lumpen. Geros Wäsche, Geros Verbandszeug und Geros Geheimnisse.`})},{id:`kohlesack`,name:`Kohlesack`,sprite:`kohlesack`,x:90,y:335,look:`Ein halb leerer Kohlesack. Er ist zu leer für die Esse und zu voll von Spinnweben.`,use:`Ich schüttle den Sack. Eine Schabe flieht, sonst nichts.`,take:`Ein leerer Sack. Ich habe schon genug Last im Leben.`},{id:`strohlager`,name:`Geros Strohlager`,sprite:`strohlager`,x:760,y:430,hit:[725,400,70,32],look:`Geros Lager aus Stroh. Er schläft neben der Esse, damit er nicht auskühlt. Oder damit er nie zu weit von der Arbeit weg ist.`,use:`Ich lege mich kurz hin. Das Stroh pikst. Ich stehe auf. Das Leben ist nichts für Weichlinge.`},{id:`weinfass`,name:`Weinfass`,sprite:`weinfass`,x:855,y:352,look:`Ein kleines Weinfass, mit Kreide beschriftet: „Nur für Notfälle.“ Es ist leer. Die Notfälle waren zahlreich.`,use:`Ich klopfe an das Fass. Es hallt hohl. Gero hustet laut in meine Richtung.`,take:`Gero würde mich erschlagen. Mit dem Fass. Wahrscheinlich leer.`},M({id:`s_eimer`,item:`eimer`,x:262,y:394,say:`Ein hölzerner Eimer. Er hat bessere Tage gesehen, aber noch nicht den schlechtesten.`,at:{x:275,y:400}}),{id:`fenster`,name:`Fenster`,sprite:null,x:100,y:200,hit:[55,85,90,120],at:{x:100,y:330},look:`Ein vergittertes Fenster. Der Mond schaut herein wie ein neugieriger Henker.`},{id:`ketten`,name:`Ketten`,sprite:null,x:700,y:150,hit:[670,60,80,120],at:{x:700,y:340},look:`Schwere Ketten an einem Flaschenzug. Man hebt damit Eisen, Amboss, und gelegentlich Gero.`,use:`Ich ziehe an den Ketten. Sie klirren und lösen eine Staubwolke aus. Weiter passiert nichts.`},{id:`hufeisenwand`,name:`Hufeisen`,sprite:null,x:570,y:200,hit:[495,130,150,110],at:{x:570,y:330},look:`Ein Dutzend Hufeisen an der Wand, alle abgenutzt. Ob sie Glück bringen? Den Pferden brachten sie jedenfalls keins.`,take:`Hufeisen? Die hängen so fest, dass selbst Gero sie nicht mehr loskriegt.`},{id:`kamin`,name:`Kaminabzug`,sprite:null,x:340,y:90,hit:[250,0,190,110],at:{x:340,y:345},look:`Der gewaltige Rauchfang über der Esse. Irgendwo da oben wohnt der Schornsteinfeger. Er ist seit dem Frühjahr verschollen.`}]};async function At(e){e.remove(`stiefel_alt`),e.set(`c1_blasebalg_heil`,!0),e.sfx(`creak`),await e.pose(`use`,800),await e.say(`Ich schneide eine Sohle aus dem Stiefel, lege sie über das Loch und nähe sie fest. Stich für Stich, wie ein Chirurg ohne Diplom.`),await e.say(`Der Blasebalg hält. Er wölbt sich stolz und faucht einmal zur Probe.`),await R(e,`Du hast tatsächlich zwei Hände. Gut gemacht, für einen Totengräber.`)}async function jt(e,t){if(L(e,`c1_falle_zu`))return e.say(`Die Falle ist schon zugeschnappt. Der Köder wäre jetzt Verschwendung.`);if(!L(e,`c1_falle_heil`))return e.say(`In eine kaputte Falle einen Köder legen? Dann hole ich mir nur Mäuse. Zuerst muss der Bolzen repariert werden.`);e.remove(t),e.set(`c1_koeder`,!0),await e.pose(`use`,600),await e.say(t===`wurst`?`Ich lege die Räucherwurst auf den Auslöser. Der Duft zieht durch den Nebel wie ein Versprechen.`:`Ich lege den Knochen auf den Auslöser. Er riecht nach Hoffnung und alten Zeiten.`),await e.walk(640,405),await e.say(`Ich verstecke mich hinter dem Baumstumpf und halte die Luft an.`),await e.wait(500),e.frame(`wolf1`,`idle`),await e.moveNpc(`wolf1`,470,396,900),e.sfx(`clank`),e.shake(500),e.set(`c1_falle_zu`,!0),await e.say(`KLACK! Ein Jaulen, ein Zerren. Der Wolf reißt sich los, mit eingeklemmtem Schweif und gekränkter Ehre.`),e.frame(`wolf1`,`flee`),e.frame(`wolf2`,`flee`);let n=e.moveNpc(`wolf1`,-80,380,900),r=e.moveNpc(`wolf2`,-80,410,1100);await Promise.all([n,r]),e.set(`c1_wolves_weg`,!0),await e.say(`Beide Wölfe sind im Wald verschwunden, mit dem Köder im Magen und einem Schwur auf Rache. Die Bahn zu Halvard ist frei.`)}var Mt=(e,...t)=>D(e,`halvard`,...t),Nt=e=>L(e,`c1_wolves_weg`);async function Pt(e){e.frame(`wolf1`,`idle`),e.sfx(`roar`),await e.say(`Ein tiefes Knurren. Zwei Wölfe heben die Köpfe, die Lefzen gekräuselt. Sie stehen genau zwischen mir und dem Ritter.`),await e.say(`Ich habe zwei Beine, sie haben acht Zähne pro Schnauze. Schlechte Rechnung. Ich ziehe mich zurück.`),await e.walk(560,400)}var Ft=e=>{let t=e=>async t=>{if(!Nt(t))return Pt(t);typeof e==`string`?await t.say(e):e&&await e(t)};return{...e,take:t(e.take),use:t(e.use),talk:t(e.talk)}};async function It(e){if(L(e,`c1_halvard_wasser`))return Mt(e,`Danke, mein Junge. Genug für heute. Wasser ist wie Vergebung: Man bekommt nie zu viel, aber man merkt es.`);e.remove(`eimer_wasser`),e.add(`eimer`),e.set(`c1_halvard_wasser`,!0),e.sfx(`splash`),await e.pose(`use`,700),await e.say(`Ich halte Halvard den Eimer an die Lippen. Er trinkt in gierigen Zügen, dann sinkt er zurück und atmet auf.`),await Mt(e,`Wasser. Heiliges, sauberes, wunderbares Wasser. Ich wusste nicht mehr, wie es schmeckt.`),await Mt(e,`Du bist der erste, der nicht davongelaufen ist. Setz dich, Junge. Ich habe Zeit. Mehr als mir lieb ist.`)}async function Lt(e){await Mt(e,`Du willst also, dass ich für dich bürge. Ein Ritter bürgt nur für den, den er kennt.`),await Mt(e,`Also sag mir, Junge: Warum willst du Ritter werden?`);let t=await e.choose([`Wegen des Ruhms und der Lieder, die man über mich singen wird.`,`Weil jemand die Schwachen schützen muss. Und ich kann nicht wegsehen.`,`Weil der Orden ein Dach, Suppe und ein Bett bietet. Ich bin Waise.`]);t===0?await Mt(e,`Ha! Ruhm. Ich kannte viele, die für Ruhm starben. Man erinnert sich an keinen. Aber du bist wenigstens ehrlich dumm.`):t===1?(e.honor(1),await Mt(e,`Hm. So reden sie alle, bis die erste Klinge kommt. Aber du sagst es, als meintest du es. Das ist selten.`)):(e.honor(1),await Mt(e,`Endlich einer, der nicht lügt! Ein Dach, Suppe, ein Bett. Das ist mehr Wahrheit, als der halbe Orden aufbringt.`)),await Mt(e,`Hier, mein Brief. Ich habe ihn schon geschrieben, bevor die Wölfe kamen. Für den Fall, dass ich jemanden finde, der es wert ist.`),e.add(`halvard_brief`),e.set(`have_sponsor`,!0),e.sfx(`fanfare`),await e.say(`Ich bekomme einen gefalteten Brief mit rotem Siegel. Halvards Wort für mich. Die Hand, die ihn schrieb, zitterte.`),await Rt(e)}async function Rt(e){e.has(`siegelring`)||(Number(e.flag(`honor`)??0)>=1?(e.add(`siegelring`),e.sfx(`magic`),await Mt(e,`Und nimm meinen Ring. Er hat einen Raben. Wer ihn trägt, hat Freunde, die zählen. Ich brauche ihn nicht mehr.`),await e.say(`Ein schwerer Siegelring mit Rabenwappen liegt in meiner Hand. Es fühlt sich an wie ein Versprechen.`)):(await Mt(e,`Den Ring gebe ich nur einem, der Ehre gezeigt hat. Du bist ehrlich, aber noch nicht erprobt. Zeig mir Ehre, und er gehört dir.`),e.set(`c1_ring_offen`,!0)))}var zt={id:`waldrand`,title:`Am Waldrand`,bg:`waldrand`,walk:I.waldrand.walk,scale:I.waldrand.scale,ambient:`forest`,fx:[{kind:`fog`,area:[0,240,960,200],n:1.1},{kind:`fireflies`,area:[600,200,360,160],n:.5}],things:[Re(`left`,{id:`to_dorf`,name:`Zum Dorfplatz`,to:`dorfplatz`,x:840,y:405,facing:-1,look:`Der Pfad zurück nach Aschenfurt. Dort warten Pest, Brandt und Brot.`}),{id:`to_moor`,primary:`walk`,name:`Pfad ins Moor`,sprite:null,x:917,y:400,hit:[874,215,86,225],at:{x:922,y:410},look:`Dort hinten glimmt das Moor grün unter dem Nebel. Hübsch, wie ein Gruselmärchen.`,walk:e=>e.say(`Das Moor. Dort will ich erst hin, wenn ich Klinge, Segen und Bürgen habe. Und Feldwebel Brandt mich schickt.`),use:`Das Moor. Dort will ich erst hin, wenn ich Klinge, Segen und Bürgen habe. Und Feldwebel Brandt mich schickt.`},Ft(P({id:`halvard`,name:`Ser Halvard`,x:170,y:392,frames:{idle:`halvard_idle`,talk:`halvard_talk`},at:{x:330,y:404},look:Ze(e=>L(e,`c1_halvard_wasser`)?`Ser Halvard, in Rüstung an eine Eiche gelehnt. Das Gesicht ist grau, die Augen aber wach. Er trinkt Wasser, als sei es Wein.`:`Ein Ritter in Rüstung, an einen Baum gelehnt. Er atmet noch, flach und mühsam. Ein Wappen mit Raben auf der Brust.`),give:{eimer_wasser:e=>Nt(e)?It(e):Pt(e),halvard_brief:`Halvard schüttelt den Kopf. „Behalte ihn, Junge. Ein Brief gehört dem, der ihn braucht.“`},talk:async e=>{await A(e,()=>[{text:`Wer seid Ihr?`,run:async()=>{await Mt(e,`Ser Halvard vom Orden des Raben. Oder was von ihm übrig ist. Ich lehne seit drei Tagen an diesem Baum und ordne meine Sünden.`),await Mt(e,`Es sind weniger, als ich dachte. Das ist enttäuschend.`)}},{text:`Was ist Euch zugestoßen?`,run:async()=>{await Mt(e,`Ich ritt von Grauwacht nach Aschenfurt, mit einer Warnung für Brandt. Männer im schwarzen Mantel, ein vergifteter Pfeil, und mein Pferd ging mit ihnen durch. Ich habe es ihnen nicht verübelt.`),await Mt(e,`Dann kamen die Wölfe. Sie dachten, ich wäre Abendessen. Ich bin zäh, sie haben aufgegeben und warten jetzt.`),e.set(`c1_halvard_story`,!0)}},{text:`Ich habe Wasser für Euch.`,show:()=>e.has(`eimer_wasser`)&&!L(e,`c1_halvard_wasser`),run:()=>It(e)},{text:`Würdet Ihr für mich bürgen?`,show:()=>L(e,`c1_halvard_wasser`)&&!L(e,`have_sponsor`),run:()=>Lt(e)},{text:`Und der Ring?`,show:()=>L(e,`have_sponsor`)&&!e.has(`siegelring`)&&!!e.flag(`c1_ring_offen`),run:()=>Rt(e)},{text:`Wovor warnt Ihr Brandt?`,show:()=>!!e.flag(`c1_halvard_story`),run:async()=>{await Mt(e,`Vor dem Kanzler Malvor. Der König trinkt seinen Wein nicht aus Durst. Der Kelch ist vergiftet, Junge, und niemand will es hören.`),await Mt(e,`Wenn du nach Grauwacht kommst: Trau keinem, der zu freundlich lächelt. Und hüte deinen Becher.`)}},{text:`Was erwartet mich im Moor?`,show:()=>L(e,`c1_halvard_wasser`),run:async()=>{await Mt(e,`Das Hexenmoor? Nebel, Irrlichter, Schlangen. Und Morwenna. Eine alte Frau, die Kräuter kennt, vor denen selbst der Teufel einen Bogen macht.`),await Mt(e,`Sie braut Gegengifte. Wenn der König noch zu retten ist, dann von ihr. Bring Gaben mit und sei höflich.`)}},{text:`Haltet durch. Ich hole Hilfe.`,show:()=>L(e,`have_sponsor`),run:async()=>{await Mt(e,`Hilfe? In Aschenfurt? Ha. Sag Brandt, er soll zwei Männer schicken, die weniger Angst vor Wölfen haben als vor mir.`)}},j(`Geh, Junge. Und lass dich nicht beißen.`,`halvard`,e,`Ich komme wieder.`)])}})),P({id:`wolf1`,name:`Wolf`,x:290,y:388,frames:{idle:`wolf_growl`,flee:`wolf_flee`},hidden:Nt,look:`Ein grauer Wolf mit gelben Augen. Er bewacht Halvard wie ein Hund einen Knochen: mit viel Zuneigung und Zähnen.`,talk:`Der Wolf knurrt. Ein wunderbares Gespräch, aber einseitig.`,take:`Ich greife nach dem Wolf? Ich habe zwei Hände und sehr gern beide.`,use:`Ich bin ein einfacher Totengräber. Kein Wolfsflüsterer. Er knurrt, ich weiche zurück.`,give:{wurst:`Ich werfe dem Wolf die Wurst zu? Dann ist er satt, und meine Waden sind dran. Ich brauche eine Falle.`,brot_alt:`Der Wolf schnuppert am Brot und wendet sich angewidert ab. Selbst Wölfe haben Standards.`}}),P({id:`wolf2`,name:`Wolf`,x:240,y:420,frames:{idle:`wolf_growl`,flee:`wolf_flee`},hidden:Nt,look:`Ein zweiter, kleinerer Wolf. Er knurrt weniger, schaut dafür öfter zu meiner Wade.`,talk:`Der Wolf legt die Ohren an. Er ist kein Gesprächspartner.`,take:`Das ist nicht mein Haustier. Und ich werde auch keins daraus machen.`,use:`Ich gehe lieber auf Abstand. Der Wolf auch, aber in meine Richtung.`}),{id:`falle`,name:`Wolfsfalle`,sprite:e=>L(e,`c1_falle_zu`)?`falle_zu`:L(e,`c1_falle_heil`)?`falle_offen`:`falle_zu`,x:450,y:404,scale:1.6,hit:[405,366,90,44],look:e=>L(e,`c1_falle_zu`)?`Die Falle ist zugeschnappt. Ein paar graue Haare hängen noch dran. Sie hat ihre Pflicht getan.`:L(e,`c1_falle_heil`)?L(e,`c1_koeder`)?`Die Falle ist gespannt und mit Wurst bestückt.`:`Die Wolfsfalle, gespannt und bereit. Es fehlt nur ein Köder.`:`Eine rostige Wolfsfalle, zugeschnappt. Der Bolzen, der sie spannen würde, ist abgebrochen. Mit einem Nagel ließe sich das beheben.`,take:`Die Falle nehme ich nicht mit. Sie beißt auch Besitzer.`,use:e=>L(e,`c1_falle_zu`)?`Die Falle ist zugeschnappt. Sie hat ihre Arbeit getan und ruht sich aus.`:L(e,`c1_falle_heil`)?`Die Falle ist gespannt. Ich fasse sie lieber nicht an. Ich brauche noch zehn Finger.`:`Ich ziehe an den Zähnen. Sie klappen nicht auf, der Bolzen fehlt. Ich brauche etwas, das ihn ersetzt: einen Nagel, vielleicht.`,useWith:{nagel:async e=>{if(L(e,`c1_falle_heil`))return e.say(`Die Falle ist schon repariert. Mehr Nägel braucht sie nicht, außer für meinen Sarg.`);e.remove(`nagel`),e.set(`c1_falle_heil`,!0),e.sfx(`clank`),await e.pose(`use`,700),await e.say(`Ich schiebe den Nagel durch das Scharnier. Dann spanne ich die Federn auseinander, vorsichtig, wie eine Kreuzotter. Klack.`),await e.say(`Die Falle steht offen wie ein Maul. Jetzt fehlt noch ein Köder.`)},wurst:e=>jt(e,`wurst`),knochen:`Ein abgenagter Knochen? Den hat schon jemand verschmäht. Der Wolf will etwas mit Fleisch dran. Wurst, am besten.`,brot_alt:`Brot als Köder? Wölfe sind keine Raben. Sie wollen etwas, das einmal gelebt hat.`,tote_ratte:`Eine tote Ratte als Köder? Der Wolf schaut mich beleidigt an. Es muss mehr sein. Wurst, am besten.`}},{id:`baumstumpf`,name:`Baumstumpf`,sprite:`baumstumpf`,x:660,y:385,look:`Ein knorriger Baumstumpf. Seine Jahresringe erzählen von besseren Zeiten. Und von Äxten.`,use:`Ich setze mich kurz darauf. Es ist unbequem. Ein Baumstumpf kennt keine Gnade.`,take:`Der Stumpf hängt noch an den Wurzeln. Ich auch, an meinem Leben.`},Ft(N({id:`tornister`,name:`Halvards Tornister`,x:105,y:428,sprites:{closed:`lumpenkorb`,open:`lumpenkorb`},contents:[`kerze`,`kamm`],title:`Halvards Tornister`,look:`Ein ledernes Bündel neben dem Ritter. Wolfszähne haben es durchbohrt. Das Wenige, was drin ist, hat den Angriff überlebt.`,emptyText:`Leer. Der Rest war wohl Abendessen.`})),{id:`strohlager`,name:`Lager`,sprite:`strohlager`,x:360,y:438,hit:[325,408,70,32],look:`Das Lager der Wölfe: zertrampeltes Stroh und Knochen. Ein Albtraum für Allergiker.`,use:`Ich stochere im Stroh. Haare, Knochen und der Geruch nasser Wolle.`},{id:`knochenhaufen`,name:`Knochenhaufen`,sprite:`knochenhaufen`,x:560,y:436,look:`Knochen. Kleine, große, mittelgroße. Die Wölfe haben hier gespeist, und zwar ausgiebig.`,take:`Es sind genug Knochen in Aschenfurt. Ich brauche keine weiteren.`},{id:`tierskelett`,name:`Hirschskelett`,sprite:`tierskelett`,x:690,y:436,look:`Das Skelett eines Hirsches. Er wollte in den Wald und kam nur bis hierher. Ein Leben in einem Satz.`,take:`Die Knochen sind sauber abgenagt. Nichts mehr zu holen.`},N({id:`steinhaufen`,name:`Steinhaufen`,x:540,y:360,sprites:{closed:`steinhaufen`,open:`steinhaufen`},contents:[`zinnring`],title:`Steinhaufen`,look:`Ein Haufen loser Steine. Jemand hat hier etwas versteckt. Oder die Steine haben es selbst versteckt.`,emptyText:`Nur Steine, Käfer und eine Menge Geduld.`,onOpen:async e=>{await e.say(`Ich wälze ein paar Steine zur Seite. Etwas Rundes liegt dazwischen.`)}}),{id:`schubkarre`,name:`Umgekippte Schubkarre`,sprite:`schubkarre`,x:825,y:372,look:`Eine umgekippte Schubkarre, halb im Moos versunken. Wer sie hierher geschoben hat, wollte nicht weit.`,take:`Eine Schubkarre mitnehmen? Ich habe keinen Platz für ein Fahrzeug im Gepäck.`,use:`Ich richte sie auf. Sie kippt sofort wieder um, aus Prinzip.`},{id:`eiche`,name:`Alte Eiche`,sprite:null,x:150,y:280,hit:[70,100,160,200],at:{x:120,y:400},look:`Eine uralte, riesige Eiche. Ihre Äste greifen nach dem Himmel. Die Wurzeln greifen nach Halvard.`},{id:`moorlicht`,name:`Grünes Leuchten`,sprite:null,x:780,y:250,hit:[700,200,220,80],at:{x:780,y:372},look:`Ein grünliches Leuchten über dem fernen Moor. Es lockt wie ein Wirtshaus, in dem man nie wieder bezahlen muss.`},M({id:`w_holzstab`,item:`holzstab`,x:625,y:412,say:`Ein gerader Ast, so lang wie mein Arm. Noch kein Werkzeug, aber voller Hoffnung.`,at:{x:620,y:415}}),M({id:`w_fieberkraut`,item:`fieberkraut`,x:790,y:392,say:`Gelbe Blüten, schwarze Erde: Fieberkraut. Hildas Enkel wird es freuen.`,at:{x:790,y:400}}),M({id:`w_pilz`,item:`pilz`,x:835,y:405,say:`Ein Fliegenpilz. Wunderschön, giftig, ehrlich. Ich esse ihn nicht.`,at:{x:835,y:410}})]},Bt=n({combos:()=>Ut,default:()=>Jt,hint:()=>qt,items:()=>Ht,scenes:()=>Vt,start:()=>Wt}),Vt=[nt,kt,St,ut,zt].map(e=>({...e,things:e.things.map($e)})),Ht=He,Ut={"holzstab+pech":async e=>{e.remove(`holzstab`),e.remove(`pech`),e.add(`fackel`),e.sfx(`pickup`),await e.say(`Ich knete das Pech um das Ende des Stabs. Eine Fackel. Noch kalt, aber voller Absicht.`)},"fackel+feuerstein":async e=>{await Ue(e,`Ich schlage Funken auf die Fackel. Das Pech fängt, zischt und brennt. Licht! Es reicht für ein paar Handgriffe.`)},"nadel_zwirn+stiefel_alt":`Leder, Nadel, Zwirn. Daraus könnte man etwas flicken. Ein Loch im Blasebalg zum Beispiel.`,"brot_alt+wurst":`Brot und Wurst. Das Mahl eines Armen und die Hoffnung eines Wolfs. Ich esse nichts davon, es wird noch gebraucht.`,"rattenfalle+tote_ratte":`Die Ratte ist schon tot. Die Falle schnappt aus Prinzip zu. Es ist ein Missverständnis.`,"eimer_wasser+flasche_leer":`Wasser in die Flasche gießen? Das wäre bloß Wasser. Für etwas Gesegnetes brauche ich das Weihwasserbecken.`,"holzstab+kerzenwachs":`Wachs an einen Stab kleben? Das gäbe eine armselige Kerze. Ich brauche Pech.`,"feuerstein+holzstab":`Funken auf einen Holzstab? Er brennt ab, und mit ihm mein Plan. Erst Pech dran.`,"kreide+pergamentfetzen":`Ich kritzle „Sünden“ auf den Fetzen und streiche es durch. Es wird nicht besser.`,"knochen+tote_ratte":`Ein Knochen und eine tote Ratte. Der Anfang einer Suppe, die ich nie kochen werde.`},Wt={scene:`dorfplatz`,x:520,y:400,facing:1,inv:[],flags:{chapter:1},intro:async e=>{await e.card(`Kapitel 1`,`Der Rabeneid`),await O(e,`Aschenfurt. Dreck, Krähen und ein Galgen, der nie Urlaub hat.`,`Heute ändere ich mein Leben. Heute werde ich Ritter.`),await D(e,`brandt`,`Du da! Totengräberjunge! Lungerst du wieder herum?`),await O(e,`Ich will zum Rabenorden, Feldwebel. Ich will Ritter werden.`),await D(e,`brandt`,`Ha! Du? Dann beweise es. Der Orden prüft nur, wer drei Dinge vorweist:`),await D(e,`brandt`,`Eine KLINGE. Einen SEGEN der Kirche. Und einen BÜRGEN aus den Reihen des Ordens.`),await D(e,`brandt`,`Bring mir alle drei, lzstück neben Knochen und Federn. Das wäre ein kurzer Zauber.`}},M({id:`m_rabenfeder`,item:`rabenfeder`,x:218,y:396,say:`Eine Rabenfeder vom Totem. Die Krähen hier sind entweder großzügig oder in der Mauser.`}),sn(`l`,312,`Moorlaterne`,`Eine tote Laterne. Am Sockel hat jemand ein Haus mit Rauchfaden eingeritzt: die Heimat?`),sn(`m`,500,`Moorlaterne`,`Eine tote Laterne. In ihr Eisen ist ein Halbmond geritzt. Der Mond, wenn man es poetisch sehen will.`),sn(`r`,712,`Moorlaterne`,`Eine tote Laterne. Am Sockel ist eine Hütte auf Stelzen eingeritzt. Sie zeigt nach Osten.`),cn(`l`,312),cn(`m`,500),cn(`r`,712),ln(1,232,203,`Ein bläuliches Licht über dem Wasser. Es schwebt genau so, dass man ihm folgen will.`),ln(2,452,182,`Ein Irrlicht. Es blinkt zweimal, als würde es mir etwas zuflüstern. Vermutlich eine Lüge.`),ln(3,464,284,`Ein Irrlicht dicht über dem Steg. Es riecht nach Schwefel und Schadenfreude.`),ln(4,662,180,`Ein fahles Licht. Wo es hinführt, wartet Schlamm. Das weiß ich, weil es gleich hinter mir kichert.`),{id:`schlange`,name:`Moorschlange`,sprite:`schlange`,x:405,y:378,scale:1.3,hit:[380,336,52,46],look:e=>e.say(e.flag(`c2_schlange_ab`)?`Die Schlange verdaut die Ratte. Sie sieht aus wie ein Seil mit einer Beule und guten Gründen, in Ruhe gelassen zu werden.`:`Eine fette Moorschlange. Sie bewacht eine vertrocknete Zunge neben sich und blickt mich an, als wüsste sie, was ich will.`),take:`Eine Schlange mit der Hand greifen? Der Friedhof ist voll von Leuten, die das auch versucht haben.`,use:e=>e.say(e.flag(`c2_schlange_ab`)?`Ich stupse sie an. Sie öffnet ein Auge, schließt es wieder. Die Ratte war ein gutes Geschäft.`:`Sie zischt, und ich ziehe die Hand sofort zurück. Ich habe meinen Arm noch gern.`),useWith:{tote_ratte:async e=>{if(e.flag(`c2_schlange_ab`))return e.say(`Eine Ratte reicht ihr. Sie ist keine Ritterin der unersättlichen Tafel.`);e.remove(`tote_ratte`),e.set(`c2_schlange_ab`,!0),e.sfx(`splash`),await e.pose(`use`,500),await e.say(`Ich lege die tote Ratte ein Stück entfernt aufs Holz. Die Schlange vergisst mich augenblicklich.`),await e.say(`Sie schluckt die Ratte im Ganzen, langsam und selbstzufrieden, und wird träge.`),await O(e,`Menschen sind weniger leicht zu bestechen. Aber nur weil sie keine Ratten mögen.`)},wurst:`Eine Wurst? Sie sieht mich an, als hätte ich ihr ein Gedicht vorgelesen. Schlangen wollen Beute, die vorher gelebt hat.`,brot_alt:`Brot interessiert sie nicht. Offenbar bin ich der Einzige, der in diesem Moor Kohlenhydrate schätzt.`}},M({id:`m_zunge`,item:`schlangenzunge`,x:462,y:392,look:`Eine vertrocknete, gespaltene Zunge. Die Schlange behält sie im Blick.`,guard:e=>e.flag(`c2_schlange_ab`)?null:`Die Schlange schnellt vor, ihr Kopf kaum eine Handbreit von meinen Fingern. Ich sollte sie erst ablenken.`,say:`Die Zunge ist hart wie Leder und riecht nach Pökelsalz. Morwenna wird sich freuen. Ich weniger.`}),M({id:`m_ratte`,item:`tote_ratte`,x:152,y:404,say:`Eine tote Ratte im Schilf. Gefunden, nicht gestohlen. Ich fasse sie mit dem Zipfel meines Ärmels.`,look:`Eine tote Ratte, steif wie ein Gebet. Für manche ein Ekel, für andere ein Abendessen.`}),{id:`alraune`,name:`Alraune`,sprite:`alraune`,x:612,y:384,scale:1.5,hit:[586,320,56,70],hidden:e=>!!e.flag(`c2_alraune_got`),primary:`take`,look:`Eine Wurzel mit Armen, Beinen und einem Gesicht, das mich vorwurfsvoll ansieht. Ihr Schrei soll Menschen töten. Wer sie ausgräbt, braucht Wachs in den Ohren.`,take:async e=>{if(!e.flag(`c2_ohren`)){e.sfx(`roar`),e.flash(`#ffffff`,300),e.shake(700),await e.pose(`pick`,500),await e.say(`Kaum berühre ich die Blätter, öffnet die Wurzel den Mund. Der Schrei geht mir durch Mark und Bein.`),await e.say(`Ich taumele rückwärts über den Steg, mit klingelndem Schädel. Das war zu früh und zu laut.`),await O(e,`Ich brauche etwas in den Ohren. Etwas Weiches, Dichtes. Wachs vielleicht, wie es die Seeleute tun.`),await e.walk(540,396);return}e.sfx(`dig`),await e.pose(`dig`,900),e.sfx(`roar`),e.shake(500),await e.say(`Ich ziehe. Die Wurzel kreischt, ich höre es nur als fernes Summen. Dann hält sie still, beleidigt.`),e.add(`alraune`),e.set(`c2_alraune_got`,!0),e.set(`c2_ohren`,!1),await O(e,`Ein guter Moment, kein Held zu sein und Wachs zu benutzen.`)},use:e=>e.say(`Ich betrachte sie aus sicherer Entfernung. Ihre geschlossenen Augen sind kein Grund, ihr zu trauen.`),useWith:{kerzenwachs:async e=>{if(e.flag(`c2_ohren`))return e.say(`Meine Ohren sind schon dicht. Ich höre nur noch mein Blut.`);e.remove(`kerzenwachs`),e.set(`c2_ohren`,!0),await e.pose(`use`,500),await e.say(`Ich knete das Wachs weich und stopfe es mir in die Ohren. Die Welt wird zu einem warmen, dumpfen Brummen.`),await O(e,`Jetzt kann sie schreien, wie sie will.`)},eimer:`Alraunen brauchen kein Wasser. Sie leben vom Zorn.`,fackel:`Alraune verbrennen? Die Hexe würde mich verfluchen. Und ich schon die Alraune.`}},z({id:`tuempel`,name:`Tümpel`,hit:[490,285,190,55],at:{x:560,y:360},look:`Trübes, grünes Moorwasser. Kleine Blasen steigen auf, als atme dort unten etwas.`,use:`Ich tauche eine Hand hinein. Etwas Lebendiges streift meine Finger. Ich beschließe, kein Wasser mit der Hand zu holen.`,take:`Wasser mit den Händen tragen? Ich bin Totengräber, kein Wunder.`,useWith:{eimer:async e=>{if(e.has(`moorwasser`))return e.say(`Ich habe schon einen Eimer voll Moorwasser.`);e.sfx(`splash`),await e.pose(`use`,600),e.remove(`eimer`),e.add(`moorwasser`),await e.say(`Der Eimer taucht ein, und das Wasser kommt grün, dickflüssig und leise murmelnd wieder heraus.`),await O(e,`Sieht aus wie Suppe. Riecht wie die Suppe vom letzten Hungerjahr.`)},fackel:`Wenn das Gas hier brennt, ist es das letzte Licht, das ich sehe.`}}),N({id:`moor_stumpf`,name:`Hohler Baumstumpf`,x:842,y:400,sprites:{closed:`baumstumpf`,open:`baumstumpf`},scale:.9,contents:[`brot_alt`,`pilz`,`zinnbecher`,`apfelrest`],look:`Ein hohler Baumstumpf, glatt wie ein Mund. Jemand benutzt ihn als Vorratskammer, und ich ahne, wer.`,title:`Im Stumpf`,emptyText:`Leer. Selbst die Würmer sind ausgezogen.`}),N({id:`moor_skelett`,name:`Ochsenskelett`,x:740,y:406,sprites:{closed:`tierskelett`,open:`tierskelett`},scale:.85,contents:[`knochen`,`rostiger_dolch`,`messingknopf`],look:`Das Skelett eines Zugochsen. Er hat wohl Geduld bewiesen, bis zum letzten Schritt. Zwischen den Rippen liegt etwas.`,title:`Zwischen den Rippen`}),z({id:`moor_burg`,name:`Ferne Türme`,hit:[545,55,120,75],at:{x:560,y:380},look:`Hinter Nebel und Wasser ragen Türme auf: Burg Grauwacht. So nah, dass man sie sehen kann, so fern, dass man vorher sterben könnte.`}),z({id:`moor_baum`,name:`Toter Riesenbaum`,hit:[0,0,250,300],at:{x:150,y:375},look:`Ein gewaltiger, toter Baum, behängt mit Moos wie mit Trauerfahnen. Er sieht aus, als hätte er früher Krieg gegen den Himmel geführt.`,take:`Ich nehme einen Ast mit? Das ganze Moor ist aus Ästen gemacht. Ich nehme lieber Abstand.`}),z({id:`moor_pfaehle`,name:`Verrottete Pfähle`,hit:[800,185,70,110],at:{x:800,y:380},look:`Schwarze, schiefe Pfähle ragen aus dem Wasser. Einst ein Steg, ein Zaun oder ein Galgen. Im Moor sind die Grenzen fließend.`}),z({id:`moor_schilf`,name:`Schilf`,hit:[570,240,130,90],at:{x:640,y:365},look:`Dichtes Schilf mit braunen Kolben. Es raschelt, auch wenn kein Wind geht. Ich gehe davon aus, dass das nicht der Wind ist.`,use:`Ich teile das Schilf. Dahinter ist nur noch mehr Schilf. Und etwas, das sich hastig wegbewegt.`})]};async function dn(e){if(!e.has(`gegengift`)){await O(e,`Ohne Gegengift nach Grauwacht? Dann komme ich mit leeren Händen. Der König wartet nicht ewig.`);return}if(!e.has(`hexentalisman`)){await O(e,`Der Weg hinaus führt an den Geistern des Moores vorbei. Ohne Schutz gehe ich nicht.`);return}await O(e,`Ein Gegengift, ein Rabenschädel an einer Schnur und ein Schwert, das ich selbst gemacht habe.`,`Das hätte ich Brandt gerne gezeigt. Nun gut. Grauwacht.`),await e.card(`Kapitel 3`,`Burg Grauwacht`),e.set(`chapter`,3),await e.goto(`burgtor`,80,400,1)}var fn=[un,{id:`hexenhuette`,title:`Morwennas Hütte`,bg:`hexenhuette`,walk:I.hexenhuette.walk,scale:I.hexenhuette.scale,ambient:`hut`,fx:[{kind:`dust`,n:.5},{kind:`embers`,area:[380,250,220,80],n:.5}],enter:async e=>{await k(e,`c2_huette_intro`,async()=>{await e.say(`Drinnen ist es warm, es riecht nach Kräutern, Kerzenwachs und etwas, das früher ein Tier war.`)})},things:[Re(`left`,{id:`to_moor`,name:`Hinaus ins Moor`,to:`moorpfad`,x:820,y:384,facing:-1,look:`Die Tür zum Moor. Draußen warten Nebel und Schlamm.`}),P({id:`morwenna`,name:`Morwenna`,x:392,y:376,frames:{idle:`morwenna_idle`,talk:`morwenna_talk`,stir:`morwenna_stir`},look:`Morwenna, die Moorhexe. Sie sieht aus wie jemand, der drei Pestjahre überlebt hat und den Rest für unhöflich hält.`,pick:(e,t)=>t.flag(`c2_kn`)&&!t.flag(`c2_gegengift`)?`stir`:null,talk:async e=>{await k(e,`c2_met_morwenna`,async()=>{await D(e,`morwenna`,`Sieh an. Ein Totengräberjunge, der freiwillig durchs Moor spaziert. Die Irrlichter haben dich nicht gefressen.`),await O(e,`Ich habe ihnen ein paar Laternen gezeigt. Sie waren beeindruckt.`),await D(e,`morwenna`,`Die Laternen. Hm. Der Reim vom Totem. Du kannst lesen, oder du bist zufällig klug. Setz dich nicht, du verschmutzt die Stühle.`)}),await A(e,()=>[{text:`Wer seid Ihr?`,run:()=>D(e,`morwenna`,`Morwenna. Heilerin, Hexe, Nachbarin. Je nachdem, wen du fragst und ob gerade jemand krank ist.`,`Die Leute aus dem Dorf holen mich, wenn sie sterben. Und verbrennen mich, wenn sie nicht sterben.`)},{text:`Ich brauche ein Gegengift gegen Schierling.`,show:()=>!e.flag(`c2_recipe`),done:()=>!!e.flag(`c2_gegengift`),run:async()=>{await D(e,`morwenna`,`Schierling. Der König, nehme ich an. Der Rabenorden sucht Hilfe, wenn es zu spät ist.`),await O(e,`Wenn Ihr es nicht tut, stirbt er. Und ich werde nie Ritter.`),await D(e,`morwenna`,`Zwei gute Gründe, einer davon egoistisch. Ich mag dich schon fast.`,`Ich braue es nicht für dich. Du brauchst es selbst, mit deinen Händen, unter meinen Augen. Fünf Dinge, in genau dieser Reihenfolge:`),await D(e,`morwenna`,`„Erst das Nasse aus dem Moor. Dann das Leichte, das fliegt. Dann das Tiefe, das schreit. Dann das Böse, das züngelt. Und zuletzt das Feuer.“`),e.set(`c2_recipe`,!0),await O(e,`Wasser, Feder, Wurzel, Zunge, Feuer. Ich kann mir Reihenfolgen merken. Mein Beruf besteht daraus.`),await D(e,`morwenna`,`Gib die Dinge in den Kessel, wenn du sie hast. Einmal falsch, und er spuckt. Ich habe schon eine Katze verloren, aber nur an eine Ratte.`)}},{text:`Wie war die Reihenfolge noch mal?`,show:()=>!!e.flag(`c2_recipe`)&&!e.flag(`c2_kocht`),done:()=>!!e.flag(`c2_kocht`),run:()=>D(e,`morwenna`,`Das Nasse. Das Leichte. Das Tiefe. Das Böse. Das Feuer.`,`Nasses ist im Moor, Leichtes hat Flügel, Tiefes hat Wurzeln, Böses hat eine gespaltene Zunge.`)},{text:`Wo finde ich die Zutaten?`,show:()=>!!e.flag(`c2_recipe`)&&!e.flag(`c2_kocht`),done:()=>!!e.flag(`c2_kocht`),run:async()=>{await D(e,`morwenna`,`Draußen auf dem Steg, nicht in meiner Hütte. Ich lasse mich nicht ausrauben, ich lasse mich nur besuchen.`),!e.has(`moorwasser`)&&!e.flag(`c2_in_moorwasser`)&&await D(e,`morwenna`,`Das Wasser: Dein Eimer tut es im Tümpel. Ich trinke es nicht, aber das ist Geschmackssache.`),!e.has(`rabenfeder`)&&!e.flag(`c2_in_rabenfeder`)&&await D(e,`morwenna`,`Federn: Wo Krähen auf Schädeln sitzen, fallen sie. Das Totem am Anfang des Stegs.`),!e.has(`alraune`)&&!e.flag(`c2_in_alraune`)&&await D(e,`morwenna`,`Alraune: Wächst am Steg. Zieh sie nie aus ohne Wachs in den Ohren. Mein Kommodenwachs steht dir in der mittleren Schublade zu.`),!e.has(`schlangenzunge`)&&!e.flag(`c2_in_schlangenzunge`)&&await D(e,`morwenna`,`Zunge: Die Schlange sitzt drauf. Lenk sie ab. Schlangen mögen, was gestorben ist. Wie ich.`)}},{text:`Wieso ist da ein Rabe im Käfig?`,run:()=>D(e,`morwenna`,`Weil er mir gestern noch die Perlen für den Rosenkranz gestohlen hat. Jetzt ist er mein Berater. Er redet mehr als ich und hat selten recht.`,`Er mag Brot. Wer ihn füttert, bekommt gute Ratschläge. Meistens.`)},{text:`Was verbirgt das Tuch auf dem Spiegel?`,run:()=>D(e,`morwenna`,`Was ich gestern gesehen habe, will ich heute nicht wiedersehen. Der Spiegel zeigt nicht, was ist. Er zeigt, was kommt.`,`Fass ihn an, wenn du es wagst. Aber heul mir nicht vor.`)},{text:`Der Kanzler Malvor. Kennt Ihr ihn?`,run:async()=>{e.set(`c2_malvor_klatsch`,!0),await D(e,`morwenna`,`Malvor. Ein Mann in schwarzem Talar, der aufs Moor starrte, als wollte er es kaufen.`,`Er war letzten Winter hier. Wollte Schierling „gegen Ratten“. Ich habe Ratten gesehen, die ihm sehr ähnlich sehen.`),await O(e,`Ihr habt ihm Schierling gegeben?`),await D(e,`morwenna`,`Nein. Ich habe ihm Nesseltee gegeben. Und ein Gefühl, ich hätte ihn durchschaut. Jetzt weiß ich es sicher.`)}},{text:`Was verlangt Ihr für Euren Talisman?`,show:()=>!!e.flag(`c2_recipe`)&&!e.has(`hexentalisman`)&&!e.flag(`c2_gegengift`),done:()=>e.has(`hexentalisman`),run:()=>D(e,`morwenna`,`Erst das Gegengift. Dann reden wir. Ich verschenke nichts, bevor ich weiß, ob du es wert bist.`)},{text:`Könnte ich ein Gefäß für das Gegengift bekommen?`,show:()=>!!e.flag(`c2_kocht`)&&!e.flag(`c2_gegengift`)&&!e.has(`flasche_leer`),done:()=>!!e.flag(`c2_gegengift`),run:async()=>{await D(e,`morwenna`,`Ohne Flasche? Dann schöpfst du es mit den Händen. Nein. Hier.`),e.add(`flasche_leer`),await e.say(`Sie wirft mir eine staubige Flasche zu. Ich fange sie knapp.`)}},{text:`Was wisst Ihr über den Drachen im Vulkan?`,show:()=>!!e.flag(`c2_gegengift`),done:()=>!!e.flag(`c2_dragon_hint`),run:async()=>{await D(e,`morwenna`,`Aschenschlund. Man erzählt, er hütet ein Vermögen aus Gold. Nein. Ich war einmal in meiner Jugend in seinem Rauch.`),await D(e,`morwenna`,`Der Drache hütet kein Gold, Junge. Er hütet ein Ei. Das Gold ist sein Nestpolster.`),await O(e,`Ein Ei? Dann ist er kein Ungeheuer. Er ist ein Vater. Oder eine Mutter.`),await D(e,`morwenna`,`Er ist beides, wenn es sein muss. Denk daran, wenn dein Schwert zu laut wird.`),e.set(`c2_dragon_hint`,!0)}},j(`Geh, bevor die Katze dich verflucht. Und nimm dein Schwert mit. Am besten auch ein bisschen Verstand.`,`morwenna`,e,`Ich gehe jetzt.`)])},give:{trank_rot:async e=>{e.remove(`trank_rot`),await D(e,`morwenna`,`Mein Liebestrank! Der war für Hans, den Köhler. Er hat ihn nie bekommen. Gut, dass du ihn gefunden hast, bevor er sich verliebt.`),await e.say(`Morwenna steckt die Flasche weg. Die Truhe schließt sich von selbst, jemand sollte sich vor ihr in Acht nehmen.`)},silber:async e=>{e.remove(`silber`),await D(e,`morwenna`,`Silber für mich? Das ist die erste ehrliche Geste seit Jahren. Aber ich brauche es nicht. Behalte es für deine Zukunft.`),e.add(`silber`)},tote_ratte:`Eine tote Ratte? Danke, aber ich esse zu Mittag keine Nagetiere. Gib sie der Schlange.`}}),{id:`kessel`,name:`Hexenkessel`,sprite:e=>e.flag(`c2_gegengift`)?`kessel_gegengift`:e.flag(`c2_kocht`)?`kessel_kocht`:`kessel_kalt`,x:482,y:338,scale:1.35,look:e=>e.say(e.flag(`c2_gegengift`)?`Der Kessel ist leer, nur ein türkiser Rand erinnert an das Gegengift.`:e.flag(`c2_kocht`)?`Das Gebräu kocht türkis und ruhig. Es fehlt nur noch ein Gefäß.`:`Ein dreibeiniger Eisenkessel in der Feuerstelle. Er riecht nach vielen Versuchen und manchen Opfern.`),take:`Er wiegt mehr als ein Ochse. Und er gehört einer Hexe.`,use:async e=>{if(e.flag(`c2_gegengift`))return e.say(`Er ist leer. Mehr kann ich hier nicht tun.`);if(e.flag(`c2_kocht`))return e.say(`Ich brauche eine Flasche, um das Gegengift abzufüllen.`);let t=Number(e.flag(`c2_kn`)??0);await e.say(t?`Der Kessel hat schon ${t} Zutat${t>1?`en`:``} geschluckt. Es geht weiter, wenn ich die nächste habe.`:`Ein leerer Kessel, kalt. Die Zutaten müssten erst hinein, in der richtigen Reihenfolge.`)},useWith:{moorwasser:on(`moorwasser`),rabenfeder:on(`rabenfeder`),alraune:on(`alraune`),schlangenzunge:on(`schlangenzunge`),fackel:on(`fackel`),eimer:`Ein leerer Eimer in den Kessel? Das hilft niemandem. Er muss voller Moorwasser sein.`,kerzenwachs:`Wachs im Gegengift? Dann sterbe ich an Verstopfung.`,wurst:async e=>D(e,`morwenna`,`Meine Wurst! Aus meinem Kessel! Nur über meine Leiche!`),tote_ratte:`Rattensuppe. Ich habe schon Schlimmeres gerochen, aber nur bei Beerdigungen.`,pilz:`Der Fliegenpilz würde das Gegengift nicht heilen, sondern lustig machen.`,fieberkraut:`Fieberkraut im Gegengift? Das ist eine andere Krankheit, Bran.`,flasche_leer:async e=>{if(e.flag(`c2_gegengift`))return e.say(`Der Kessel ist leer. Die Flasche kann sich ausruhen.`);if(!e.flag(`c2_kocht`))return e.say(`Der Kessel ist noch nicht fertig. Ein leeres Fläschchen in einer kalten Suppe hilft nicht.`);if(e.remove(`flasche_leer`),e.sfx(`magic`),await e.pose(`use`,700),e.add(`gegengift`),e.set(`c2_gegengift`,!0),e.flash(`#8fffe0`,600),await e.say(`Ich tauche die Flasche ein. Das Gebräu fließt hinein, leuchtend türkis, warm wie frisches Blut.`),await D(e,`morwenna`,`Sieh an. Du hast es nicht verdorben. Das kommt höchstens bei einem von zehn vor. Und die anderen neun sind gestorben.`),e.flag(`taken_hex_silber`)){await D(e,`morwenna`,`Eine Frage noch: Fehlt mir eigentlich Silber? Ich zähle meine Münzen jeden Abend.`);let t=await e.choose([`Ja, hier ist Euer Silber zurück.`,`Ich weiß nicht, wovon Ihr sprecht.`]);t===0&&e.has(`silber`)?(e.remove(`silber`),e.honor(2),await D(e,`morwenna`,`Ehrlichkeit. Der Rabenorden wird einen Narren mehr bekommen. Aber einen guten.`)):t===0?(await O(e,`Ich habe es leider schon ausgegeben. Es tut mir leid.`),e.honor(1),await D(e,`morwenna`,`Dann schuldest du mir etwas. Ich schreibe es auf. Schulden sind das Einzige, was Ritter nicht überleben.`)):(e.honor(-1),await D(e,`morwenna`,`Du lügst schlecht. Aber ich lasse es dir durchgehen. Der Talisman schützt dich nicht vor deinem Gewissen.`))}await D(e,`morwenna`,`Nimm. Das hier ist der Talisman. Er hält die Geister des Moores fern, wenn du wieder hinausgehst. Und die Irrlichter sowieso.`),e.add(`hexentalisman`),await e.say(`Ein winziger Rabenschädel an einer Lederschnur. Er ist kalt, aber nicht unfreundlich.`),await D(e,`morwenna`,`Geh jetzt nach Osten. Und Junge: Wenn du es nicht brauchst, trink es nicht selbst.`),await O(e,`Ich werde es nicht trinken. Aber danke. Wirklich.`),await D(e,`morwenna`,`Frag mich nach dem Drachen, bevor du gehst. Du wirst es brauchen.`)}}},...Fe({id:`kommode`,name:`Kommode`,sprites:[`kommode_wk_zu`,`kommode_wk_oben`,`kommode_wk_oben`,`kommode_wk_unten`],x:745,y:352,scale:1.05,at:{x:745,y:372},look:`Eine breite Kommode aus dunklem Holz, gekrönt von Mäuseköttel. Die Schubladen haben Griffe aus Rabenfüßen.`,drawers:[{name:`Obere Schublade`,hit:[.06,.08,.88,.3],contents:[`wurst`,`kamm`,`haarlocke`],look:`Die oberste Schublade. Der Griff ist ein vertrockneter Rabenfuß. Er zuckt nicht, soweit ich sehe.`},{name:`Mittlere Schublade`,hit:[.06,.4,.88,.28],contents:[`kerzenwachs`,`kerzenstummel`,`rattenfalle`],look:`Die mittlere Schublade. Sie klemmt ein wenig, als wollte sie ihre Geheimnisse behalten.`},{name:`Untere Schublade`,hit:[.06,.7,.88,.26],contents:[`zinnring`,`spindel`,`pergamentfetzen`],look:`Die unterste Schublade. Staub und Spinnweben haben sie zusammengeklebt.`}]}),N({id:`truhe`,name:`Verschlossene Truhe`,x:858,y:366,sprites:{closed:`kiste_dorf`,open:`kiste_dorf_offen`},scale:1.1,contents:[`fieberkraut`,`trank_rot`,`zinnbecher`],lock:{key:`eisenschluessel`,text:`Mit einem schweren Schloss gesichert. Ohne Schlüssel keine Chance, und mit dem Schwert breche ich lieber keine Hexenkiste auf.`,openText:`Der Schlüssel dreht sich, und das Schloss gibt mit einem Seufzer nach.`},look:`Eine alte Holztruhe mit Eisenbeschlägen. Das Schloss ist größer als mein Gesicht. Kratzspuren am Rand: Die Katze hat es versucht.`,title:`In der Truhe`}),M({id:`hex_silber`,item:`silber`,x:818,y:404,say:`Silber, offen auf dem Boden. Für eine Hexe etwas leichtsinnig. Für mich ein Problem.`,onTake:e=>{e.honor(-1)}}),P({id:`katze`,name:`Schwarze Katze`,x:628,y:380,frames:{idle:`katze_sit`,stretch:`katze_stretch`},hit:[602,338,52,48],look:e=>e.say(e.flag(`c2_katze_gefuettert`)?`Die Katze streckt sich zufrieden. Sie sieht aus, als hätte sie einen Handel gewonnen.`:`Eine pechschwarze Katze. Sie sitzt auf etwas Glänzendem und starrt mich an, als hielte sie mich für sehr dumm. Vielleicht hat sie recht.`),pick:(e,t)=>t.flag(`c2_katze_gefuettert`)?`stretch`:null,talk:e=>e.say(e.flag(`c2_katze_gefuettert`)?`Miau. Ich übersetze: „Gern geschehen.“`:`Ich rede mit der Katze. Sie blinzelt langsam. Entweder Verachtung oder Zuneigung. Bei Katzen ist es dasselbe.`),take:`Ich greife nach ihr. Sie faucht. Die Handnarbe wird mir eine Lehre sein.`,use:e=>e.say(e.flag(`c2_katze_gefuettert`)?`Sie lässt sich kurz streicheln und dann nie wieder.`:`Sie sitzt auf einem Schlüssel, da bin ich fast sicher. Sie wird ihn nicht freiwillig hergeben. Vielleicht gegen etwas Essbares.`),give:{wurst:async e=>{if(e.flag(`c2_katze_gefuettert`))return e.say(`Sie hat schon genug. Die Katze hat immer genug, wenn man es nicht anbietet.`);e.remove(`wurst`),e.set(`c2_katze_gefuettert`,!0),await e.pose(`use`,500),await e.say(`Die Katze riecht an der Wurst. Dann nimmt sie sie, zieht sie in einen Winkel und verschwindet damit.`),await e.say(`An der Stelle, wo sie saß, liegt ein schwerer Eisenschlüssel.`),await O(e,`Ein Handel. Ich habe schon unter Menschen schlechtere erlebt.`)},tote_ratte:`Die Katze betrachtet die tote Ratte. Dann mich. Das ist eine Beleidigung, soweit ich Katzen verstehe.`,knochen:`Sie gähnt. Knochen sind etwas für Hunde.`,brot_alt:`Katzen und Brot. Das ist wie Mönche und Alkohol: In der Theorie ablehnend.`}}),M({id:`hex_schluessel`,item:`eisenschluessel`,x:615,y:392,hidden:e=>!e.flag(`c2_katze_gefuettert`),say:`Ein schwerer Eisenschlüssel, noch warm von der Katze. Er passt zur Truhe, schätze ich.`}),{id:`kaefig`,name:`Rabenkäfig`,sprite:`kaefig_rabe`,x:575,y:346,scale:1.15,look:`Ein Käfig, und darin ein Rabe, der aussieht, als hätte er viele Ratschläge für die Welt, aber niemand fragt ihn.`,take:`Ich nehme der Hexe nicht ihren Raben. Ich möchte weiterhin einen Kopf haben.`,use:`Ich öffne den Riegel einen Spalt. „Kraah! Lass das, Totengräber!“ sagt der Rabe. Die Tür fällt wieder zu.`,talk:async e=>{await D(e,`kaefig`,`Kraah! Totengräber! Frischer Totengräber! Erst nass! Dann leicht! Dann tief! Dann böse! Dann heiß! Kraah!`),await O(e,`Der Rabe kennt das Rezept. Beeindruckend, und beunruhigend.`),e.set(`c2_rabe_rezept`,!0)},give:{brot_alt:async e=>{e.remove(`brot_alt`),e.sfx(`pickup`),await e.say(`Der Rabe stürzt sich auf das Brot, kaut mit schiefem Kopf und blinzelt mich an.`),await D(e,`kaefig`,`Gut! Gut! Hör zu: Nicht den Kessel füttern, bevor die Rechnung stimmt! Nass, leicht, tief, böse, Feuer! Kraah!`),e.set(`c2_rabe_rezept`,!0)},wurst:`Der Rabe starrt auf die Wurst und dann auf die Katze. „Teile nie mit der Katze!“ krächzt er. Eine weise Warnung.`}},{id:`spiegel`,name:`Verhüllter Spiegel`,sprite:`spiegel_verhuellt`,x:235,y:346,scale:.95,look:`Ein hoher Spiegel, unter schwarzem Tuch versteckt. An den Rändern schimmert etwas wie Silber und schlechtes Gewissen.`,take:`Der Spiegel ist festgenagelt, aus gutem Grund.`,use:async e=>{await e.say(`Ich ziehe das Tuch ein Stück zur Seite. Im Glas liegt kein Gesicht, sondern Rauch.`),e.flag(`c2_spiegel`)?await e.say(`Der Rauch zeigt noch einmal denselben Berg. Ich ziehe das Tuch wieder zu, bevor er mir mehr verrät, als ich wissen will.`):(e.set(`c2_spiegel`,!0),e.flash(`#ff9a4a`,500),await e.say(`Im Rauch erscheinen Bilder: ein glühender Berg, ein riesiger Schatten, der etwas Rundes wärmt. Eine schwarze Gestalt nähert sich ihm.`),await e.say(`Die schwarze Gestalt hält ein goldenes Horn. Dann reißt der Rauch.`),await O(e,`Ein Drache. Und ein Ei. Und der Kanzler Malvor mit einem Horn, wenn mich nicht alles täuscht.`)),await D(e,`morwenna`,`Finger weg vom Spiegel! Er verbraucht dich, wenn du zu oft hineinschaust.`)},useWith:{kerzenwachs:`Wachs auf einen Zauberspiegel. Das sollte ich nie gesagt haben.`}},{id:`besen`,name:`Hexenbesen`,sprite:`besen`,x:128,y:350,scale:1,look:`Ein alter Reisigbesen. Er lehnt an der Wand wie ein Betrunkener an der Kirchentür. Ob er fliegt? Ich frage lieber nicht.`,take:`Ein Besen nützt mir nichts. Ich fliege nicht. Ich gehe zu Fuß, mit Blasen.`,use:async e=>{if(e.flag(`c2_gefegt`))return e.say(`Der Boden ist so sauber, wie er in einem Hexenhaus sein kann. Also nicht.`);e.set(`c2_gefegt`,!0),await e.pose(`use`,600),await e.say(`Ich fege die Ecke neben der Tür. Staub, Spinnweben, ein Mäuseskelett. Und etwas Kleines, Glänzendes.`),await D(e,`morwenna`,`Ich bin immer wieder froh, wenn jemand mein Elend sichtbar macht.`)}},M({id:`hex_knopf`,item:`messingknopf`,x:170,y:398,hidden:e=>!e.flag(`c2_gefegt`),say:`Ein Messingknopf, unter dem Staub verborgen. Von einem Soldatenrock vielleicht. Oder von einem Ritter, der sein Hemd verlor.`}),{id:`sessel`,name:`Alter Sessel`,sprite:`sessel`,x:312,y:352,scale:.95,look:`Ein durchgesessener Lehnstuhl mit einem Kissen aus Rabenfedern. Die Feder da sieht beinahe frisch aus.`,use:`Ich setze mich kurz. Das Kissen knirscht. Ich stehe wieder auf.`,take:`Der Sessel ist zu schwer. Außerdem sitzt vermutlich gerade ein Geist darin.`},N({id:`korb`,name:`Lumpenkorb`,x:905,y:352,sprites:{closed:`lumpenkorb`,open:`lumpenkorb`},scale:1.2,contents:[`lappen`,`nagel`,`spielfigur`],look:`Ein Korb voller zerschlissener Lappen. Ein Hexenhaushalt ist auch nur ein Haushalt.`,title:`Im Korb`,at:{x:880,y:372}}),{id:`strohlager`,name:`Strohlager`,sprite:`strohlager`,x:690,y:394,scale:1.1,look:`Ein Lager aus Stroh. Wer dort schläft? Die Katze, nehme ich an. Morwenna schläft wohl im Stehen.`,use:`Ich lasse mich nicht aufs Hexenstroh nieder. Man weiß nie, was darin wohnt.`},z({id:`regal_l`,name:`Linkes Regal`,hit:[175,85,175,225],at:{x:262,y:345},look:`Ein Regal voller Gläser: Augen, Zungen, Finger. Der Inhalt scheint nicht zu verderben, was mich beunruhigt.`,take:`Ein Glas voll Augen. Nein, danke. Die starren mich schon an.`,use:async e=>{if(e.flag(`c2_regal_l`))return e.say(`Ich habe schon gesucht. Mehr gibt das Regal nicht her.`);await e.say(`Ich schiebe ein paar Gläser zur Seite. Hinter ihnen steht eine leere Flasche, nur ein wenig staubig.`),e.set(`c2_regal_l`,!0),!e.flag(`taken_hex_flasche`)&&!e.has(`flasche_leer`)&&(e.add(`flasche_leer`),e.set(`taken_hex_flasche`,!0),await e.say(`Sie ist leer und sauber. Eine Flasche, die auf etwas wartet. Ich nehme sie mit.`))}}),z({id:`regal_r`,name:`Rechtes Regal`,hit:[645,85,135,225],at:{x:640,y:345},look:`Noch mehr Gläser, Knochen und ein Totenschädel mit Brille. Die Brille ist neu. Das Schlimmste daran.`,use:`Ich suche zwischen Wurzeln und Knochen. Alles beschriftet, in einer Schrift, die ich nicht lesen kann, aus Prinzip.`}),z({id:`kamin`,name:`Feuerstelle`,hit:[360,120,250,190],at:{x:482,y:372},look:`Ein gewaltiger Steinkamin. Der Kessel steht mitten in der Asche. Das Feuer ist kaum mehr als eine Erinnerung.`,use:`Ich stochere in der Asche. Warm. Das Feuer ist aus, aber nicht tot.`,useWith:{fackel:`Ich könnte den Kamin anzünden, aber Morwenna hat ihn dafür sicher aufgespart.`}}),z({id:`schaedel_tuer`,name:`Schädel über der Tür`,hit:[55,70,40,55],at:{x:120,y:372},look:`Ein Tierschädel über dem Türsturz. Er schützt vor bösem Besuch. Ich bin der Beweis, dass es nicht funktioniert.`}),z({id:`hirsch`,name:`Geweih über dem Kamin`,hit:[440,30,110,75],at:{x:480,y:372},look:`Ein Hirschschädel mit gewaltigem Geweih. Er sieht aus, als würde er jeden Satz beurteilen.`}),z({id:`kraeuter`,name:`Kräuterbündel`,hit:[360,0,240,90],at:{x:480,y:372},look:`Getrocknete Kräuter und Wurzeln hängen von den Balken. Vieles davon weiß ich zu nennen, vieles zu meiden.`,take:`Ich reiße nichts ab. Ich möchte nicht, dass meine Haut anschwillt, weil ich das falsche Kraut erwische.`}),z({id:`fenster`,name:`Rundes Fenster`,hit:[855,100,90,95],at:{x:860,y:372},look:`Ein rundes Fenster. Dahinter hängt ein grüner Mond. Oder eine sehr große Laterne. Das Moor macht keine Unterschiede.`}),z({id:`laterne_wand`,name:`Wandlaterne`,hit:[88,125,38,80],at:{x:130,y:372},look:`Eine kleine e lügen.`),B(`tor_burg`,`Burg Grauwacht`,[400,0,340,125],`Die Burg Grauwacht auf ihrem Felsen. Hunderte Fenster, aber nur wenige erleuchtet. Die Pest spart Kerzen.`),B(`tor_flagge`,`Wimpel`,[30,118,40,120],`Ein Wimpel am Mast. Er hängt traurig, als wüsste er mehr als wir.`),B(`tor_zinnen`,`Wehrgang`,[0,200,245,40],`Die Zinnen. Von dort oben haben schon viele ihre letzte Aussicht genossen.`),B(`tor_graben`,`Burggraben`,[0,318,240,22],`Der Graben. Wasser, Schlamm, und ein Gerücht von einer Leiche. Man kann nicht alles haben.`)]},On=e=>!!e.flag(`c3_roderic_met`);async function kn(e){for(e.set(`c3_eduard_offered`,!0),await e.moveNpc(`eduard`,Math.max(60,Math.min(880,e.hero.x+80)),Math.max(350,Math.min(425,e.hero.y)),700),await D(e,`eduard`,`Na, Totengräber. Du schuftest wie ein Esel. Dabei kann man das auch einfacher haben.`),await D(e,`eduard`,`Fünf Silberlinge, und du gibst Roderic gegenüber an, dass ICH deine Aufgaben erledigt habe. Und umgekehrt.`);;){let t=await e.choose([`Nein danke. Ich verdiene mir meine Ritterehre selbst.`,`Fünf Silberlinge? Her damit.`,`Wie viel genau?`]);if(t===2){await D(e,`eduard`,`Fünf. Sieben, wenn du dich beeilst. Mein Vater kauft auch Ehre. Im Dutzend billiger.`);continue}t===0?(e.honor(1),e.set(`c3_eduard_resolved`,!0),await D(e,`eduard`,`Du bist ein Narr. Ein ehrlicher. Das ist noch schlimmer.`),await O(e,`Mein Bauch sagt ja. Mein Gewissen sagt nein. Mein Gewissen hat die lauteren Argumente.`)):(e.honor(-1),e.add(`silber`),e.set(`c3_bribed`,!0),await D(e,`eduard`,`Hübsch. Du bist ein Mann nach meinem Geschmack. Käuflich.`),await O(e,`Das Silber brennt in der Tasche. Ich fühle mich wie ein Dieb mit Genehmigung.`));return}}async function An(e){if(!e.flag(`c3_eduard_offered`)){if(await D(e,`roderic`,`Eine Sache noch. Die wichtigste. Du wirst gleich einen Besuch bekommen.`),await kn(e),e.flag(`c3_bribed`)){await D(e,`roderic`,`Eduard grinst wie ein Fuchs im Hühnerstall. Hat er dir etwas gegeben?`),await O(e,`Silber. Ich hab es genommen. E
