;break;case`ash`:e.fillStyle=`rgba(${t.color??`200,190,185`},0.6)`,e.fillRect(r.x,r.y,r.size,r.size);break;case`fireflies`:{let n=.5+.5*Math.sin(r.ph*2.2);e.globalCompositeOperation=`lighter`;let a=e.createRadialGradient(r.x,r.y,0,r.x,r.y,8),o=t.color??`190,255,120`;a.addColorStop(0,`rgba(${o},${.9*n*i})`),a.addColorStop(1,`rgba(${o},0)`),e.fillStyle=a,e.fillRect(r.x-8,r.y-8,16,16),e.globalCompositeOperation=`source-over`;break}case`drips`:r.life>r.max&&(e.fillStyle=`rgba(150,190,210,0.7)`,e.fillRect(r.x,r.y,1.5,4));break;case`smoke`:{let a=e.createRadialGradient(r.x,r.y,0,r.x,r.y,r.size),o=t.color??`60,56,60`;a.addColorStop(0,`rgba(${o},${.28*i*(1-n)})`),a.addColorStop(1,`rgba(${o},0)`),e.fillStyle=a,e.fillRect(r.x-r.size,r.y-r.size,r.size*2,r.size*2);break}}}}),e.restore()}},ce={"Ich knete das Pech um das Ende des Stabs. Eine Fackel. Noch kalt, aber voller Absicht.":`ฉันนวดยางสนรอบปลายไม้ กลายเป็นคบเพลิง ยังเย็นอยู่ แต่เต็มไปด้วยเจตนา`,"Ich schlage Funken auf die Fackel. Das Pech fängt, zischt und brennt. Licht! Es reicht für ein paar Handgriffe.":`ฉันตีประกายไฟใส่คบเพลิง ยางสนติด ฉี่ดดด แล้วก็ลุกไหม้ แสงสว่าง! พอให้ทำอะไรได้นิดหน่อย`,"Leder, Nadel, Zwirn. Daraus könnte man etwas flicken. Ein Loch im Blasebalg zum Beispiel.":`หนัง เข็ม ด้าย เอามาปะอะไรได้อยู่ อย่างเช่นรูในเครื่องสูบลม`,"Brot und Wurst. Das Mahl eines Armen und die Hoffnung eines Wolfs. Ich esse nichts davon, es wird noch gebraucht.":`ขนมปังกับไส้กรอก มื้อของคนจนและความหวังของหมาป่า ฉันไม่กินหรอก เดี๋ยวยังต้องใช้`,"Die Ratte ist schon tot. Die Falle schnappt aus Prinzip zu. Es ist ein Missverständnis.":`หนูตายไปแล้ว กับดักมันดีดปิดตามหลักการของมันเอง เป็นความเข้าใจผิดล้วนๆ`,"Wasser in die Flasche gießen? Das wäre bloß Wasser. Für etwas Gesegnetes brauche ich das Weihwasserbecken.":`เทน้ำใส่ขวดเหรอ? ก็ได้แค่น้ำธรรมดา ถ้าจะเอาน้ำมนต์ ฉันต้องใช้อ่างน้ำมนต์`,"Wachs an einen Stab kleben? Das gäbe eine armselige Kerze. Ich brauche Pech.":`เอาขี้ผึ้งแปะติดไม้เหรอ? ได้เทียนกระจอกๆ เล่มหนึ่ง ฉันต้องใช้ยางสน`,"Funken auf einen Holzstab? Er brennt ab, und mit ihm mein Plan. Erst Pech dran.":`ตีประกายไฟใส่ไม้ท่อนเหรอ? มันก็ไหม้หมด แผนฉันก็ไหม้ไปด้วย เอายางสนมาทาก่อน`,"Ich kritzle „Sünden“ auf den Fetzen und streiche es durch. Es wird nicht besser.":`ฉันขีดเขียนคำว่า “บาป” ลงบนเศษผ้า แล้วก็ขีดฆ่าทิ้ง ไม่ได้ดีขึ้นเลย`,"Ein Knochen und eine tote Ratte. Der Anfang einer Suppe, die ich nie kochen werde.":`กระดูกหนึ่งชิ้นกับหนูตายหนึ่งตัว จุดเริ่มต้นของซุปที่ฉันจะไม่มีวันได้ทำ`,"Kapitel 1":`บทที่ 1`,"Der Rabeneid":`คำสาบานแห่งอีกา`,"Aschenfurt. Dreck, Krähen und ein Galgen, der nie Urlaub hat.":`Aschenfurt ฝุ่นสกปรก อีกา และตะแลงแกงที่ไม่เคยได้หยุดพักร้อน`,"Heute ändere ich mein Leben. Heute werde ich Ritter.":`วันนี้ฉันจะเปลี่ยนชีวิต วันนี้ฉันจะเป็นอัศวิน`,"Du da! Totengräberjunge! Lungerst du wieder herum?":`เฮ้ย เอ็ง! เด็กขุดศพ! มาเดินเตร่อีกแล้วเหรอ?`,"Ich will zum Rabenorden, Feldwebel. Ich will Ritter werden.":`ผมอยากเข้าสู่ภาคีอีกา จ่า ผมอยากเป็นอัศวิน`,"Ha! Du? Dann beweise es. Der Orden prüft nur, wer drei Dinge vorweist:":`ฮ่า! เอ็งน่ะนะ? งั้นก็พิสูจน์มาสิ ภาคีจะทดสอบเฉพาะคนที่มีของสามอย่าง:`,"Eine KLINGE. Einen SEGEN der Kirche. Und einen BÜRGEN aus den Reihen des Ordens.":`ดาบหนึ่งเล่ม พรจากคริสตจักรหนึ่งอย่าง และผู้ค้ำประกันจากสมาชิกภาคีหนึ่งคน`,"Bring mir alle drei, dann reden wir. Vorher störst du nur die Raben.":`เอามาให้ครบทั้งสามอย่าง แล้วค่อยคุยกัน ก่อนหน้านั้นเอ็งก็แค่กวนใจพวกอีกา`,"Klinge, Segen, Bürge. Das klingt nach einem langen Tag.":`ดาบ พร ผู้ค้ำประกัน ฟังดูเป็นวันที่ยาวนานเลยนะ`,"Ein Eimer liegt in der Schmiede. Damit könntest du am Brunnen Wasser holen.":`มีถังน้ำอยู่ในโรงตีเหล็ก เอาไปตักน้ำที่บ่อได้`,"Der Rabe am Galgen bewacht das Seil. Futter für ihn liegt in Kunz' Kiste auf dem Dorfplatz. Den Schlüssel dazu such in der Schmiede, im Werkzeugschrank.":`อีกาที่ตะแลงแกงเฝ้าเชือกอยู่ อาหารของมันอยู่ในหีบของ Kunz กลางลานหมู่บ้าน กุญแจหีบให้ไปหาในโรงตีเหล็ก ที่ตู้เครื่องมือ`,"Öffne Kunz' Kiste auf dem Dorfplatz mit dem Eisenschlüssel. Brot und Wurst liegen darin.":`เปิดหีบของ Kunz กลางลานหมู่บ้านด้วยกุญแจเหล็ก ข้างในมีขนมปังกับไส้กรอก`,"Nimm das Brot aus Kunz' Kiste (Kiste öffnen und herausnehmen) und füttere damit den Raben am Galgen.":`หยิบขนมปังจากหีบของ Kunz (เปิดหีบแล้วหยิบออกมา) แล้วเอาไปให้อีกาที่ตะแลงแกงกิน`,"Gib dem Raben am Galgen etwas zu fressen, dann ist das Seil frei.":`ให้อีกาที่ตะแลงแกงกินอะไรสักหน่อย แล้วเชือกก็จะว่าง`,"Nimm jetzt das Seil vom Galgen auf dem Dorfplatz.":`ทีนี้ก็เอาเชือกลงจากตะแลงแกงกลางลานหมู่บ้านได้แล้ว`,"Binde das Seil am Brunnen auf dem Dorfplatz an die Kurbel.":`ผูกเชือกเข้ากับที่หมุนของบ่อน้ำกลางลานหมู่บ้าน`,"Benutze den Eimer am Brunnen auf dem Dorfplatz, um Wasser zu holen.":`ใช้ถังที่บ่อน้ำกลางลานหมู่บ้านตักน้ำ`,"Entzünde die Fackel: Feuerstein darauf benutzen, oder an einer Kerzenflamme in der Kapelle.":`จุดคบเพลิง: ใช้หินเหล็กไฟกับมัน หรือจุดจากเปลวเทียนในโบสถ์น้อย`,"Zum Anzünden fehlt dir Feuerstein. Er liegt im Werkzeugschrank der Schmiede.":`ไม่มีหินเหล็กไฟก็จุดไม่ได้ มันอยู่ในตู้เครื่องมือของโรงตีเหล็ก`,"Du brauchst eine Fackel für die Gruft. Ein Holzstab liegt am Waldrand.":`เจ้าต้องมีคบเพลิงสำหรับห้องใต้ดินฝังศพ มีไม้ท่อนอยู่ที่ชายป่า`,"Tauche den Holzstab ins Pechfass auf dem Dorfplatz. Das gibt eine Fackel.":`จุ่มไม้ท่อนลงในถังยางสนกลางลานหมู่บ้าน ก็จะได้คบเพลิง`,"Sprich mit Feldwebel Brandt auf dem Dorfplatz.":`คุยกับจ่า Brandt กลางลานหมู่บ้าน`,"Du hast Klinge, Segen und Bürgen. Zeige sie Feldwebel Brandt auf dem Dorfplatz.":`เจ้ามีดาบ พร และผู้ค้ำประกันแล้ว เอาไปให้จ่า Brandt ดูกลางลานหมู่บ้าน`,"Der Sakristeischrank in der Kapelle hat ein Runenschloss. Die richtige Reihenfolge steht irgendwo auf dem Dorfplatz geschrieben, auf dem Anschlagbrett.":`ตู้เก็บของในห้องเก็บเครื่องแต่งกายของโบสถ์น้อยมีกุญแจรูน ลำดับที่ถูกต้องเขียนไว้ที่ไหนสักแห่งกลางลานหมู่บ้าน บนกระดานประกาศ`,"Drücke die Runenknöpfe am Sakristeischrank in der Kapelle in der richtigen Reihenfolge: Rabe, Lamm, Kreuz.":`กดปุ่มรูนที่ตู้ในห้องเก็บเครื่องแต่งกายของโบสถ์น้อยตามลำดับที่ถูกต้อง: อีกา, ลูกแกะ, กางเขน`,"Nimm den Gruftschlüssel aus der oberen Schublade des Sakristeischranks.":`หยิบกุญแจห้องใต้ดินฝังศพจากลิ้นชักบนของตู้ในห้องเก็บเครื่องแต่งกาย`,"Öffne die Falltür in der Kapelle mit dem Gruftschlüssel.":`เปิดประตูกลที่พื้นในโบสถ์น้อยด้วยกุญแจห้องใต้ดินฝังศพ`,"Für den Skelettwächter brauchst du Weihwasser. Eine leere Flasche liegt in der unteren Schublade des Sakristeischranks.":`สำหรับผู้พิทักษ์โครงกระดูก เจ้าต้องมีน้ำมนต์ ขวดเปล่าอยู่ในลิ้นชักล่างของตู้ในห้องเก็บเครื่องแต่งกาย`,"Gieße das Wasser in das Weihwasserbecken in der Kapelle.":`เทน้ำลงในอ่างน้ำมนต์ในโบสถ์น้อย`,"Fülle die leere Flasche am vollen Weihwasserbecken in der Kapelle.":`เติมขวดเปล่าที่อ่างน้ำมนต์ซึ่งเต็มแล้วในโบสถ์น้อย`,"Im Reliquienschrein der Gruft: die drei Steinplatten in der Reihenfolge Rabe, Lamm, Kreuz drücken. Vorher den Wächter mit Weihwasser besänftigen.":`ที่ศาลบรรจุพระธาตุในห้องใต้ดินฝังศพ: กดแผ่นหินทั้งสามตามลำดับ อีกา ลูกแกะ กางเขน ก่อนอื่นต้องทำให้ผู้พิทักษ์สงบด้วยน้ำมนต์`,"Nimm die Reliquie aus dem Schrein. Den Wächter hast du besänftigt, hoffentlich.":`หยิบพระธาตุออกจากศาล ผู้พิทักษ์สงบลงแล้ว หวังว่านะ`,"Auf einem Sarkophag in der Gruft liegt ein Klingenbruch. Gero in der Schmiede braucht ihn.":`บนโลงหินในห้องใต้ดินฝังศพมีดาบหักวางอยู่ Gero ในโรงตีเหล็กต้องการมัน`,"Bringe die Reliquie zu Pater Anselm in der Kapelle. Er siegelt dir den Segen.":`เอาพระธาตุไปให้บาทหลวง Anselm ในโบสถ์น้อย ท่านจะประทับตราพรให้เจ้า`,"Die Klinge liegt fertig auf der Werkbank. Gero will zwei Silber oder zehn Mal Blasebalg pumpen. Rede mit ihm.":`ดาบวางเสร็จอยู่บนโต๊ะช่างแล้ว Gero ต้องการเงินสองเหรียญ หรือไม่ก็สูบเครื่องสูบลมสิบครั้ง ไปคุยกับเขาสิ`,"Öffne die Kohlekiste in der Schmiede mit dem kleinen Schlüssel.":`เปิดหีบถ่านในโรงตีเหล็กด้วยกุญแจดอกเล็ก`,"Der kleine Schlüssel zur Kohlekiste liegt im Werkzeugschrank der Schmiede.":`กุญแจดอกเล็กของหีบถ่านอยู่ในตู้เครื่องมือของโรงตีเหล็ก`,"Lege die Kohle in die Esse.":`ใส่ถ่านลงในเตาหลอม`,"Nimm die Kohle aus der Kohlekiste und lege sie in die Esse.":`หยิบถ่านจากหีบถ่านแล้วใส่ลงในเตาหลอม`,"Zünde die Kohle in der Esse mit dem Feuerstein an.":`จุดถ่านในเตาหลอมด้วยหินเหล็กไฟ`,"Feuerstein liegt im Werkzeugschrank der Schmiede, mittlere Schublade.":`หินเหล็กไฟอยู่ในตู้เครื่องมือของโรงตีเหล็ก ลิ้นชักกลาง`,"Der Blasebalg hat ein Loch. Du brauchst Leder: Ein alter Stiefel steckt im Heuhaufen auf dem Dorfplatz. Dazu Nadel und Zwirn aus dem Werkzeugschrank.":`เครื่องสูบลมมีรูรั่ว เจ้าต้องมีหนัง: รองเท้าบูทเก่าซุกอยู่ในกองฟางกลางลานหมู่บ้าน ส่วนเข็มกับด้ายอยู่ในตู้เครื่องมือ`,"Flicke den Blasebalg mit Stiefel und Nadel und Zwirn.":`ปะเครื่องสูบลมด้วยรองเท้าบูท เข็ม และด้าย`,"Nadel und Zwirn liegen in der obersten Schublade des Werkzeugschranks.":`เข็มกับด้ายอยู่ในลิ้นชักบนสุดของตู้เครื่องมือ`,"Pumpe den Blasebalg, bis die Esse weiß glüht.":`สูบเครื่องสูบลมจนเตาหลอมร้อนแดงเป็นสีขาว`,"Lege den Klingenbruch in die glühende Esse.":`ใส่ดาบหักลงในเตาหลอมที่ร้อนแดง`,"Bearbeite den Amboss mit dem Hammer, vier Schläge.":`ตีทั่งด้วยค้อน สี่ครั้ง`,"Nimm den Hammer von der Werkbank und schlage auf den Amboss.":`หยิบค้อนจากโต๊ะช่างแล้วตีลงบนทั่ง`,"Gieße das Wasser ins Löschfass der Schmiede. Optional: erst Weihwasser hinein.":`เทน้ำลงในถังชุบของโรงตีเหล็ก ทางเลือก: ใส่น้ำมนต์ลงไปก่อน`,"Schrecke die Klinge im Löschfass ab. Wer Weihwasser hat, kann die Klinge segnen.":`จุ่มดาบชุบในถังชุบ ถ้ามีน้ำมนต์ก็ทำพรให้ดาบได้`,"Schleife die Klinge am Schleifstein.":`ลับดาบที่หินลับมีด`,"Repariere die Wolfsfalle am Waldrand mit dem Nagel.":`ซ่อมกับดักหมาป่าที่ชายป่าด้วยตะปู`,"Am Waldrand lauern Wölfe. Die kaputte Falle braucht einen Nagel, einen findest du auf dem Dorfplatz.":`หมาป่าซุ่มอยู่ที่ชายป่า กับดักที่พังต้องใช้ตะปู เจ้าหาได้กลางลานหมู่บ้าน`,"Öffne Kunz' Kiste auf dem Dorfplatz. Die Wurst darin ist der Köder für die Wölfe.":`เปิดหีบของ Kunz กลางลานหมู่บ้าน ไส้กรอกข้างในเป็นเหยื่อล่อหมาป่า`,"Den Köder, eine Wurst, findest du in der Kiste auf dem Dorfplatz. Der Schlüssel liegt im Werkzeugschrank der Schmiede.":`เหยื่อล่อคือไส้กรอก เจ้าหาได้ในหีบกลางลานหมู่บ้าน กุญแจอยู่ในตู้เครื่องมือของโรงตีเหล็ก`,"Nimm die Wurst aus Kunz' Kiste auf dem Dorfplatz, um die Wölfe am Waldrand zu ködern.":`หยิบไส้กรอกจากหีบของ Kunz กลางลานหมู่บ้าน เพื่อล่อหมาป่าที่ชายป่า`,"Lege die Wurst als Köder in die gespannte Wolfsfalle am Waldrand.":`วางไส้กรอกเป็นเหยื่อในกับดักหมาป่าที่ขึงไว้แล้วที่ชายป่า`,"Gib Ser Halvard am Waldrand das Wasser.":`ให้น้ำแก่ Ser Halvard ที่ชายป่า`,"Sprich mit Ser Halvard am Waldrand und bitte ihn um seine Bürgschaft.":`คุยกับ Ser Halvard ที่ชายป่า แล้วขอให้ท่านค้ำประกัน`,"Du brauchst noch den Segen von Pater Anselm in der Kapelle.":`เจ้ายังต้องการพรจากบาทหลวง Anselm ในโบสถ์น้อยอีก`,"Zeige Feldwebel Brandt auf dem Dorfplatz deine drei Beweise.":`เอาหลักฐานทั้งสามอย่างให้จ่า Brandt ดูกลางลานหมู่บ้าน`,"Na sieh einer an. Der Totengräberjunge, und er trägt tatsächlich etwas bei sich.":`โอ้โฮ ดูซิใครมา เด็กขุดศพ แล้วมีของติดตัวมาจริงๆ ด้วย`,"Eine Klinge. Den Segen von Pater Anselm. Und Ser Halvards Brief.":`ดาบหนึ่งเล่ม พรจากบาทหลวง Anselm และจดหมายของ Ser Halvard`,"Klinge...":`ดาบ...`,"Sie summt leise. Hast du sie in Weihwasser getauft? Unverschämt. Und klug.":`มันครางเบาๆ เอ็งเอามันไปจุ่มน้ำมนต์เหรอ? อวดดีนัก แต่ก็ฉลาด`,"Etwas krumm, etwas schief, aber ehrlich geschmiedet. Das ist mehr, als ich von mancher Klinge im Orden sagen kann.":`งอนิดๆ เบี้ยวหน่อยๆ แต่ตีมาอย่างซื่อสัตย์ ซึ่งดีกว่าดาบหลายเล่มในภาคีที่ข้าจะพูดได้`,"Segen... das Siegel ist echt. Der Pater hat sogar ordentlich geschrieben. Wunder über Wunder.":`พร... ตราประทับของจริง บาทหลวงเขียนเรียบร้อยด้วยซ้ำ ปาฏิหาริย์ซ้อนปาฏิหาริย์`,"Und Halvards Brief. Seine Handschrift. Er lebt also noch.":`แล้วก็จดหมายของ Halvard ลายมือเขา แปลว่าเขายังไม่ตายสินะ`,"Und sein Siegelring am Finger. Er muss dich sehr gemocht haben, Junge.":`แล้วก็แหวนตราของเขาที่นิ้วเอ็งอีก เขาคงชอบเอ็งมากเลยนะ ไอ้หนู`,"Man erzählt sich, du hättest den Toten Respekt erwiesen und Hilda geholfen. In Aschenfurt ist das fast schon verdächtig.":`เขาเล่ากันว่าเอ็งให้เกียรติคนตายและช่วย Hilda ใน Aschenfurt นี่ถือว่าน่าสงสัยเกือบๆ แล้วนะ`,"Man erzählt sich auch, am Leichenkarren sei ein Beutel verschwunden. Ich habe nichts gehört. Ich höre ohnehin schlecht.":`เขาเล่ากันอีกว่ารถเข็นศพถุงเงินหายไปใบหนึ่ง ข้าไม่ได้ยินอะไรทั้งนั้น ยังไงหูข้าก็ไม่ดีอยู่แล้ว`,"Also gut. Die Prüfung findet auf Burg Grauwacht statt. Dort sitzt der Orden, wenn er nicht gerade vergiftet wird.":`เอาล่ะ การทดสอบจะจัดที่ปราสาท Grauwacht ภาคีประจำอยู่ที่นั่น ตอนที่ไม่ได้ถูกวางยาพิษอยู่น่ะนะ`,"Der Weg dorthin führt durch das Hexenmoor. Es gibt keinen anderen. Die Wege drumherum sind länger als dein Leben.":`ทางไปที่นั่นผ่านหนองน้ำแม่มด ไม่มีทางอื่น ทางอ้อมยาวกว่าชีวิตเอ็งอีก`,"Das Hexenmoor? Mit... Hexen?":`หนองน้ำแม่มด? ที่มี... แม่มดเนี่ยนะ?`,"Mit Nebel, Irrlichtern und einer Dame, die Morwenna heißt. Sei höflich, bring Brot mit, und iss nichts, was sie dir anbietet.":`มีหมอก ไฟผีหลอก และสตรีนางหนึ่งชื่อ Morwenna สุภาพเข้าไว้ เอาขนมปังไปด้วย และอย่ากินอะไรที่นางยื่นให้`,"Hier, eine Fackel. Die Irrlichter mögen keine ernsthafte Konkurrenz.":`นี่ คบเพลิง ไฟผีหลอกไม่ชอบคู่แข่งตัวจริงหรอก`,"Deine Fackel hast du ja schon. Gut. Im Moor ist Licht wichtiger als Mut.":`เอ็งมีคบเพลิงอยู่แล้วนี่ ดี ในหนองน้ำแสงสำคัญกว่าความกล้า`,"Und einen Eimer. Frag nicht. Im Moor ist alles nass, nur der Durst nicht.":`แล้วก็ถังใบหนึ่ง อย่าถาม ในหนองน้ำทุกอย่างเปียกหมด ยกเว้นความกระหาย`,"Eine schwarze Feder segelt vom Galgen und landet vor meinen Füßen. Der Rabe sieht weg, als wäre nichts gewesen.":`ขนอีกาสีดำปลิวลงมาจากตะแลงแกงแล้วตกลงตรงหน้าเท้าฉัน อีกามองไปทางอื่น ทำเหมือนไม่มีอะไรเกิดขึ้น`,"Geh, Bran. Und komm lebendig zurück. Ich habe schon genug Leichen zu zählen.":`ไปเถอะ Bran แล้วกลับมาทั้งเป็นด้วย ข้านับศพมามากพอแล้ว`,"Kapitel 2":`บทที่ 2`,"Das Hexenmoor":`หนองน้ำแม่มด`,"Dorfplatz von Aschenfurt":`ลานหมู่บ้าน Aschenfurt`,"Zur Schmiede":`ไปโรงตีเหล็ก`,"Dort hinten qualmt die Schmiede. Der Rauch riecht nach Arbeit und Ärger.":`ตรงโน้น โรงตีเหล็กควันโขมง ควันกลิ่นงานหนักและปัญหา`,"Zum Waldrand":`ไปชายป่า`,"Der Pfad zum Waldrand. Dort, sagt man, fressen die Wölfe das, was die Pest übrig lässt.":`ทางเดินไปชายป่า ว่ากันว่าหมาป่าที่นั่นกินของที่กาฬโรคเหลือไว้`,Kapelle:`โบสถ์น้อย`,"Die Kapelle von Aschenfurt. Das Dach hat Löcher, der Glaube auch.":`โบสถ์น้อยของ Aschenfurt หลังคามีรูรั่ว ศรัทธาก็เหมือนกัน`,"Feldwebel Brandt":`จ่า Brandt`,"Feldwebel Brandt. Er sieht aus, als hätte er den Krieg gewonnen und dabei sich selbst verloren.":`จ่า Brandt ดูเหมือนคนที่ชนะสงคราม แต่เสียตัวเองไประหว่างนั้น`,"Brandt winkt ab. „Behalte es. Zeig mir alles auf einmal, ich bin kein Pfandleiher.“":`Brandt โบกมือปัด “เก็บไว้เถอะ เอามาให้ข้าดูทีเดียวทั้งหมด ข้าไม่ใช่โรงรับจำนำ”`,"„Behalte es, Junge. Zeig mir Klinge, Segen und Bürgen zusammen. Der Orden liebt Vollständigkeit.“":`“เก็บไว้ ไอ้หนู เอาดาบ พร และผู้ค้ำประกันมาให้ดูพร้อมกัน ภาคีชอบความครบถ้วน”`,"„Nicht einzeln. Wenn du alles hast, komm zu mir. Ich vergesse sonst die Hälfte.“":`“ไม่ต้องทีละอย่าง ได้ครบเมื่อไหร่ค่อยมาหาข้า ไม่งั้นข้าลืมไปครึ่งหนึ่ง”`,"Brandt schnuppert, schluckt hörbar und schiebt sie zurück. „Dienstvergehen. Behalte sie. Ich habe nichts gesehen.“":`Brandt สูดดม กลืนน้ำลายดังเอื๊อก แล้วดันมันกลับมา “ผิดวินัย เก็บไว้ ข้าไม่เห็นอะไรทั้งนั้น”`,"Brandt wägt den Beutel in der Hand, wird blass und drückt ihn dir zurück. „Ich kenne diesen Beutel. Ich kenne den Karren. Ich habe nichts gesehen.“":`Brandt ชั่งน้ำหนักถุงในมือ หน้าซีดเผือด แล้วดันมันคืนมาให้เอ็ง “ข้ารู้จักถุงนี้ ข้ารู้จักรถเข็นนั่น ข้าไม่เห็นอะไรทั้งนั้น”`,"Was genau brauche ich für die Prüfung?":`ผมต้องมีอะไรบ้างสำหรับการทดสอบ?`,"Drei Dinge, Totengräberjunge. Eine Klinge, einen Segen und einen Bürgen.":`สามอย่าง เด็กขุดศพ ดาบ พร และผู้ค้ำประกัน`,"Die Klinge muss von dir sein. Der Orden prüft, ob du Hitze und Hammerschlag verträgst.":`ดาบต้องเป็นของเอ็งเอง ภาคีจะดูว่าเอ็งทนความร้อนและแรงค้อนได้ไหม`,"Der Segen ist ein Siegelbrief vom Pater. Und der Bürge muss ein Ritter des Ordens sein, der seinen Namen für dich verpfändet.":`พรคือจดหมายประทับตราจากบาทหลวง ส่วนผู้ค้ำประกันต้องเป็นอัศวินของภาคี ที่เอาชื่อตัวเองมาค้ำเอ็ง`,"Wo bekomme ich eine Klinge?":`ผมจะหาดาบได้ที่ไหน?`,"Gero, der Schmied. Brummig, lahm, und er hat noch nie freiwillig jemandem geholfen.":`Gero ช่างตีเหล็ก ขี้บ่น ขาเป๋ และไม่เคยช่วยใครด้วยความเต็มใจเลยสักครั้ง`,"Er schmiedet nicht selbst, seit die Hand nicht mehr will. Aber er weiß genau, wie es geht. Und er sagt es dir. Meistens laut.":`เขาไม่ตีเองแล้วตั้งแต่มือไม่ยอมทำงาน แต่รู้ดีว่าต้องทำยังไง แล้วเขาก็จะบอกเอ็ง ส่วนใหญ่ก็ตะโกนบอก`,"Und der Segen?":`แล้วพรล่ะ?`,"Pater Anselm in der Kapelle. Er sitzt auf seinem Segen wie ein Geizhals auf dem Gold.":`บาทหลวง Anselm ในโบสถ์น้อย ท่านนั่งทับพรของท่านเหมือนคนขี้เหนียวนั่งทับทองคำ`,"Man munkelt, in der Gruft fehle etwas. Ein Heiligtum. Er wird dir mehr sagen, wenn du ihm einen Gefallen tust.":`เขาลือกันว่าในห้องใต้ดินฝังศพมีของหายไปชิ้นหนึ่ง ของศักดิ์สิทธิ์ ท่านจะบอกเอ็งมากกว่านี้ ถ้าเอ็งช่วยท่านสักเรื่อง`,"Wer könnte für mich bürgen?":`ใครจะค้ำประกันให้ผมได้?`,"Ser Halvard. Ritter des Ordens, ein ehrlicher Mann. Er ritt vor Wochen zum Waldrand und kam nie zurück.":`Ser Halvard อัศวินของภาคี คนซื่อสัตย์ เขาขี่ม้าไปชายป่าเมื่อหลายสัปดาห์ก่อนแล้วไม่กลับมาอีกเลย`,"Wenn die Wölfe ihn nicht haben, dann liegt er noch dort. Aber ich schicke keinen meiner Männer. Die Wölfe haben Hunger und ich Familie.":`ถ้าหมาป่าไม่ได้ตัวเขาไป เขาก็คงยังอยู่ที่นั่น แต่ข้าไม่ส่งลูกน้องคนไหนไปหรอก หมาป่าหิว ส่วนข้ามีครอบครัว`,"Wie steht es um Aschenfurt?":`Aschenfurt เป็นยังไงบ้าง?`,"Die Pest nimmt, der Hunger nimmt, der Steuereintreiber nimmt auch. Nur der Galgen gibt noch Arbeit.":`กาฬโรคเอาไป ความหิวเอาไป คนเก็บภาษีก็เอาไปด้วย มีแค่ตะแลงแกงที่ยังมีงานให้ทำ`,"Und oben auf Grauwacht liegt der König im Sterben. Man flüstert, es sei kein Fieber.":`และบนปราสาท Grauwacht พระราชากำลังจะสิ้นพระชนม์ เขากระซิบกันว่าไม่ใช่ไข้`,"Kein Fieber?":`ไม่ใช่ไข้?`,"Ich sagte nichts. Ich bin Soldat, kein Schwätzer.":`ข้าไม่ได้พูดอะไร ข้าเป็นทหาร ไม่ใช่ปากสว่าง`,"Was ist mit dem Leichenkarren?":`แล้วรถเข็นศพล่ะ?`,"Der steht seit gestern da. Der Fuhrmann ist an Schlimmerem gestorben als am Karren.":`จอดอยู่ตรงนั้นตั้งแต่เมื่อวาน คนขับรถตายด้วยเรื่องที่แย่กว่ารถเข็น`,"Wer noch Anstand hat, deckt ihn zu. Wer keinen hat, durchsucht ihn. Ich schaue nicht hin, ich bin im Dienst.":`ใครมีมารยาทก็เอาผ้าคลุมให้ ใครไม่มีก็ค้น ข้าไม่มองหรอก ข้าอยู่เวร`,"Warum sollte ich ein Ritter werden wollen?":`ทำไมผมต้องอยากเป็นอัศวินด้วย?`,"Ha! Frag mich in zehn Jahren, wenn du noch lebst.":`ฮ่า! ถามข้าอีกสิบปี ถ้าเอ็งยังมีชีวิตอยู่`,"Man bekommt ein Pferd, ein Schwert und ein Dach. Dafür bekommt man auch Dinge hineingerammt. Ich war nie Ritter. Ich war nur sein Schatten.":`ได้ม้า ได้ดาบ ได้หลังคา แลกกับการถูกยัดของใส่ตัวด้วย ข้าไม่เคยเป็นอัศวิน ข้าเป็นแค่เงาของเขา`,"Dann hol sie dir. Und zieh dir was Sauberes an.":`งั้นก็ไปเอามาสิ แล้วหาเสื้อผ้าสะอาดๆ ใส่ด้วย`,"Ich komme wieder.":`ผมจะกลับมา`,Hilda:`Hilda`,"Hilda, alt wie der Brunnen und doppelt so zäh. Sie trägt ein Kopftuch und die Sorgen eines ganzen Dorfes.":`Hilda แก่เท่าบ่อน้ำและเหนียวเป็นสองเท่า สวมผ้าคลุมหัวและแบกความทุกข์ของทั้งหมู่บ้านไว้`,"„Wurst? Behalte sie. Mein Kunz hatte auch eine. Er war so stolz auf sie, dass er sie nie gegessen hat.“":`“ไส้กรอกเหรอ? เก็บไว้เถอะ Kunz ของข้าก็เคยมีเส้นหนึ่ง เขาภูมิใจกับมันจนไม่เคยกินเลย”`,"Junge! Du bist doch der von Oswin, der mit der Schaufel. Hast du zufällig Fieberkraut?":`หนู! เอ็งนี่ลูกชายของ Oswin ใช่ไหม คนที่ถือพลั่วน่ะ บังเอิญมีสมุนไพรแก้ไข้ไหม?`,"Fieberkraut? Nein. Warum?":`สมุนไพรแก้ไข้? ไม่มีครับ ทำไมเหรอ?`,"Mein Enkel brennt wie eine Kerze. Der Bader sagt, nur Fieberkraut hilft. Der Bader sagt auch, er sei kein Arzt.":`หลานข้าตัวร้อนเป็นไฟเหมือนเทียน หมอตัดผมบอกว่ามีแต่สมุนไพรแก้ไข้ที่ช่วยได้ หมอตัดผมก็บอกด้วยว่าตัวเองไม่ใช่หมอ`,"Wo wächst Fieberkraut?":`สมุนไพรแก้ไข้ขึ้นที่ไหนครับ?`,"Am Waldrand, bei den Fliegenpilzen, wo die Erde schwarz ist. Das Kraut hat kleine gelbe Blüten.":`ที่ชายป่า ตรงเห็ดฝาแดง ตรงที่ดินเป็นสีดำ สมุนไพรนั่นมีดอกสีเหลืองเล็กๆ`,"Aber die Wölfe, Junge. Bleib am Rand, auf der rechten Seite. Dort, wo die Sonne untergeht, haben sie keinen Hunger.":`แต่ระวังหมาป่านะหนู เดินชิดขอบ ฝั่งขวา ตรงที่ดวงอาทิตย์ตก พวกมันไม่หิว`,"Ich habe das Fieberkraut gefunden.":`ผมเจอสมุนไพรแก้ไข้แล้วครับ`,"Was könnt Ihr mir über Aschenfurt erzählen?":`เล่าเรื่อง Aschenfurt ให้ฟังหน่อยได้ไหมครับ?`,"Früher gab es hier einen Markt, Musik und Mädchen. Jetzt gibt es einen Galgen, einen Karren und Brandt.":`สมัยก่อนที่นี่มีตลาด มีดนตรี มีสาวๆ เดี๋ยวนี้มีตะแลงแกง รถเข็นศพ และ Brandt`,"Der Galgen ist am fleißigsten. Der Rabe darauf hat mehr Freunde als ich.":`ตะแลงแกงขยันที่สุด อีกาบนนั้นมีเพื่อนมากกว่าข้าอีก`,"Kennt Ihr eine verschlossene Kiste?":`รู้จักหีบที่ล็อกไว้ไหมครับ?`,"Die Kiste da unten gehörte meinem seligen Kunz. Er hat sie vor Jahren mit einem Eisenschlüssel zugesperrt.":`หีบตรงนั้นเป็นของ Kunz ผู้ล่วงลับของข้า เขาล็อกด้วยกุญแจเหล็กเมื่อหลายปีก่อน`,"Den Schlüssel hat er beim Schmied verloren, als er betrunken war. Gero hat ihn bestimmt irgendwo verstaut, in einer Schublade, wo er niemanden stört.":`กุญแจเขาทำหายที่ร้านช่างตีเหล็กตอนเมา Gero ต้องเก็บไว้ที่ไหนสักแห่งแน่ๆ ในลิ้นชักที่ไม่รบกวนใคร`,"Drin liegen Brot und eine Wurst, für schlechte Zeiten. Die Zeiten sind schlecht genug. Nimm sie, wenn du kannst. Er braucht sie nicht mehr.":`ข้างในมีขนมปังกับไส้กรอกไว้ยามยาก ยามนี้ก็ยากพอแล้ว เอาไปเถอะถ้าเอ็งเอาได้ เขาไม่ต้องใช้แล้ว`,"Der arme Bertold. Fuhrmann, immer pünktlich. Nur diesmal zu pünktlich.":`Bertold ผู้น่าสงสาร คนขับรถ ตรงเวลาเสมอ แต่คราวนี้ตรงเวลาเกินไป`,"Keiner deckt ihn zu. Ich würde es tun, aber meine Knie... Wenn du Anstand hast, Junge, hilf ihm. Die Toten merken sich so etwas.":`ไม่มีใครคลุมผ้าให้เขาเลย ข้าก็อยากทำ แต่เข่าข้า... ถ้าเอ็งมีมารยาท หนู ช่วยเขาหน่อย คนตายจำเรื่องแบบนี้ได้`,"Kennt Ihr den Ritter Halvard?":`รู้จักอัศวิน Halvard ไหมครับ?`,"Ser Halvard? Er hat vor Jahren meinem Kunz ein Fass Bier ausgegeben. Seitdem bete ich für ihn.":`Ser Halvard เหรอ? เขาเคยเลี้ยงเบียร์ Kunz ของข้าหนึ่งถังเมื่อหลายปีก่อน ตั้งแต่นั้นข้าก็สวดภาวนาให้เขามาตลอด`,"Wenn er am Waldrand liegt, brauchen ihn die Wölfe nicht. Aber Wasser, Wasser braucht er bestimmt. Brunnenwasser, nicht das Zeug aus der Regentonne.":`ถ้าเขานอนอยู่ที่ชายป่า หมาป่าก็ไม่ต้องการเขาหรอก แต่น้ำ เขาต้องการแน่ๆ น้ำบ่อ ไม่ใช่ของในถังน้ำฝน`,"Geh mit Gott, Kind. Oder wenigstens mit Fieberkraut.":`ไปกับพระเจ้านะ ลูก หรืออย่างน้อยก็ไปกับสมุนไพรแก้ไข้`,"Ich suche das Kraut.":`ผมกำลังหาสมุนไพรอยู่`,Galgen:`ตะแลงแกง`,"Der Galgen von Aschenfurt, jetzt ohne Strick. Er sieht beleidigt aus.":`ตะแลงแกงของ Aschenfurt ตอนนี้ไม่มีเชือกแล้ว ดูเหมือนโกรธอยู่`,"Der Galgen von Aschenfurt. Er hat öfter Arbeit als der Bäcker. Der Strick wippt leicht im Wind.":`ตะแลงแกงของ Aschenfurt ทำงานบ่อยกว่าคนทำขนมปังอีก เชือกแกว่งเบาๆ ตามลม`,"Hier hängt nichts mehr. Außer meiner Laune.":`ที่นี่ไม่มีอะไรแขวนอยู่แล้ว ยกเว้นอารมณ์ฉัน`,"Ich greife nach dem Seil, da stürzt der Rabe herab und hackt nach meiner Hand.":`ฉันเอื้อมไปหยิบเชือก อีกาก็โฉบลงมาจิกมือฉัน`,"„Krah!“ heißt hier ganz klar: mein Seil, mein Galgen.":`“คร้าก!” ตรงนี้แปลชัดเจนว่า เชือกของข้า ตะแลงแกงของข้า`,"Ich sollte ihn irgendwie ablenken. Raben sind bestechlich. Wie alle anderen auch.":`ฉันต้องหาทางเบี่ยงความสนใจมันสักอย่าง อีกาติดสินบนได้ เหมือนทุกคนนั่นแหละ`,"Ein gutes Seil. Der Henker wird es vermissen. Oder auch nicht.":`เชือกดีนะ เพชฌฆาตคงคิดถึงมัน หรือไม่ก็ไม่`,"Ich probiere die Falltür. Sie ist in tadellosem Zustand. Wie beruhigend.":`ฉันลองประตูกลที่พื้น สภาพไร้ที่ติ ช่างน่าอุ่นใจ`,"Ich ziehe am Strick. Er hält. Wie die meisten Dinge in Aschenfurt, nur nicht die Hoffnung.":`ฉันดึงเชือก มันทน เหมือนเรื่องส่วนใหญ่ใน Aschenfurt ยกเว้นความหวัง`,Rabe:`อีกา`,"Der Rabe ist satt und sieht aus, als überlege er, ob er jetzt Mitleid haben sollte. Er entscheidet sich dagegen.":`อีกาอิ่มแล้ว ดูเหมือนกำลังคิดว่าตอนนี้ควรจะสงสารไหม มันตัดสินใจว่าไม่`,"Ein Rabe auf dem Galgen. Er mustert mich so, wie ein Henker einen Hals mustert.":`อีกาบนตะแลงแกง มันจ้องฉันเหมือนเพชฌฆาตจ้องคอ`,"Ich greife nach dem Raben. Er greift nach meinem Finger. Wir einigen uns auf Abstand.":`ฉันเอื้อมไปหาอีกา มันเอื้อมมาหานิ้วฉัน เราตกลงกันว่าเว้นระยะห่าง`,"Krah.":`คร้าก`,"Ich verstehe: Du willst etwas. Brot, vermute ich. Oder etwas Totes.":`เข้าใจแล้ว เจ้าต้องการอะไรสักอย่าง ขนมปังสินะ หรือไม่ก็ของที่ตายแล้ว`,"Krah. Krah.":`คร้าก คร้าก`,"Das war eindeutig ein Ja.":`นั่นคือ “ใช่” ชัดๆ`,"Danke für die Feder.":`ขอบคุณสำหรับขนนะ`,"Das war eindeutig ein „Gern geschehen“. Oder eine Drohung.":`นั่นคือ “ไม่เป็นไร” ชัดๆ หรือไม่ก็คำขู่`,"Er ist satt. Selbst Raben haben ihre Grenzen. Nur Menschen nicht.":`มันอิ่มแล้ว แม้แต่อีกาก็มีขีดจำกัด มีแต่คนที่ไม่มี`,"Das Brot ist hart wie ein Pestkarren-Rad. Der Rabe hackt es genüsslich in Stücke.":`ขนมปังแข็งเหมือนล้อรถเข็นศพ อีกาจิกเป็นชิ้นๆ อย่างเอร็ดอร่อย`,"Er ist satt. Die Ratte kann bleiben, wo sie ist. Ich ebenfalls.":`มันอิ่มแล้ว หนูอยู่ตรงนั้นต่อไปได้ ฉันก็เหมือนกัน`,"Der Rabe stürzt sich auf die tote Ratte wie ein Bürgermeister auf Steuergelder.":`อีกาพุ่งเข้าใส่หนูตายเหมือนนายกเทศมนตรีพุ่งเข้าใส่เงินภาษี`,"Der Rabe wendet den Kopf ab. Er ist offenbar Feinschmecker. Räucherwurst hat er unter seiner Würde, Aas ist er gewohnt.":`อีกาเบือนหน้าหนี ดูท่าเป็นพวกนักชิม ไส้กรอกรมควันต่ำเกินศักดิ์ศรี ซากเน่าถึงจะคุ้นเคย`,"Der Rabe stochert in dem Apfelrest herum und lässt ihn liegen. Würmer hat er selbst genug.":`อีกาจิ้มเศษแอปเปิลแล้วทิ้งไว้ มันมีหนอนกินเองอยู่แล้ว`,Brunnen:`บ่อน้ำ`,"Der Brunnen, jetzt mit Seil an der Kurbel. Fehlt nur noch ein Eimer, der nicht davonläuft.":`บ่อน้ำ ตอนนี้มีเชือกผูกที่ที่หมุนแล้ว ขาดแค่ถังที่ไม่วิ่งหนี`,"Der Dorfbrunnen. Die Kurbel hängt ohne Seil, vom Eimer fehlt jede Spur. Jemand hat gründlich aufgeräumt, oder gründlich geplündert.":`บ่อน้ำประจำหมู่บ้าน ที่หมุนห้อยโหวงไม่มีเชือก ถังก็หายไปไร้ร่องรอย ใครสักคนเก็บกวาดเรียบร้อย หรือไม่ก็ปล้นเรียบร้อย`,"Der Brunnen bleibt, wo er ist. Er hat Wurzeln.":`บ่อน้ำอยู่ที่เดิม มันมีราก`,"Ich wickle das Seil von der Kurbel. Es hat dem Brunnen nichts gebracht, vielleicht bringt es mir etwas.":`ฉันม้วนเชือกออกจากที่หมุน มันไม่ได้ช่วยอะไรบ่อน้ำ บางทีอาจช่วยฉัน`,"Die Kurbel dreht sich leer im Kreis. Ein Brunnen ohne Seil ist nur ein tiefes Loch mit Meinung.":`ที่หมุนหมุนว่างๆ บ่อน้ำไม่มีเชือกก็แค่หลุมลึกที่มีความเห็น`,"Die Kurbel läuft, das Seil sinkt. Ohne Eimer ziehe ich nur nasses Hanfseil nach oben. Ich brauche etwas zum Schöpfen.":`ที่หมุนทำงาน เชือกจมลง ไม่มีถังก็ได้แต่ดึงเชือกกัญชงเปียกๆ ขึ้นมา ฉันต้องมีอะไรไว้ตัก`,"Das Seil hängt schon an der Kurbel.":`เชือกผูกกับที่หมุนอยู่แล้ว`,"Ich knote das Seil fest an die Kurbel. Es hält. Mehr kann man von einem Seil nicht verlangen.":`ฉันผูกเชือกแน่นกับที่หมุน มันทน เชือกจะเรียกร้องมากกว่านี้ก็ไม่ได้`,"Ein Eimer ohne Seil im Brunnen? Der Eimer fällt hinunter, ich sehe ihn nie wieder.":`ถังไม่มีเชือกใส่ในบ่อเหรอ? ถังตกลงไป ฉันไม่ได้เห็นมันอีกเลย`,"Der Eimer taucht ein und kommt voll Wasser zurück. Es ist erstaunlich klar. Für Aschenfurt fast verdächtig.":`ถังจมลงแล้วขึ้นมาเต็มน้ำ ใสอย่างน่าประหลาด สำหรับ Aschenfurt ถือว่าน่าสงสัย`,"Ich schütte das Wasser zurück? Da hätte ich es nie hochholen müssen.":`เทน้ำกลับเหรอ? งั้นฉันก็ไม่ต้องตักขึ้นมาตั้งแต่แรก`,"Eine Flasche in den Brunnen tauchen? Das wäre nur Wasser. Für etwas Besonderes brauche ich das Weihwasserbecken in der Kapelle.":`จุ่มขวดลงบ่อเหรอ? ก็ได้แค่น้ำธรรมดา ถ้าจะเอาของพิเศษ ฉันต้องใช้อ่างน้ำมนต์ในโบสถ์น้อย`,Anschlagbrett:`กระดานประกาศ`,"Das Anschlagbrett. Lauter Verordnungen, die niemand befolgt.":`กระดานประกาศ เต็มไปด้วยกฤษฎีกาที่ไม่มีใครทำตาม`,"„§1: Die Pest ist verboten. Zuwiderhandlungen werden mit dem Tod bestraft.“ Ich bin beeindruckt von der Logik.":`“§ 1: ห้ามเป็นกาฬโรค ผู้ฝ่าฝืนต้องโทษประหาร” ฉันทึ่งในตรรกะนี้`,"„§2: Wer stirbt, zahlt Leichensteuer. Hinterbliebene haften.“":`“§ 2: ผู้ใดตายต้องจ่ายภาษีศพ ผู้รอดชีวิตรับผิดชอบ”`,"„§3: In jeder Sakristei des Reiches sind die Heiligen Zeichen mit Ehrfurcht zu betätigen:“":`“§ 3: ในห้องเก็บเครื่องแต่งกายทุกแห่งของราชอาณาจักร ต้องแตะเครื่องหมายศักดิ์สิทธิ์ด้วยความเคารพ:”`,"„Zuerst der RABE, der wacht. Dann das LAMM, das duldet. Zuletzt das KREUZ, das erlöst.“":`“ก่อนอื่นอีกา ผู้เฝ้ายาม จากนั้นลูกแกะ ผู้อดทน และสุดท้ายกางเขน ผู้ไถ่บาป”`,"Das klingt wichtig. Ich merke mir die Reihenfolge: Rabe, Lamm, Kreuz.":`ฟังดูสำคัญ ฉันจะจำลำดับไว้: อีกา, ลูกแกะ, กางเขน`,"„§4: Wer den Rabenorden begehrt, melde sich bei Feldwebel Brandt. Klinge, Segen und Bürge sind vorzuweisen.“ Und darunter: „§5: Nichts abreißen.“":`“§ 4: ผู้ใดปรารถนาภาคีอีกา จงรายงานตัวต่อจ่า Brandt ต้องแสดงดาบ พร และผู้ค้ำประกัน” และข้างใต้: “§ 5: ห้ามฉีก”`,"Ich lese es noch einmal. Der Paragraf mit den Heiligen Zeichen ist der einzige, der aussieht, als meine er es ernst.":`ฉันอ่านอีกรอบ ข้อที่ว่าด้วยเครื่องหมายศักดิ์สิทธิ์เป็นข้อเดียวที่ดูเหมือนเอาจริง`,"Nicht abreißen. Das steht ausdrücklich da, und es ist der einzige Paragraf, den Brandt tatsächlich durchsetzt.":`ห้ามฉีก เขียนไว้ชัดเจน และเป็นข้อเดียวที่ Brandt บังคับใช้จริง`,Pechfass:`ถังยางสน`,"Ein Fass voll zähem, schwarzem Pech. Man dichtet damit Dächer ab und, wenn man Pech hat, Särge.":`ถังที่เต็มไปด้วยยางสนสีดำเหนียวข้น เอาไว้อุดหลังคา และถ้าซวยก็อุดโลงศพ`,"Mit bloßen Händen? Ich klebe dann bis Pfingsten an Aschenfurt fest. Ich brauche etwas zum Schöpfen.":`ใช้มือเปล่าเหรอ? ฉันจะติดอยู่กับ Aschenfurt ไปจนถึงเทศกาลเพนเทคอสต์ ฉันต้องมีอะไรไว้ตัก`,"Das Pech blubbert zufrieden. Ich fasse es nicht an. Ich habe nur diese eine Hand, die ich noch brauche.":`ยางสนเดือดปุดๆ อย่างพอใจ ฉันไม่แตะมันหรอก ฉันมีมือข้างนี้อยู่ข้างเดียวที่ยังต้องใช้`,"Ich tauche den Stab tief ins Pech. Fertig ist eine Fackel. Sie ist noch nicht angezündet.":`ฉันจุ่มไม้ลงในยางสนลึกๆ เสร็จเป็นคบเพลิง แต่ยังไม่ได้จุดไฟ`,"Mit Feuerstein oder an einer Flamme lässt sie sich entzünden.":`จุดได้ด้วยหินเหล็กไฟหรือจากเปลวไฟ`,"Ich habe schon genug Pech. Mehr ist Verschwendung.":`ฉันมียางสนพอแล้ว เอาอีกก็สิ้นเปลือง`,"Ich schöpfe einen Klumpen Pech mit dem Löffel. Der Löffel ist danach ein Mahnmal.":`ฉันตักยางสนก้อนหนึ่งด้วยช้อน หลังจากนั้นช้อนก็กลายเป็นอนุสรณ์`,"Ich schöpfe Pech in den Zinnbecher und kratze einen Klumpen heraus. Der Becher ist hinüber, aber er hatte ein erfülltes Leben.":`ฉันตักยางสนใส่ถ้วยดีบุกแล้วขูดก้อนหนึ่งออกมา ถ้วยพังแล้ว แต่มันก็มีชีวิตที่สมบูรณ์`,Heuhaufen:`กองฟาง`,"Ein Heuhaufen. In jedem steckt angeblich eine Nadel. In diesem auch noch etwas anderes.":`กองฟาง ว่ากันว่าทุกกองมีเข็มซ่อนอยู่ กองนี้มีของอย่างอื่นด้วย`,"Ich nehme eine Hand voll Heu. Nützlich für Pferde, die es hier nicht mehr gibt.":`ฉันหยิบฟางกำมือหนึ่ง มีประโยชน์สำหรับม้า ซึ่งที่นี่ไม่มีแล้ว`,"Ich wühle noch einmal. Nur Heu, Mäuse und die Erinnerung an bessere Zeiten.":`ฉันควานอีกรอบ มีแต่ฟาง หนู และความทรงจำถึงวันเวลาที่ดีกว่า`,"Ich wühle bis zum Ellbogen... und ziehe einen alten Lederstiefel heraus. Nur einen.":`ฉันควานลึกถึงข้อศอก... แล้วดึงรองเท้าบูทหนังเก่าออกมา แค่ข้างเดียว`,"Wer verliert hier nur einen Stiefel? Und woher kommt der zweite Fuß? Besser, ich frage nicht.":`ใครกันที่ทำรองเท้าหายข้างเดียวแบบนี้? แล้วเท้าอีกข้างมาจากไหน? ไม่ถามดีกว่า`,Leichenkarren:`รถเข็นศพ`,"Der Leichenkarren von Aschenfurt. Darauf liegt Bertold, der Fuhrmann, unter einem fadenscheinigen Tuch. Ein Zipfel von einem Geldbeutel schaut hervor.":`รถเข็นศพของ Aschenfurt บนนั้นมี Bertold คนขับรถนอนอยู่ใต้ผ้าบางๆ ปลายถุงเงินโผล่ออกมา`,Kiste:`หีบ`,"Mit einem Vorhängeschloss gesichert. Ein Eisenschlüssel wäre schön.":`ล็อกไว้ด้วยกุญแจแขวน ถ้ามีกุญแจเหล็กก็คงดี`,"Das Schloss springt auf, als hätte es nur darauf gewartet.":`กุญแจเปิดผึง ราวกับรอแค่นี้อยู่แล้ว`,"Kunz' Kiste. Offen und erstaunlich bescheiden.":`หีบของ Kunz เปิดอยู่ และเรียบง่ายอย่างน่าทึ่ง`,"Eine Kiste mit einem schweren Vorhängeschloss. Wem sie gehört, hat sie nicht mehr abgeholt.":`หีบที่ล็อกด้วยกุญแจแขวนหนักๆ เจ้าของไม่ได้กลับมาเอาอีกเลย`,Regentonne:`ถังน้ำฝน`,"Eine Regentonne mit grünem Wasser. Mückenlarven schwimmen darin wie kleine, unzufriedene Fische.":`ถังน้ำฝนที่มีน้ำสีเขียว ลูกน้ำว่ายอยู่ข้างในเหมือนปลาตัวเล็กๆ ที่ไม่พอใจ`,"Ich schaue hinein. Das Wasser schaut zurück und riecht nach Pestgrube. Das ist nichts zum Trinken, nicht einmal für Wölfe.":`ฉันมองเข้าไป น้ำมองกลับมาและส่งกลิ่นเหมือนหลุมศพหมู่ ดื่มไม่ได้ แม้แต่หมาป่าก็ไม่ดื่ม`,"Ich nehme eine Tonne Wasser mit? Ich bin Totengräber, kein Brunnenbauer.":`ฉันจะแบกน้ำไปทั้งถังเหรอ? ฉันเป็นคนขุดศพ ไม่ใช่คนขุดบ่อ`,"Wasser aus der Regentonne? Das ist grün und lebt. Ich suche etwas Klareres, den Brunnen etwa.":`น้ำจากถังน้ำฝนเหรอ? สีเขียวแถมมีชีวิต ฉันหาของที่ใสกว่านี้ดีกว่า เช่นบ่อน้ำ`,"Ich schütte das gute Wasser in die schlechte Tonne? Das wäre eine Verschwendung wie eine Beichte bei Brandt.":`เทน้ำดีลงถังเน่าเหรอ? สิ้นเปลืองเหมือนไปสารภาพบาปกับ Brandt`,Haustür:`ประตูบ้าน`,"Eine verschlossene Haustür. Dahinter hört man Husten. Ich klopfe lieber nicht.":`ประตูบ้านที่ล็อกอยู่ ข้างในได้ยินเสียงไอ ฉันไม่เคาะดีกว่า`,"Ich klopfe an. Von innen ruft jemand: „Wir sind alle tot! Kommt morgen wieder!“":`ฉันเคาะประตู จากข้างในมีคนตะโกน “พวกเราตายกันหมดแล้ว! พรุ่งนี้ค่อยมาใหม่!”`,"Burg Grauwacht":`ปราสาท Grauwacht`,"Burg Grauwacht, hoch auf ihrem Felsen. Dort wohnt der König, und dort sitzt der Rabenorden. Weit weg, und doch zum Greifen nah.":`ปราสาท Grauwacht ตั้งเด่นบนหน้าผา พระราชาประทับที่นั่น และภาคีอีกาก็ประจำอยู่ที่นั่นด้วย ไกลแสนไกล แต่ก็เหมือนเอื้อมถึง`,"Ich winke der Burg zu. Sie winkt nicht zurück. Burgen sind so.":`ฉันโบกมือให้ปราสาท ปราสาทไม่โบกตอบ ปราสาทก็เป็นแบบนี้แหละ`,Wappenschild:`ป้ายตราประจำ`,"Ein Wirtshausschild mit einem Löwen. Das Wirtshaus ist seit der Pest geschlossen. Der Löwe lächelt tapfer.":`ป้ายโรงเตี๊ยมรูปสิงโต โรงเตี๊ยมปิดมาตั้งแต่กาฬโรค สิงโตยังยิ้มอย่างกล้าหาญ`,Glockenturm:`หอระฆัง`,"Der Glockenturm. Die Glocke läutet nur noch bei Beerdigungen. Also ständig.":`หอระฆัง ระฆังตีเฉพาะตอนงานศพ ก็คือตีตลอดเวลา`,"Eine Scherbe. Sie wird mich nicht reich machen.":`เศษแก้ว มันไม่ทำให้ฉันรวยหรอก`,"Ein krummer Nagel, aus dem Galgengerüst gefallen. Nützlich für Särge, Schlösser und Fallen.":`ตะปูคดๆ หล่นจากโครงตะแลงแกง มีประโยชน์สำหรับโลงศพ กุญแจ และกับดัก`,"Ein abgenagter Knochen. Ob Hund oder Mensch, will ich nicht wissen.":`กระดูกที่ถูกแทะจนเกลี้ยง หมาหรือคนก็ไม่อยากรู้`,"Hilda hat schon ihr Kraut. Mehr Fieber hat der Kleine nicht.":`Hilda ได้สมุนไพรของนางแล้ว เด็กน้อยไม่มีไข้มากกว่านี้แล้ว`,"Fieberkraut! Vom Waldrand! Du hast dich zu den Wölfen getraut, für ein altes Weib?":`สมุนไพรแก้ไข้! จากชายป่า! เอ็งกล้าไปหาหมาป่า เพื่อหญิงแก่คนหนึ่งเนี่ยนะ?`,"Da, nimm das. Meine Brosche. Sie war meiner Mutter. Sie sagte immer: Ein Silber, das glänzt, ist ein Silber, das jemand liebt.":`นี่ เอาไป เข็มกลัดของข้า เป็นของแม่ข้า แม่บอกเสมอว่า เงินที่เป็นประกาย คือเงินที่มีคนรัก`,"Ich bekomme eine silberne Rosenbrosche. Und einen Apfel. Ein guter Tag für einen Totengräber.":`ฉันได้เข็มกลัดเงินรูปกุหลาบ กับแอปเปิลลูกหนึ่ง วันที่ดีสำหรับคนขุดศพ`,"Krah!":`คร้าก!`,"Zum Dank zupft er sich eine schwarze Feder aus und lässt sie vor mir fallen. Eine Rabenfeder. Man sagt, sie bringt Unglück. Oder Tinte.":`เพื่อขอบคุณ มันดึงขนสีดำออกมาหนึ่งเส้นแล้วทิ้งลงตรงหน้าฉัน ขนอีกา เขาว่ามันนำโชคร้าย หรือไม่ก็หมึก`,"Jetzt ist er mit dem Fressen beschäftigt. Das Seil am Galgen gehört mir, wenn ich will.":`ตอนนี้มันกำลังกินอยู่ เชือกที่ตะแลงแกงเป็นของฉัน ถ้าฉันต้องการ`,"Bertold, der Fuhrmann, liegt unter einem fadenscheinigen Tuch. Das Tuch ist verrutscht. Der Geldbeutel an seinem Gürtel lockt.":`Bertold คนขับรถ นอนอยู่ใต้ผ้าบางๆ ผ้าเลื่อนหลุด ถุงเงินที่เข็มขัดของเขายั่วยวน`,"Den Münzbeutel nehmen.":`หยิบถุงเหรียญ`,"Das Tuch zurechtlegen.":`จัดผ้าให้เรียบร้อย`,"Lieber die Finger davonlassen.":`อย่าแตะดีกว่า`,"Ich habe ihn schon genommen. Er brennt in meiner Tasche wie ein schlechtes Gewissen.":`ฉันหยิบมันมาแล้ว มันร้อนอยู่ในกระเป๋าฉันเหมือนความรู้สึกผิด`,"Ich nehme den Beutel. Es ist Grabraub, kein Zweifel. Bertold hätte ihn mir wahrscheinlich geschenkt. Wahrscheinlich.":`ฉันหยิบถุง นี่คือการปล้นศพ ไม่ต้องสงสัย Bertold คงยกให้ฉันอยู่แล้วล่ะ คงนะ`,"In diesem Moment krächzt irgendwo ein Rabe. Ich fühle mich beobachtet. Von allen.":`ตอนนั้นเองที่อีกาตัวหนึ่งร้องก้องอยู่ที่ไหนสักแห่ง ฉันรู้สึกเหมือนมีคนมอง ทุกคนเลย`,"Das Tuch liegt ordentlich. Bertold würde sich bedanken, wenn er könnte.":`ผ้าวางเรียบร้อยดี Bertold คงขอบคุณถ้าเขาทำได้`,"Ich ziehe das Tuch gerade und streiche es glatt. „Ruhe in Frieden, Bertold. Und danke für die Fuhren.“":`ฉันดึงผ้าให้ตรงแล้วลูบให้เรียบ “ขอให้หลับให้สงบ Bertold ขอบคุณสำหรับการขนส่งนะ”`,"Ein Windstoß hebt den Zipfel, als wollte er nicken. Vielleicht war es nur der Wind. Aber ich glaube es nicht.":`ลมกระโชกยกชายผ้าขึ้นราวกับจะพยักหน้า บางทีอาจเป็นแค่ลม แต่ฉันไม่เชื่อ`,"Ich lasse die Finger davon. Manche Dinge sollte man den Toten lassen. Und den Würmern.":`ฉันไม่แตะมัน บางอย่างควรเก็บไว้ให้คนตาย และหนอน`,Lamm:`ลูกแกะ`,Kreuz:`กางเขน`,"Die Platte sitzt fest im Stein.":`แผ่นหินแน่นติดอยู่กับหิน`,RLK:`อ-ล-ก`,"Ein tiefes Mahlen im Stein. Die Platten versinken, die Türen des Schreins schwingen auf und enthüllen warmes, goldenes Licht.":`เสียงบดลึกในหิน แผ่นหินจมลง ประตูศาลเปิดออก เผยแสงสีทองอบอุ่น`,"Rabe, Lamm, Kreuz. Wer einmal die Fenster der Kapelle gesehen hat, vergisst sie nicht.":`อีกา ลูกแกะ กางเขน ใครเคยเห็นหน้าต่างโบสถ์น้อยแล้วไม่มีวันลืม`,"Hinter mir klappert etwas. Das Skelett hat den Kopf gehoben und mustert mich. Dann senkt es ihn wieder, gnädig, vorläufig.":`มีอะไรกระทบกันกราวอยู่ข้างหลังฉัน โครงกระดูกเงยหัวขึ้นมองฉัน แล้วก็ก้มลงอีก อย่างปรานี ชั่วคราว`,"Das Skelett schüttelt langsam den Schädel, als sei es mir peinlich. Es ist mir vermutlich peinlich.":`โครงกระดูกส่ายกะโหลกช้าๆ ราวกับอาย มันคงอายฉันจริงๆ`,"Kaum hebe ich den Knochen, reißt der Wächter die Augen auf. Blaues Feuer in leeren Höhlen.":`ฉันเพิ่งยกกระดูกขึ้น ผู้พิทักษ์ก็ลืมตาโพลง ไฟสีน้ำเงินในเบ้าตาว่างเปล่า`,"WER... STÖRT... MEINE... WACHE?":`ใคร... กล้า... รบกวน... การเฝ้ายามของข้า?`,"Entschuldigung! Ich wollte nur... ich gehe schon!":`ขอโทษครับ! ผมแค่... ผมไปเดี๋ยวนี้แหละ!`,"Der Schild kracht neben mir in den Boden. Ich renne, was meine Beine hergeben, die Treppe hinauf, in Sicherheit.":`โล่ฟาดลงพื้นข้างตัวฉันเสียงสนั่น ฉันวิ่งสุดชีวิตขึ้นบันได ไปที่ปลอดภัย`,"Puh. Der Wächter ist ein schlechter Gastgeber. Ich brauche etwas, um ihn zu besänftigen. Weihwasser, hieß es.":`ฟู่ ผู้พิทักษ์เป็นเจ้าบ้านที่แย่ ฉันต้องมีอะไรสักอย่างมาทำให้มันสงบ น้ำมนต์ เขาว่าอย่างนั้น`,"Die Gruft unter der Kapelle":`ห้องใต้ดินฝังศพใต้โบสถ์น้อย`,"Es ist stockfinster hier unten. Ich höre Tropfen, Ratten und mein Herz. In dieser Reihenfolge.":`มืดสนิทข้างล่างนี้ ฉันได้ยินเสียงหยดน้ำ หนู และหัวใจตัวเอง ตามลำดับนั้น`,"Ohne Licht kann ich hier nichts tun. Ich brauche eine Fackel. Und Feuer.":`ไม่มีแสงก็ทำอะไรไม่ได้ ฉันต้องมีคบเพลิง และไฟ`,"Das Fackellicht kriecht über Sarkophage, Spinnweben und Knochen. Der Raum hat mehr Bewohner, als ich dachte.":`แสงคบเพลิงคืบคลานไปบนโลงหิน ใยแมงมุม และกระดูก ห้องนี้มีผู้อยู่อาศัยมากกว่าที่ฉันคิด`,"In der mittleren Nische steht ein Reliquienschrein. Daneben ein Skelett im Panzer. Es rührt sich nicht. Noch nicht.":`ในซอกกลางมีศาลบรรจุพระธาตุ ข้างๆ มีโครงกระดูกสวมเกราะ มันไม่ขยับ ยังไม่ขยับ`,"Treppe zur Kapelle":`บันไดไปโบสถ์น้อย`,"Die Treppe zurück nach oben, ins Licht. Ein bisschen Optimismus auf dreißig Stufen.":`บันไดกลับขึ้นไปข้างบน สู่แสงสว่าง ความหวังนิดหน่อยในสามสิบขั้น`,"Verschütteter Gang":`ทางเดินถล่ม`,"Ein Seitengang, bis zur Decke verschüttet. Oswin sagt, dahinter liegt die Pestgrube von 1342. Ich bin nicht neugierig.":`ทางเดินข้างที่ถล่มจนเต็มถึงเพดาน Oswin บอกว่าข้างหลังนั่นคือหลุมศพหมู่กาฬโรคปี 1342 ฉันไม่อยากรู้อยากเห็น`,"Ich räume ein paar Steine weg. Dahinter sind noch mehr Steine. Weiter komme ich nicht, zum Glück.":`ฉันเคลียร์หินออกไปสองสามก้อน ข้างหลังมีหินอีก ไปต่อไม่ได้ โชคดีจริง`,Skelettwächter:`ผู้พิทักษ์โครงกระดูก`,"Der Skelettwächter steht stramm, ein Rest Weihwasser glänzt auf dem Schädel. Er sieht beinahe friedlich aus.":`ผู้พิทักษ์โครงกระดูกยืนตรงแน่ว น้ำมนต์ที่เหลือแวววาวบนกะโหลก ดูเกือบสงบ`,"Ein Ritterskelett mit Schild und Schwert, stramm wie Feldwebel Brandt. Die Augenhöhlen folgen mir, hundertprozentig.":`โครงกระดูกอัศวินพร้อมโล่และดาบ ตรงแน่วอย่างจ่า Brandt เบ้าตาตามฉัน ร้อยเปอร์เซ็นต์`,"Ich spreche ihn an. Er rührt sich nicht. Aber ich habe das Gefühl, dass er jedes Wort zählt.":`ฉันพูดกับมัน มันไม่ขยับ แต่ฉันรู้สึกว่ามันนับทุกคำ`,"Weihwasser. Lange nicht gefühlt. Sprich, Sterblicher.":`น้ำมนต์... นานแล้วที่ไม่ได้สัมผัส พูดเถิด มนุษย์`,"Was bewacht Ihr?":`ท่านเฝ้าอะไรอยู่?`,"Die Reliquie des heiligen Corvin. Seit dreihundert Jahren.":`พระธาตุของนักบุญ Corvin มาสามร้อยปีแล้ว`,"Räuber kamen. Ich habe sie verscheucht. Sie ließen den Finger zurück und nahmen die Beine in die Hand.":`พวกโจรมา ข้าไล่ไปแล้ว พวกมันทิ้งนิ้วไว้ แล้วเผ่นแน่บ`,"Wie öffnet man den Schrein?":`เปิดศาลได้ยังไง?`,"Drei Steinplatten. Das Zeichen des Wächters zuerst, dann des Sanften, dann des Erlösers.":`แผ่นหินสามแผ่น เครื่องหมายของผู้พิทักษ์ก่อน แล้วผู้อ่อนโยน แล้วผู้ไถ่บาป`,"Ich bin Skelett. Ich habe das alles auswendig gelernt. Es gibt hier unten sonst nichts zu tun.":`ข้าเป็นโครงกระดูก ข้าท่องมันขึ้นใจหมดแล้ว ข้างล่างนี้ไม่มีอะไรทำอยู่แล้ว`,"Darf ich die Reliquie mitnehmen?":`ผมเอาพระธาตุไปได้ไหม?`,"Für den Pater? Für den Segen? Nimm sie. Ich werde sie vermissen. Und dann kommt jemand anderes, um sie zu stehlen.":`ให้บาทหลวงเหรอ? เพื่อพรเหรอ? เอาไปเลย ฉันจะคิดถึงมันนะ แล้วเดี๋ยวก็มีคนอื่นมาขโมยไปอีก`,"Wie ist es, ein Skelett zu sein?":`เป็นโครงกระดูกรู้สึกยังไงบ้าง?`,"Kühl. Und man spart eine Menge Geld für Essen.":`เย็นดี แล้วก็ประหยัดค่าอาหารไปได้เยอะเลย`,"Geh in Frieden. Und nimm die Treppe leise.":`ไปโดยสงบเถอะ แล้วเดินลงบันไดเบา ๆ ด้วยล่ะ`,"Danke, Wächter.":`ขอบใจนะ ผู้พิทักษ์`,"Ich klopfe dem Skelett auf die Schulter. Es klappert. Vermutlich aus Prinzip.":`ฉันตบไหล่โครงกระดูกเบา ๆ มันกรอบแกรบขึ้นมา คงเป็นไปตามหลักการของมัน`,"Ich nehme es mit? Ein Skelett im Rucksack? Das gäbe unangenehme Fragen.":`จะให้พกไปด้วยเหรอ? โครงกระดูกในเป้เนี่ยนะ? เดี๋ยวก็โดนถามเรื่องไม่น่าสบายใจพอดี`,"Ich habe ihn schon gesegnet. Mehr Wasser gibt es für ihn nicht, sonst wird er noch rostig.":`ฉันอวยพรให้เขาไปแล้ว น้ำมากกว่านี้ไม่มีให้อีก ไม่งั้นเดี๋ยวจะขึ้นสนิมเอา`,"Ich besprenge den Skelettwächter mit Weihwasser. Es zischt leise, ein Seufzen geht durch den Brustpanzer.":`ฉันพรมน้ำมนต์ใส่โครงกระดูกผู้พิทักษ์ มันซ่าเบา ๆ แล้วเสียงถอนหายใจก็ไหลผ่านเกราะอก`,"Die Augenhöhlen erlöschen, das Skelett steht still und friedlich. Es verbeugt sich sogar, ein bisschen.":`เบ้าตาดับลง โครงกระดูกยืนนิ่งอย่างสงบ มันถึงกับโค้งคำนับให้ด้วย นิดหน่อย`,"Jetzt habe ich Ruhe. Und die leere Flasche behalte ich gleich, für das nächste Mal.":`ทีนี้ก็เงียบสงบเสียที ส่วนขวดเปล่านี่ฉันเก็บไว้เลย เผื่อคราวหน้า`,Reliquienschrein:`หีบพระธาตุ`,"Der Reliquienschrein steht offen. Im Inneren brennt ein einsames, goldenes Licht.":`หีบพระธาตุเปิดอยู่ ข้างในมีแสงสีทองดวงเดียวลุกโชนอยู่อย่างเดียวดาย`,"Ein Reliquienschrein aus Stein. Darüber drei Steinplatten mit Zeichen: Rabe, Lamm, Kreuz. Zwei steinerne Türen verbergen das Heiligtum.":`หีบพระธาตุหิน เหนือขึ้นไปมีแผ่นหินสามแผ่นสลักสัญลักษณ์ไว้: อีกา ลูกแกะ กางเขน ประตูหินสองบานซ่อนที่ศักดิ์สิทธิ์ไว้`,"Ich nehme den Schrein nicht mit. Er ist aus Stein. Den Inhalt vielleicht.":`ฉันไม่เอาหีบไปด้วยหรอก มันเป็นหิน ของข้างในอาจจะเอา`,"Der Schrein ist offen. Der Fingerknochen liegt da, golden und bescheiden.":`หีบเปิดอยู่ กระดูกนิ้วนอนอยู่ตรงนั้น สีทองและเจียมเนื้อเจียมตัว`,"Die Türen sind verschlossen. Die Steinplatten darüber sind das Schloss: Drei Zeichen, in der richtigen Reihenfolge.":`ประตูล็อกอยู่ แผ่นหินด้านบนนั่นแหละคือกุญแจ: สามสัญลักษณ์ เรียงให้ถูกลำดับ`,Reliquie:`พระธาตุ`,"Ein Fingerknochen in einem goldenen Schrein. Heilig, behauptet das Etikett. Der Knochen schweigt.":`กระดูกนิ้วในหีบทอง ศักดิ์สิทธิ์ ป้ายบอกอย่างนั้น ส่วนกระดูกไม่พูดอะไร`,"Ich nehme den Fingerknochen. Das Skelett sieht zu und rührt sich nicht. Ich glaube, es lächelt. Schwer zu sagen.":`ฉันหยิบกระดูกนิ้ว โครงกระดูกมองอยู่และไม่ขยับ ฉันว่ามันยิ้มนะ ยากจะบอก`,"Sarkophag des Ritters Tankred":`โลงหินของอัศวินทันเครด`,"Ein steinerner Sarkophag. Die Inschrift: „Ser Tankred, genannt der Stets-zu-spät. Er kam, sah und starb.“":`โลงหิน จารึกว่า: „เซอร์ทันเครด ผู้ได้ฉายาว่าไปช้าเสมอ เขามา เขาเห็น เขาตาย“`,"Ich versuche, den Deckel zu heben. Er bewegt sich keinen Zoll. Tankred will nicht gestört werden. Verständlich.":`ฉันลองยกฝา มันไม่ขยับสักนิ้ว ทันเครดไม่อยากให้ใครรบกวน เข้าใจได้`,"Tankred nehme ich nicht mit.":`ทันเครดฉันไม่เอาไปด้วย`,"Der halbe Rest eines Schwerts. Rost, Staub und ein Hauch Mut. Gero wird es lieben.":`ดาบครึ่งเล่มที่เหลืออยู่ สนิม ฝุ่น และความกล้าอีกนิดหน่อย เกโรต้องชอบแน่`,"Die Hälfte eines Schwerts, auf dem Sarkophag liegen gelassen. Ob es Tankred gehörte? Er braucht es nicht mehr.":`ดาบครึ่งเล่มที่ทิ้งไว้บนโลงหิน จะเป็นของทันเครดหรือเปล่านะ? เขาไม่ได้ใช้แล้วล่ะ`,"Offener Sarkophag":`โลงหินที่เปิดอยู่`,"Ein Sarkophag mit verschobenem Deckel. Jemand hat hier nachgesehen, vor sehr langer Zeit und mit schlechten Manieren.":`โลงหินที่ฝาเลื่อนเปิด มีคนมาแอบดูที่นี่เมื่อนานมากแล้ว แถมมารยาทแย่ด้วย`,"Nur Staub, Knochenreste und das Gefühl, bestohlen zu werden, obwohl man selbst der Dieb ist.":`มีแต่ฝุ่น เศษกระดูก และความรู้สึกเหมือนโดนขโมย ทั้งที่ตัวเองนั่นแหละเป็นขโมย`,"Ich spähe in den Sarkophag. Ein Gerippe in Fetzen von Seide, die Hände auf der Brust gefaltet. Daneben liegt einiges, was sich zu nehmen lohnt, wenn man keine Skrupel hat.":`ฉันชะโงกดูในโลงหิน โครงกระดูกในผ้าไหมขาดวิ่น มือพนมไว้บนอก ข้าง ๆ มีของอยู่หลายอย่างที่น่าหยิบ ถ้าไม่มีความเกรงใจอะไร`,Knochenhaufen:`กองกระดูก`,"Ein Haufen Knochen. Menschlich, tierisch, unentschlossen. Hier hat jemand aufgeräumt, indem er nicht aufgeräumt hat.":`กองกระดูก ทั้งของคน ของสัตว์ และของที่ตัดสินใจไม่ได้ ใครสักคนเก็บกวาดที่นี่ด้วยวิธีไม่เก็บกวาดอะไรเลย`,"Nur Knochen. Nichts, was ich noch brauchen könnte.":`กระดูกล้วน ๆ ไม่มีอะไรที่ฉันจะต้องใช้อีกแล้ว`,Ritterskelett:`โครงกระดูกอัศวิน`,"Ein Ritterskelett, quer über den Boden hingestreckt. Sein Panzer ist verrostet, seine Pläne auch. Er hat es nicht bis zur Treppe geschafft.":`โครงกระดูกอัศวินนอนแผ่ขวางพื้น เกราะสนิมเขรอะ แผนการก็เช่นกัน เขาไปไม่ถึงบันไดด้วยซ้ำ`,"Nichts mehr. Er hat nur noch seine Würde, und die ist auch durchlöchert.":`ไม่เหลืออะไรแล้ว เหลือแค่ศักดิ์ศรี ซึ่งก็พรุนเป็นรูเหมือนกัน`,Steinplatte:`แผ่นหิน`,"Ein aufrecht stehender Grabdeckel mit eingemeißeltem Ritter. Er sieht aus, als wolle er jemandem etwas sagen: „Lass mich raus“ oder „Lass mich in Ruhe“.":`ฝาหลุมศพตั้งตรงสลักรูปอัศวิน ดูเหมือนอยากจะบอกอะไรใครสักคน: „ปล่อยฉันออกไป“ หรือ „อย่ามายุ่งกับฉัน“`,"Die Steinplatte wiegt mehr als eine Kuh. Ich bin kein Kuhfreund.":`แผ่นหินหนักกว่าวัวอีก ฉันไม่ได้ชอบวัวสักหน่อย`,Tierskelett:`โครงกระดูกสัตว์`,"Das Skelett eines Hundes, vielleicht eines Wolfs. Er kam herunter, um zu fressen, und blieb, um zu verhungern. Eine Lehre, die ich gern teile.":`โครงกระดูกหมา หรืออาจเป็นหมาป่า ลงมาเพื่อหากิน แล้วอยู่เพื่ออดตาย เป็นบทเรียนที่ฉันยินดีแบ่งปัน`,Fackelhalter:`ที่ยึดคบเพลิง`,"Meine Fackel steckt im Halter und brennt ruhig. So habe ich beide Hände frei.":`คบเพลิงของฉันเสียบอยู่ในที่ยึด ลุกสงบ ๆ ทำให้มือว่างทั้งสองข้าง`,"Ein eiserner Fackelhalter an der Wand. Er ist leer und wartet auf Licht.":`ที่ยึดคบเพลิงเหล็กติดผนัง ว่างเปล่า รอแสงสว่างอยู่`,"Der Halter sitzt fest in der Wand. Ich lasse ihn dort. Er hat Wichtigeres zu tun.":`ที่ยึดติดแน่นกับผนัง ฉันปล่อยไว้ตรงนั้นแหละ มันมีธุระสำคัญกว่าต้องทำ`,"Ich nehme die brennende Fackel wieder aus dem Halter.":`ฉันดึงคบเพลิงที่ลุกอยู่ออกจากที่ยึดอีกครั้ง`,"Ich nehme die Fackel nicht heraus. Hier hängt sie gut.":`ฉันไม่ดึงคบเพลิงออก แขวนอยู่ตรงนี้ก็ดีแล้ว`,"Der Halter ist leer. Eine brennende Fackel würde ihn schmücken.":`ที่ยึดว่างอยู่ คบเพลิงที่ลุกไหม้คงช่วยประดับให้สวยขึ้น`,"Die Fackel ist nicht angezündet. In den Halter gesteckt bringt sie niemandem etwas.":`คบเพลิงยังไม่ได้จุด เสียบลงที่ยึดไปก็ไม่ช่วยใครเลย`,"Ich stecke die brennende Fackel in den Halter. Sie leuchtet stetig und brennt nicht ab, solange sie dort bleibt. Immerhin etwas.":`ฉันเสียบคบเพลิงที่ลุกอยู่ลงในที่ยึด มันส่องสว่างนิ่ง ๆ และไม่มอดหมดตราบใดที่อยู่ตรงนั้น อย่างน้อยก็ได้อะไรสักอย่าง`,Spinnweben:`ใยแมงมุม`,"Dichte Spinnweben, groß wie Fischernetze. Wer hier haust, hat hundert Augen und keinen Hunger. Hoffentlich.":`ใยแมงมุมหนาทึบ ใหญ่เท่าอวนจับปลา ใครอาศัยอยู่ที่นี่คงมีตาเป็นร้อยและไม่หิวเลย หวังว่านะ`,Lichtschacht:`ช่องแสง`,"Ein schmaler Schacht in der Decke, durch den ein bisschen Mondlicht fällt. Ein Gruß von oben, wo die Lebenden sind.":`ช่องแคบ ๆ ที่เพดาน มีแสงจันทร์ลอดลงมานิดหน่อย คำทักทายจากข้างบน ที่ซึ่งคนเป็นอยู่`,"Eine Rabenkralle. Vermutlich vom letzten Raben, der sich hierher verirrt hat. Ich frage nicht.":`กรงเล็บอีกา คงมาจากอีกาตัวสุดท้ายที่หลงเข้ามาที่นี่ ฉันไม่ถามหรอก`,"den Raben":`อีกา`,"das Lamm":`ลูกแกะ`,"das Kreuz":`กางเขน`,"Die Runenknöpfe sind eingesunken. Der Schrank ist offen. Mehr gibt es hier nicht zu schieben.":`ปุ่มรูนจมลงไปแล้ว ตู้เปิดแล้ว ไม่มีอะไรให้ดันอีก`,"Rabe, Lamm, Kreuz. Ich hätte es auch von den Glasfenstern ablesen können. Das hätte ich merken müssen.":`อีกา ลูกแกะ กางเขน ฉันอ่านจากหน้าต่างกระจกสีก็ได้ น่าจะสังเกตเองให้ได้`,"Das Schloss bestraft Fehler mit einer Ohrfeige. Und mit Wiederholung. Ich lese lieber noch einmal die Verordnungen nach.":`กุญแจนี้ลงโทษความผิดพลาดด้วยการตบหน้า แล้วให้ทำใหม่ ฉันขอกลับไปอ่านข้อบังคับอีกรอบดีกว่า`,Lamms:`ลูกแกะ`,Raben:`อีกา`,Kreuzes:`กางเขน`,"Der Knopf sitzt fest im Holz. Man kann ihn drücken, nicht herausreißen.":`ปุ่มติดแน่นในไม้ กดได้ แต่ดึงออกไม่ได้`,"Der Fingerknochen des heiligen Corvin! Zurück in Gottes Haus! Ich dachte, die Räuber hätten ihn längst in Suppe gekocht.":`กระดูกนิ้วของนักบุญคอร์วิน! กลับมาอยู่ในบ้านของพระเจ้าแล้ว! นึกว่าพวกโจรเอาไปต้มซุปกินนานแล้วซะอีก`,"Er lag in der Gruft, im Reliquienschrein, bewacht von einem Skelett.":`มันอยู่ในห้องใต้ดิน ในหีบพระธาตุ มีโครงกระดูกเฝ้าอยู่`,"Bewacht! Natürlich. Ich hätte selbst gehen sollen, aber meine Knie... meine Nerven... Meine Knie und meine Nerven.":`มีคนเฝ้า! แน่นอนอยู่แล้ว ข้าควรไปเองแท้ ๆ แต่เข่าข้า... ประสาทข้า... เข่ากับประสาทของข้านี่แหละ`,"Du hast mehr Mut als der halbe Orden. Warte, ich siegle dir den Segen.":`เจ้ากล้ากว่าครึ่งหนึ่งของคณะเสียอีก รอก่อน ข้าจะประทับตราพรให้`,"Pater Anselm kramt in seinem Gewand, entrollt Pergament, kritzelt, taucht Wachs ein und drückt sein Siegel hinein.":`บาทหลวงอันเซล์มควานหาในจีวร คลี่กระดาษหนัง เขียนขีดเขียน จุ่มขี้ผึ้ง แล้วกดตราประทับลงไป`,"Hier. Der Segen der Kirche, schwarz auf weiß und rot gesiegelt. Und der Rest vom Wachs. Für Kerzen. Oder Ohren.":`นี่ พรของคริสตจักร ตัวอักษรสีดำบนกระดาษขาว ประทับตราแดง แล้วก็ขี้ผึ้งที่เหลือ เอาไปทำเทียน หรือจะอุดหูก็ได้`,"Geh mit Gott, Bran. Und wenn Gott gerade nicht erreichbar ist, geh trotzdem.":`ไปกับพระเจ้าเถอะ แบรน แล้วถ้าตอนนี้พระเจ้าติดต่อไม่ได้ ก็ไปอยู่ดี`,"Ausgehobenes Grab":`หลุมศพที่ขุดแล้ว`,Grabstelle:`ที่ฝังศพ`,"Ein sauber ausgehobenes Grab. Ich bin stolz darauf. Das ist vermutlich ungesund.":`หลุมศพที่ขุดไว้เรียบร้อย ฉันภูมิใจกับมันนะ ซึ่งคงไม่ค่อยดีต่อสุขภาพจิต`,"Eine Bodenplatte, die Oswin schon gelockert hat. Darunter wartet Erde, die niemand mehr in den überfüllten Friedhof bringen kann.":`แผ่นพื้นที่ออสวินงัดไว้หลวมแล้ว ข้างใต้มีดินรออยู่ ดินที่ไม่มีใครเอาเข้าไปในสุสานที่แน่นเอี๊ยดได้อีกแล้ว`,"Ohne Schaufel kann ich hier nur mit den Fingern graben. Meine Schaufel liegt anderswo.":`ไม่มีพลั่วก็ขุดได้แค่ด้วยนิ้ว พลั่วของฉันอยู่ที่อื่น`,"Mit bloßen Händen? Und ohne Auftrag? Oswin weiß mehr darüber.":`ด้วยมือเปล่า? แล้วไม่มีงานจ้างด้วย? เรื่องนี้ออสวินรู้ดีกว่า`,"Das Grab nehme ich nicht mit. Es gehört schon jemandem, nur weiß er es noch nicht.":`หลุมนี้ฉันไม่เอาไปด้วยหรอก มันเป็นของใครบางคนอยู่แล้ว แค่เขายังไม่รู้ตัว`,"Ich kann nicht einfach in einer Kapelle Löcher graben. Oswin weiß mehr darüber.":`จะมาขุดหลุมในโบสถ์น้อยตามใจชอบไม่ได้ เรื่องนี้ออสวินรู้ดีกว่า`,"Das Grab ist fertig. Es wartet auf seinen Gast.":`หลุมเสร็จแล้ว รอแขกของมันอยู่`,"Das dritte Grab ist fertig. Ich lehne mich auf die Schaufel wie ein Meister.":`หลุมที่สามเสร็จแล้ว ฉันเท้าพลั่วยืนเหมือนช่างฝีมือชั้นครู`,"Gut gemacht, Junge. Komm her, ich bezahle dich.":`ทำได้ดีนี่ เจ้าหนู มานี่ เดี๋ยวจ่ายค่าจ้างให้`,"Kapelle von Aschenfurt":`โบสถ์น้อยแห่งอาเชนฟูร์ท`,"Zum Dorfplatz":`ไปที่ลานหมู่บ้าน`,"Das schwere Eichenportal. Draußen warten Pest, Wind und Brandt. Drinnen nur Pest und Anselm.":`ประตูไม้โอ๊กบานหนัก ข้างนอกมีกาฬโรค ลม และบรานดท์รออยู่ ข้างในมีแค่กาฬโรคกับอันเซล์ม`,Friedhofstür:`ประตูสุสาน`,"Die Tür zum Friedhof, mit einem Balken von innen verriegelt. Draußen ist kein Platz mehr für Tote, sagt Oswin. Drinnen schon.":`ประตูไปสุสาน ขัดด้วยคานจากข้างใน ออสวินบอกว่าข้างนอกไม่มีที่ให้คนตายแล้ว ข้างในยังมี`,"Verriegelt. Oswin sagt, Pestgefahr. Und kein Platz. Der Friedhof ist so voll, dass selbst die Maulwürfe auswandern.":`ล็อกอยู่ ออสวินบอกว่าอันตรายจากกาฬโรค แล้วก็ไม่มีที่ สุสานแน่นจนตัวตุ่นยังอพยพหนี`,"Pater Anselm":`บาทหลวงอันเซล์ม`,"Pater Anselm, hager, mit einem Schal vor dem Gesicht gegen die Pest. Er sieht aus wie ein Gebet auf zwei Beinen. Einem sehr müden Gebet.":`บาทหลวงอันเซล์ม ผอมโซ ผ้าพันคอปิดหน้ากันกาฬโรค ดูเหมือนบทสวดที่เดินได้สองขา บทสวดที่เหนื่อยมากเลย`,"„Almosen? Wirf sie in den Opferstock, mein Sohn. Der Himmel führt Buch. Ich auch.“":`„ทำทาน? หย่อนลงตู้บริจาคเถอะลูกข้า สวรรค์จดบัญชีไว้ ข้าก็จดเหมือนกัน“`,"„Das ist Weihwasser! Aus meinem Becken? Wunderbar! Nein, behalte es, du wirst es noch brauchen.“":`„นี่น้ำมนต์! จากอ่างของข้าเหรอ? วิเศษจริง! ไม่ ๆ เก็บไว้เถอะ เจ้าจะได้ใช้อีก“`,"Ah, eine lebende Seele! Die erste seit Tagen, die nicht beichten will, weil es zu spät ist.":`อา วิญญาณที่ยังมีชีวิต! คนแรกในรอบหลายวันที่ไม่มาขอสารภาพบาปเพราะสายเกินไปแล้ว`,"Pater Anselm, ich bin Bran, Oswins Lehrling.":`บาทหลวงอันเซล์ม ผมแบรน ลูกมือของออสวินครับ`,"Der Totengräberjunge. Ja. Willkommen in der Kapelle von Aschenfurt. Bitte nicht atmen. Oder atmen, aber leise.":`เด็กขุดหลุมศพ ใช่ ยินดีต้อนรับสู่โบสถ์น้อยแห่งอาเชนฟูร์ท ห้ามหายใจนะ หรือจะหายใจก็ได้ แต่เบา ๆ`,"Ich brauche den Segen der Kirche.":`ผมต้องการพรจากคริสตจักรครับ`,"Den Segen für den Rabenorden. Natürlich. Der Orden ist streng, aber gerecht. Und ich bin geizig, aber großzügig.":`พรสำหรับคณะอีกา แน่นอน คณะนั้นเข้มงวดแต่ยุติธรรม ส่วนข้าก็ขี้เหนียวแต่ใจกว้าง`,"Ich siegle dir den Brief, wenn du mir etwas zurückbringst: den Fingerknochen des heiligen Corvin.":`ข้าจะประทับตราจดหมายให้ ถ้าเจ้านำของกลับมาให้ข้า: กระดูกนิ้วของนักบุญคอร์วิน`,"Er lag im Reliquienschrein in der Gruft unter der Falltür. Räuber haben ihn gestohlen, aber sie fanden die Gruft nicht wieder und ließen ihn zurück. Eine lange Geschichte. Ich habe sie nie ganz geglaubt.":`มันอยู่ในหีบพระธาตุในห้องใต้ดินใต้ประตูกลบนพื้น พวกโจรขโมยไป แต่หาห้องใต้ดินไม่เจออีกเลยเลยทิ้งไว้ เป็นเรื่องยาว ข้าไม่เคยเชื่อทั้งหมดหรอก`,"Wie komme ich in die Gruft?":`จะเข้าห้องใต้ดินได้ยังไงครับ?`,"Die Falltür ist verschlossen. Den Schlüssel bewahre ich im Sakristeischrank auf, dem mit dem Runenschloss.":`ประตูกลล็อกอยู่ กุญแจข้าเก็บไว้ในตู้ห้องเก็บเครื่องบูชา ตู้ที่มีกุญแจรูน`,"Die Zeichen müssen in der richtigen Reihenfolge gedrückt werden. Ich habe sie vergessen. Ich weiß nur, dass es auf einem Anschlag steht. Auf dem Dorfplatz.":`ต้องกดสัญลักษณ์ให้ถูกลำดับ ข้าลืมไปแล้ว รู้แค่ว่ามันเขียนอยู่บนประกาศ ที่ลานหมู่บ้าน`,"In der Gruft ist es dunkel. Nimm Licht mit. Und denk an den Wächter. Er mag keine Diebe. Weihwasser, mein Sohn, Weihwasser besänftigt ihn.":`ในห้องใต้ดินมืด เอาแสงไปด้วย แล้วคิดถึงผู้พิทักษ์ด้วย เขาไม่ชอบโจร น้ำมนต์ลูกข้า น้ำมนต์ช่วยให้เขาใจเย็น`,"Das Weihwasserbecken ist leer.":`อ่างน้ำมนต์ว่างเปล่า`,"Seit der letzten Messe. Kein Wasser mehr, die Brunnen sind verseucht. Der auf dem Dorfplatz ist der einzige, der noch klar ist, aber ihm fehlt Seil und Eimer.":`ตั้งแต่พิธีมิสซาครั้งสุดท้าย น้ำไม่มีเหลือ บ่อน้ำเป็นพิษหมด บ่อที่ลานหมู่บ้านเป็นบ่อเดียวที่ยังใส แต่ขาดทั้งเชือกทั้งถัง`,"Gieß das Wasser einfach hinein, ich segne es dann mit meinem Glauben. Das reicht für die Flasche. Eine leere liegt in der Sakristei.":`เทน้ำลงไปเลย เดี๋ยวข้าอวยพรด้วยศรัทธาของข้า แค่นั้นก็พอสำหรับขวดแล้ว ขวดเปล่ามีอยู่ในห้องเก็บเครื่องบูชา`,"Was wisst Ihr über Ser Halvard?":`ท่านรู้อะไรเกี่ยวกับเซอร์ฮัลวาร์ดบ้างครับ?`,"Ein guter Mann. Er beichtete oft und sündigte selten. Sehr verdächtig. Wenn er am Waldrand liegt, schicke ich ihm meinen Segen. Mehr kann ich nicht tun, ich habe Knie.":`คนดี สารภาพบาปบ่อยแต่ทำบาปน้อย น่าสงสัยมาก ถ้าเขานอนอยู่ที่ชายป่า ข้าก็ส่งพรไปให้ มากกว่านี้ทำไม่ได้ ข้ามีหัวเข่า`,"Was ist mit der Pest?":`แล้วกาฬโรคล่ะครับ?`,"Die Pest ist Gottes Prüfung. Ich bin durchgefallen, aber ich bleibe sitzen.":`กาฬโรคคือการทดสอบจากพระเจ้า ข้าสอบตก แต่ข้ายังนั่งเรียนต่อ`,"Ich trage den Schal, weil ich gelesen habe, dass er hilft. Gelesen habe ich es von einem Mann, der danach gestorben ist.":`ข้าพันผ้าพันคอเพราะอ่านเจอว่ามันช่วยได้ อ่านจากชายคนหนึ่งที่ตายไปหลังจากนั้น`,"Was ist mit dem Sakristeischrank?":`แล้วตู้ในห้องเก็บเครื่องบูชาล่ะครับ?`,"Mein Küster, Gott hab ihn selig, hat das Schloss gebaut. Drei Runen: Rabe, Lamm, Kreuz. In welcher Reihenfolge? Fragt mich nicht.":`เสมียนวัดของข้า ขอพระเจ้าทรงโปรดเขา เป็นคนสร้างกุญแจนั่น รูนสามอัน: อีกา ลูกแกะ กางเขน ลำดับไหนน่ะรึ? อย่าถามข้า`,"Es steht an den Fenstern, wenn man genau hinsieht, und auf den Verordnungen im Dorf, wenn man lesen kann.":`มันอยู่ที่หน้าต่าง ถ้ามองดี ๆ และอยู่ในประกาศของหมู่บ้าน ถ้าอ่านออก`,"Was macht ein Pater, wenn keiner mehr betet?":`บาทหลวงทำอะไรเมื่อไม่มีใครสวดมนต์แล้วล่ะครับ?`,"Er betet selbst. Lauter. Damit es auffällt.":`ก็สวดเอง ดังขึ้น จะได้มีคนสังเกต`,"Und er sammelt Kerzenstummel. Eines Tages, Bran, werde ich eine ganze Kerze daraus bauen.":`แล้วก็สะสมเศษเทียน สักวันหนึ่ง แบรน ข้าจะทำเทียนเล่มเต็มจากมัน`,"Der Herr behüte dich. Falls er gerade Zeit hat.":`ขอพระเจ้าคุ้มครองเจ้า ถ้าท่านมีเวลาว่างนะ`,"Der Herr sei mit Euch.":`พระเจ้าสถิตกับท่านเถิดครับ`,"Totengräber Oswin":`คนขุดหลุมศพออสวิน`,"Oswin, mein Meister. Er hat mehr Menschen begraben als jeder andere in der Grafschaft und ist trotzdem fröhlich. Er sagt, das liege an der Gesellschaft.":`ออสวิน อาจารย์ของฉัน เขาฝังคนมามากกว่าใครในแคว้น แต่ก็ยังร่าเริง เขาบอกว่าเป็นเพราะเพื่อนร่วมงาน`,"Oswin hebt die Hand. „Behalte dein Silber, Junge. Ich nehme von Lehrlingen nichts. Nur Arbeit.“":`ออสวินยกมือขึ้น „เก็บเงินเจ้าไว้เถอะหนู ข้าไม่รับอะไรจากลูกศิษย์ นอกจากงาน“`,"Bran! Mein Lehrling, mein Sorgenkind. Was treibt dich in die Kapelle, außer dem Segen, den du nicht brauchst?":`แบรน! ลูกศิษย์ข้า ลูกปัญหาของข้า อะไรพาเจ้ามาโบสถ์น้อย นอกจากพรที่เจ้าไม่ต้องการ?`,"Ich will Ritter werden, Meister.":`ผมอยากเป็นอัศวินครับ อาจารย์`,"Ritter. Hm. Als Totengräber hast du wenigstens am Ende noch Arbeit. Als Ritter bist du die Arbeit.":`อัศวิน หึ เป็นคนขุดหลุมศพอย่างน้อยตอนจบก็ยังมีงานทำ เป็นอัศวินน่ะ เจ้านั่นแหละคืองาน`,"Braucht Ihr Hilfe beim Graben?":`ให้ผมช่วยขุดไหมครับ?`,"Und wie! Der Friedhof ist voll. Also graben wir in der Kapelle, unter den Bodenplatten. Drei Gräber, Junge, bis zum Abend.":`ต้องการมาก! สุสานเต็มแล้ว เราเลยขุดในโบสถ์น้อย ใต้แผ่นพื้น สามหลุมหนู ภายในเย็นนี้`,"Hier, meine Reserveschaufel. Zwei Silber für dich, wenn alle drei fertig sind. Und die Ehre, Gottes Boden zu öffnen.":`นี่ พลั่วสำรองของข้า สองเหรียญเงินให้เจ้า เมื่อทำครบทั้งสามหลุม แล้วก็เกียรติที่ได้เปิดแผ่นดินของพระเจ้า`,"Oswin drückt mir die Schaufel in die Hand. Sie ist warm von seiner Hand und kalt von der Arbeit.":`ออสวินยัดพลั่วใส่มือฉัน มันอุ่นจากมือเขา และเย็นจากงาน`,"Drei Gräber, sauber und tief. Du hast Talent, Junge. Das ist keine Schande, auch wenn es sich so anfühlt. Hier, zwei Silber.":`สามหลุม เรียบร้อยและลึก เจ้ามีพรสวรรค์นะหนู ไม่ใช่เรื่องน่าอาย ถึงจะรู้สึกอย่างนั้นก็เถอะ นี่ สองเหรียญเงิน`,"Zwei Silbermünzen. Für einen Totengräberlehrling ist das ein Vermögen. Und ehrlich verdient.":`เหรียญเงินสองเหรียญ สำหรับลูกศิษย์คนขุดหลุมศพนี่คือเงินก้อนโต แถมหามาอย่างสุจริตด้วย`,"Was wisst Ihr über die Gruft?":`ท่านรู้อะไรเกี่ยวกับห้องใต้ดินบ้างครับ?`,"Unter der Falltür? Die alten Ritter liegen da. Und ein Wächter, der sich nie hingelegt hat.":`ใต้ประตูกลน่ะรึ? อัศวินเก่า ๆ นอนอยู่ตรงนั้น กับผู้พิทักษ์ที่ไม่เคยล้มตัวลงนอน`,"Ein Skelett im Panzer, steht stramm wie Brandt. Er wacht über den Reliquienschrein. Wenn du etwas nimmst, ohne ihn zu besänftigen, wird er unfreundlich.":`โครงกระดูกในเกราะ ยืนตัวตรงเหมือนบรานดท์ เฝ้าหีบพระธาตุอยู่ ถ้าเจ้าหยิบอะไรโดยไม่ทำให้เขาใจเย็น เขาจะไม่เป็นมิตรนะ`,"Ich sage immer: Weihwasser auf den Schädel und leise hinaus. Hat bei Brandt auch funktioniert.":`ข้าพูดเสมอ: น้ำมนต์ใส่กะโหลก แล้วเดินออกเงียบ ๆ ได้ผลกับบรานดท์เหมือนกัน`,"Habt Ihr eine Fackel für mich?":`ท่านมีคบเพลิงให้ผมไหมครับ?`,"Eine Fackel? Nein, aber ich weiß, wie man eine macht. Einen Stab, Pech vom Dorfplatz, und Feuer. Am Waldrand liegt genug Holz.":`คบเพลิงน่ะรึ? ไม่มี แต่ข้ารู้วิธีทำ ไม้ท่อนหนึ่ง ยางสนจากลานหมู่บ้าน แล้วก็ไฟ ที่ชายป่ามีไม้เยอะแยะ`,"Und denk dran: Pech brennt nicht ewig. In der Gruft hast du Licht für ein paar Handgriffe. Dann musst du wieder hoch und neu anzünden.":`แล้วจำไว้: ยางสนไม่ไหม้ตลอดไป ในห้องใต้ดินเจ้าจะมีแสงพอทำอะไรได้ไม่กี่อย่าง แล้วต้องกลับขึ้นมาจุดใหม่`,"Warum seid Ihr noch hier in Aschenfurt?":`ทำไมท่านยังอยู่ที่อาเชนฟูร์ทล่ะครับ?`,"Weil die Toten bleiben. Und wo Tote sind, braucht man Totengräber. Es ist das einzige Geschäft ohne Konkurrenz und ohne Reklamationen.":`เพราะคนตายไม่ไปไหน และที่ไหนมีคนตายก็ต้องมีคนขุดหลุมศพ เป็นธุรกิจเดียวที่ไม่มีคู่แข่งและไม่มีใครมาร้องเรียน`,"Was haltet Ihr vom Rabenorden?":`ท่านคิดยังไงกับคณะอีกาครับ?`,"Ehrenwerte Männer. Sie sind immer bestens beritten, wenn sie vor der Pest fliehen. Aber es gibt auch gute darunter, wie Halvard. Der hat mir mal ein Grab bezahlt, für einen Fremden.":`ผู้ทรงเกียรติ ขี่ม้าดีที่สุดเสมอเวลาหนีกาฬโรค แต่ก็มีคนดีอยู่บ้าง อย่างฮัลวาร์ด เขาเคยออกค่าหลุมศพให้คนแปลกหน้าให้ข้าครั้งหนึ่ง`,"Pass auf deinen Rücken auf. Es gibt nur einen.":`ระวังหลังไว้ด้วย มีอันเดียวเท่านั้น`,"Bis später, Meister.":`ไว้เจอกันนะครับ อาจารย์`,Altar:`แท่นบูชา`,"Der Altar, kalt und schmucklos. Der Kelch ist leer, die Kerzen auch. Es fehlt der Glaube. Und der Wein.":`แท่นบูชา เย็นเฉียบและเปล่าเปลือย ถ้วยว่างเปล่า เทียนก็ด้วย ขาดศรัทธา แล้วก็ไวน์`,"Ich berühre den Altar. Er ist so kalt wie der Papst in Rom. Ich lasse ihn in Ruhe.":`ฉันแตะแท่นบูชา เย็นเหมือนพระสันตปาปาที่โรม ฉันปล่อยมันไว้ตามเดิม`,"Vom Altar etwas nehmen? In dieser Kapelle? Nicht mit meinem Karma.":`จะหยิบอะไรจากแท่นบูชา? ในโบสถ์น้อยนี้เนี่ยนะ? กรรมของฉันไม่ไหวหรอก`,"Fenster: Rabe":`หน้าต่าง: อีกา`,"Das Glasfenster zeigt einen schwarzen Raben mit klugem Blick. Er ist der erste im Reigen der drei. Der Wächter.":`หน้าต่างกระจกสีแสดงอีกาดำตาฉลาด เป็นตัวแรกในสามตัวที่เรียงกัน ผู้พิทักษ์`,"Fenster: Lamm":`หน้าต่าง: ลูกแกะ`,"Das Glasfenster zeigt ein weißes Lamm mit Heiligenschein. In der Mitte, sanft und geduldig.":`หน้าต่างกระจกสีแสดงลูกแกะขาวมีรัศมีเหนือหัว อยู่ตรงกลาง อ่อนโยนและอดทน`,"Fenster: Kreuz":`หน้าต่าง: กางเขน`,"Das Glasfenster zeigt ein goldenes Kreuz, das über allem leuchtet. Das Letzte der drei Zeichen, der Abschluss.":`หน้าต่างกระจกสีแสดงกางเขนทองที่ส่องสว่างเหนือทุกสิ่ง สัญลักษณ์สุดท้ายของสาม จุดจบ`,Banner:`ธง`,"Ein verblichenes blaues Banner mit einer Lilie. Der Rand ist ausgefranst, die Hoffnung auch.":`ธงสีน้ำเงินซีดจางลายดอกลิลลี่ ขอบลุ่ยแล้ว ความหวังก็ด้วย`,"Ein zweites Banner, ebenso zerschlissen. Motten haben Schlimmeres angerichtet als die Pest.":`ธงผืนที่สอง ขาดวิ่นไม่แพ้กัน แมลงเม่าทำร้ายหนักกว่ากาฬโรคอีก`,Wandleuchter:`เชิงเทียนติดผนัง`,"Ein Wandleuchter mit drei Kerzen. Sie flackern tapfer. Eine der drei ist bereits ein Märtyrer.":`เชิงเทียนติดผนังสามเล่ม ริบหรี่อย่างกล้าหาญ มีอยู่เล่มหนึ่งที่เป็นผู้พลีชีพไปแล้ว`,Sakristeischrank:`ตู้ห้องเก็บเครื่องบูชา`,"Der Sakristeischrank, offen. Das Runenschloss ist ein Häufchen Eisen. Drei Fächer wollen durchsucht werden.":`ตู้ห้องเก็บเครื่องบูชา เปิดอยู่ กุญแจรูนเหลือแค่กองเหล็ก ช่องสามช่องรอให้ค้น`,"Ein hoher Sakristeischrank mit drei Runenknöpfen, Rabe, Lamm und Kreuz. Das Schloss reagiert nur auf die richtige Reihenfolge.":`ตู้ห้องเก็บเครื่องบูชาสูงใหญ่ มีปุ่มรูนสามปุ่ม อีกา ลูกแกะ และกางเขน กุญแจตอบสนองเฉพาะลำดับที่ถูกเท่านั้น`,"Obere Schublade":`ลิ้นชักบน`,"Die Schublade rührt sich nicht. Das Runenschloss hält sie fest.":`ลิ้นชักไม่ขยับ กุญแจรูนล็อกไว้`,"Untere Schublade":`ลิ้นชักล่าง`,"Auch diese Schublade bleibt zu. Das Runenschloss.":`ลิ้นชักนี้ก็ยังปิดอยู่ กุญแจรูน`,Fach:`ช่อง`,"Das Fach ist verschlossen. Das Runenschloss.":`ช่องล็อกอยู่ กุญแจรูน`,"Das Fach hinter der Tür. Es duftet nach altem Weihrauch.":`ช่องหลังประตู มีกลิ่นธูปเก่า ๆ`,Weihwasserbecken:`อ่างน้ำมนต์`,"Das Weihwasserbecken, gefüllt mit klarem Wasser. Es schimmert leicht. Ein Wunder, oder der Mond.":`อ่างน้ำมนต์ เต็มไปด้วยน้ำใส เปล่งประกายเบา ๆ ปาฏิหาริย์ หรือไม่ก็แสงจันทร์`,"Das Weihwasserbecken, trocken wie Anselms Humor. Am Grund klebt ein Rest Moos.":`อ่างน้ำมนต์ แห้งเหมือนอารมณ์ขันของอันเซล์ม ที่ก้นมีมอสติดอยู่นิดหน่อย`,"Das Becken ist aus Stein und schwerer als meine Sünden.":`อ่างทำจากหิน และหนักกว่าบาปของฉัน`,"Ich tauche zwei Finger ins Wasser und bekreuzige mich. Es tut nicht weh. Das ist ein gutes Zeichen.":`ฉันจุ่มสองนิ้วลงน้ำแล้วทำสัญลักษณ์กางเขน ไม่เจ็บ ถือเป็นสัญญาณที่ดี`,"Ich greife hinein. Nur Staub. Ohne Wasser wird das nichts mit dem Segen.":`ฉันล้วงลงไป มีแต่ฝุ่น ไม่มีน้ำก็ไม่ได้พรหรอก`,"Das Becken ist schon voll. Mehr Segen passt nicht hinein.":`อ่างเต็มแล้ว พรมากกว่านี้ใส่ไม่ลง`,"Ich gieße das Wasser in das Becken. Es leuchtet kurz silbern auf, als hätte jemand im Himmel genickt.":`ฉันเทน้ำลงในอ่าง มันเรืองเป็นสีเงินวูบหนึ่ง เหมือนมีใครบนสวรรค์พยักหน้า`,"Mit einer leeren Flasche kann ich nun Weihwasser schöpfen.":`ตอนนี้ฉันตักน้ำมนต์ใส่ขวดเปล่าได้แล้ว`,"Das Becken ist leer. Ich kann keine Flasche mit Staub füllen. Das wäre Betrug am Glauben.":`อ่างว่างเปล่า ฉันใส่ฝุ่นลงขวดไม่ได้ นั่นเท่ากับโกงศรัทธา`,"Ich tauche die Flasche ein und verkorke sie. Weihwasser, geschimmert wie Mondlicht auf Stein.":`ฉันจุ่มขวดลงไปแล้วปิดจุกไม้ก๊อก น้ำมนต์ ระยิบระยับเหมือนแสงจันทร์บนหิน`,"Das Weihwasser zurückgießen? Es ist kein Wein, und ich kein Alkoholiker des Glaubens.":`เทน้ำมนต์กลับน่ะเหรอ? มันไม่ใช่ไวน์ และฉันก็ไม่ใช่ขี้เมาแห่งศรัทธา`,"Ein leerer Eimer. Ich brauche Wasser, am besten aus dem Brunnen auf dem Dorfplatz.":`ถังเปล่า ฉันต้องการน้ำ ดีที่สุดจากบ่อที่ลานหมู่บ้าน`,Bibelpult:`แท่นอ่านพระคัมภีร์`,"Ein Lesepult mit einer riesigen, aufgeschlagenen Bibel. Zwischen den Seiten steckt ein Lesezeichen.":`แท่นอ่านพร้อมพระคัมภีร์เล่มมหึมาเปิดค้างอยู่ ระหว่างหน้ามีที่คั่นหนังสือเสียบอยู่`,"Ich blättere. Latein, Latein, noch mehr Latein. Beim Lesezeichen halte ich an.":`ฉันพลิกดู ละติน ละติน ละตินอีก ฉันหยุดที่ที่คั่นหนังสือ`,"„Et corvus vigilabat, et agnus patiebatur, et crux consummabat.“ Mein Latein reicht für „Rabe“, „Lamm“ und „Kreuz“.":`„Et corvus vigilabat, et agnus patiebatur, et crux consummabat.“ ละตินของฉันพอแปลได้แค่ „อีกา“ „ลูกแกะ“ และ „กางเขน“`,"Wieder diese Reihenfolge. Anscheinend meinen es die Heiligen ernst.":`ลำดับนี้อีกแล้ว ดูเหมือนนักบุญจะจริงจังกันนะ`,"Die Bibel wiegt mehr als ich. Und sie ist nicht mein Eigentum.":`พระคัมภีร์หนักกว่าฉัน แล้วมันก็ไม่ใช่ของฉันด้วย`,Beichtstuhl:`ห้องสารภาพบาป`,"Ein Beichtstuhl aus dunklem Holz, mit Vorhang. Hier haben Menschen ihre Sünden abgelegt. Manche haben auch etwas vergessen.":`ห้องสารภาพบาปไม้เข้มมีม่าน ที่นี่ผู้คนวางบาปของตัวเองลง บางคนก็ลืมของไว้ด้วย`,"Nur ein Abdruck auf der Bank und der Nachhall hundert gemurmelter Sünden.":`มีแค่รอยบนม้านั่งกับเสียงสะท้อนของบาปที่พึมพำมาร้อยครั้ง`,"Ich ziehe den Vorhang zur Seite. Auf der Bank liegt etwas, das ein Beichtender vergessen hat.":`ฉันเลิกม่านออก บนม้านั่งมีของที่คนสารภาพบาปลืมไว้`,Kerzenständer:`เชิงเทียน`,"Ein dreiarmiger Kerzenständer aus schwarzem Eisen. Drei Kerzen brennen, eine davon unter Protest.":`เชิงเทียนเหล็กดำสามแขน เทียนสามเล่มลุกอยู่ เล่มหนึ่งลุกอย่างประท้วง`,"Die Flammen tanzen. Ich könnte hier eine Fackel entzünden, wenn ich eine hätte.":`เปลวไฟเต้นระบำ ฉันจุดคบเพลิงที่นี่ได้ ถ้าฉันมี`,"Der Kerzenständer ist zu schwer, und Pater Anselm schaut mich an wie ein Pfarrer einen Dieb.":`เชิงเทียนหนักเกินไป แล้วบาทหลวงอันเซล์มก็มองฉันเหมือนบาทหลวงมองขโมย`,"Ich halte die Fackel an die Kerzenflamme. Sie fängt sofort. Das Licht tanzt an den Gewölben.":`ฉันเอาคบเพลิงจ่อเปลวเทียน มันติดทันที แสงเต้นระบำบนเพดานโค้ง`,"Ein Holzstab an die Kerzenflamme? Der brennt ab, und mit ihm meine Idee. Erst Pech dran.":`ไม้ท่อนเดียวจ่อเปลวเทียนเหรอ? มันก็แค่ไหม้หมด แล้วไอเดียของฉันก็พังไปด้วย ต้องทายางสนก่อน`,Opferstock:`ตู้บริจาค`,"Ein Opferstock, mit Eisen beschlagen. Ein Schlitz zum Einwerfen, nichts zum Herausnehmen. Ein Konzept, das ich nur bewundern kann.":`ตู้บริจาคหุ้มเหล็ก มีช่องให้หย่อน ไม่มีช่องให้เอาออก แนวคิดที่ฉันทำได้แค่ชื่นชม`,"Ich schüttle ihn. Es klirrt einmal. Ein Messingknopf, vermute ich. Jemand hat Hoffnung gespendet.":`ฉันเขย่า มีเสียงกรุ๊งกริ๊งครั้งเดียว ปุ่มทองเหลืองมั้ง มีคนบริจาคความหวัง`,"Den Opferstock stehlen? Ich bin Totengräber, kein Kirchenräuber. Noch nicht.":`ขโมยตู้บริจาคเหรอ? ฉันเป็นคนขุดหลุมศพ ไม่ใช่โจรปล้นโบสถ์ ยังไม่เป็นหรอก`,"Ich habe schon gespendet. Der Rest bleibt in meiner Tasche, schon aus Selbstschutz.":`ฉันบริจาคไปแล้ว ที่เหลืออยู่ในกระเป๋าฉัน เพื่อป้องกันตัวเองล้วน ๆ`,"Ich werfe die Münzen in den Schlitz. Es klingt hell und hoffnungsvoll.":`ฉันหย่อนเหรียญลงช่อง เสียงใสและเปี่ยมความหวัง`,"Gott segne dich, mein Sohn. Und dein Silber. Die Kirche braucht es mehr als du.":`ขอพระเจ้าอวยพรเจ้า ลูกข้า และเงินของเจ้าด้วย คริสตจักรต้องการมันมากกว่าเจ้า`,Besen:`ไม้กวาด`,"Ein Besen, lehnt an der Wand. Pater Anselm kehrt damit Sünden unter den Teppich. Es gibt keinen Teppich.":`ไม้กวาดพิงผนังอยู่ บาทหลวงอันเซล์มใช้กวาดบาปเข้าใต้พรม ไม่มีพรมหรอก`,"Ich nehme den Besen mit? Anselm würde mich verfluchen. Er hängt sehr an seinen Putzmitteln.":`จะเอาไม้กวาดไปด้วยเหรอ? อันเซล์มได้สาปแช่งฉันแน่ เขาหวงอุปกรณ์ทำความสะอาดมาก`,"Ich kehre ein bisschen. Der Staub zieht um, mehr nicht.":`ฉันกวาดนิดหน่อย ฝุ่นแค่ย้ายบ้าน ไม่มีอะไรมากกว่านั้น`,Kelchtisch:`โต๊ะถ้วยบูชา`,"Ein kleines Tischchen mit einem Messkelch. Der Kelch ist leer, seit der Wein im Bauch des Paters landete. Wie das bei Kelchen so ist.":`โต๊ะเล็กตั้งถ้วยบูชามิสซา ถ้วยว่างเปล่า ตั้งแต่ไวน์ไปอยู่ในท้องบาทหลวง ก็เป็นอย่างนี้แหละสำหรับถ้วย`,"Den Kelch nehmen? Das wäre Kirchenraub, und der Gestank von Weihrauch würde mich verraten.":`หยิบถ้วยน่ะเหรอ? นั่นคือปล้นโบสถ์ แล้วกลิ่นธูปคงฟ้องฉันแน่`,"Ich schaue in den Kelch. Ein einsamer Tropfen. Der Rest ist Erinnerung.":`ฉันมองเข้าไปในถ้วย หยดเดียวเดียวดาย ที่เหลือเป็นความทรงจำ`,"Falltür zur Gruft":`ประตูกลไปห้องใต้ดิน`,"Die Falltür steht offen. Von unten weht kalter Gruftatem. Es riecht nach Stein, Jahrhunderten und Spinnen.":`ประตูกลเปิดอยู่ ลมหายใจเย็นเฉียบของห้องใต้ดินพัดขึ้นมา กลิ่นหิน หลายศตวรรษ และแมงมุม`,"Eine schwere Falltür im Kapellenboden, mit einem Vorhängeschloss gesichert. Darunter beginnt die Gruft.":`ประตูกลหนักในพื้นโบสถ์น้อย ล็อกด้วยแม่กุญแจ ข้างใต้คือห้องใต้ดิน`,"Verschlossen. Ich brauche den Gruftschlüssel, silbern, mit Rabenkopf. Pater Anselm hat ihn irgendwo eingeschlossen.":`ล็อกอยู่ ฉันต้องมีกุญแจห้องใต้ดิน สีเงิน หัวเป็นรูปอีกา บาทหลวงอันเซล์มขังมันไว้ที่ไหนสักแห่ง`,"Die Falltür ist schon offen.":`ประตูกลเปิดอยู่แล้ว`,"Der Schlüssel dreht sich, das Schloss springt auf. Ich hebe die Falltür an: Eine Treppe führt hinab in die Dunkelheit.":`กุญแจหมุน แม่กุญแจเด้งเปิด ฉันยกประตูกลขึ้น บันไดทอดลงสู่ความมืด`,"Ich sollte Licht mitnehmen. Und vielleicht einen Gruß an die Hausherren.":`ฉันควรเอาแสงไปด้วย แล้วอาจจะทักทายเจ้าของบ้านด้วย`,"Der eiserne Schlüssel ist viel zu klein für dieses Schloss. Hier ist Silber gefragt, mit Rabenkopf.":`กุญแจเหล็กเล็กเกินไปสำหรับแม่กุญแจนี้ ที่นี่ต้องใช้เงิน หัวอีกา`,"Der kleine Kohlekistenschlüssel passt nicht. Das Schloss will etwas Edleres.":`กุญแจหีบถ่านเล็ก ๆ ไม่เข้า แม่กุญแจต้องการของที่สูงส่งกว่านี้`,"Ein Kerzenstummel. Anselm sammelt diese. Er wird es nie erfahren.":`เศษเทียน อันเซล์มสะสมพวกนี้ เขาจะไม่มีวันรู้หรอก`,"Der Blasebalg faucht, aber die Luft pfeift durch ein Loch in der Seite. Ein Windstoß für die Maus, keiner für die Esse.":`เครื่องสูบลมฟู่ แต่ลมรั่วออกทางรูข้างตัว ลมหนึ่งฟุบสำหรับหนู ไม่ถึงเตาหลอม`,"Luft in einen kalten Kamin? Nur Asche fliegt mir ins Gesicht. Zuerst muss etwas brennen.":`เป่าลมเข้าปล่องเย็น ๆ เหรอ? มีแต่เถ้าลอยใส่หน้าฉัน ต้องมีอะไรไหม้ก่อน`,"Genug geblasen. Zu viel Wind verbrennt das Eisen, sagt Gero. Und er muss es wissen.":`เป่าพอแล้ว ลมมากไปเหล็กไหม้ เกโรบอก และเขาต้องรู้ดี`,"Pffff. Die Glut wird heller. Ich muss weiter pumpen.":`ฟู่ววว ถ่านลุกสว่างขึ้น ฉันต้องสูบต่อ`,"Fffff. Die Kohlen glühen orange. Noch einmal.":`ฟู่ววว ถ่านเรืองสีส้ม อีกครั้ง`,"Fffwuuuuusch! Die Esse glüht weiß wie ein Heiligenschein. Meine Augenbrauen sind kürzer als vorher.":`ฟู่วววว์ชชช! เตาหลอมเรืองขาวเหมือนรัศมีนักบุญ คิ้วฉันสั้นลงกว่าเดิม`,"Na endlich. Jetzt hat sie Hitze. Leg den Klingenbruch hinein und lass ihn singen.":`ในที่สุดก็ได้ สุกแล้ว เอาดาบหักใส่ลงไป ปล่อยให้มันร้องเพลง`,"Mit der bloßen Faust? Der Amboss gewinnt immer.":`ด้วยกำปั้นเปล่า ๆ น่ะเหรอ? ทั่งชนะเสมอ`,"Ich schlage auf den kalten Amboss. Es klingt nach Arbeit und fühlt sich nach Handgelenk an.":`ฉันทุบทั่งเย็น ๆ เสียงเหมือนงาน และรู้สึกเหมือนข้อมือจะหัก`,"Es gibt nichts zu schmieden. Erst muss das Eisen glühen. Auf kaltes Metall zu hauen bringt nur Funken in den Ohren.":`ไม่มีอะไรให้ตี เหล็กต้องสุกก่อน ตีโลหะเย็นได้แค่ประกายไฟเข้าหู`,"Die Klinge ist fertig geformt. Weitere Schläge machen sie nur schiefer.":`ใบดาบขึ้นรูปเสร็จแล้ว ตีต่อมีแต่จะเบี้ยวขึ้น`,"Klong! Funken sprühen, die Klinge stöhnt.":`ก๊อง! ประกายไฟกระเด็น ใบดาบครางออกมา`,"Klong! Das Eisen beginnt, die Form eines Schwerts anzunehmen.":`ก๊อง! เหล็กเริ่มมีรูปร่างเป็นดาบ`,"Klong! Die Schneide wird gerade. Mein Arm weniger.":`ก๊อง! คมดาบตรงขึ้น แขนฉันตรงน้อยลง`,"Klong! Der letzte Schlag. Die Klinge liegt da wie ein Gedanke, der endlich zu Ende gedacht ist.":`ก๊อง! ครั้งสุดท้าย ใบดาบนอนอยู่ตรงนั้นเหมือนความคิดที่ในที่สุดก็คิดจบ`,"Nicht schön, aber sie wird halten. Jetzt ab ins Wasser, bevor sie es sich anders überlegt.":`ไม่สวย แต่ทนได้ ทีนี้ลงน้ำ ก่อนมันจะเปลี่ยนใจ`,"Das Fass ist voller Wasser und voller Möglichkeiten. Im Moment habe ich nichts, was sich löschen ließe.":`ถังเต็มไปด้วยน้ำและความเป็นไปได้ ตอนนี้ฉันไม่มีอะไรที่ต้องชุบ`,"Die Klinge ist längst abgeschreckt. Nochmal baden hilft ihr nicht.":`ใบดาบชุบไปนานแล้ว อาบน้ำอีกก็ไม่ช่วยอะไร`,"Halt! Das Fass ist leer! Wasser her, du Hornochse, sonst reißt dir die Klinge!":`หยุด! ถังว่างเปล่า! เอาน้ำมา ไอ้ทึ่ม ไม่งั้นใบดาบร้าว!`,"Zzzzischhh! Das Wasser singt, ein goldener Dampf steigt auf. Mir wird ganz fromm zumute.":`ซ่าาาา! น้ำร้องเพลง ไอสีทองลอยขึ้น ฉันรู้สึกศรัทธาขึ้นมาเสียอย่างนั้น`,"Zzzzischhh! Dampf, Zischen, Triumph. Die Klinge ist abgeschreckt und dunkel wie ein Entschluss.":`ซ่าาาา! ไอน้ำ เสียงฟู่ ชัยชนะ ใบดาบชุบเสร็จแล้ว ดำสนิทเหมือนการตัดสินใจ`,"Gut. Jetzt zum Schleifstein. Kurbeln, Junge, kurbeln!":`ดี ทีนี้ไปที่หินลับ หมุนสิ หนู หมุน!`,"Die Klinge ist schon gesegnet. Mehr Segen verträgt kein Schwert, nur ein Pfarrer.":`ใบดาบได้รับพรไปแล้ว ดาบรับพรมากกว่านี้ไม่ได้ มีแต่บาทหลวงที่รับได้`,"Weihwasser auf ein Fass? Es gibt nichts, das ich segnen könnte. Außer meiner Schmiede, und die ist ein verlorener Fall.":`น้ำมนต์ใส่ถัง? ไม่มีอะไรให้ฉันอวยพรเลย ยกเว้นโรงตีเหล็กของฉัน ซึ่งสิ้นหวังไปแล้ว`,"Das Fass ist trocken. Ich kippe Weihwasser doch nicht auf den Boden. Gero würde schreien. Der Pater auch.":`ถังแห้ง ฉันไม่เทน้ำมนต์ลงพื้นหรอก เกโรต้องกรี๊ด บาทหลวงก็ด้วย`,"Ich kippe das Weihwasser ins Löschfass. Es perlt golden und riecht nach Stein und Kirche.":`ฉันเทน้ำมนต์ลงในถังชุบ มันเป็นฟองสีทอง กลิ่นหินและโบสถ์`,"Was zum... das ist Ketzerei! Das ist Verschwendung! ... Das ist, Moment, das ist ziemlich klug.":`อะไรกัน... นี่มันนอกรีต! นี่มันสิ้นเปลือง! ... นี่คือ เดี๋ยวนะ นี่ค่อนข้างฉลาดเลย`,"Eine gesegnete Klinge. Die schlägt auch Dinge, die man mit Eisen nicht schlägt. Frag mich nicht, woher ich das weiß.":`ใบดาบที่ได้รับพร ฟันได้แม้แต่สิ่งที่เหล็กฟันไม่เข้า อย่าถามว่าฉันรู้ได้ยังไง`,"Was willst du, Bursche? Kohle ist keine da, Eisen ist keins da, und die Laune ist auch aufgebraucht.":`เอ็งต้องการอะไร ไอ้หนู ถ่านไม่มี เหล็กไม่มี อารมณ์ก็หมดไปแล้ว`,"Ich brauche ein Schwert. Ich will in den Rabenorden.":`ผมต้องการดาบครับ ผมอยากเข้าคณะอีกา`,"Ha! Ein Totengräber. Ich habe schon Särge für größere Träume gezimmert.":`ฮ่า! คนขุดหลุมศพ ข้าเคยทำโลงให้ความฝันที่ใหญ่กว่านี้มาแล้ว`,"Hör zu. Ich kann seit dem Unfall keinen Hammer mehr heben. Aber ich weiß noch jeden Handgriff.":`ฟังนะ ตั้งแต่เกิดอุบัติเหตุ ข้ายกค้อนไม่ได้อีก แต่ข้ายังจำทุกท่วงท่าได้`,"Du schmiedest. Ich sage dir, was du tust. Dafür zwei Silber, oder du pumpst mir zehn Mal den Blasebalg, wenn es fertig ist. Abgemacht?":`เอ็งตี ข้าบอกเอ็งว่าต้องทำอะไร ค่าจ้างสองเหรียญเงิน หรือไม่ก็สูบลมให้ข้าสิบครั้งเมื่อเสร็จ ตกลงไหม?`,"Abgemacht.":`ตกลงครับ`,"Wie schmiedet man ein Schwert?":`ตีดาบยังไงครับ?`,"Zuerst Feuer. Kohle liegt in der Kohlekiste. Den Schlüssel dazu habe ich irgendwo in meinem Werkzeugschrank verstaut. Unten oder in der Mitte, such halt.":`ก่อนอื่นไฟ ถ่านอยู่ในหีบถ่าน กุญแจหีบข้าเก็บไว้ที่ไหนสักแห่งในตู้เครื่องมือ ล่างหรือกลาง หาเอาเอง`,"Kohle in die Esse. Dann anzünden, dafür brauchst du Feuerstein und Schlageisen. Auch im Schrank.":`ถ่านใส่เตาหลอม แล้วจุดไฟ ต้องใช้หินเหล็กไฟกับเหล็กขูด อยู่ในตู้เหมือนกัน`,"Angezündet muss sie werden. Feuerstein, Junge. Der liegt im Werkzeugschrank, wo auch sonst.":`ต้องจุดมัน หินเหล็กไฟ ไอ้หนู อยู่ในตู้เครื่องมือ ที่ไหนได้อีกล่ะ`,"Jetzt brauchst du Wind. Aber mein Blasebalg hat ein Loch. Flick es mit Leder und Zwirn. Ein alter Stiefel tut es. Irgendwo liegt immer einer im Heu.":`ทีนี้ต้องใช้ลม แต่เครื่องสูบลมข้ามีรู ปะด้วยหนังกับด้าย รองเท้าบู๊ตเก่าก็ได้ อยู่ในกองฟางสักที่แหละ`,"Pump den Blasebalg, dreimal mindestens, bis die Esse weiß glüht.":`สูบลมอย่างน้อยสามครั้ง จนเตาหลอมเรืองขาว`,"Jetzt der Klingenbruch. Ich hatte mal einen, aber der liegt in der Gruft unter der Kapelle, bei den Toten. Frag nicht. Leg ihn in die Glut.":`ทีนี้ดาบหัก ข้าเคยมีอันหนึ่ง แต่มันอยู่ในห้องใต้ดินใต้โบสถ์น้อย กับคนตาย อย่าถาม วางลงในถ่านร้อน`,"Hammer, Amboss. Vier saubere Schläge. Der Hammer liegt auf der Werkbank. Wie kann man ihn übersehen?":`ค้อน ทั่ง ตีสี่ทีให้เรียบร้อย ค้อนอยู่บนโต๊ะช่าง จะมองข้ามได้ยังไง?`,"Ins Löschfass damit, aber das Fass braucht Wasser. Frisches, vom Brunnen. Die Klinge reißt sonst.":`ใส่ถังชุบเลย แต่ถังต้องมีน้ำ น้ำสด จากบ่อ ไม่งั้นใบดาบร้าว`,"Zum Schleifstein. Kurbeln, bis es funkt.":`ไปที่หินลับ หมุนจนประกายไฟออก`,"Fertig ist sie. Zahl mich oder pump mir den Blasebalg. Dann gehört sie dir.":`เสร็จแล้ว จ่ายข้า หรือไม่ก็สูบลมให้ข้า แล้วมันเป็นของเอ็ง`,"Was kostet mich das?":`ต้องจ่ายเท่าไหร่ครับ?`,"Zwei Silber, oder zehn Mal pumpen. Mir ist beides recht. Mein Rücken zieht das Pumpen vor, mein Magen das Silber.":`สองเหรียญเงิน หรือสูบสิบครั้ง ข้าได้ทั้งนั้น หลังข้าชอบสูบลม ท้องข้าชอบเงิน`,"Wenn du Dreckiges anbietest, etwa einen Beutel vom Karren, sage ich nichts. Ich sehe nur, dass er schwer ist.":`ถ้าเอ็งเสนอของสกปรก อย่างถุงจากเกวียน ข้าก็ไม่พูดอะไร ข้าแค่เห็นว่ามันหนัก`,"Wo ist Euer Klingenbruch?":`ดาบหักของท่านอยู่ที่ไหนครับ?`,"Der alte Klingenbruch? In der Gruft unter der Kapelle, auf einem Sarkophag. Ein Ritter hat ihn dort liegen lassen, als er starb. Ich habe ihn nie zurückgeholt, weil ich Skelette nicht mag.":`ดาบหักเก่าน่ะรึ? ในห้องใต้ดินใต้โบสถ์น้อย บนโลงหิน อัศวินคนหนึ่งทิ้งไว้ตรงนั้นตอนตาย ข้าไม่เคยไปเอาคืน เพราะข้าไม่ชอบโครงกระดูก`,"Die Falltür hat einen Schlüssel. Pater Anselm hat ihn im Sakristeischrank eingeschlossen.":`ประตูกลมีกุญแจ บาทหลวงอันเซล์มขังไว้ในตู้ห้องเก็บเครื่องบูชา`,"Habt Ihr etwas zur Gruft zu sagen?":`ท่านมีอะไรจะบอกเรื่องห้องใต้ดินไหมครับ?`,"Die Gruft ist feucht, finster und voller Ritter, die sich nicht gern stören lassen. Nimm eine Fackel mit. Und etwas Weihwasser.":`ห้องใต้ดินชื้น มืด และเต็มไปด้วยอัศวินที่ไม่ชอบให้ใครรบกวน เอาคบเพลิงไปด้วย แล้วก็น้ำมนต์หน่อย`,"Für die Fackel brauchst du einen Stab, etwas Pech und Feuerstein. Pech steht auf dem Dorfplatz im Fass, das schlägt alles Mögliche in den Boden.":`คบเพลิงต้องมีไม้ท่อน ยางสนนิดหน่อย และหินเหล็กไฟ ยางสนอยู่ในถังที่ลานหมู่บ้าน ซึ่งตอกอะไรลงพื้นได้สารพัด`,"Das Weihwasser: kann man damit etwas anfangen?":`น้ำมนต์ ใช้ทำอะไรได้บ้างไหมครับ?`,"Weihwasser? Ins Löschfass gegossen, wenn die Klinge geformt ist? Das wäre... nun, nicht nützlich. Mäßig nützlich. Äußerst nützlich, wenn man Dinge jagt, die sich nicht gern e
