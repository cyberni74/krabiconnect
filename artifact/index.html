rschlagen lassen.":`น้ำมนต์น่ะรึ? เทลงถังชุบตอนที่ใบดาบขึ้นรูปแล้ว? นั่นก็... ไม่เชิงมีประโยชน์ มีประโยชน์ปานกลาง มีประโยชน์สุดยอดถ้าเอ็งล่าสิ่งที่ไม่ชอบให้ใครฆ่า`,"Ich will bezahlen. Zwei Silber.":`ผมขอจ่ายครับ สองเหรียญเงิน`,"Zwei Silber. Gut. Dann gehört sie dir. Geh mir aus dem Licht, Ritterlein.":`สองเหรียญเงิน ดี ถ้างั้นมันเป็นของเอ็ง ไปให้พ้นแสงข้า อัศวินน้อย`,"Nehmt diesen Beutel. (Münzbeutel)":`รับถุงนี้ไปครับ (ถุงเหรียญ)`,"Hm. Der Beutel vom Karren. Schweres Totengeld, kein Silber. Ich frage nicht.":`หืม ถุงจากเกวียน เงินคนตายหนัก ๆ ไม่ใช่เงิน ข้าไม่ถามหรอก`,"Ich rieche Erde daran. Na gut. Das reicht. Die Klinge gehört dir. Und geh mir aus den Augen.":`ข้าได้กลิ่นดินจากมัน ก็ได้ แค่นี้พอ ใบดาบเป็นของเอ็ง แล้วไปให้พ้นหน้าข้า`,"Ich pumpe den Blasebalg zehn Mal.":`ผมสูบลมสิบครั้งครับ`,"Ich nehme den Blasebalg und pumpe. Eins. Zwei. Drei.":`ฉันจับเครื่องสูบลมแล้วสูบ หนึ่ง สอง สาม`,"Vier. Fünf. Sechs. Mein Rücken meldet Widerspruch an.":`สี่ ห้า หก หลังฉันยื่นคำร้องคัดค้าน`,"Sieben. Acht. Neun. Zehn.":`เจ็ด แปด เก้า สิบ`,"Sieh an, der Junge hat Rückgrat. Fast so viel wie ich früher. Die Klinge gehört dir.":`ดูสิ ไอ้หนูมีกระดูกสันหลัง เกือบเท่าข้าสมัยก่อน ใบดาบเป็นของเอ็ง`,"Erzählt mir etwas über Aschenfurt.":`เล่าเรื่องอาเชนฟูร์ทให้ผมฟังหน่อยครับ`,"Aschenfurt war mal eine Stadt. Jetzt ist es ein Friedhof mit Gewerbe. Ich lebe vom Hufbeschlag und von Särgen, wenn Oswin keine Nägel hat.":`อาเชนฟูร์ทเคยเป็นเมือง ตอนนี้เป็นสุสานที่มีธุรกิจ ข้าอยู่ได้ด้วยตอกเกือกม้ากับโลง ถ้าออสวินไม่มีตะปู`,"Die alte Hilda will immer, dass ich ihr Fieber heile. Ich bin Schmied, keine Hexe. Aber die Hexe im Moor, die kann es.":`ฮิลดาแก่อยากให้ข้ารักษาไข้ให้ตลอด ข้าเป็นช่างตีเหล็ก ไม่ใช่แม่มด แต่แม่มดในหนองน้ำน่ะ รักษาได้`,"Habt Ihr noch Hinweise zur Kiste auf dem Dorfplatz?":`ท่านมีเบาะแสเรื่องหีบที่ลานหมู่บ้านอีกไหมครับ?`,"Kunz' Kiste? Den Schlüssel dazu hat er mir damals im Suff gegeben. Ich habe ihn weggelegt. In die unterste Schublade, glaube ich, zu den toten Ratten und anderem Gerümpel.":`หีบของคุนซ์น่ะรึ? กุญแจเขาให้ข้าตอนเมาเมื่อก่อน ข้าเก็บไว้ ในลิ้นชักล่างสุด คิดว่านะ ปนกับหนูตายกับของขยะอื่น ๆ`,"Wenn du das Schwert verhunzt, melde dich nie wieder.":`ถ้าเอ็งทำดาบพัง ก็อย่ามาให้เห็นหน้าอีก`,"Auf Wiedersehen.":`ลาก่อนครับ`,"Die Schmiede":`โรงตีเหล็ก`,"Der Ausgang zum Dorfplatz. Draußen ist es kälter, aber weniger heiß für meine Augenbrauen.":`ทางออกไปลานหมู่บ้าน ข้างนอกหนาวกว่า แต่คิ้วฉันร้อนน้อยกว่า`,"Meister Gero":`ช่างเกโร`,"Meister Gero, der Schmied. Brummig, bärtig, mit Armen wie Brückenpfeiler, aber die Hand will nicht mehr.":`ช่างตีเหล็กเกโร หนวดเฟิ้ม อารมณ์บึ้ง แขนอย่างกับเสาสะพาน แต่มือมันไม่เอาด้วยแล้ว`,"Ich habe schon bekommen, was mir zusteht. Behalte dein Silber für schlechte Zeiten, also für immer.":`ฉันได้สิ่งที่ควรได้ไปแล้ว เก็บเงินเจ้าไว้ใช้ยามยากเถอะ ก็คือเก็บไว้ตลอดกาลนั่นแหละ`,"Erst die Arbeit, dann das Geld. Zuerst die Klinge, Junge.":`งานก่อนแล้วค่อยเงิน ดาบก่อน ไอ้หนู`,"Zwei Silber. Du bist ehrlicher als der Bürgermeister. Die Klinge ist dein.":`สองเหรียญเงิน เจ้าซื่อสัตย์กว่านายกเทศมนตรีอีกนะ ดาบเป็นของเจ้าแล้ว`,"Ich habe schon bekommen, was mir zusteht.":`ฉันได้สิ่งที่ควรได้ไปแล้ว`,"Erst die Klinge, dann die Bezahlung, und frag nicht, woher der Beutel kommt.":`ดาบก่อน แล้วค่อยจ่ายเงิน และอย่ามาถามว่าถุงเงินนั่นมาจากไหน`,"Totengeld. Ich nehme es und frage nicht. Die Klinge ist dein.":`เงินคนตาย ข้ารับไว้และไม่ถามอะไร ดาบเป็นของเจ้าแล้ว`,"„Eine Brosche? Das ist ein Geschenk, Junge. Und Geschenke verkauft man nicht, auch nicht an Schmiede.“":`„โบรชเหรอ? นั่นมันของขวัญนะไอ้หนู ของขวัญไม่เอาไปขายกันหรอก ต่อให้ขายให้ช่างตีเหล็กก็เถอะ“`,"Gero riecht an der Wurst und seufzt. „Behalt sie. Ich habe einen Magen, der nur Zorn verdaut.“":`เกโรดมไส้กรอกแล้วถอนหายใจ „เก็บไว้เถอะ ท้องข้าย่อยได้แต่ความโกรธ“`,Esse:`เตาหลอม`,"Die Esse, kalt wie Geros Humor. Ohne Brennstoff passiert hier nichts.":`เตาหลอมเย็นชืดเหมือนมุกของเกโร ไม่มีเชื้อเพลิงก็ไม่มีอะไรเกิดขึ้น`,"Kohle liegt in der Esse. Es fehlt ein Funke.":`มีถ่านอยู่ในเตาแล้ว ขาดแค่ประกายไฟ`,"Die Kohle brennt, aber nur gemütlich. Für Eisen braucht es Wind: den Blasebalg.":`ถ่านไหม้แล้ว แต่ไหม้แบบสบายๆ ถ้าจะตีเหล็กต้องมีลม คือเครื่องสูบลม`,"Die Esse glüht weiß. Jetzt gehört ein Stück Eisen hinein.":`เตาหลอมร้อนขาวโพลน ได้เวลาใส่เหล็กลงไปแล้ว`,"Der Klingenbruch glüht orange in der Glut. Zeit für den Amboss.":`ดาบหักเรืองสีส้มอยู่ในถ่านแดง ได้เวลาไปที่ทั่งแล้ว`,"Die Esse brennt ruhig vor sich hin. Das Wichtigste ist erledigt.":`เตาหลอมไหม้เรื่อยๆ ไปเอง เรื่องสำคัญที่สุดเสร็จแล้ว`,"Ich halte die Hand hinein. Kalt. Ich bräuchte Brennstoff. Kohle, am besten.":`ฉันยื่นมือเข้าไป เย็นเฉียบ ต้องมีเชื้อเพลิง ถ่านนี่แหละดีที่สุด`,"Ich puste hinein. Staub, kein Feuer. Ich brauche Feuerstein.":`ฉันเป่าเข้าไป ได้แต่ฝุ่น ไม่มีไฟ ต้องมีหินเหล็กไฟ`,"Es brennt. Aber die Glut ist träge. Mit dem Blasebalg wird sie heiß.":`ไฟติดแล้ว แต่ถ่านยังอืดๆ อยู่ ใช้เครื่องสูบลมก็จะร้อนขึ้น`,"Weißglut. Ich lege besser etwas Brauchbares hinein, bevor sie sich langweilt.":`ร้อนขาวโพลน ใส่อะไรที่มีประโยชน์ลงไปดีกว่า ก่อนมันจะเบื่อเสียก่อน`,"Das Eisen glüht. Der Amboss wartet. Der Hammer auch.":`เหล็กเรืองแสงแล้ว ทั่งรออยู่ ค้อนก็ด้วย`,"Die Esse ist zufrieden. Ich lasse sie.":`เตาหลอมพอใจแล้ว ปล่อยมันไว้อย่างนั้นแหละ`,"Eine ganze Esse? Selbst Gero würde mich auslachen. Und der kann nicht lachen.":`เตาหลอมทั้งเตาเนี่ยนะ? ขนาดเกโรยังหัวเราะเยาะฉันเลย ทั้งที่แกหัวเราะไม่เป็น`,"Es liegt schon Kohle drin. Mehr würde die Esse nur beleidigen.":`มีถ่านอยู่ในนั้นแล้ว ใส่เพิ่มก็เป็นการดูถูกเตาหลอมเปล่าๆ`,"Ich lege die Kohle in die Esse. Schwarz auf schwarz, aber voller Hoffnung.":`ฉันใส่ถ่านลงในเตาหลอม ดำบนดำ แต่เต็มไปด้วยความหวัง`,"Ich schlage Funken, aber nichts fängt Feuer. Ich brauche etwas zum Brennen. Kohle.":`ฉันตีประกายไฟ แต่ไม่มีอะไรติดไฟเลย ต้องมีของที่เผาไหม้ได้ ถ่านไง`,"Sie brennt doch schon. Funken sparen, Junge.":`มันไหม้อยู่แล้วนี่ ประหยัดประกายไฟหน่อย ไอ้หนู`,"Klick. Klick. Funke. Die Kohle fängt, glimmt und faucht. Aschenfurt hat ein Feuer mehr, immerhin eins, das nicht von der Pest kommt.":`แกร๊ก แกร๊ก ประกายไฟ ถ่านติด คุกรุ่น แล้วฟู่ขึ้นมา อัชเชนฟัวร์มีไฟเพิ่มอีกกองหนึ่ง อย่างน้อยก็กองที่ไม่ได้มาจากโรคระบาด`,"Gut. Aber das ist nur ein Kamin. Für Stahl braucht es Wind: Der Blasebalg hat leider ein Loch.":`ดี แต่นี่ก็แค่เตาผิง ถ้าจะตีเหล็กกล้าต้องมีลม เสียดายที่เครื่องสูบลมมีรูรั่ว`,"Die Esse ist noch kalt. Wie soll ich da meine Fackel anzünden?":`เตาหลอมยังเย็นอยู่ แล้วฉันจะจุดคบเพลิงได้ยังไงล่ะ`,"Ich halte die Fackel in die Glut. Sie fängt sofort. Das Licht tanzt über die Wände.":`ฉันยื่นคบเพลิงเข้าไปในถ่านแดง ติดทันที แสงไฟเต้นระบำไปทั่วผนัง`,"Halt! Den Bruch in eine lauwarme Esse? Das gibt Pfusch! Erst Weißglut, du Dummkopf.":`หยุด! เอาดาบหักใส่เตาที่แค่อุ่นๆ เนี่ยนะ? งานห่วยแตกพอดี! ต้องร้อนขาวก่อนสิ ไอ้โง่`,"Der Klingenbruch liegt längst in der Glut oder ist schon eine Klinge. Ich habe keinen zweiten.":`ดาบหักอยู่ในถ่านแดงมานานแล้ว หรือไม่ก็กลายเป็นดาบไปแล้ว ฉันไม่มีอันที่สอง`,"Ich lege den rostigen Klingenbruch in die Glut. Der Rost fällt ab wie schlechte Gewissen.":`ฉันวางดาบหักที่เป็นสนิมลงในถ่านแดง สนิมร่วงหลุดเหมือนความรู้สึกผิดที่เลือนหาย`,"Das Eisen wird rot, orange und dann gelb. Ich warte, bis es singt.":`เหล็กกลายเป็นสีแดง ส้ม แล้วก็เหลือง ฉันรอจนกว่ามันจะร้องเพลง`,"Gut so. Jetzt zum Amboss, solange es glüht. Hammer ist auf der Werkbank.":`ดีแล้ว ตอนนี้ไปที่ทั่งซะ ระหว่างที่ยังเรืองแสงอยู่ ค้อนอยู่บนโต๊ะช่าง`,"Die Esse löschen? Gero würde mich löschen. Und das Feuer wäre dann wohl das kleinere Problem.":`ดับเตาเนี่ยนะ? เกโรคงดับฉันแทน แล้วไฟคงเป็นปัญหาที่เล็กกว่าเยอะ`,"Weihwasser auf die Esse? Ein Zischen, eine Wolke, und Gero schnaubt. Das hebe ich mir lieber auf.":`น้ำมนต์รดเตาหลอมเหรอ? เสียงฟู่ ควันฟุ้ง แล้วเกโรก็จะคำราม เก็บไว้ก่อนดีกว่า`,"Das Schwert ist schon fertig. Zurück in die Glut? Dann fängt Gero von vorn an.":`ดาบเสร็จแล้ว ใส่กลับเข้าไปในถ่านอีกเหรอ? เกโรก็ต้องเริ่มใหม่หมดน่ะสิ`,"Ich halte den Holzstab in die Glut. Er brennt ab wie meine Geduld. Besser nicht.":`ฉันยื่นแท่งไม้เข้าไปในถ่านแดง มันไหม้หมดเหมือนความอดทนของฉัน ไม่ทำดีกว่า`,Blasebalg:`เครื่องสูบลม`,"Der Blasebalg, notdürftig mit Stiefelleder geflickt. Er hält. Meistens.":`เครื่องสูบลมที่ปะไว้อย่างลวกๆ ด้วยหนังรองเท้าบู๊ต มันทนอยู่ได้ ส่วนใหญ่นะ`,"Ein riesiger Blasebalg mit einem Loch von der Größe einer Faust. Das pfeift schön, aber nicht nützlich.":`เครื่องสูบลมยักษ์ที่มีรูใหญ่เท่ากำปั้น เสียงหวีดเพราะดี แต่ไม่มีประโยชน์`,"Zu schwer, zu groß, zu festgenagelt.":`หนักไป ใหญ่ไป ตอกติดแน่นเกินไป`,"Der Blasebalg ist schon geflickt.":`เครื่องสูบลมปะเรียบร้อยแล้ว`,"Das Leder passt. Aber womit nähe ich es fest? Ich brauche Nadel und Zwirn.":`หนังเข้ากันดี แต่จะเย็บติดด้วยอะไรล่ะ ต้องมีเข็มกับด้าย`,"Nadel und Zwirn habe ich. Aber wo ist das Leder? Ein Flicken aus Luft hält nicht.":`มีเข็มกับด้ายแล้ว แต่หนังอยู่ไหนล่ะ ผ้าปะที่ทำจากอากาศไม่อยู่หรอก`,"Mit dem Schwert in den Blasebalg stechen? Das Loch ist schon groß genug.":`เอาดาบแทงเครื่องสูบลมเนี่ยนะ? รูมันก็ใหญ่พอแล้ว`,Amboss:`ทั่ง`,"Der Amboss, bereit für glühendes Eisen und kräftige Arme.":`ทั่งพร้อมรับเหล็กเรืองแสงและแขนแข็งแรง`,"Ein Amboss, schwer wie ein schlechtes Gewissen. Er hat mehr Schläge hinter sich als ich Mahlzeiten.":`ทั่งหนักเหมือนความรู้สึกผิด โดนตีมามากกว่าที่ฉันเคยกินมื้ออาหารซะอีก`,"Der Amboss rührt sich nicht. Er ist ein Amboss. Nehmen ist nicht sein Beruf.":`ทั่งไม่ขยับ มันเป็นทั่ง การถูกหยิบไปไม่ใช่หน้าที่ของมัน`,"Den Klingenbruch kalt auf den Amboss legen? Er bleibt, was er ist: Schrott. Erst muss er glühen.":`เอาดาบหักที่เย็นอยู่วางบนทั่งเหรอ? มันก็ยังเป็นเศษเหล็กอยู่ดี ต้องให้มันเรืองแสงก่อน`,Löschfass:`ถังจุ่มดับ`,"Das Löschfass, bis zum Rand voll mit klarem Wasser. Ein stilles, gefährliches Bad.":`ถังจุ่มดับ เต็มปรี่ด้วยน้ำใส เป็นอ่างอาบน้ำที่เงียบสงบและอันตราย`,"Das Löschfass. Ein feuchter Rest am Boden, mehr nicht. Gero hat seit Wochen kein Wasser mehr geschleppt.":`ถังจุ่มดับ เหลือแค่น้ำชื้นๆ ที่ก้นถัง ไม่มีอะไรมากกว่านั้น เกโรไม่ได้แบกน้ำมาเป็นสัปดาห์แล้ว`,"Es ist ein Fass. Es ist voll oder leer, und trotzdem viel zu schwer.":`มันคือถัง จะเต็มหรือว่างก็ตาม หนักเกินไปอยู่ดี`,"Das Fass ist randvoll. Mehr Wasser macht es nur nass.":`ถังเต็มเอี๊ยดแล้ว เติมน้ำอีกก็แค่ทำให้เปียกเท่านั้น`,"Ich kippe den Eimer ins Löschfass. Plätschern, Wellen, Zufriedenheit. Jetzt ist es bereit.":`ฉันเทน้ำจากถังลงในถังจุ่มดับ เสียงน้ำกระเซ็น คลื่นกระเพื่อม ความพอใจ ตอนนี้มันพร้อมแล้ว`,"Der Eimer ist leer. Ein leerer Eimer in ein leeres Fass zu kippen, das ist Philosophie, aber kein Löschwasser.":`ถังน้ำว่างเปล่า เทถังว่างลงในถังว่างอีกใบ นี่มันปรัชญา ไม่ใช่น้ำสำหรับจุ่มดับ`,"Das Schwert ist schon abgeschreckt, oder noch gar nicht da. Ich lasse es im Trockenen.":`ดาบจุ่มดับเสร็จแล้ว หรือไม่ก็ยังไม่มีเลย ปล่อยให้แห้งๆ ไปก่อน`,Schleifstein:`หินลับมีด`,"Ein Schleifstein mit Kurbel. Er sieht aus wie ein Mühlstein, der Karriere in der Waffenindustrie gemacht hat.":`หินลับมีดที่มีก้านหมุน หน้าตาเหมือนหินโม่ที่ไปสร้างอาชีพในวงการอาวุธ`,"Der Stein wiegt mehr als ich. Ich lasse ihn arbeiten.":`หินหนักกว่าฉันอีก ปล่อยให้มันทำงานไป`,"Ich drehe die Kurbel. Der Stein kreischt nur vor Leere. Er will eine Klinge.":`ฉันหมุนก้าน หินร้องแหลมเพราะว่างเปล่า มันอยากได้ใบดาบ`,"Ohne fertige, abgeschreckte Klinge hat der Stein nichts zu schleifen.":`ถ้าไม่มีใบดาบที่เสร็จและจุ่มดับแล้ว หินก็ไม่มีอะไรให้ลับ`,"Die Klinge ist fertig. Der Schleifstein ruht sich aus, der Faulpelz.":`ใบดาบเสร็จแล้ว หินลับมีดพักผ่อน ไอ้ขี้เกียจ`,"Ich drehe die Kurbel. Funken sprühen wie ein kleines Feuerwerk. Das Schwert wird immer schärfer.":`ฉันหมุนก้าน ประกายไฟพุ่งเหมือนพลุเล็กๆ ดาบคมขึ้นเรื่อยๆ`,"Fertig. Mein Schwert liegt blank auf der Werkbank. Es ist nicht schön, aber ehrlich.":`เสร็จแล้ว ดาบของฉันวางเปลือยเปล่าอยู่บนโต๊ะช่าง ไม่สวย แต่ซื่อตรง`,"Nicht so schnell, Bursche! Erst die Bezahlung: zwei Silber oder zehn Mal pumpen, dann gehört sie dir.":`ช้าก่อน ไอ้หนู! จ่ายเงินก่อน สองเหรียญเงิน หรือสูบลมสิบครั้ง แล้วมันถึงจะเป็นของเจ้า`,"Nimm sie, Junge. Aber lass sie nicht am Esel fallen.":`เอาไปเถอะ ไอ้หนู แต่อย่าทำตกใส่ลานะ`,Schwert:`ดาบ`,"Mein Schwert. Blank und schief wie mein Selbstvertrauen.":`ดาบของฉัน เปลือยเปล่าและเบี้ยวเหมือนความมั่นใจของฉัน`,"Finger weg! Erst bezahlen. Zwei Silber oder zehn Mal Blasebalg.":`มือออกไป! จ่ายเงินก่อน สองเหรียญเงิน หรือสูบลมสิบครั้ง`,"Ich nehme das Schwert. Es liegt gut in der Hand. Der erste Schritt zum Ritter ist getan.":`ฉันหยิบดาบ จับถนัดมือดี ก้าวแรกสู่การเป็นอัศวินเริ่มต้นแล้ว`,Werkbank:`โต๊ะช่าง`,"Eine breite Werkbank mit Brandflecken und Messerspuren. Hier liegt alles, was ein Schmied braucht, und einiges, was er nicht braucht.":`โต๊ะช่างกว้าง เต็มไปด้วยรอยไหม้และรอยมีด ทุกอย่างที่ช่างตีเหล็กต้องใช้อยู่ที่นี่ และของอีกหลายอย่างที่ไม่ต้องใช้ด้วย`,"Ich wische mit der Hand über das Holz. Staub, Rußflecken, ein vergessener Nagel. Nichts, was mir hilft.":`ฉันเอามือปัดไปบนไม้ ฝุ่น คราบเขม่า ตะปูที่ถูกลืมหนึ่งตัว ไม่มีอะไรช่วยฉันได้`,"Die Werkbank bleibt, wo sie ist. Sie ist die Einzige in Aschenfurt, die noch Arbeit hat.":`โต๊ะช่างอยู่ที่เดิม มันเป็นสิ่งเดียวในอัชเชนฟัวร์ที่ยังมีงานทำ`,"Ein schwerer Schmiedehammer. Er ist glatt vom Schweiß unzähliger Hände. Gero beobachtet mich.":`ค้อนตีเหล็กหนักอึ้ง ลื่นเพราะเหงื่อของมือนับไม่ถ้วน เกโรจับตาดูฉันอยู่`,"Ich sollte erst mit dem Schmied reden, bevor ich seine Werkzeuge einsacke.":`ควรคุยกับช่างตีเหล็กก่อนที่จะฉวยเครื่องมือของแกเข้ากระเป๋า`,Werkzeugschrank:`ตู้เครื่องมือ`,"Die oberste Schublade. Sie klemmt ein bisschen, aber sie gibt nach.":`ลิ้นชักบนสุด ติดขัดนิดหน่อย แต่ก็ยอมเปิด`,"Die mittlere Schublade. Sie riecht nach Öl und Schicksal.":`ลิ้นชักกลาง มีกลิ่นน้ำมันและโชคชะตา`,"Die unterste Schublade. Ein Rattennest, das sich als Schublade tarnt.":`ลิ้นชักล่างสุด รังหนูที่ปลอมตัวเป็นลิ้นชัก`,"Ein großer Werkzeugschrank mit drei Schubladen. Gero sagt, es herrsche eine Ordnung. Die Ordnung ist das Chaos.":`ตู้เครื่องมือใหญ่ที่มีสามลิ้นชัก เกโรบอกว่ามีระเบียบอยู่ ระเบียบนั้นคือความโกลาหล`,Kohlekiste:`หีบถ่าน`,"Die Kohlekiste ist abgeschlossen. Gero ist geizig, selbst mit Kohle.":`หีบถ่านล็อกอยู่ เกโรขี้เหนียว แม้แต่กับถ่าน`,"Das kleine Schloss klickt. Dunkel und bereit.":`แม่กุญแจเล็กๆ ดังคลิก มืดและพร้อมแล้ว`,"Leer. Nur ein bisschen Kohlenstaub und das Echo meiner Hoffnung.":`ว่างเปล่า มีแค่ฝุ่นถ่านนิดหน่อยกับเสียงสะท้อนแห่งความหวังของฉัน`,"Die Kohlekiste, offen. Es liegen drei Klumpen darin. Mehr gibt es nicht.":`หีบถ่านเปิดอยู่ มีก้อนถ่านสามก้อนอยู่ข้างใน ไม่มีมากกว่านี้แล้ว`,"Eine verschlossene Kohlekiste. Mit einem kleinen Schloss gesichert. Kohle ist hier kostbarer als Gold.":`หีบถ่านที่ล็อกไว้ ด้วยแม่กุญแจเล็กๆ ที่นี่ถ่านมีค่ากว่าทองคำ`,Lumpenkorb:`ตะกร้าผ้าขี้ริ้ว`,"Ein Korb voller Lumpen. Geros Wäsche, Geros Verbandszeug und Geros Geheimnisse.":`ตะกร้าเต็มไปด้วยผ้าขี้ริ้ว ผ้าซักของเกโร ผ้าพันแผลของเกโร และความลับของเกโร`,Kohlesack:`กระสอบถ่าน`,"Ein halb leerer Kohlesack. Er ist zu leer für die Esse und zu voll von Spinnweben.":`กระสอบถ่านที่ว่างไปครึ่งหนึ่ง ว่างเกินกว่าจะใช้กับเตา และมีใยแมงมุมเต็มเกินไป`,"Ich schüttle den Sack. Eine Schabe flieht, sonst nichts.":`ฉันสะบัดกระสอบ แมลงสาบตัวหนึ่งวิ่งหนี ไม่มีอะไรอีก`,"Ein leerer Sack. Ich habe schon genug Last im Leben.":`กระสอบว่างเปล่า ฉันแบกภาระในชีวิตมามากพอแล้ว`,"Geros Strohlager":`ที่นอนฟางของเกโร`,"Geros Lager aus Stroh. Er schläft neben der Esse, damit er nicht auskühlt. Oder damit er nie zu weit von der Arbeit weg ist.":`ที่นอนฟางของเกโร แกนอนข้างเตาหลอมเพื่อไม่ให้หนาว หรือไม่ก็เพื่อไม่ให้อยู่ไกลจากงานเกินไป`,"Ich lege mich kurz hin. Das Stroh pikst. Ich stehe auf. Das Leben ist nichts für Weichlinge.":`ฉันเอนตัวลงสักพัก ฟางทิ่มแทง ฉันลุกขึ้น ชีวิตไม่ใช่ของพวกอ่อนแอ`,Weinfass:`ถังไวน์`,"Ein kleines Weinfass, mit Kreide beschriftet: „Nur für Notfälle.“ Es ist leer. Die Notfälle waren zahlreich.":`ถังไวน์เล็กๆ เขียนด้วยชอล์กว่า „เฉพาะยามฉุกเฉิน“ มันว่างเปล่า ยามฉุกเฉินมีเยอะนี่นา`,"Ich klopfe an das Fass. Es hallt hohl. Gero hustet laut in meine Richtung.":`ฉันเคาะถัง เสียงก้องกลวง เกโรไอเสียงดังมาทางฉัน`,"Gero würde mich erschlagen. Mit dem Fass. Wahrscheinlich leer.":`เกโรคงฟาดฉันตาย ด้วยถังนั่นแหละ น่าจะเป็นถังเปล่าด้วย`,"Ein hölzerner Eimer. Er hat bessere Tage gesehen, aber noch nicht den schlechtesten.":`ถังไม้ มันเคยผ่านวันที่ดีกว่านี้มาแล้ว แต่ยังไม่ถึงวันที่แย่ที่สุด`,Fenster:`หน้าต่าง`,"Ein vergittertes Fenster. Der Mond schaut herein wie ein neugieriger Henker.":`หน้าต่างมีลูกกรง พระจันทร์ส่องเข้ามาเหมือนเพชฌฆาตขี้สงสัย`,Ketten:`โซ่`,"Schwere Ketten an einem Flaschenzug. Man hebt damit Eisen, Amboss, und gelegentlich Gero.":`โซ่หนักๆ ติดกับรอก ใช้ยกเหล็ก ทั่ง และบางครั้งก็เกโร`,"Ich ziehe an den Ketten. Sie klirren und lösen eine Staubwolke aus. Weiter passiert nichts.":`ฉันดึงโซ่ มันดังกริ๊งๆ และฝุ่นฟุ้งเป็นกลุ่ม ไม่มีอะไรเกิดขึ้นอีก`,Hufeisen:`เกือกม้า`,"Ein Dutzend Hufeisen an der Wand, alle abgenutzt. Ob sie Glück bringen? Den Pferden brachten sie jedenfalls keins.":`เกือกม้าโหลหนึ่งแขวนอยู่บนผนัง สึกหรอทุกอัน จะนำโชคไหมนะ อย่างน้อยพวกม้าก็ไม่ได้โชคดีเลย`,"Hufeisen? Die hängen so fest, dass selbst Gero sie nicht mehr loskriegt.":`เกือกม้าเหรอ? แขวนแน่นจนเกโรเองยังเอาลงไม่ได้`,Kaminabzug:`ปล่องเตา`,"Der gewaltige Rauchfang über der Esse. Irgendwo da oben wohnt der Schornsteinfeger. Er ist seit dem Frühjahr verschollen.":`ปล่องควันมหึมาเหนือเตาหลอม คนปัดปล่องควันอาศัยอยู่ตรงไหนสักแห่งข้างบน แกหายตัวไปตั้งแต่ฤดูใบไม้ผลิ`,"Ich schneide eine Sohle aus dem Stiefel, lege sie über das Loch und nähe sie fest. Stich für Stich, wie ein Chirurg ohne Diplom.":`ฉันตัดพื้นรองเท้าออกจากบู๊ต วางทับรู แล้วเย็บติด ทีละเข็ม เหมือนศัลยแพทย์ที่ไม่มีใบประกาศ`,"Der Blasebalg hält. Er wölbt sich stolz und faucht einmal zur Probe.":`เครื่องสูบลมทนได้ มันป่องขึ้นอย่างภาคภูมิและฟู่ครั้งหนึ่งเป็นการทดสอบ`,"Du hast tatsächlich zwei Hände. Gut gemacht, für einen Totengräber.":`เจ้ามีสองมือจริงๆ ด้วยแฮะ ทำได้ดี สำหรับคนขุดหลุมศพ`,"Alter Stiefel":`รองเท้าบู๊ตเก่า`,"Ein einzelner, steifer Lederstiefel. Wer verliert nur einen? Und warum fehlt der Fuß nicht?":`รองเท้าบู๊ตหนังข้างเดียวที่แข็งทื่อ ใครจะทำหายแค่ข้างเดียวกันนะ แล้วทำไมเท้าถึงไม่หายไปด้วย`,"Die Fackel flackert unruhig. Das Pech geht zur Neige.":`คบเพลิงสั่นไหวไม่สงบ ยางสนใกล้หมดแล้ว`,"Die Fackel spuckt, zischt und erlischt. Dunkelheit, wie sie nur Gräber kennen.":`คบเพลิงพ่นประกาย ฟู่ แล้วดับ มืดอย่างที่มีแต่หลุมศพรู้จัก`,"Mit Feuerstein lässt sie sich wieder entzünden. Am besten oben, wo es hell ist.":`จุดใหม่ได้ด้วยหินเหล็กไฟ ดีที่สุดคือข้างบนที่สว่างๆ`,"Stockfinster. Ich sehe meine eigene Hand nicht, und die ist mir noch am vertrautesten.":`มืดสนิท ฉันมองไม่เห็นมือตัวเอง ทั้งที่มันเป็นสิ่งที่ฉันคุ้นเคยที่สุด`,"Ich taste ins Nichts. Das Nichts tastet nicht zurück. Noch nicht.":`ฉันควานเข้าไปในความว่างเปล่า ความว่างเปล่าไม่ควานตอบ ยังไม่ใช่ตอนนี้`,"Ohne Licht greife ich hier höchstens in etwas, das ich später bereue.":`ถ้าไม่มีแสง ฉันก็ได้แต่คว้าโดนอะไรสักอย่างที่ภายหลังจะเสียใจ`,"Ein tiefes Knurren. Zwei Wölfe heben die Köpfe, die Lefzen gekräuselt. Sie stehen genau zwischen mir und dem Ritter.":`เสียงขู่คำรามทุ้มต่ำ หมาป่าสองตัวเงยหัวขึ้น ริมฝีปากย่น พวกมันยืนขวางระหว่างฉันกับอัศวินพอดี`,"Ich habe zwei Beine, sie haben acht Zähne pro Schnauze. Schlechte Rechnung. Ich ziehe mich zurück.":`ฉันมีสองขา พวกมันมีแปดเขี้ยวต่อปาก คำนวณแล้วไม่คุ้ม ฉันถอยดีกว่า`,"Danke, mein Junge. Genug für heute. Wasser ist wie Vergebung: Man bekommt nie zu viel, aber man merkt es.":`ขอบใจนะ หนุ่มน้อย พอแล้วสำหรับวันนี้ น้ำก็เหมือนการอภัย ไม่เคยได้มากเกินไป แต่เรารู้สึกได้`,"Ich halte Halvard den Eimer an die Lippen. Er trinkt in gierigen Zügen, dann sinkt er zurück und atmet auf.":`ฉันยื่นถังให้ฮาลวาร์ดจ่อริมฝีปาก เขาดื่มอึกใหญ่อย่างกระหาย แล้วทรุดลงพิงและถอนหายใจโล่งอก`,"Wasser. Heiliges, sauberes, wunderbares Wasser. Ich wusste nicht mehr, wie es schmeckt.":`น้ำ น้ำศักดิ์สิทธิ์ สะอาด วิเศษ ข้าลืมไปแล้วว่ารสชาติเป็นยังไง`,"Du bist der erste, der nicht davongelaufen ist. Setz dich, Junge. Ich habe Zeit. Mehr als mir lieb ist.":`เจ้าเป็นคนแรกที่ไม่วิ่งหนี นั่งลงสิ หนุ่มน้อย ข้ามีเวลา มากกว่าที่ข้าอยากได้`,"Du willst also, dass ich für dich bürge. Ein Ritter bürgt nur für den, den er kennt.":`เจ้าอยากให้ข้ารับรองให้เจ้าสินะ อัศวินรับรองให้เฉพาะคนที่ตัวเองรู้จักเท่านั้น`,"Also sag mir, Junge: Warum willst du Ritter werden?":`ว่าไป หนุ่มน้อย ทำไมเจ้าถึงอยากเป็นอัศวิน`,"Wegen des Ruhms und der Lieder, die man über mich singen wird.":`เพราะเกียรติยศ และบทเพลงที่ผู้คนจะร้องถึงข้า`,"Weil jemand die Schwachen schützen muss. Und ich kann nicht wegsehen.":`เพราะต้องมีคนปกป้องผู้อ่อนแอ และข้าทนนิ่งดูดายไม่ได้`,"Weil der Orden ein Dach, Suppe und ein Bett bietet. Ich bin Waise.":`เพราะกองอัศวินมีหลังคา ซุป และเตียงให้ ข้าเป็นเด็กกำพร้า`,"Ha! Ruhm. Ich kannte viele, die für Ruhm starben. Man erinnert sich an keinen. Aber du bist wenigstens ehrlich dumm.":`ฮ่า! เกียรติยศ ข้ารู้จักหลายคนที่ตายเพื่อเกียรติยศ ไม่มีใครจำได้สักคน แต่อย่างน้อยเจ้าก็โง่อย่างซื่อสัตย์`,"Hm. So reden sie alle, bis die erste Klinge kommt. Aber du sagst es, als meintest du es. Das ist selten.":`หืม คนพวกนั้นพูดแบบนี้กันทุกคน จนกว่าคมดาบแรกจะมาถึง แต่เจ้าพูดเหมือนเจ้าหมายความอย่างนั้นจริงๆ นั่นหายากนะ`,"Endlich einer, der nicht lügt! Ein Dach, Suppe, ein Bett. Das ist mehr Wahrheit, als der halbe Orden aufbringt.":`ในที่สุดก็มีคนไม่โกหก! หลังคา ซุป เตียง นั่นคือความจริงมากกว่าที่กองอัศวินครึ่งหนึ่งพูดได้ซะอีก`,"Hier, mein Brief. Ich habe ihn schon geschrieben, bevor die Wölfe kamen. Für den Fall, dass ich jemanden finde, der es wert ist.":`นี่ จดหมายของข้า ข้าเขียนไว้ก่อนที่หมาป่าจะมา เผื่อว่าเจอใครที่คู่ควร`,"Ich bekomme einen gefalteten Brief mit rotem Siegel. Halvards Wort für mich. Die Hand, die ihn schrieb, zitterte.":`ฉันได้จดหมายพับผนึกด้วยตราประทับสีแดง คำรับรองของฮาลวาร์ดสำหรับฉัน มือที่เขียนมันสั่นเทา`,"Und nimm meinen Ring. Er hat einen Raben. Wer ihn trägt, hat Freunde, die zählen. Ich brauche ihn nicht mehr.":`และเอาแหวนข้าไปด้วย มันมีรูปอีกา คนที่สวมมันมีมิตรที่นับได้ ข้าไม่ต้องการมันอีกแล้ว`,"Ein schwerer Siegelring mit Rabenwappen liegt in meiner Hand. Es fühlt sich an wie ein Versprechen.":`แหวนตราประทับหนักๆ ที่มีตราอีกาวางอยู่ในมือฉัน รู้สึกเหมือนคำสัญญา`,"Den Ring gebe ich nur einem, der Ehre gezeigt hat. Du bist ehrlich, aber noch nicht erprobt. Zeig mir Ehre, und er gehört dir.":`แหวนนี้ข้าให้เฉพาะคนที่แสดงเกียรติยศแล้วเท่านั้น เจ้าซื่อสัตย์ แต่ยังไม่ผ่านการพิสูจน์ แสดงเกียรติยศให้ข้าเห็น แล้วมันจะเป็นของเจ้า`,"Am Waldrand":`ชายป่า`,"Der Pfad zurück nach Aschenfurt. Dort warten Pest, Brandt und Brot.":`เส้นทางกลับอัชเชนฟัวร์ ที่นั่นมีโรคระบาด แบรนด์ และขนมปังรออยู่`,"Pfad ins Moor":`ทางเข้าหนองน้ำ`,"Dort hinten glimmt das Moor grün unter dem Nebel. Hübsch, wie ein Gruselmärchen.":`ตรงโน้น หนองน้ำเรืองแสงสีเขียวใต้หมอก สวยดี เหมือนนิทานผี`,"Das Moor. Dort will ich erst hin, wenn ich Klinge, Segen und Bürgen habe. Und Feldwebel Brandt mich schickt.":`หนองน้ำ ฉันจะไปที่นั่นก็ต่อเมื่อมีดาบ พร และผู้รับรองแล้ว และเมื่อสิบเอกแบรนด์ส่งฉันไป`,"Ser Halvard":`ท่านฮาลวาร์ด`,"Ser Halvard, in Rüstung an eine Eiche gelehnt. Das Gesicht ist grau, die Augen aber wach. Er trinkt Wasser, als sei es Wein.":`ท่านฮาลวาร์ดในชุดเกราะพิงต้นโอ๊ก หน้าซีดเทา แต่ตายังตื่นตัว เขาดื่มน้ำเหมือนมันเป็นไวน์`,"Ein Ritter in Rüstung, an einen Baum gelehnt. Er atmet noch, flach und mühsam. Ein Wappen mit Raben auf der Brust.":`อัศวินในชุดเกราะพิงต้นไม้ ยังหายใจอยู่ แผ่วเบาและยากลำบาก มีตราอีกาบนอก`,"Halvard schüttelt den Kopf. „Behalte ihn, Junge. Ein Brief gehört dem, der ihn braucht.“":`ฮาลวาร์ดส่ายหน้า „เก็บมันไว้เถอะ หนุ่มน้อย จดหมายเป็นของคนที่ต้องใช้มัน“`,"Wer seid Ihr?":`ท่านคือใคร`,"Ser Halvard vom Orden des Raben. Oder was von ihm übrig ist. Ich lehne seit drei Tagen an diesem Baum und ordne meine Sünden.":`ท่านฮาลวาร์ดแห่งกองอัศวินอีกา หรืออะไรก็ตามที่เหลืออยู่ ข้าพิงต้นไม้ต้นนี้มาสามวันแล้ว นั่งไล่เรียงบาปของตัวเอง`,"Es sind weniger, als ich dachte. Das ist enttäuschend.":`มีน้อยกว่าที่คิด น่าผิดหวังจริง`,"Was ist Euch zugestoßen?":`เกิดอะไรขึ้นกับท่าน`,"Ich ritt von Grauwacht nach Aschenfurt, mit einer Warnung für Brandt. Männer im schwarzen Mantel, ein vergifteter Pfeil, und mein Pferd ging mit ihnen durch. Ich habe es ihnen nicht verübelt.":`ข้าขี่ม้าจากเกราวัคท์ไปอัชเชนฟัวร์ พร้อมคำเตือนให้แบรนด์ ชายสวมเสื้อคลุมดำ ลูกธนูอาบยาพิษ แล้วม้าข้าก็หนีไปกับพวกมัน ข้าไม่โทษมันหรอก`,"Dann kamen die Wölfe. Sie dachten, ich wäre Abendessen. Ich bin zäh, sie haben aufgegeben und warten jetzt.":`แล้วหมาป่าก็มา พวกมันคิดว่าข้าเป็นมื้อเย็น ข้าเหนียว พวกมันเลยยอมแพ้ แต่ตอนนี้ก็รออยู่`,"Ich habe Wasser für Euch.":`ข้ามีน้ำให้ท่าน`,"Würdet Ihr für mich bürgen?":`ท่านจะรับรองให้ข้าไหม`,"Und der Ring?":`แล้วแหวนล่ะ`,"Wovor warnt Ihr Brandt?":`ท่านเตือนแบรนด์เรื่องอะไร`,"Vor dem Kanzler Malvor. Der König trinkt seinen Wein nicht aus Durst. Der Kelch ist vergiftet, Junge, und niemand will es hören.":`เรื่องเสนาบดีมัลวอร์ กษัตริย์ไม่ได้ดื่มไวน์เพราะกระหาย ถ้วยมันมีพิษ หนุ่มน้อย และไม่มีใครอยากฟัง`,"Wenn du nach Grauwacht kommst: Trau keinem, der zu freundlich lächelt. Und hüte deinen Becher.":`ถ้าเจ้าไปถึงเกราวัคท์ อย่าเชื่อคนที่ยิ้มเป็นมิตรเกินไป และระวังถ้วยของเจ้าให้ดี`,"Was erwartet mich im Moor?":`อะไรรอข้าอยู่ในหนองน้ำ`,"Das Hexenmoor? Nebel, Irrlichter, Schlangen. Und Morwenna. Eine alte Frau, die Kräuter kennt, vor denen selbst der Teufel einen Bogen macht.":`หนองแม่มดเหรอ? หมอก ไฟหลอก งู และมอร์เวนนา หญิงชราที่รู้จักสมุนไพรจนแม้แต่ปีศาจยังต้องหลบ`,"Sie braut Gegengifte. Wenn der König noch zu retten ist, dann von ihr. Bring Gaben mit und sei höflich.":`นางต้มยาถอนพิษ ถ้ากษัตริย์ยังมีทางรอด ก็ต้องจากนาง เอาของกำนัลไปด้วยและสุภาพเข้าไว้`,"Haltet durch. Ich hole Hilfe.":`ทนไว้นะ ข้าจะไปเรียกคนมาช่วย`,"Hilfe? In Aschenfurt? Ha. Sag Brandt, er soll zwei Männer schicken, die weniger Angst vor Wölfen haben als vor mir.":`คนมาช่วย? ในอัชเชนฟัวร์เนี่ยนะ ฮ่า บอกแบรนด์ให้ส่งคนมาสองคน ที่กลัวหมาป่าน้อยกว่ากลัวข้า`,"Geh, Junge. Und lass dich nicht beißen.":`ไปเถอะ หนุ่มน้อย และอย่าให้ถูกกัด`,Wolf:`หมาป่า`,"Ein grauer Wolf mit gelben Augen. Er bewacht Halvard wie ein Hund einen Knochen: mit viel Zuneigung und Zähnen.":`หมาป่าสีเทาตาเหลือง มันเฝ้าฮาลวาร์ดเหมือนหมาเฝ้ากระดูก ด้วยความรักมากมายและเขี้ยวเต็มปาก`,"Der Wolf knurrt. Ein wunderbares Gespräch, aber einseitig.":`หมาป่าขู่คำราม บทสนทนาที่วิเศษ แต่ฝ่ายเดียว`,"Ich greife nach dem Wolf? Ich habe zwei Hände und sehr gern beide.":`เอื้อมมือไปจับหมาป่าเหรอ? ฉันมีสองมือและรักทั้งสองข้างมาก`,"Ich bin ein einfacher Totengräber. Kein Wolfsflüsterer. Er knurrt, ich weiche zurück.":`ฉันเป็นแค่คนขุดหลุมศพธรรมดา ไม่ใช่คนกระซิบหมาป่า มันขู่คำราม ฉันถอยหลัง`,"Ich werfe dem Wolf die Wurst zu? Dann ist er satt, und meine Waden sind dran. Ich brauche eine Falle.":`โยนไส้กรอกให้หมาป่าเหรอ? มันอิ่ม แล้วน่องฉันก็เป็นคิวต่อไป ฉันต้องการกับดัก`,"Der Wolf schnuppert am Brot und wendet sich angewidert ab. Selbst Wölfe haben Standards.":`หมาป่าดมขนมปังแล้วหันหนีอย่างรังเกียจ แม้แต่หมาป่ายังมีมาตรฐาน`,"Ein zweiter, kleinerer Wolf. Er knurrt weniger, schaut dafür öfter zu meiner Wade.":`หมาป่าตัวที่สอง เล็กกว่า ขู่น้อยกว่า แต่มองน่องฉันบ่อยกว่า`,"Der Wolf legt die Ohren an. Er ist kein Gesprächspartner.":`หมาป่าลู่หูลง มันไม่ใช่คู่สนทนา`,"Das ist nicht mein Haustier. Und ich werde auch keins daraus machen.":`มันไม่ใช่สัตว์เลี้ยงฉัน และฉันก็จะไม่ทำให้มันเป็นด้วย`,"Ich gehe lieber auf Abstand. Der Wolf auch, aber in meine Richtung.":`ฉันขอเว้นระยะดีกว่า หมาป่าก็เหมือนกัน แต่เว้นในทิศทางมาทางฉัน`,Wolfsfalle:`กับดักหมาป่า`,"Die Falle ist zugeschnappt. Ein paar graue Haare hängen noch dran. Sie hat ihre Pflicht getan.":`กับดักงับปิดแล้ว ขนสีเทาไม่กี่เส้นยังติดอยู่ มันทำหน้าที่ของมันแล้ว`,"Die Falle ist gespannt und mit Wurst bestückt.":`กับดักตั้งไว้และมีไส้กรอกเป็นเหยื่อ`,"Die Wolfsfalle, gespannt und bereit. Es fehlt nur ein Köder.":`กับดักหมาป่า ตั้งไว้พร้อมแล้ว ขาดแค่เหยื่อ`,"Eine rostige Wolfsfalle, zugeschnappt. Der Bolzen, der sie spannen würde, ist abgebrochen. Mit einem Nagel ließe sich das beheben.":`กับดักหมาป่าขึ้นสนิม งับปิดอยู่ สลักที่ใช้ขึ้นสปริงหักไปแล้ว ใช้ตะปูแก้ได้`,"Die Falle nehme ich nicht mit. Sie beißt auch Besitzer.":`กับดักนี่ฉันไม่เอาไป มันกัดเจ้าของด้วย`,"Die Falle ist zugeschnappt. Sie hat ihre Arbeit getan und ruht sich aus.":`กับดักงับปิดแล้ว ทำงานเสร็จและกำลังพักผ่อน`,"Ich ziehe an den Zähnen. Sie klappen nicht auf, der Bolzen fehlt. Ich brauche etwas, das ihn ersetzt: einen Nagel, vielleicht.":`ฉันดึงฟัน มันไม่เปิด เพราะสลักหายไป ต้องมีอะไรมาแทน ตะปูมั้ง`,"Die Falle ist gespannt. Ich fasse sie lieber nicht an. Ich brauche noch zehn Finger.":`กับดักตั้งไว้แล้ว ฉันไม่แตะดีกว่า ฉันยังต้องใช้นิ้วทั้งสิบ`,"Die Falle ist schon repariert. Mehr Nägel braucht sie nicht, außer für meinen Sarg.":`กับดักซ่อมแล้ว ไม่ต้องการตะปูอีก ยกเว้นสำหรับโลงศพฉัน`,"Ich schiebe den Nagel durch das Scharnier. Dann spanne ich die Federn auseinander, vorsichtig, wie eine Kreuzotter. Klack.":`ฉันเสียบตะปูเข้าไปในบานพับ แล้วค่อยๆ ดึงสปริงให้เปิดออกอย่างระวัง เหมือนงูพิษ แกร๊ก`,"Die Falle steht offen wie ein Maul. Jetzt fehlt noch ein Köder.":`กับดักอ้าปากรออยู่ ตอนนี้ขาดแค่เหยื่อ`,"Die Falle ist schon zugeschnappt. Wurst wäre jetzt Verschwendung.":`กับดักงับปิดไปแล้ว ตอนนี้ใช้ไส้กรอกก็เสียเปล่า`,"In eine kaputte Falle Wurst legen? Dann hole ich mir nur Mäuse. Zuerst muss der Bolzen repariert werden.":`เอาไส้กรอกใส่กับดักที่พังเหรอ? ได้แต่หนูมาเท่านั้น ต้องซ่อมสลักก่อน`,"Ich lege die Räucherwurst auf den Auslöser. Der Duft zieht durch den Nebel wie ein Versprechen.":`ฉันวางไส้กรอกรมควันบนไกปืน กลิ่นลอยผ่านหมอกเหมือนคำสัญญา`,"Ich verstecke mich hinter dem Baumstumpf und halte die Luft an.":`ฉันซ่อนตัวหลังตอไม้และกลั้นหายใจ`,"KLACK! Ein Jaulen, ein Zerren. Der Wolf reißt sich los, mit eingeklemmtem Schweif und gekränkter Ehre.":`แกร๊ก! เสียงโหยหวน ดิ้นรน หมาป่าสะบัดหลุด หางติดและศักดิ์ศรีบอบช้ำ`,"Beide Wölfe sind im Wald verschwunden, mit der Wurst im Magen und einem Schwur auf Rache. Die Bahn zu Halvard ist frei.":`หมาป่าทั้งสองหายไปในป่า พร้อมไส้กรอกในท้องและคำสาบานแก้แค้น ทางไปหาฮาลวาร์ดโล่งแล้ว`,"Brot als Köder? Wölfe sind keine Raben. Sie wollen etwas, das einmal gelebt hat.":`ขนมปังเป็นเหยื่อเหรอ? หมาป่าไม่ใช่อีกา พวกมันต้องการสิ่งที่เคยมีชีวิต`,"Eine tote Ratte als Köder? Der Wolf schaut mich beleidigt an. Es muss mehr sein. Wurst, am besten.":`หนูตายเป็นเหยื่อเหรอ? หมาป่ามองฉันอย่างขุ่นเคือง ต้องมากกว่านี้ ไส้กรอกดีที่สุด`,Baumstumpf:`ตอไม้`,"Ein knorriger Baumstumpf. Seine Jahresringe erzählen von besseren Zeiten. Und von Äxten.":`ตอไม้ปุ่มปม วงปีของมันเล่าเรื่องวันเวลาที่ดีกว่า และเรื่องขวาน`,"Ich setze mich kurz darauf. Es ist unbequem. Ein Baumstumpf kennt keine Gnade.":`ฉันนั่งลงสักครู่ ไม่สบายเลย ตอไม้ไม่รู้จักความปรานี`,"Der Stumpf hängt noch an den Wurzeln. Ich auch, an meinem Leben.":`ตอยังติดรากอยู่ ฉันก็ติดชีวิตของฉันเหมือนกัน`,"Halvards Tornister":`กระเป๋าสะพายของฮาลวาร์ด`,"Ein ledernes Bündel neben dem Ritter. Wolfszähne haben es durchbohrt. Das Wenige, was drin ist, hat den Angriff überlebt.":`ห่อหนังข้างตัวอัศวิน เขี้ยวหมาป่าทะลุผ่านไปแล้ว ของน้อยนิดที่อยู่ข้างในรอดจากการโจมตี`,"Leer. Der Rest war wohl Abendessen.":`ว่างเปล่า ที่เหลือคงเป็นมื้อเย็น`,Lager:`ที่ซุ่ม`,"Das Lager der Wölfe: zertrampeltes Stroh und Knochen. Ein Albtraum für Allergiker.":`รังหมาป่า ฟางที่ถูกเหยียบและกระดูก ฝันร้ายของคนเป็นภูมิแพ้`,"Ich stochere im Stroh. Haare, Knochen und der Geruch nasser Wolle.":`ฉันเขี่ยฟาง ขน กระดูก และกลิ่นขนแกะเปียก`,"Knochen. Kleine, große, mittelgroße. Die Wölfe haben hier gespeist, und zwar ausgiebig.":`กระดูก เล็ก ใหญ่ กลาง หมาป่ากินกันที่นี่ และกินอย่างจุใจ`,"Es sind genug Knochen in Aschenfurt. Ich brauche keine weiteren.":`อัชเชนฟัวร์มีกระดูกพอแล้ว ฉันไม่ต้องการเพิ่ม`,Hirschskelett:`โครงกระดูกกวาง`,"Das Skelett eines Hirsches. Er wollte in den Wald und kam nur bis hierher. Ein Leben in einem Satz.":`โครงกระดูกกวาง มันอยากเข้าป่าแต่มาได้แค่นี้ ชีวิตทั้งชีวิตในประโยคเดียว`,"Die Knochen sind sauber abgenagt. Nichts mehr zu holen.":`กระดูกถูกแทะสะอาดเกลี้ยง ไม่มีอะไรเหลือให้เอา`,Steinhaufen:`กองหิน`,"Ein Haufen loser Steine. Jemand hat hier etwas versteckt. Oder die Steine haben es selbst versteckt.":`กองหินหลวมๆ มีใครซ่อนอะไรไว้ที่นี่ หรือไม่ก็หินซ่อนมันเอง`,"Nur Steine, Käfer und eine Menge Geduld.":`แค่หิน ด้วง และความอดทนมหาศาล`,"Ich wälze ein paar Steine zur Seite. Etwas Rundes liegt dazwischen.":`ฉันกลิ้งหินออกไปสองสามก้อน มีของกลมๆ อยู่ตรงกลาง`,"Umgekippte Schubkarre":`รถเข็นล้ม`,"Eine umgekippte Schubkarre, halb im Moos versunken. Wer sie hierher geschoben hat, wollte nicht weit.":`รถเข็นล้มคว่ำ จมอยู่ในมอสส์ครึ่งคัน ใครเข็นมาที่นี่คงไม่ได้ตั้งใจไปไกล`,"Eine Schubkarre mitnehmen? Ich habe keinen Platz für ein Fahrzeug im Gepäck.":`เอารถเข็นไปด้วยเหรอ? ฉันไม่มีที่ในสัมภาระสำหรับยานพาหนะ`,"Ich richte sie auf. Sie kippt sofort wieder um, aus Prinzip.":`ฉันตั้งมันขึ้น มันล้มทันที ตามหลักการ`,"Alte Eiche":`ต้นโอ๊กเก่า`,"Eine uralte, riesige Eiche. Ihre Äste greifen nach dem Himmel. Die Wurzeln greifen nach Halvard.":`ต้นโอ๊กยักษ์โบราณ กิ่งก้านเอื้อมคว้าฟ้า ส่วนรากเอื้อมคว้าฮาลวาร์ด`,"Grünes Leuchten":`แสงสีเขียว`,"Ein grünliches Leuchten über dem fernen Moor. Es lockt wie ein Wirtshaus, in dem man nie wieder bezahlen muss.":`แสงเขียวๆ เหนือหนองน้ำไกลๆ มันล่อเหมือนโรงเตี๊ยมที่ไม่ต้องจ่ายเงินอีกเลย`,"Ein gerader Ast, so lang wie mein Arm. Noch kein Werkzeug, aber voller Hoffnung.":`กิ่งไม้ตรง ยาวเท่าแขนฉัน ยังไม่ใช่เครื่องมือ แต่เต็มไปด้วยความหวัง`,"Gelbe Blüten, schwarze Erde: Fieberkraut. Hildas Enkel wird es freuen.":`ดอกไม้เหลือง ดินดำ หญ้าไข้ ลูกหลานของฮิลดาจะดีใจ`,"Ein Fliegenpilz. Wunderschön, giftig, ehrlich. Ich esse ihn nicht.":`เห็ดแมลงวัน สวย มีพิษ ซื่อตรง ฉันไม่กินหรอก`,"Erst des Mondes bleiches Licht,":`แสงจันทร์ซีดก่อน`,"dann der Hexe Haus im Moor,":`แล้วบ้านแม่มดในหนอง`,"zuletzt der Heimat schwacher Schein –":`สุดท้ายแสงริบหรี่ของบ้าน –`,"dann ziehen die Irrlichter fort.":`แล้วไฟหลอกจะจากไป`,"Sie brennt friedlich. Die Irrlichter schmollen irgendwo im Nebel.":`มันไหม้อย่างสงบ ไฟหลอกงอนอยู่ที่ไหนสักแห่งในหมอก`,"Diese Laterne brennt schon.":`โคมนี้ติดไฟอยู่แล้ว`,"Die dritte Flamme faucht auf. Ein Pfeifen geht durch das Moor, dann Stille.":`เปลวที่สามฟู่ขึ้น เสียงหวีดดังผ่านหนอง แล้วเงียบ`,"Die Irrlichter sinken ins Wasser wie beleidigte Hofdamen. Der Steg zur Hütte ist frei.":`ไฟหลอกจมลงน้ำเหมือนนางสนมที่ถูกดูหมิ่น สะพานไม้ไปกระท่อมโล่งแล้ว`,"Nach Stein sieht das Ganze nicht aus. Aber nach Anstand.":`มันดูไม่เหมือนหิน แต่ดูมีมารยาท`,"Die Flamme brennt ruhig und grünlich. Irgendwo im Nebel zischt etwas verärgert.":`เปลวไฟลุกนิ่งๆ สีเขียวอ่อน บางอย่างในหมอกฟู่อย่างไม่พอใจ`,"Zwei Flammen. Die Irrlichter weichen ein Stück zurück. Das scheint zu stimmen.":`สองเปลว ไฟหลอกถอยไปเล็กน้อย ดูเหมือนจะถูกทาง`,"Die Flamme zuckt. Ein hohes Kichern geht über das Wasser, und alle Laternen erlöschen auf einmal.":`เปลวไฟกระตุก เสียงหัวเราะแหลมสูงลอยข้ามน้ำ แล้วโคมทุกดวงดับพร้อมกัน`,"Das war die falsche Reihenfolge. Die Irrlichter lachen mich aus. Sehr professionell.":`ลำดับผิด ไฟหลอกหัวเราะเยาะฉัน มืออาชีพจริงๆ`,"Das Moorwasser platscht in den Kessel und blubbert träge zurück.":`น้ำหนองกระเซ็นลงหม้อต้ม แล้วเดือดปุดๆ กลับลงไปอย่างเฉื่อยชา`,"Morwenna nickt kaum merklich: „Das Nasse zuerst. Immerhin.“":`มอร์เวนนาพยักหน้าแทบมองไม่เห็น „ของเปียกก่อน อย่างน้อยก็ถูก“`,"Die Feder schwebt auf dem Wasser wie ein kleines schwarzes Schiff.":`ขนนกลอยบนน้ำเหมือนเรือสีดำลำเล็ก`,"Das Wasser färbt sich tintig.":`น้ำเปลี่ยนเป็นสีหมึก`,"Die Alraune sinkt in den Kessel. Für einen Augenblick glaube ich, sie seufzt.":`แมนเดรกจมลงในหม้อ ชั่วขณะหนึ่งฉันคิดว่ามันถอนหายใจ`,"Das Gebräu wird dick und riecht nach nasser Erde und schlechtem Gewissen.":`น้ำยาข้นขึ้นและมีกลิ่นดินเปียกกับความรู้สึกผิด`,"Ich werfe die Zunge hinein. Es zischt, als würde sie noch Meinungen haben.":`ฉันโยนลิ้นลงไป มันฟู่ราวกับยังมีความเห็นอยู่`,"Die Brühe schimmert türkis. Es fehlt nur noch das Feuer.":`น้ำแกงเป็นประกายสีเขียวขุ่น ขาดแค่ไฟ`,"Der Kessel kocht schon. Jetzt fehlt nur ein Gefäß für das Gegengift.":`หม้อเดือดอยู่แล้ว ตอนนี้ขาดแค่ภาชนะใส่ยาถอนพิษ`,"Halt! Du wirfst nicht blind Zeug in meinen Kessel. Frag erst, wie man es richtig macht.":`หยุด! อย่าโยนอะไรมั่วๆ ลงหม้อข้า ถามก่อนว่าต้องทำยังไงให้ถูก`,"Ich halte die Fackel unter den Kessel. Die Flammen lecken am Eisen, das Gebräu beginnt zu kochen.":`ฉันถือคบเพลิงไว้ใต้หม้อ เปลวไฟเลียเหล็ก น้ำยาเริ่มเดือด`,"Fertig gekocht. Türkis wie ein toter Fisch – genau richtig.":`ต้มเสร็จแล้ว เขียวขุ่นเหมือนปลาตาย พอดีเป๊ะ`,"Jetzt brauchst du etwas, worin du es nach Grauwacht tragen kannst. Eine Flasche.":`ตอนนี้เจ้าต้องมีอะไรสักอย่างไว้ใส่ถือไปเกราวัคท์ ขวดสักใบ`,Morwenna:`มอร์เวนนา`,"Feuer unter einem leeren Kessel? Ich würde nur Luft kochen.":`ก่อไฟใต้หม้อเปล่าเนี่ยนะ? ฉันก็ต้มได้แค่อากาศ`,"Der Kessel faucht, würgt und speit eine grüne Wolke bis zur Decke. Ich lande rücklings auf dem Boden.":`หม้อฟู่ สำลัก แล้วพ่นควันสีเขียวถึงเพดาน ฉันล้มหงายหลังกับพื้น`,"Falsche Reihenfolge! Ich sagte: erst das Nasse, dann das Leichte, das Tiefe, das Böse – zuletzt das Feuer.":`ลำดับผิด! ข้าบอกแล้ว ของเปียกก่อน แล้วของเบา ของลึก ของชั่วร้าย สุดท้ายคือไฟ`,"Sie fischt mit dem Löffel alles aus dem Qualm und drückt es mir in die Hand. „Von vorn. Und diesmal mit Verstand.“":`นางใช้ทัพพีตักทุกอย่างออกจากควันแล้วยัดใส่มือฉัน „เริ่มใหม่ รอบนี้ใช้สมองหน่อย“`,"Die Laterne brennt mit grünlichem Schein. Sehr gemütlich, wenn man Sumpfgas mag.":`โคมส่องแสงสีเขียวอ่อน น่าสบายมาก ถ้าชอบก๊าซหนองน้ำ`,"Sie ist am Steg festgenagelt. Wer stiehlt schon Laternen im Moor? Nur Irrlichter.":`มันถูกตอกติดกับสะพานไม้ ใครจะขโมยโคมในหนองกัน มีแต่ไฟหลอก`,"Sie brennt schon.":`มันติดไฟอยู่แล้ว`,"Ohne Flamme gibt sie nichts her. Meine Fackel vielleicht?":`ถ้าไม่มีเปลวไฟมันก็ไม่ให้อะไร คบเพลิงของฉันล่ะ บางทีอาจได้`,"Wachs auf die Laterne? Dann brennt sie schlechter, nicht besser.":`หยดขี้ผึ้งบนโคมเหรอ? มันจะไหม้แย่ลง ไม่ใช่ดีขึ้น`,"Wasser auf eine Laterne. Das ist der Gegenbeweis zu allem, wofür sie gebaut wurde.":`น้ำราดโคม นี่คือข้อพิสูจน์ที่ตรงข้ามกับทุกอย่างที่มันถูกสร้างมาเพื่อ`,Irrlicht:`ไฟหลอก`,"Ich greife nach dem Licht. Es kichert und tanzt eine Handbreit weiter. Typisch Irrlicht.":`ฉันเอื้อมไปจับแสง มันหัวเราะคิกคักแล้วเต้นห่างออกไปหนึ่งฝ่ามือ ไฟหลอกก็แบบนี้แหละ`,"Ein Licht fangen? Dann wäre ich der erste, der es überlebt.":`จับแสงเหรอ? ฉันก็คงเป็นคนแรกที่รอดมาได้`,"Es lacht über meine kleine Fackel. Neid der Größe.":`มันหัวเราะเยาะคบเพลิงเล็กๆ ของฉัน อิจฉาคนตัวใหญ่`,Moorpfad:`ทางหนอง`,Hexenhütte:`กระท่อมแม่มด`,"Eine windschiefe Hütte auf Stelzen. Hinter dem Fenster brennt ein Licht, das nicht nach Kerze aussieht.":`กระท่อมเอียงกะเท่เร่บนเสาสูง หลังหน้าต่างมีแสงสว่างที่ไม่เหมือนแสงเทียน`,"Die letzten Planken zur Hütte tanzen unter Irrlichtern. Wer ihnen folgt, endet im Schlamm. Ich brauche Licht, das sie vertreibt.":`แผ่นกระดานสุดท้ายไปกระท่อมเต้นระบำใต้ไฟหลอก ใครตามไปก็จบที่โคลน ฉันต้องมีแสงที่ไล่พวกมันไป`,"Weg nach Grauwacht":`ทางไปเกราวัคท์`,"Der Steg führt nach Osten, aus dem Moor hinaus. Irgendwo dahinter liegt Burg Grauwacht.":`สะพานไม้นำไปทางตะวันออก ออกจากหนอง ที่ไหนสักแห่งข้างหลังนั่นคือปราสาทเกราวัคท์`,"Zurück nach Westen":`กลับไปทางตะวันตก`,"Dort liegt Aschenfurt. Dort liegt auch alles, was ich hinter mir lassen wollte.":`อัชเชนฟัวร์อยู่ตรงนั้น และทุกอย่างที่ฉันอยากทิ้งไว้ข้างหลังก็อยู่ที่นั่นด้วย`,"Zurück nach Aschenfurt? Mit leeren Händen? Brandt würde mich auslachen.":`กลับอัชเชนฟัวร์เหรอ? มือเปล่าเนี่ยนะ แบรนด์จะหัวเราะเยาะฉันแน่`,"Der König stirbt dort drüben. Ich gehe nach Osten.":`กษัตริย์กำลังจะสิ้นพระชนม์ตรงโน้น ฉันไปทางตะวันออก`,"Krähenschädel-Totem":`โทเท็มหัวกะโหลกอีกา`,"Ein Pfahl voller Krähenschädel. Zwischen den Knochen sind Zeilen eingeritzt:":`เสาที่เต็มไปด้วยหัวกะโหลกอีกา มีบรรทัดสลักไว้ระหว่างกระดูก`,"Mond, Hexenhaus, Heimat. Und die Laternen am Steg kennen die Reihenfolge, nehme ich an.":`จันทร์ บ้านแม่มด บ้านเกิด และโคมที่สะพานไม้คงรู้ลำดับ ฉันเดานะ`,"Das Totem ist tief im Torf verwurzelt. Die Schädel starren mich an, als wüssten sie, wie das ausgeht.":`โทเท็มฝังรากลึกในพีท หัวกะโหลกจ้องมองฉันเหมือนรู้ว่าเรื่องจะจบยังไง`,"Ich klopfe leise an einen Schädel. Er klappert. Der Nachbar auch. Eine Gemeinschaft.":`ฉันเคาะกะโหลกเบาๆ มันกึกกัก ข้างๆ ก็กึกกักด้วย ชุมชนเลยทีเดียว`,"Ein brennendes Holzstück neben Knochen und Federn. Das wäre ein kurzer Zauber.":`ไม้ท่อนหนึ่งที่กำลังไหม้อยู่ข้างกระดูกและขนนก นั่นจะเป็นเวทมนตร์ที่สั้นมาก`,"Eine Rabenfeder vom Totem. Die Krähen hier sind entweder großzügig oder in der Mauser.":`ขนนกอีกาจากโทเท็ม อีกาที่นี่ไม่ใจกว้างก็กำลังผลัดขน`,Moorlaterne:`โคมหนอง`,"Eine tote Laterne. Am Sockel hat jemand ein Haus mit Rauchfaden eingeritzt: die Heimat?":`โคมที่ดับแล้ว ที่ฐานมีคนสลักรูปบ้านที่มีควันเป็นเส้น นั่นคือบ้านเกิดหรือ`,"Eine tote Laterne. In ihr Eisen ist ein Halbmond geritzt. Der Mond, wenn man es poetisch sehen will.":`โคมที่ดับแล้ว บนเหล็กสลักรูปพระจันทร์เสี้ยว จันทร์ ถ้ามองแบบกวี`,"Eine tote Laterne. Am Sockel ist eine Hütte auf Stelzen eingeritzt. Sie zeigt nach Osten.":`โคมที่ดับแล้ว ที่ฐานสลักรูปกระท่อมบนเสาสูง ชี้ไปทางตะวันออก`,"Ein bläuliches Licht über dem Wasser. Es schwebt genau so, dass man ihm folgen will.":`แสงสีฟ้าอ่อนเหนือน้ำ ลอยอยู่ในตำแหน่งที่ทำให้อยากตามไปพอดี`,"Ein Irrlicht. Es blinkt zweimal, als würde es mir etwas zuflüstern. Vermutlich eine Lüge.":`ไฟหลอก มันกะพริบสองครั้งราวกับกระซิบบางอย่างกับฉัน คงเป็นคำโกหก`,"Ein Irrlicht dicht über dem Steg. Es riecht nach Schwefel und Schadenfreude.":`ไฟหลอกอยู่ใกล้เหนือสะพานไม้ มีกลิ่นกำมะถันและความสะใจในความทุกข์ของคนอื่น`,"Ein fahles Licht. Wo es hinführt, wartet Schlamm. Das weiß ich, weil es gleich hinter mir kichert.":`แสงซีดเซียว ที่มันนำไปคือโคลนรออยู่ ฉันรู้เพราะมันหัวเราะคิกคักอยู่ข้างหลังฉันพอดี`,Moorschlange:`งูหนองน้ำ`,"Die Schlange verdaut die Ratte. Sie sieht aus wie ein Seil mit einer Beule und guten Gründen, in Ruhe gelassen zu werden.":`งูกำลังย่อยหนูอยู่ หน้าตาเหมือนเชือกที่มีก้อนนูนหนึ่งก้อน กับเหตุผลดี ๆ ที่ควรปล่อยมันไว้ตามลำพัง`,"Eine fette Moorschlange. Sie bewacht eine vertrocknete Zunge neben sich und blickt mich an, als wüsste sie, was ich will.":`งูหนองน้ำตัวอ้วน มันเฝ้าลิ้นแห้ง ๆ อันหนึ่งที่วางอยู่ข้างตัว แล้วจ้องฉันราวกับรู้ว่าฉันต้องการอะไร`,"Eine Schlange mit der Hand greifen? Der Friedhof ist voll von Leuten, die das auch versucht haben.":`เอามือคว้างูน่ะเหรอ? สุสานเต็มไปด้วยคนที่เคยคิดแบบเดียวกันนี้แหละ`,"Ich stupse sie an. Sie öffnet ein Auge, schließt es wieder. Die Ratte war ein gutes Geschäft.":`ฉันสะกิดมันเบา ๆ มันลืมตาข้างหนึ่ง แล้วก็หลับตาต่อ หนูตัวนั้นนี่ดีลที่คุ้มจริง ๆ`,"Sie zischt, und ich ziehe die Hand sofort zurück. Ich habe meinen Arm noch gern.":`มันฟ่อ แล้วฉันก็ชักมือกลับทันที ฉันยังรักแขนตัวเองอยู่นะ`,"Eine Ratte reicht ihr. Sie ist keine Ritterin der unersättlichen Tafel.":`หนูตัวเดียวก็พอสำหรับมันแล้ว มันไม่ใช่อัศวินแห่งโต๊ะอาหารไม่รู้จักอิ่มหรอก`,"Ich lege die tote Ratte ein Stück entfernt aufs Holz. Die Schlange vergisst mich augenblicklich.":`ฉันวางหนูตายไว้บนไม้ห่างออกไปหน่อย งูลืมฉันไปในพริบตา`,"Sie schluckt die Ratte im Ganzen, langsam und selbstzufrieden, und wird träge.":`มันกลืนหนูทั้งตัว ช้า ๆ อย่างพอใจในตัวเอง แล้วก็เฉื่อยลง`,"Menschen sind weniger leicht zu bestechen. Aber nur weil sie keine Ratten mögen.":`คนน่ะติดสินบนยากกว่า แต่ก็เพราะพวกเขาไม่ชอบหนูเท่านั้นแหละ`,"Eine Wurst? Sie sieht mich an, als hätte ich ihr ein Gedicht vorgelesen. Schlangen wollen Beute, die vorher gelebt hat.":`ไส้กรอกเหรอ? มันมองฉันราวกับว่าฉันอ่านบทกวีให้ฟัง งูอยากได้เหยื่อที่เคยมีชีวิตมาก่อน`,"Brot interessiert sie nicht. Offenbar bin ich der Einzige, der in diesem Moor Kohlenhydrate schätzt.":`มันไม่สนใจขนมปัง ดูเหมือนฉันจะเป็นคนเดียวในหนองน้ำนี้ที่เห็นค่าของคาร์โบไฮเดรต`,"Eine vertrocknete, gespaltene Zunge. Die Schlange behält sie im Blick.":`ลิ้นแห้ง ๆ ที่แยกเป็นสองแฉก งูจับตาดูมันอยู่ไม่ละ`,"Die Schlange schnellt vor, ihr Kopf kaum eine Handbreit von meinen Fingern. Ich sollte sie erst ablenken.":`งูพุ่งเข้ามา หัวของมันห่างจากนิ้วฉันแค่ฝ่ามือเดียว ฉันควรหลอกล่อมันก่อน`,"Die Zunge ist hart wie Leder und riecht nach Pökelsalz. Morwenna wird sich freuen. Ich weniger.":`ลิ้นแข็งเหมือนหนัง และมีกลิ่นเกลือหมัก มอร์เวนนาต้องดีใจแน่ ส่วนฉันไม่ค่อยดีใจเท่าไหร่`,"Eine tote Ratte im Schilf. Gefunden, nicht gestohlen. Ich fasse sie mit dem Zipfel meines Ärmels.":`หนูตายตัวหนึ่งในกอกก ฉันเจอมัน ไม่ได้ขโมยมา ฉันจับมันด้วยปลายแขนเสื้อ`,"Eine tote Ratte, steif wie ein Gebet. Für manche ein Ekel, für andere ein Abendessen.":`หนูตายแข็งเป็นไม้เหมือนคำอธิษฐาน สำหรับบางคนมันน่าขยะแขยง สำหรับบางคนมันคืออาหารเย็น`,Alraune:`แมนเดรก`,"Eine Wurzel mit Armen, Beinen und einem Gesicht, das mich vorwurfsvoll ansieht. Ihr Schrei soll Menschen töten. Wer sie ausgräbt, braucht Wachs in den Ohren.":`รากไม้ที่มีแขน ขา และใบหน้าที่มองฉันอย่างตำหนิ ว่ากันว่าเสียงกรีดร้องของมันฆ่าคนได้ ใครจะขุดมันขึ้นมาต้องเอาขี้ผึ้งอุดหู`,"Kaum berühre ich die Blätter, öffnet die Wurzel den Mund. Der Schrei geht mir durch Mark und Bein.":`ฉันแค่แตะใบมันเบา ๆ รากก็อ้าปาก เสียงกรีดร้องทะลุไปถึงกระดูก`,"Ich taumele rückwärts über den Steg, mit klingelndem Schädel. Das war zu früh und zu laut.":`ฉันเซถอยหลังไปบนสะพานไม้ หัวอื้อไปหมด เร็วไปและดังไปหน่อย`,"Ich brauche etwas in den Ohren. Etwas Weiches, Dichtes. Wachs vielleicht, wie es die Seeleute tun.":`ฉันต้องมีอะไรอุดหู อะไรที่นุ่มและแน่น ขี้ผึ้งน่าจะได้ อย่างที่พวกกะลาสีทำกัน`,"Ich ziehe. Die Wurzel kreischt, ich höre es nur als fernes Summen. Dann hält sie still, beleidigt.":`ฉันดึง รากกรีดร้อง แต่ฉันได้ยินเป็นแค่เสียงหึ่ง ๆ ไกล ๆ แล้วมันก็นิ่งไป อย่างคนโกรธเคือง`,"Ein guter Moment, kein Held zu sein und Wachs zu benutzen.":`นี่เป็นเวลาที่ดีที่จะไม่เป็นวีรบุรุษ แล้วใช้ขี้ผึ้งซะ`,"Ich betrachte sie aus sicherer Entfernung. Ihre geschlossenen Augen sind kein Grund, ihr zu trauen.":`ฉันมองมันจากระยะที่ปลอดภัย การที่ตามันปิดอยู่ไม่ใช่เหตุผลที่จะไว้ใจมัน`,"Meine Ohren sind schon dicht. Ich höre nur noch mein Blut.":`หูฉันอุดแน่นแล้ว ได้ยินแต่เสียงเลือดตัวเอง`,"Ich knete das Wachs weich und stopfe es mir in die Ohren. Die Welt wird zu einem warmen, dumpfen Brummen.":`ฉันนวดขี้ผึ้งให้นุ่ม แล้วยัดเข้าหู โลกกลายเป็นเสียงหึ่ง ๆ อื้อ ๆ อุ่น ๆ`,"Jetzt kann sie schreien, wie sie will.":`ทีนี้มันจะกรีดร้องยังไงก็เชิญ`,"Alraunen brauchen kein Wasser. Sie leben vom Zorn.":`แมนเดรกไม่ต้องการน้ำ มันอยู่ได้ด้วยความโกรธ`,"Alraune verbrennen? Die Hexe würde mich verfluchen. Und ich schon die Alraune.":`เผาแมนเดรกเหรอ? แม่มดต้องสาปฉันแน่ ส่วนฉันก็สาปแมนเดรกไปแล้ว`,Tümpel:`แอ่งน้ำ`,"Trübes, grünes Moorwasser. Kleine Blasen steigen auf, als atme dort unten etwas.":`น้ำหนองสีเขียวขุ่น มีฟองเล็ก ๆ ผุดขึ้นมา ราวกับมีอะไรหายใจอยู่ข้างล่างนั่น`,"Ich tauche eine Hand hinein. Etwas Lebendiges streift meine Finger. Ich beschließe, kein Wasser mit der Hand zu holen.":`ฉันจุ่มมือลงไป มีบางอย่างที่ยังมีชีวิตเฉียดนิ้วฉัน ฉันตัดสินใจว่าจะไม่ตักน้ำด้วยมือ`,"Wasser mit den Händen tragen? Ich bin Totengräber, kein Wunder.":`ถือน้ำด้วยมือเปล่าเหรอ? ฉันเป็นคนขุดหลุมศพ ไม่ใช่นักปาฏิหาริย์`,"Ich habe schon einen Eimer voll Moorwasser.":`ฉันมีถังน้ำหนองเต็มถังอยู่แล้ว`,"Der Eimer taucht ein, und das Wasser kommt grün, dickflüssig und leise murmelnd wieder heraus.":`ถังจุ่มลงไป แล้วน้ำก็ขึ้นมา สีเขียว ข้นหนืด และพึมพำเบา ๆ`,"Sieht aus wie Suppe. Riecht wie die Suppe vom letzten Hungerjahr.":`หน้าตาเหมือนซุป กลิ่นเหมือนซุปของปีที่อดอยากครั้งล่าสุด`,"Wenn das Gas hier brennt, ist es das letzte Licht, das ich sehe.":`ถ้าแก๊สตรงนี้ลุกไหม้ มันจะเป็นแสงสุดท้ายที่ฉันได้เห็น`,"Hohler Baumstumpf":`ตอไม้กลวง`,"Ein hohler Baumstumpf, glatt wie ein Mund. Jemand benutzt ihn als Vorratskammer, und ich ahne, wer.":`ตอไม้กลวงเรียบเหมือนปาก มีใครสักคนใช้มันเป็นห้องเก็บของ และฉันพอเดาได้ว่าใคร`,"Im Stumpf":`ในตอไม้`,"Leer. Selbst die Würmer sind ausgezogen.":`ว่างเปล่า แม้แต่หนอนก็ย้ายออกไปแล้ว`,Ochsenskelett:`โครงกระดูกวัว`,"Das Skelett eines Zugochsen. Er hat wohl Geduld bewiesen, bis zum letzten Schritt. Zwischen den Rippen liegt etwas.":`โครงกระดูกของวัวลากเกวียน มันคงอดทนถึงก้าวสุดท้าย ระหว่างซี่โครงมีบางอย่างวางอยู่`,"Zwischen den Rippen":`ระหว่างซี่โครง`,"Ferne Türme":`หอคอยไกล ๆ`,"Hinter Nebel und Wasser ragen Türme auf: Burg Grauwacht. So nah, dass man sie sehen kann, so fern, dass man vorher sterben könnte.":`เหนือหมอกและผืนน้ำมีหอคอยตระหง่านขึ้นมา ปราสาทเกราวัคท์ ใกล้พอที่จะมองเห็น แต่ไกลพอที่คนจะตายก่อนไปถึง`,"Toter Riesenbaum":`ต้นไม้ยักษ์ที่ตายแล้ว`,"Ein gewaltiger, toter Baum, behängt mit Moos wie mit Trauerfahnen. Er sieht aus, als hätte er früher Krieg gegen den Himmel geführt.":`ต้นไม้ยักษ์ใหญ่ที่ตายแล้ว มีมอสห้อยเหมือนธงไว้อาลัย ดูเหมือนมันเคยทำสงครามกับท้องฟ้า`,"Ich nehme einen Ast mit? Das ganze Moor ist aus Ästen gemacht. Ich nehme lieber Abstand.":`ฉันจะเอากิ่งไม้ไปด้วยเหรอ? หนองน้ำทั้งผืนนี้ทำจากกิ่งไม้ ฉันขอเก็บระยะห่างไว้ดีกว่า`,"Verrottete Pfähle":`เสาไม้ผุพัง`,"Schwarze, schiefe Pfähle ragen aus dem Wasser. Einst ein Steg, ein Zaun oder ein Galgen. Im Moor sind die Grenzen fließend.":`เสาไม้ดำเอียง ๆ โผล่พ้นน้ำ ครั้งหนึ่งอาจเป็นสะพาน รั้ว หรือตะแลงแกง ในหนองน้ำ เส้นแบ่งมันเลือนรางอยู่แล้ว`,Schilf:`กกอ้อ`,"Dichtes Schilf mit braunen Kolben. Es raschelt, auch wenn kein Wind geht. Ich gehe davon aus, dass das nicht der Wind ist.":`กกอ้อหนาทึบ มีรวงสีน้ำตาล มันไหวซู่ซ่าแม้ไม่มีลม ฉันเดาว่านั่นไม่ใช่ลมแน่`,"Ich teile das Schilf. Dahinter ist nur noch mehr Schilf. Und etwas, das sich hastig wegbewegt.":`ฉันแหวกกกออก ข้างหลังมีแต่กกเพิ่มอีก กับบางสิ่งที่รีบหนีไปอย่างลนลาน`,"Ohne Gegengift nach Grauwacht? Dann komme ich mit leeren Händen. Der König wartet nicht ewig.":`ไม่มียาแก้พิษแล้วจะไปเกราวัคท์เหรอ? ฉันก็ไปมือเปล่าน่ะสิ กษัตริย์ไม่รอตลอดไปหรอก`,"Der Weg hinaus führt an den Geistern des Moores vorbei. Ohne Schutz gehe ich nicht.":`ทางออกต้องผ่านวิญญาณแห่งหนองน้ำ ถ้าไม่มีอะไรป้องกัน ฉันไม่ไป`,"Ein Gegengift, ein Rabenschädel an einer Schnur und ein Schwert, das ich selbst gemacht habe.":`ยาแก้พิษ หัวกะโหลกอีการ้อยเชือก กับดาบที่ฉันทำเอง`,"Das hätte ich Brandt gerne gezeigt. Nun gut. Grauwacht.":`ถ้าบรานท์ได้เห็นคงดี ก็ช่างเถอะ ไปเกราวัคท์กัน`,"Kapitel 3":`บทที่ 3`,"Morwennas Hütte":`กระท่อมของมอร์เวนนา`,"Drinnen ist es warm, es riecht nach Kräutern, Kerzenwachs und etwas, das früher ein Tier war.":`ข้างในอบอุ่น มีกลิ่นสมุนไพร ขี้ผึ้งเทียน และบางอย่างที่เคยเป็นสัตว์`,"Hinaus ins Moor":`ออกไปที่หนองน้ำ`,"Die Tür zum Moor. Draußen warten Nebel und Schlamm.":`ประตูสู่หนองน้ำ ข้างนอกมีหมอกกับโคลนรออยู่`,"Morwenna, die Moorhexe. Sie sieht aus wie jemand, der drei Pestjahre überlebt hat und den Rest für unhöflich hält.":`มอร์เวนนา แม่มดแห่งหนองน้ำ หน้าตาเหมือนคนที่รอดจากกาฬโรคมาสามปี แล้วคิดว่าที่เหลือเป็นความไร้มารยาท`,"Sieh an. Ein Totengräberjunge, der freiwillig durchs Moor spaziert. Die Irrlichter haben dich nicht gefressen.":`อ้าว ลูกมือคนขุดหลุมศพที่เดินเล่นผ่านหนองน้ำด้วยความสมัครใจ ไฟผีไม่ได้กินเธอสินะ`,"Ich habe ihnen ein paar Laternen gezeigt. Sie waren beeindruckt.":`ฉันเอาโคมไฟให้พวกมันดูหน่อย พวกมันประทับใจ`,"Die Laternen. Hm. Der Reim vom Totem. Du kannst lesen, oder du bist zufällig klug. Setz dich nicht, du verschmutzt die Stühle.":`โคมไฟ อืม กลอนเรื่องเสาโทเทม เธออ่านออก ไม่ก็บังเอิญฉลาด อย่านั่งนะ เดี๋ยวเก้าอี้เปื้อน`,"Morwenna. Heilerin, Hexe, Nachbarin. Je nachdem, wen du fragst und ob gerade jemand krank ist.":`มอร์เวนนา หมอยา แม่มด เพื่อนบ้าน แล้วแต่ว่าจะถามใคร และตอนนั้นมีใครป่วยอยู่หรือเปล่า`,"Die Leute aus dem Dorf holen mich, wenn sie sterben. Und verbrennen mich, wenn sie nicht sterben.":`คนในหมู่บ้านมาหาข้าตอนจะตาย แล้วก็เผาข้าตอนไม่ตาย`,"Ich brauche ein Gegengift gegen Schierling.":`ฉันต้องการยาแก้พิษเฮมล็อก`,"Schierling. Der König, nehme ich an. Der Rabenorden sucht Hilfe, wenn es zu spät ist.":`เฮมล็อก กษัตริย์สินะ ข้าเดานะ คณะอีกาหาคนช่วยก็ตอนสายเกินไปแล้ว`,"Wenn Ihr es nicht tut, stirbt er. Und ich werde nie Ritter.":`ถ้าท่านไม่ช่วย เขาจะตาย แล้วฉันก็จะไม่มีวันได้เป็นอัศวิน`,"Zwei gute Gründe, einer davon egoistisch. Ich mag dich schon fast.":`เหตุผลดี ๆ สองข้อ ข้อหนึ่งเห็นแก่ตัว ข้าเกือบจะชอบเจ้าแล้ว`,"Ich braue es nicht für dich. Du brauchst es selbst, mit deinen Händen, unter meinen Augen. Fünf Dinge, in genau dieser Reihenfolge:":`ข้าไม่ต้มให้เจ้าหรอก เจ้าต้องทำเอง ด้วยมือเจ้าเอง ใต้สายตาข้า ห้าอย่าง เรียงตามลำดับนี้เป๊ะ ๆ:`,"„Erst das Nasse aus dem Moor. Dann das Leichte, das fliegt. Dann das Tiefe, das schreit. Dann das Böse, das züngelt. Und zuletzt das Feuer.“":`„ก่อนอื่นของเปียกจากหนองน้ำ แล้วของเบาที่บินได้ แล้วของลึกที่กรีดร้อง แล้วของชั่วที่แลบลิ้น และสุดท้ายคือไฟ“`,"Wasser, Feder, Wurzel, Zunge, Feuer. Ich kann mir Reihenfolgen merken. Mein Beruf besteht daraus.":`น้ำ ขนนก ราก ลิ้น ไฟ ฉันจำลำดับได้ งานฉันก็คือเรื่องนี้แหละ`,"Gib die Dinge in den Kessel, wenn du sie hast. Einmal falsch, und er spuckt. Ich habe schon eine Katze verloren, aber nur an eine Ratte.":`พอได้ของแล้วก็ใส่ลงหม้อ ผิดทีเดียวมันก็พ่นออกมา ข้าเคยเสียแมวไปตัวหนึ่ง แต่เสียให้หนูเท่านั้นนะ`,"Wie war die Reihenfolge noch mal?":`ลำดับเป็นยังไงนะ?`,"Das Nasse. Das Leichte. Das Tiefe. Das Böse. Das Feuer.":`ของเปียก ของเบา ของลึก ของชั่ว ไฟ`,"Nasses ist im Moor, Leichtes hat Flügel, Tiefes hat Wurzeln, Böses hat eine gespaltene Zunge.":`ของเปียกอยู่ในหนองน้ำ ของเบามีปีก ของลึกมีราก ของชั่วมีลิ้นแยกสองแฉก`,"Wo finde ich die Zutaten?":`จะหาส่วนผสมได้ที่ไหน?`,"Draußen auf dem Steg, nicht in meiner Hütte. Ich lasse mich nicht ausrauben, ich lasse mich nur besuchen.":`ข้างนอกบนสะพานไม้ ไม่ใช่ในกระท่อมข้า ข้าไม่ยอมให้ใครปล้น ข้ายอมให้มาเยี่ยมเท่านั้น`,"Das Wasser: Dein Eimer tut es im Tümpel. Ich trinke es nicht, aber das ist Geschmackssache.":`น้ำ ถังของเจ้าใช้ได้ที่แอ่งน้ำ ข้าไม่ดื่มมันหรอก แต่นั่นเรื่องรสนิยม`,"Federn: Wo Krähen auf Schädeln sitzen, fallen sie. Das Totem am Anfang des Stegs.":`ขนนก ที่ไหนมีอีกาเกาะอยู่บนหัวกะโหลก ที่นั่นขนก็ร่วง เสาโทเทมตรงต้นสะพานไม้`,"Alraune: Wächst am Steg. Zieh sie nie aus ohne Wachs in den Ohren. Mein Kommodenwachs steht dir in der mittleren Schublade zu.":`แมนเดรก ขึ้นอยู่ตามสะพานไม้ อย่าถอนขึ้นมาโดยไม่มีขี้ผึ้งอุดหู ขี้ผึ้งในตู้ลิ้นชักของข้า ลิ้นชักกลาง เจ้าหยิบได้`,"Zunge: Die Schlange sitzt drauf. Lenk sie ab. Schlangen mögen, was gestorben ist. Wie ich.":`ลิ้น งูนั่งทับอยู่ ล่อมันออกไป งูชอบของที่ตายแล้ว เหมือนข้า`,"Wieso ist da ein Rabe im Käfig?":`ทำไมมีอีกาอยู่ในกรงล่ะ?`,"Weil er mir gestern noch die Perlen für den Rosenkranz gestohlen hat. Jetzt ist er mein Berater. Er redet mehr als ich und hat selten recht.":`เพราะเมื่อวานมันขโมยลูกปัดสายประคำข้า ตอนนี้มันเป็นที่ปรึกษาข้า มันพูดมากกว่าข้า แล้วก็ถูกน้อยครั้ง`,"Er mag Brot. Wer ihn füttert, bekommt gute Ratschläge. Meistens.":`มันชอบขนมปัง ใครให้อาหารมันก็ได้คำแนะนำดี ๆ ส่วนใหญ่นะ`,"Was verbirgt das Tuch auf dem Spiegel?":`ผ้าที่คลุมกระจกซ่อนอะไรอยู่?`,"Was ich gestern gesehen habe, will ich heute nicht wiedersehen. Der Spiegel zeigt nicht, was ist. Er zeigt, was kommt.":`สิ่งที่ข้าเห็นเมื่อวาน ข้าไม่อยากเห็นอีกวันนี้ กระจกไม่ได้แสดงสิ่งที่เป็นอยู่ มันแสดงสิ่งที่จะมา`,"Fass ihn an, wenn du es wagst. Aber heul mir nicht vor.":`ถ้ากล้าก็แตะมัน แต่อย่ามาร้องไห้กับข้านะ`,"Der Kanzler Malvor. Kennt Ihr ihn?":`ท่านอัครเสนาบดีมัลวอร์ ท่านรู้จักเขาไหม?`,"Malvor. Ein Mann in schwarzem Talar, der aufs Moor starrte, als wollte er es kaufen.":`มัลวอร์ ชายในชุดคลุมดำที่จ้องมองหนองน้ำราวกับจะซื้อมัน`,"Er war letzten Winter hier. Wollte Schierling „gegen Ratten“. Ich habe Ratten gesehen, die ihm sehr ähnlich sehen.":`เขามาที่นี่ฤดูหนาวที่แล้ว อยากได้เฮมล็อก „ไว้กำจัดหนู“ ข้าเคยเห็นหนูที่หน้าตาเหมือนเขามาก`,"Ihr habt ihm Schierling gegeben?":`ท่านให้เฮมล็อกเขาไปเหรอ?`,"Nein. Ich habe ihm Nesseltee gegeben. Und ein Gefühl, ich hätte ihn durchschaut. Jetzt weiß ich es sicher.":`ไม่ ข้าให้ชาตำแยเขาไป กับความรู้สึกว่าข้ามองเขาออก ตอนนี้ข้ามั่นใจแล้ว`,"Was verlangt Ihr für Euren Talisman?":`ท่านต้องการอะไรเป็นค่าเครื่องรางของท่าน?`,"Erst das Gegengift. Dann reden wir. Ich verschenke nichts, bevor ich weiß, ob du es wert bist.":`ยาแก้พิษก่อน แล้วค่อยคุยกัน ข้าไม่แจกอะไรฟรีก่อนจะรู้ว่าเจ้าคู่ควร`,"Könnte ich ein Gefäß für das Gegengift bekommen?":`ขอภาชนะใส่ยาแก้พิษได้ไหม?`,"Ohne Flasche? Dann schöpfst du es mit den Händen. Nein. Hier.":`ไม่มีขวดเหรอ? งั้นก็ตักด้วยมือสิ ไม่ล่ะ นี่ รับไป`,"Sie wirft mir eine staubige Flasche zu. Ich fange sie knapp.":`เธอโยนขวดเก่าเต็มฝุ่นมาให้ ฉันรับได้หวุดหวิด`,"Was wisst Ihr über den Drachen im Vulkan?":`ท่านรู้อะไรเกี่ยวกับมังกรในภูเขาไฟบ้าง?`,"Aschenschlund. Man erzählt, er hütet ein Vermögen aus Gold. Nein. Ich war einmal in meiner Jugend in seinem Rauch.":`อาชเชนชลุนด์ เขาเล่าว่ามันเฝ้าทองคำมหาศาล ไม่หรอก ตอนหนุ่ม ๆ ข้าเคยเข้าไปอยู่ในควันของมันครั้งหนึ่ง`,"Der Drache hütet kein Gold, Junge. Er hütet ein Ei. Das Gold ist sein Nestpolster.":`มังกรไม่ได้เฝ้าทองคำหรอก เจ้าหนู มันเฝ้าไข่ ทองคำเป็นแค่เบาะรองรัง`,"Ein Ei? Dann ist er kein Ungeheuer. Er ist ein Vater. Oder eine Mutter.":`ไข่เหรอ? งั้นมันก็ไม่ใช่อสุรกาย มันเป็นพ่อ หรือไม่ก็แม่`,"Er ist beides, wenn es sein muss. Denk daran, wenn dein Schwert zu laut wird.":`มันเป็นทั้งสองอย่างถ้าจำเป็น จำไว้เวลาดาบเจ้าเสียงดังเกินไป`,"Geh, bevor die Katze dich verflucht. Und nimm dein Schwert mit. Am besten auch ein bisschen Verstand.":`ไปซะ ก่อนที่แมวจะสาปเจ้า แล้วเอาดาบไปด้วย ถ้าเอาสมองไปด้วยสักหน่อยก็ดี`,"Ich gehe jetzt.":`ฉันไปแล้วนะ`,"Mein Liebestrank! Der war für Hans, den Köhler. Er hat ihn nie bekommen. Gut, dass du ihn gefunden hast, bevor er sich verliebt.":`ยารักของข้า! นั่นมันของฮันส์ คนเผาถ่าน เขาไม่เคยได้รับเลย ดีแล้วที่เจ้าเจอมันก่อนเขาจะตกหลุมรัก`,"Morwenna steckt die Flasche weg. Die Truhe schließt sich von selbst, jemand sollte sich vor ihr in Acht nehmen.":`มอร์เวนนาเก็บขวดเข้าที่ หีบปิดลงเอง ใครสักคนควรระวังมันไว้`,"Silber für mich? Das ist die erste ehrliche Geste seit Jahren. Aber ich brauche es nicht. Behalte es für deine Zukunft.":`เงินให้ข้าเหรอ? นี่เป็นน้ำใจที่จริงใจครั้งแรกในรอบหลายปี แต่ข้าไม่ต้องการหรอก เก็บไว้เพื่ออนาคตเจ้าเถอะ`,"Eine tote Ratte? Danke, aber ich esse zu Mittag keine Nagetiere. Gib sie der Schlange.":`หนูตายเหรอ? ขอบใจ แต่ข้าไม่กินสัตว์ฟันแทะตอนมื้อกลางวัน เอาไปให้งูเถอะ`,Hexenkessel:`หม้อแม่มด`,"Der Kessel ist leer, nur ein türkiser Rand erinnert an das Gegengift.":`หม้อว่างเปล่า เหลือแค่ขอบสีเทอร์ควอยซ์ที่เตือนใจถึงยาแก้พิษ`,"Das Gebräu kocht türkis und ruhig. Es fehlt nur noch ein Gefäß.":`น้ำยาเดือดสีเทอร์ควอยซ์ นิ่งสงบ ขาดแค่ภาชนะ`,"Ein dreibeiniger Eisenkessel in der Feuerstelle. Er riecht nach vielen Versuchen und manchen Opfern.":`หม้อเหล็กสามขาตั้งอยู่ในเตา มีกลิ่นของการทดลองมากมายและผู้เคราะห์ร้ายบางราย`,"Er wiegt mehr als ein Ochse. Und er gehört einer Hexe.":`มันหนักกว่าวัวตัวหนึ่ง แล้วยังเป็นของแม่มดอีก`,"Er ist leer. Mehr kann ich hier nicht tun.":`มันว่างเปล่า ฉันทำอะไรต่อที่นี่ไม่ได้แล้ว`,"Ich brauche eine Flasche, um das Gegengift abzufüllen.":`ฉันต้องมีขวดไว้ใส่ยาแก้พิษ`,"Ein leerer Kessel, kalt. Die Zutaten müssten erst hinein, in der richtigen Reihenfolge.":`หม้อว่างเปล่าเย็นเฉียบ ต้องใส่ส่วนผสมลงไปก่อน เรียงลำดับให้ถูก`,"Ein leerer Eimer in den Kessel? Das hilft niemandem. Er muss voller Moorwasser sein.":`เอาถังเปล่าใส่หม้อเหรอ? ไม่ช่วยใครเลย มันต้องเต็มไปด้วยน้ำหนอง`,"Wachs im Gegengift? Dann sterbe ich an Verstopfung.":`ขี้ผึ้งในยาแก้พิษเหรอ? งั้นฉันตายเพราะท้องผูกแน่`,"Meine Wurst! Aus meinem Kessel! Nur über meine Leiche!":`ไส้กรอกของข้า! จากหม้อของข้า! ข้ามศพข้าไปก่อนเถอะ!`,"Rattensuppe. Ich habe schon Schlimmeres gerochen, aber nur bei Beerdigungen.":`ซุปหนู ฉันเคยได้กลิ่นที่แย่กว่านี้ แต่ก็แค่ในงานศพ`,"Der Fliegenpilz würde das Gegengift nicht heilen, sondern lustig machen.":`เห็ดมีพิษไม่ได้ทำให้ยาแก้พิษหาย มันจะทำให้ขำเฉย ๆ`,"Fieberkraut im Gegengift? Das ist eine andere Krankheit, Bran.":`หญ้าไข้ในยาแก้พิษเหรอ? นั่นมันโรคอีกอย่างนะ บราน`,"Der Kessel ist leer. Die Flasche kann sich ausruhen.":`หม้อว่างเปล่า ขวดพักผ่อนไปก่อนได้`,"Der Kessel ist noch nicht fertig. Ein leeres Fläschchen in einer kalten Suppe hilft nicht.":`หม้อยังไม่เสร็จ ขวดเล็กเปล่า ๆ ในซุปเย็น ๆ ไม่ช่วยอะไร`,"Ich tauche die Flasche ein. Das Gebräu fließt hinein, leuchtend türkis, warm wie frisches Blut.":`ฉันจุ่มขวดลงไป น้ำยาไหลเข้ามา สีเทอร์ควอยซ์เรืองแสง อุ่นเหมือนเลือดสด`,"Sieh an. Du hast es nicht verdorben. Das kommt höchstens bei einem von zehn vor. Und die anderen neun sind gestorben.":`ดูสิ เจ้าไม่ทำพัง นั่นเกิดขึ้นแค่หนึ่งในสิบ แล้วอีกเก้าคนก็ตายไป`,"Eine Frage noch: Fehlt mir eigentlich Silber? Ich zähle meine Münzen jeden Abend.":`ขอถามอีกข้อ ฉันขาดเงินไปหรือเปล่า? ฉันนับเหรียญทุกเย็นเลยนะ`,"Ja, hier ist Euer Silber zurück.":`ใช่ นี่เงินของท่านคืนให้`,"Ich weiß nicht, wovon Ihr sprecht.":`ฉันไม่รู้ว่าท่านพูดถึงอะไร`,"Ehrlichkeit. Der Rabenorden wird einen Narren mehr bekommen. Aber einen guten.":`ความซื่อสัตย์ คณะอีกาจะได้คนโง่เพิ่มอีกหนึ่ง แต่เป็นคนโง่ที่ดี`,"Ich habe es leider schon ausgegeben. Es tut mir leid.":`น่าเสียดาย ฉันใช้ไปแล้ว ขอโทษด้วย`,"Dann schuldest du mir etwas. Ich schreibe es auf. Schulden sind das Einzige, was Ritter nicht überleben.":`งั้นเจ้าก็เป็นหนี้ข้า ข้าจะจดไว้ หนี้เป็นสิ่งเดียวที่อัศวินรอดชีวิตไม่ได้`,"Du lügst schlecht. Aber ich lasse es dir durchgehen. Der Talisman schützt dich nicht vor deinem Gewissen.":`เจ้าโกหกไม่เก่ง แต่ข้าจะปล่อยผ่าน เครื่องรางไม่ได้ป้องกันเจ้าจากมโนธรรมของเจ้าหรอก`,"Nimm. Das hier ist der Talisman. Er hält die Geister des Moores fern, wenn du wieder hinausgehst. Und die Irrlichter sowieso.":`เอาไป นี่คือเครื่องราง มันจะไล่วิญญาณแห่งหนองน้ำให้ห่างตอนเจ้าออกไปอีกครั้ง ไฟผีก็เหมือนกัน`,"Ein winziger Rabenschädel an einer Lederschnur. Er ist kalt, aber nicht unfreundlich.":`หัวกะโหลกอีกาจิ๋วห้อยบนเชือกหนัง เย็นเฉียบ แต่ไม่ได้ดูไม่เป็นมิตร`,"Geh jetzt nach Osten. Und Junge: Wenn du es nicht brauchst, trink es nicht selbst.":`ไปทางตะวันออกซะ แล้วเจ้าหนู ถ้าไม่จำเป็นก็อย่าดื่มเอง`,"Ich werde es nicht trinken. Aber danke. Wirklich.":`ฉันจะไม่ดื่มหรอก แต่ขอบคุณนะ จริง ๆ`,"Frag mich nach dem Drachen, bevor du gehst. Du wirst es brauchen.":`ถามข้าเรื่องมังกรก่อนไป เจ้าจะต้องใช้`,Kommode:`ตู้ลิ้นชัก`,"Eine breite Kommode aus dunklem Holz, gekrönt von Mäuseköttel. Die Schubladen haben Griffe aus Rabenfüßen.":`ตู้ลิ้นชักกว้างไม้สีเข้ม มีขี้หนูกองอยู่ด้านบนเหมือนมงกุฎ ลิ้นชักมีที่จับเป็นตีนอีกา`,"Die oberste Schublade. Der Griff ist ein vertrockneter Rabenfuß. Er zuckt nicht, soweit ich sehe.":`ลิ้นชักบนสุด ที่จับเป็นตีนอีกาแห้ง ๆ มันไม่กระตุก เท่าที่ฉันเห็น`,"Mittlere Schublade":`ลิ้นชักกลาง`,"Die mittlere Schublade. Sie klemmt ein wenig, als wollte sie ihre Geheimnisse behalten.":`ลิ้นชักกลาง มันติดฝืด ๆ ราวกับอยากเก็บความลับไว้`,"Die unterste Schublade. Staub und Spinnweben haben sie zusammengeklebt.":`ลิ้นชักล่างสุด ฝุ่นกับใยแมงมุมเกาะติดจนมันแน่นสนิท`,"Verschlossene Truhe":`หีบที่ล็อกอยู่`,"Mit einem schweren Schloss gesichert. Ohne Schlüssel keine Chance, und mit dem Schwert breche ich lieber keine Hexenkiste auf.":`ล็อกด้วยกุญแจใหญ่ ไม่มีกุญแจก็หมดหวัง และฉันไม่อยากงัดหีบแม่มดด้วยดาบหรอก`,"Der Schlüssel dreht sich, und das Schloss gibt mit einem Seufzer nach.":`กุญแจหมุน แล้วแม่กุญแจก็ยอมเปิดพร้อมเสียงถอนหายใจ`,"Eine alte Holztruhe mit Eisenbeschlägen. Das Schloss ist größer als mein Gesicht. Kratzspuren am Rand: Die Katze hat es versucht.":`หีบไม้เก่าหุ้มเหล็ก แม่กุญแจใหญ่กว่าหน้าฉันอีก มีรอยข่วนที่ขอบ แมวเคยลองมาแล้ว`,"In der Truhe":`ในหีบ`,"Silber, offen auf dem Boden. Für eine Hexe etwas leichtsinnig. Für mich ein Problem.":`เงินวางอยู่บนพื้นโล่ง ๆ สำหรับแม่มดนี่ประมาทไปหน่อย สำหรับฉันนี่คือปัญหา`,"Schwarze Katze":`แมวดำ`,"Die Katze streckt sich zufrieden. Sie sieht aus, als hätte sie einen Handel gewonnen.":`แมวบิดขี้เกียจอย่างพอใจ ดูเหมือนมันชนะดีลมา`,"Eine pechschwarze Katze. Sie sitzt auf etwas Glänzendem und starrt mich an, als hielte sie mich für sehr dumm. Vielleicht hat sie recht.":`แมวดำสนิท มันนั่งทับของวาว ๆ อยู่ แล้วจ้องฉันราวกับคิดว่าฉันโง่มาก บางทีมันอาจถูก`,"Miau. Ich übersetze: „Gern geschehen.“":`เมี้ยว ฉันแปลให้: „ยินดีที่ได้ช่วย“`,"Ich rede mit der Katze. Sie blinzelt langsam. Entweder Verachtung oder Zuneigung. Bei Katzen ist es dasselbe.":`ฉันคุยกับแมว มันกะพริบตาช้า ๆ ไม่ดูถูกก็รัก สำหรับแมวสองอย่างนี้ก็เหมือนกัน`,"Ich greife nach ihr. Sie faucht. Die Handnarbe wird mir eine Lehre sein.":`ฉันเอื้อมมือไปหามัน มันฟ่อ แผลเป็นที่มือจะเป็นบทเรียนให้ฉัน`,"Sie lässt sich kurz streicheln und dann nie wieder.":`มันยอมให้ลูบแป๊บเดียว แล้วก็ไม่มีอีกเลย`,"Sie sitzt auf einem Schlüssel, da bin ich fast sicher. Sie wird ihn nicht freiwillig hergeben. Vielleicht gegen etwas Essbares.":`มันนั่งทับกุญแจอยู่ ฉันเกือบแน่ใจ มันไม่ยอมให้ง่าย ๆ หรอก บางทีอาจแลกกับของกินได้`,"Sie hat schon genug. Die Katze hat immer genug, wenn man es nicht anbietet.":`มันอิ่มแล้ว แมวอิ่มเสมอ ถ้าไม่มีใครยื่นอะไรให้`,"Die Katze riecht an der Wurst. Dann nimmt sie sie, zieht sie in einen Winkel und verschwindet damit.":`แมวดมไส้กรอก แล้วคาบมันไปลากเข้ามุม แล้วหายตัวไปพร้อมกับมัน`,"An der Stelle, wo sie saß, liegt ein schwerer Eisenschlüssel.":`ตรงที่มันนั่งอยู่ มีกุญแจเหล็กหนัก ๆ วางอยู่`,"Ein Handel. Ich habe schon unter Menschen schlechtere erlebt.":`ดีลหนึ่ง ฉันเคยเจอดีลที่แย่กว่านี้ในหมู่มนุษย์`,"Die Katze betrachtet die tote Ratte. Dann mich. Das ist eine Beleidigung, soweit ich Katzen verstehe.":`แมวมองหนูตาย แล้วมองฉัน นั่นคือการดูหมิ่น เท่าที่ฉันเข้าใจแมว`,"Sie gähnt. Knochen sind etwas für Hunde.":`มันหาว กระดูกเป็นของหมา`,"Katzen und Brot. Das ist wie Mönche und Alkohol: In der Theorie ablehnend.":`แมวกับขนมปัง เหมือนพระกับเหล้า ในทฤษฎีก็ปฏิเสธ`,"Ein schwerer Eisenschlüssel, noch warm von der Katze. Er passt zur Truhe, schätze ich.":`กุญแจเหล็กหนัก ๆ ยังอุ่นจากตัวแมว ฉันว่ามันน่าจะไขหีบได้`,Rabenkäfig:`กรงอีกา`,"Ein Käfig, und darin ein Rabe, der aussieht, als hätte er viele Ratschläge für die Welt, aber niemand fragt ihn.":`กรงหนึ่ง ข้างในมีอีกาที่ดูเหมือนมีคำแนะนำให้โลกมากมาย แต่ไม่มีใครถาม`,"Ich nehme der Hexe nicht ihren Raben. Ich möchte weiterhin einen Kopf haben.":`ฉันไม่เอาอีกาของแม่มดหรอก ฉันอยากมีหัวติดตัวต่อไป`,"Ich öffne den Riegel einen Spalt. „Kraah! Lass das, Totengräber!“ sagt der Rabe. Die Tür fällt wieder zu.":`ฉันเปิดสลักให้แง้มนิดหน่อย „กรั๊าก! เลิกนะ คนขุดหลุมศพ!“ อีกาพูด ประตูปิดกลับลงมา`,"Kraah! Totengräber! Frischer Totengräber! Erst nass! Dann leicht! Dann tief! Dann böse! Dann heiß! Kraah!":`กรั๊าก! คนขุดหลุมศพ! คนขุดหลุมศพมือใหม่! ก่อนอื่นเปียก! แล้วเบา! แล้วลึก! แล้วชั่ว! แล้วร้อน! กรั๊าก!`,"Der Rabe kennt das Rezept. Beeindruckend, und beunruhigend.":`อีการู้สูตร น่าประทับใจ และน่าไม่สบายใจ`,"Der Rabe stürzt sich auf das Brot, kaut mit schiefem Kopf und blinzelt mich an.":`อีกาโผเข้าหาขนมปัง เคี้ยวหัวเอียง ๆ แล้วกะพริบตาใส่ฉัน`,"Gut! Gut! Hör zu: Nicht den Kessel füttern, bevor die Rechnung stimmt! Nass, leicht, tief, böse, Feuer! Kraah!":`ดี! ดี! ฟังนะ: อย่าป้อนหม้อก่อนที่บัญชีจะลงตัว! เปียก เบา ลึก ชั่ว ไฟ! กรั๊าก!`,"Der Rabe starrt auf die Wurst und dann auf die Katze. „Teile nie mit der Katze!“ krächzt er. Eine weise Warnung.":`อีกาจ้องไส้กรอก แล้วจ้องแมว „อย่าแบ่งให้แมว!“ มันร้องเสียงแหบ คำเตือนที่ฉลาด`,"Verhüllter Spiegel":`กระจกที่คลุมผ้า`,"Ein hoher Spiegel, unter schwarzem Tuch versteckt. An den Rändern schimmert etwas wie Silber und schlechtes Gewissen.":`กระจกบานสูงซ่อนอยู่ใต้ผ้าดำ ที่ขอบมีบางอย่างเงาวาวเหมือนเงินกับมโนธรรมที่ไม่สบายใจ`,"Der Spiegel ist festgenagelt, aus gutem Grund.":`กระจกถูกตอกตะปูติดไว้ ด้วยเหตุผลที่ดี`,"Ich ziehe das Tuch ein Stück zur Seite. Im Glas liegt kein Gesicht, sondern Rauch.":`ฉันดึงผ้าออกไปนิดหน่อย ในกระจกไม่มีใบหน้า มีแต่ควัน`,"Im Rauch erscheinen Bilder: ein glühender Berg, ein riesiger Schatten, der etwas Rundes wärmt. Eine schwarze Gestalt nähert sich ihm.":`ในควันมีภาพปรากฏ ภูเขาร้อนแดง เงาขนาดมหึมาที่กำลังอุ่นบางอย่างกลม ๆ ร่างสีดำเข้าใกล้มัน`,"Die schwarze Gestalt hält ein goldenes Horn. Dann reißt der Rauch.":`ร่างสีดำถือเขาสีทอง แล้วควันก็ขาดหาย`,"Ein Drache. Und ein Ei. Und der Kanzler Malvor mit einem Horn, wenn mich nicht alles täuscht.":`มังกร กับไข่ และอัครเสนาบดีมัลวอร์ถือเขา ถ้าฉันไม่ได้ตาฝาดไปหมด`,"Der Rauch zeigt noch einmal denselben Berg. Ich ziehe das Tuch wieder zu, bevor er mir mehr verrät, als ich wissen will.":`ควันแสดงภูเขาลูกเดิมอีกครั้ง ฉันดึงผ้าปิดกลับก่อนที่มันจะบอกฉันมากกว่าที่ฉันอยากรู้`,"Finger weg vom Spiegel! Er verbraucht dich, wenn du zu oft hineinschaust.":`อย่าแตะกระจก! มันจะสูบเจ้าถ้าเจ้ามองเข้าไปบ่อยเกินไป`,"Wachs auf einen Zauberspiegel. Das sollte ich nie gesagt haben.":`เอาขี้ผึ้งป้ายกระจกวิเศษเหรอ ไม่น่าพูดเลย`,Hexenbesen:`ไม้กวาดแม่มด`,"Ein alter Reisigbesen. Er lehnt an der Wand wie ein Betrunkener an der Kirchentür. Ob er fliegt? Ich frage lieber nicht.":`ไม้กวาดกิ่งไม้เก่า มันพิงผนังเหมือนคนเมาพิงประตูโบสถ์ มันบินได้ไหม? ไม่ถามดีกว่า`,"Ein Besen nützt mir nichts. Ich fliege nicht. Ich gehe zu Fuß, mit Blasen.":`ไม้กวาดไม่มีประโยชน์กับฉัน ฉันไม่บิน ฉันเดินด้วยเท้า พร้อมตุ่มพอง`,"Der Boden ist so sauber, wie er in einem Hexenhaus sein kann. Also nicht.":`พื้นสะอาดเท่าที่บ้านแม่มดจะสะอาดได้ นั่นคือไม่สะอาด`,"Ich fege die Ecke neben der Tür. Staub, Spinnweben, ein Mäuseskelett. Und etwas Kleines, Glänzendes.":`ฉันกวาดมุมข้างประตู ฝุ่น ใยแมงมุม โครงกระดูกหนู แล้วก็บางอย่างเล็ก ๆ วาว ๆ`,"Ich bin immer wieder froh, wenn jemand mein Elend sichtbar macht.":`ฉันดีใจทุกครั้งที่มีใครทำให้ความอับโชคของฉันเห็นได้ชัด`,"Ein Messingknopf, unter dem Staub verborgen. Von einem Soldatenrock vielleicht. Oder von einem Ritter, der sein Hemd verlor.":`กระดุมทองเหลืองซ่อนอยู่ใต้ฝุ่น อาจมาจากเสื้อทหาร หรือจากอัศวินที่ทำเสื้อหาย`,"Alter Sessel":`เก้าอี้เก่า`,"Ein durchgesessener Lehnstuhl mit einem Kissen aus Rabenfedern. Die Feder da sieht beinahe frisch aus.":`เก้าอี้นวมที่ยุบเพราะถูกนั่งมานาน มีหมอนยัดขนอีกา ขนตรงนั้นดูเหมือนยังใหม่อยู่`,"Ich setze mich kurz. Das Kissen knirscht. Ich stehe wieder auf.":`ฉันนั่งแป๊บเดียว หมอนลั่นเอี๊ยด ฉันลุกขึ้นอีกครั้ง`,"Der Sessel ist zu schwer. Außerdem sitzt vermutlich gerade ein Geist darin.":`เก้าอี้หนักเกินไป อีกอย่าง ตอนนี้น่าจะมีผีนั่งอยู่ในนั้น`,"Ein Korb voller zerschlissener Lappen. Ein Hexenhaushalt ist auch nur ein Haushalt.":`ตะกร้าเต็มไปด้วยผ้าขี้ริ้วขาด ๆ บ้านแม่มดก็เป็นแค่บ้านธรรมดา`,"Im Korb":`ในตะกร้า`,Strohlager:`ที่นอนฟาง`,"Ein Lager aus Stroh. Wer dort schläft? Die Katze, nehme ich an. Morwenna schläft wohl im Stehen.":`ที่นอนฟาง ใครนอนตรงนี้น่ะเหรอ? แมว ฉันเดานะ มอร์เวนนาคงนอนยืน`,"Ich lasse mich nicht aufs Hexenstroh nieder. Man weiß nie, was darin wohnt.":`ฉันไม่นอนบนฟางแม่มดหรอก ไม่รู้ว่าอะไรอาศัยอยู่ข้างใน`,"Linkes Regal":`ชั้นซ้าย`,"Ein Regal voller Gläser: Augen, Zungen, Finger. Der Inhalt scheint nicht zu verderben, was mich beunruhigt.":`ชั้นเต็มไปด้วยโหลแก้ว ตา ลิ้น นิ้ว ข้างในดูเหมือนไม่เน่า ซึ่งทำให้ฉันไม่สบายใจ`,"Ein Glas voll Augen. Nein, danke. Die starren mich schon an.":`โหลเต็มไปด้วยลูกตา ไม่เอาล่ะ ขอบคุณ พวกมันจ้องฉันอยู่แล้ว`,"Ich habe schon gesucht. Mehr gibt das Regal nicht her.":`ฉันหาแล้ว ชั้นนี้ไม่มีอะไรให้อีก`,"Ich schiebe ein paar Gläser zur Seite. Hinter ihnen steht eine leere Flasche, nur ein wenig staubig.":`ฉันดันโหลสองสามใบไปข้าง ๆ ข้างหลังมีขวดเปล่าตั้งอยู่ ฝุ่นจับนิดหน่อย`,"Sie ist leer und sauber. Eine Flasche, die auf etwas wartet. Ich nehme sie mit.":`มันว่างและสะอาด ขวดที่รอคอยบางอย่างอยู่ ฉันเอาไปด้วย`,"Rechtes Regal":`ชั้นขวา`,"Noch mehr Gläser, Knochen und ein Totenschädel mit Brille. Die Brille ist neu. Das Schlimmste daran.":`โหลเพิ่มอีก กระดูก และหัวกะโหลกใส่แว่น แว่นเป็นของใหม่ นั่นแหละที่แย่ที่สุด`,"Ich suche zwischen Wurzeln und Knochen. Alles beschriftet, in einer Schrift, die ich nicht lesen kann, aus Prinzip.":`ฉันค้นระหว่างรากไม้กับกระดูก ทุกอย่างติดป้าย ด้วยลายมือที่ฉันอ่านไม่ออก โดยหลักการ`,Feuerstelle:`เตาผิง`,"Ein gewaltiger Steinkamin. Der Kessel steht mitten in der Asche. Das Feuer ist kaum mehr als eine Erinnerung.":`เตาผิงหินใหญ่โต หม้ออยู่กลางขี้เถ้า ไฟเหลือเป็นแค่ความทรงจำ`,"Ich stochere in der Asche. Warm. Das Feuer ist aus, aber nicht tot.":`ฉันเขี่ยขี้เถ้า อุ่น ไฟดับแล้ว แต่ไม่ตาย`,"Ich könnte den Kamin anzünden, aber Morwenna hat ihn dafür sicher aufgespart.":`ฉันจะจุดเตาก็ได้ แต่มอร์เวนนาคงเก็บมันไว้เพื่อเรื่องนั้นแน่`,"Schädel über der Tür":`หัวกะโหลกเหนือประตู`,"Ein Tierschädel über dem Türsturz. Er schützt vor bösem Besuch. Ich bin der Beweis, dass es nicht funktioniert.":`หัวกะโหลกสัตว์เหนือวงกบประตู มันป้องกันแขกร้าย ฉันคือหลักฐานว่ามันไม่ได้ผล`,"Geweih über dem Kamin":`เขากวางเหนือเตาผิง`,"Ein Hirschschädel mit gewaltigem Geweih. Er sieht aus, als würde er jeden Satz beurteilen.":`หัวกะโหลกกวางที่มีเขาใหญ่โต ดูเหมือนมันกำลังตัดสินทุกประโยคที่พูด`,Kräuterbündel:`มัดสมุนไพร`,"Getrocknete Kräuter und Wurzeln hängen von den Balken. Vieles davon weiß ich zu nennen, vieles zu meiden.":`สมุนไพรแห้งกับรากไม้ห้อยจากคาน หลายอย่างฉันรู้ชื่อ หลายอย่างฉันรู้ว่าควรเลี่ยง`,"Ich reiße nichts ab. Ich möchte nicht, dass meine Haut anschwillt, weil ich das falsche Kraut erwische.":`ฉันไม่ฉีกอะไรเลย ฉันไม่อยากให้ผิวบวมเพราะหยิบสมุนไพรผิด`,"Rundes Fenster":`หน้าต่างกลม`,"Ein rundes Fenster. Dahinter hängt ein grüner Mond. Oder eine sehr große Laterne. Das Moor macht keine Unterschiede.":`หน้าต่างกลม ข้างหลังมีดวงจันทร์สีเขียวแขวนอยู่ หรือไม่ก็โคมไฟดวงใหญ่มาก หนองน้ำไม่แยกแยะ`,Wandlaterne:`โคมติดผนัง`,"Eine kleine Laterne an der Wand. Ihr Licht ist warm und gelb, die einzige freundliche Farbe im Haus.":`โคมไฟเล็ก ๆ ติดผนัง แสงอุ่นและเหลือง สีเดียวที่ดูเป็นมิตรในบ้านนี้`,"Ein Fliegenpilz, der mitten im Zimmer wächst. Eine Hexe ist eben Hausherrin der Natur.":`เห็ดมีพิษขึ้นอยู่กลางห้อง แม่มดก็เป็นเจ้าของบ้านแห่งธรรมชาติอยู่แล้ว`,"Ein rostiger Nagel am Boden. Er wartet auf einen Zeh, der ihn zu schätzen weiß.":`ตะปูขึ้นสนิมบนพื้น มันรอนิ้วเท้าที่จะเห็นค่ามัน`,"Ritze unter dem Regal":`รอยแยกใต้ชั้น`,"Zwischen Regal und Boden klafft eine Ritze. Etwas Kleines liegt darin.":`ระหว่างชั้นกับพื้นมีรอยแยกอ้าอยู่ มีของเล็ก ๆ วางอยู่ข้างใน`,"In der Ritze":`ในรอยแยก`,"Das Moor von Grauwacht. Wer es kennt, nennt es einen Ort zum Sterben. Wer es nicht kennt, hält es für Nebel.":`หนองน้ำแห่งเกราวัคท์ ใครรู้จักมันเรียกว่าที่ตาย ใครไม่รู้จักคิดว่าเป็นแค่หมอก`,"Halvard sagte: Der König siecht, und das Gift heißt Schierling. Nur eine Hexe kennt die Antwort.":`ฮาลวาร์ดบอกว่า กษัตริย์กำลังทรุดโทรม และพิษนั้นชื่อเฮมล็อก มีแค่แม่มดที่รู้คำตอบ`,"Du hast Gegengift und Talisman. Verlasse das Moor nach Osten, Richtung Grauwacht.":`เจ้ามียาแก้พิษกับเครื่องรางแล้ว ออกจากหนองน้ำไปทางตะวันออก มุ่งหน้าสู่เกราวัคท์`,"Die Irrlichter blockieren den Steg. Das Totem am Anfang verrät vielleicht, wie man sie vertreibt.":`ไฟผีขวางสะพานไม้ เสาโทเทมตรงต้นสะพานอาจบอกวิธีไล่พวกมัน`,"Entzünde die drei Moorlaternen mit deiner Fackel: erst der Mond, dann das Hexenhaus, zuletzt die Heimat.":`จุดโคมหนองน้ำทั้งสามด้วยคบไฟ: ก่อนอื่นดวงจันทร์ แล้วบ้านแม่มด สุดท้ายบ้านเกิด`,"Geh zur Hexenhütte am Ende des Stegs und sprich mit Morwenna.":`ไปที่กระท่อมแม่มดปลายสะพานไม้ แล้วคุยกับมอร์เวนนา`,"Frag Morwenna nach einem Gegengift gegen Schierling.":`ถามมอร์เวนนาเรื่องยาแก้พิษเฮมล็อก`,"Sprich mit Morwenna über den Talisman.":`คุยกับมอร์เวนนาเรื่องเครื่องราง`,"Füll das Gebräu mit einer leeren Flasche in das Gegengift ab.":`ใช้ขวดเปล่ากรอกน้ำยาลงเป็นยาแก้พิษ`,"Moorwasser (Eimer im Tümpel)":`น้ำหนอง (ถังที่แอ่งน้ำ)`,Moorwasser:`น้ำหนอง`,"eine Rabenfeder (beim Totem)":`ขนอีกา (ที่เสาโทเทม)`,"die Alraune (jetzt mit Wachs in den Ohren)":`แมนเดรก (ตอนนี้อุดหูด้วยขี้ผึ้งแล้ว)`,"die Alraune (erst Kerzenwachs aus der Kommode)":`แมนเดรก (ก่อนอื่นเอาขี้ผึ้งเทียนจากตู้ลิ้นชัก)`,"die Schlangenzunge":`ลิ้นงู`,"die Schlangenzunge (Schlange erst mit etwas Totem ablenken)":`ลิ้นงู (ก่อนอื่นล่องูออกไปด้วยของจากเสาโทเทม)`,"Dir fehlen noch: ":`เจ้ายังขาด: `,"Gib die Zutaten in den Kessel: erst das Nasse, dann das Leichte, das Tiefe, das Böse, zuletzt das Feuer.":`ใส่ส่วนผสมลงหม้อ: ก่อนอื่นของเปียก แล้วของเบา ของลึก ของชั่ว สุดท้ายไฟ`,"Das Ganze mitnehmen? Ich suche lieber gezielt.":`เอาไปทั้งหมดเหรอ? ฉันเลือกหาเฉพาะที่ต้องการดีกว่า`,"Leer. Nur Staub und eine tote Spinne.":`ว่างเปล่า มีแต่ฝุ่นกับแมงมุมตายตัวหนึ่ง`,"Es ist schon offen.":`มันเปิดอยู่แล้ว`,"Becher mit Wein":`ถ้วยไวน์`,"Becher mit Suppe":`ถ้วยซุป`,Zinnbecher:`ถ้วยดีบุก`,"Ein verbeulter Zinnbecher. Er hat schon Wein, Suppe und Schlimmeres gesehen.":`ถ้วยดีบุกบุบ ๆ มันเคยเห็นทั้งไวน์ ซุป และอะไรที่แย่กว่านั้นมาแล้ว`,"Gewürzter Weinkrug":`เหยือกไวน์ปรุงรส`,Weinkrug:`เหยือกไวน์`,"Ein Tonkrug mit schwerem, rotem Wein. Er riecht nach Pflaumen und Entschuldigungen.":`เหยือกดินเผาใส่ไวน์แดงเข้ม ๆ มีกลิ่นลูกพลัมกับข้อแก้ตัว`,"Der Schild ist blank gescheuert. Mehr Sand macht ihn nur ärgerlicher.":`โล่ถูกขัดจนเงาแล้ว ใส่ทรายเพิ่มก็แค่ทำให้มันหงุดหงิดขึ้น`,"Ich scheuere den Schild mit Sand, bis der Rost nachgibt. Darunter blitzt Stahl. Jetzt noch glänzen.":`ฉันขัดโล่ด้วยทรายจนสนิมหลุด ข้างใต้มีเหล็กกล้าวาบขึ้นมา ทีนี้ก็แค่ทำให้เงาวับ`,"Der Lappen verschmiert nur den Rost. Erst mit Sand scheuern, dann polieren.":`ผ้าขี้ริ้วแค่ละเลงสนิมให้เลอะ ต้องขัดด้วยทรายก่อน แล้วค่อยขัดเงา`,"Ich poliere, bis ich mein Gesicht sehe. Ein bleicher Junge starrt zurück. Ein Spiegelschild! Der Drache wird sein eigenes Feuer lieben.":`ฉันขัดจนเห็นหน้าตัวเอง เด็กหนุ่มซีดเผือดจ้องกลับมา โล่กระจก! มังกรจะรักไฟของมันเอง`,"Sand auf einen Lappen? Das gibt Schmirgel. Praktisch, aber ich brauche etwas, das ich polieren kann.":`ทรายบนผ้าขี้ริ้วเหรอ? ได้กระดาษทราย สะดวกดี แต่ฉันต้องการของที่ขัดเงาได้`,"Der Wein ist schon gewürzt. Mehr Kraut macht nur das Gewissen schwerer.":`ไวน์ปรุงรสแล้ว สมุนไพรเพิ่มก็แค่ทำให้มโนธรรมหนักขึ้น`,"Ich zerkrümele das Kraut im Krug und schüttle. Der Wein wird trüb und riecht nach Heu. Ein Opfer für jeden, der ihn trinkt.":`ฉันขยี้สมุนไพรลงในเหยือกแล้วเขย่า ไวน์ขุ่นและกลิ่นเหมือนหญ้าแห้ง เหยื่อของใครก็ตามที่ดื่มมัน`,"Ein Zinnbecher auf einem Totenkopf? Sehr stimmungsvoll. Aber Wilm würde lachen.":`ถ้วยดีบุกบนหัวกะโหลกเหรอ? บรรยากาศดีมาก แต่วิล์มคงหัวเราะ`,"Burg Grauwacht. Mauern aus grauem Stein, Banner mit Raben, und ein Fallgitter, das aussieht, als hätte es Zähne.":`ปราสาทเกราวัคท์ กำแพงหินเทา ธงรูปอีกา และประตูเหล็กที่ดูเหมือนมีเขี้ยว`,"Das Moor liegt hinter mir. Das Schlimmste kommt vermutlich noch.":`หนองน้ำอยู่ข้างหลังฉันแล้ว สิ่งที่แย่ที่สุดน่าจะยังมาไม่ถึง`,"Das Fallgitter hängt an einer Winde ohne Kurbel. Such in der Schubkarre nach etwas Langem aus Eisen.":`ประตูเหล็กแขวนอยู่กับกว้านที่ไม่มีที่หมุน หาของเหล็กยาว ๆ ในรถเข็น`,"Die Winde klemmt: Nimm Pech aus dem Pechfass und schmiere sie.":`กว้านติดขัด เอายางสนจากถังยางสนมาทา`,"Zeige Hauptmann Grimm Schwert, Siegelbrief und Halvards Brief. Oder bring die Wache Wilm mit Wein dazu, den Hauptmann abzulenken.":`แสดงดาบ จดหมายตราประทับ และจดหมายของฮาลวาร์ดให้กัปตันกริมม์ดู หรือให้ยามวิล์มดื่มไวน์เพื่อเบี่ยงความสนใจกัปตัน`,"Benutze die Torwinde und kurbele das Fallgitter hoch.":`ใช้กว้านประตูแล้วหมุนยกประตูเหล็กขึ้น`,"Schließe die Prüfung der Demut bei Ser Roderic im Burghof ab.":`ผ่านการทดสอบความถ่อมตนกับเซอร์โรเดอริกในลานปราสาทให้สำเร็จ`,"Hol dir bei Myrddin im Bibliotheksturm das Siegel der Weisheit.":`ไปรับตราแห่งปัญญาจากเมอร์ดินในหอคอยห้องสมุด`,"Poliere den Schild aus der Rüstkammer mit Sand und Lappen zum Spiegelschild.":`ขัดโล่จากคลังเกราะด้วยทรายและผ้าให้เป็นโล่กระจก`,"Sprich mit Ser Roderic im Thronsaal: Es geht zum Vulkan.":`คุยกับเซอร์โรเดอริกในห้องบัลลังก์: มุ่งหน้าสู่ภูเขาไฟ`,"Sprich im Burghof mit Ser Roderic, dem Ordensmeister.":`คุยกับเซอร์โรเดอริก ปรมาจารย์แห่งคณะ ในลานปราสาท`,"Beschlage das Pferd Donnerhuf: Hufeisen im Futtertrog, Hammer und Nagel an der Werkbank, Apfel von Berta.":`ใส่เกือกม้าให้ม้าทันเดอร์ฮูฟ: เกือกม้าในรางอาหาร ค้อนกับตะปูที่โต๊ะช่าง แอปเปิลจากเบอร์ตา`,"Setze in der Rüstkammer die Rüstung zusammen: Brustpanzer, Helm, Armschienen. Der Schlüssel liegt auf der Werkbank im Hof.":`ประกอบชุดเกราะในคลังเกราะ: เกราะอก หมวกเหล็ก เกราะแขน กุญแจอยู่บนโต๊ะช่างในลานปราสาท`,"Fülle einen Becher mit Suppe aus Bertas Kessel (erst mit ihr reden) und bringe ihn in den Kerker.":`เติมถ้วยด้วยซุปจากหม้อของเบอร์ตา (ก่อนอื่นคุยกับเธอ) แล้วเอาไปที่คุกใต้ดิน`,"Fege den Hof mit dem Besen.":`กวาดลานปราสาทด้วยไม้กวาด`,"Melde Ser Roderic, dass du alle Aufgaben erledigt hast. Gib Eduards Silber zurück, falls du es genommen hast.":`รายงานเซอร์โรเดอริกว่าทำภารกิจครบแล้ว คืนเงินของเอดูอาร์ดถ้าเอาไป`,"Myrddins Prüfung: Zieh die Bücher in der Reihenfolge Rot, Schwarz, Blau, Grün.":`บททดสอบของเมอร์ดิน: ดึงหนังสือตามลำดับ แดง ดำ น้ำเงิน เขียว`,"Beantworte das Rätsel des Bücherschranks: Was nimmt man, und es bleibt zurück?":`ตอบปริศนาตู้หนังสือ: อะไรที่เอาไป แล้วมันยังอยู่ข้างหลัง?`,"Bringe die Waage ins Gleichgewicht: Die linke Schale wiegt fünf. Gewichte liegen im Messkasten.":`ทำให้ตาชั่งสมดุล: จานซ้ายหนักห้า ตุ้มน้ำหนักอยู่ในกล่องวัด`,"Sprich mit Myrddin: Du hast alle drei Prüfungen bestanden.":`คุยกับเมอร์ดิน: เจ้าผ่านการทดสอบทั้งสามแล้ว`,"Lenke Kanzler Malvor ab (Halvards Brief oder der Hexentalisman) und träufle das Gegengift in den Weinkelch.":`เบี่ยงความสนใจอัครเสนาบดีมัลวอร์ (จดหมายของฮาลวาร์ดหรือเครื่องรางแม่มด) แล้วหยดยาแก้พิษลงในถ้วยไวน์`,"Gib im Thronsaal das Gegengift in den Kelch, solange Malvor abgelenkt ist.":`ใน
