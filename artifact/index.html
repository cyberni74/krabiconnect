,take:`Die Luke ist größer als meine Zukunft.`,exit:{to:`kerker`,x:120,y:400,facing:1,guard:e=>On(e)?(e.set(`c3_luke`,!0),null):`Der Kerker? Ich möchte erst den Ordensmeister fragen, ob das erlaubt ist.`}},P({id:`pferd`,name:`Streitross Donnerhuf`,x:135,y:352,scale:.88,frames:{idle:`pferd_idle`,stamp:`pferd_stamp`},look:bn(e=>e.flag(`c3_t_pferd`)?`Donnerhuf mit vier gesunden Hufen. Er sieht sogar dankbar aus. Für ein Pferd.`:`Ein Streitross mit drei Schuhen. Der vierte Huf scharrt unglücklich im Stroh.`),talk:async e=>{await O(e,e.flag(`c3_t_pferd`)?`Na, Donnerhuf. Gute Hufe, schlechter Charakter?`:`Hallo, Donnerhuf. Ich bin nur ein harmloser Totengräber.`),await e.say(`Donnerhuf schnaubt. Er ist offenbar nicht für Konversation gezüchtet.`)},give:{apfel:async e=>{if(e.flag(`c3_pferd_ruhig`))return e.say(`Er hat seinen Apfel schon. Er schaut, als wolle er einen zweiten.`);e.remove(`apfel`),e.set(`c3_pferd_ruhig`,!0),await e.say(`Crunch. Donnerhuf wird weich wie Butter. Zumindest für einen Apfel lang.`)},hufeisen:async e=>{if(e.flag(`c3_t_pferd`))return e.say(`Er hat vier Schuhe. Sein Selbstwertgefühl ist wiederhergestellt.`);if(!e.flag(`c3_pferd_ruhig`)){e.frame(`pferd`,`stamp`),e.sfx(`clank`),await e.say(`Ich nähere mich dem Huf. Donnerhuf tritt aus. Ich fliege durch die Luft und lande in einem Heuhaufen.`),await e.say(`Vielleicht erst mit etwas Süßem bestechen.`),e.frame(`pferd`,`idle`);return}if(!e.has(`hammer`))return e.say(`Womit soll ich nageln? Mit der Faust? Ein Hammer wäre gut. Pip hat doch eine Werkbank.`);if(!e.has(`nagel`))return e.say(`Ein Hufeisen ohne Nägel ist ein Schmuckstück. Ich brauche einen Nagel.`);e.sfx(`hammer`),await e.pose(`use`,900),e.sfx(`hammer`),e.remove(`hufeisen`),e.remove(`nagel`),e.set(`c3_t_pferd`,!0),await e.say(`Klong, klong, klong. Donnerhuf steht auf vier Schuhen und prüft den Boden wie ein Adliger den Bodensatz.`),await D(e,`pip`,`Das hat noch niemand geschafft! Er hat dich nicht mal gebissen! Nimm das Seil, ich hab zwei.`),e.add(`seil`)},nagel:`Das Pferd frisst keine Nägel. Dafür gibt es Hufschmiede.`}}),P({id:`pip`,name:`Stallmeister Pip`,x:285,y:376,frames:{idle:`pip_idle`,talk:`pip_talk`},look:`Pip, der Stallmeister. Zwölf Jahre alt, zwei Zähne Lücke, das Selbstbewusstsein eines Bischofs.`,talk:async e=>{await k(e,`c3_met_pip`,async()=>{await D(e,`pip`,`Neu hier? Ich bin Pip, der Stallmeister. Das sage ich, weil mir sonst keiner glaubt.`)}),await A(e,()=>[{text:`Was ist mit dem Pferd los?`,done:()=>!!e.flag(`c3_t_pferd`),run:async()=>{await D(e,`pip`,`Donnerhuf hat sein Eisen verloren. Irgendwo im Stall, glaube ich. Vielleicht im Futtertrog.`,`Aber er tritt. Er tritt jeden, der nicht nach Apfel riecht. Berta hat Äpfel.`)}},{text:`Wo finde ich Werkzeug?`,run:()=>D(e,`pip`,`Auf meiner Werkbank da vorn: Hammer, Nägel und anderes Zeug. Pass auf die Zange auf. Sie beißt.`)},{text:`Wer ist Ser Eduard?`,run:()=>D(e,`pip`,`Der Knappe, der immer den besten Platz in der Schlange hat. Er mag mich nicht. Ich mag ihn nicht. So sind wir Freunde.`)},{text:`Hast du ein Seil?`,show:()=>!e.flag(`c3_t_pferd`),run:()=>D(e,`pip`,`Klar. Aber nur für Leute, die dem Pferd helfen. Das ist die Regel. Meine Regel.`)},{text:`Wie ist der Kanzler?`,run:()=>D(e,`pip`,`Malvor? Der guckt, als würde er mir Karotten wegnehmen. Aber er riecht immer nach Wein. Er rührt selbst den Kelch des Königs.`)},j(`Wenn du tritt kriegst, sag nicht, ich hätte dich gewarnt. Doch, sag es.`,`pip`,e,`Auf Wiedersehen.`)])}}),P({id:`roderic`,name:`Ser Roderic`,x:575,y:376,frames:{idle:`roderic_idle`,talk:`roderic_talk`},look:`Ser Roderic, Ordensmeister. Silberhaar, Raben auf dem Brustpanzer, und Augen, die schon alles gesehen und dann vergessen haben, warum.`,talk:async e=>{await k(e,`c3_roderic_met`,async()=>{await D(e,`roderic`,`Du bist Bran aus Aschenfurt. Hauptmann Grimm hat mir einen Raben geschickt. Er schreibt, du seist 'hartnäckig, schmutzig und ehrlich'.`),await O(e,`Das trifft es. Mehr oder weniger.`),await D(e,`roderic`,`Der Orden kennt drei Eide: Demut, Weisheit, Mut. Mut wirst du am Vulkan zeigen. Aber das ist später.`,`Heute: Demut und Weisheit. Fang mit der Demut an. Hier ist deine Liste.`),await D(e,`roderic`,`Erstens: Das Pferd Donnerhuf beschlagen. Zweitens: Die Ordensrüstung in der Rüstkammer herrichten. Drittens: Suppe zu den Gefangenen bringen.`,`Viertens: Den Hof fegen. Und fünftens, aber das erfährst du von selbst.`)}),await A(e,()=>[{text:`Wie steht meine Aufgabenliste?`,done:()=>!!e.flag(`c3_demut_done`),run:()=>D(e,`roderic`,jn(e,`c3_t_pferd`,`Donnerhuf beschlagen`),jn(e,`c3_t_ruestung`,`Ordensrüstung in der Rüstkammer richten`),jn(e,`c3_t_suppe`,`Suppe zu den Gefangenen bringen`),jn(e,`c3_t_hof`,`Hof fegen`))},{text:`Ich habe alle Aufgaben erledigt.`,show:()=>_n(e)===4&&!e.flag(`c3_demut_done`),run:async()=>{await An(e)}},{text:`Was ist das für ein Orden?`,run:()=>D(e,`roderic`,`Der Orden der Raben schützt die Schwachen, bewacht die Toten und verwaltet die Schulden der Lebenden.`,`Meistens ist das Letzte das Anstrengendste.`)},{text:`Wie geht es dem König?`,run:async()=>{await D(e,`roderic`,`Schlecht. Schon seit Wochen. Die Ärzte sagen Fieber. Die Köchin sagt Schierling. Ich sage nichts, aus Gewohnheit.`,`Der Kanzler lässt niemanden zu ihm außer sich selbst.`)}},{text:`Wo ist Ser Aldric?`,run:async()=>{e.set(`c3_met_roderic_aldric`,!0),await D(e,`roderic`,`Aldric? Mein bester Mann. Vor Wochen zur Grenze gesandt, seither kein Wort. Der Kanzler sagt: gefallen.`,`Ich sage: Aldric fällt nicht. Er stolpert höchstens, und das auch nur auf Befehl.`)}},{text:`Wo kann ich suchen?`,run:()=>D(e,`roderic`,`Der Burghof gehört dir. Rüstkammer links, Bibliothek rechts, Kerkerluke vorn. Der Thronsaal steht dir offen, wenn du demütig warst.`)},{text:`Was soll ich in der Rüstkammer?`,done:()=>!!e.flag(`c3_t_ruestung`),run:()=>D(e,`roderic`,`Der Rüstungsständer ist leer. Brustpanzer, Helm, Armschienen liegen irgendwo. Ordnung ist die Demut des Soldaten.`,`Und poliere den alten Schild, wenn du schon da bist. Du wirst nicht oft einen Spiegel in der Hand haben.`)},j(`Geh. Und schlafe nicht im Stehen. Das tun nur Pferde und Hauptleute.`,`roderic`,e,`Auf Wiedersehen.`)])}}),P({id:`berta`,name:`Köchin Berta`,x:700,y:384,facing:-1,frames:{idle:`berta_idle`,talk:`berta_talk`},look:`Köchin Berta, Löffel in der Hand, Fleck auf der Schürze. Man traut ihr die Pest nicht zu, aber das Kochen schon.`,give:{holzloeffel:async e=>{if(e.flag(`c3_loeffel`))return D(e,`berta`,`Mein Löffel! Zum zweiten Mal gefunden, zum zweiten Mal gerührt.`);e.remove(`holzloeffel`),e.set(`c3_loeffel`,!0),e.honor(1),await D(e,`berta`,`MEIN LÖFFEL! Der gute Löffel! Wo hast du den gefunden?`,`Im Heukarren? Dieser Pip! Ich schlage ihn mit seinem eigenen Heu.`),await D(e,`berta`,`Hier. Ein Krug Wein, und Schlafkraut gegen die Albträume des Königs. Ich habe immer zu viel davon.`),e.add(`wein`),e.add(`schlafkraut`)},silber:async e=>{if(!e.flag(`c3_bribed`))return D(e,`berta`,`Silber? Behalt es, du siehst aus, als bräuchtest du es.`);e.remove(`silber`),e.honor(1),e.set(`c3_bribed`,!1),e.set(`c3_eduard_resolved`,!0),await D(e,`berta`,`Für die Armenspeise? Von Eduards Silber? Das schmeckt wie Gerechtigkeit mit Salz.`),await O(e,`Besser bei den Armen als in meiner Tasche.`)}},talk:async e=>{await k(e,`c3_met_berta`,async()=>{await D(e,`berta`,`Ah, ein Neuer! Zu dünn. Setz dich nicht, ich habe nichts, was dich satt macht.`)}),await A(e,()=>[{text:`Roderic schickt mich. Suppe für die Gefangenen.`,show:()=>!e.flag(`c3_berta_ok`),run:async()=>{e.set(`c3_berta_ok`,!0),await D(e,`berta`,`Die armen Seelen im Keller! Nimm einen Becher und fülle ihn aus dem Kessel.`),e.has(`zinnbecher`)||(e.add(`zinnbecher`),await D(e,`berta`,`Hier, ein Becher. Verbeult, aber er hält. Wie ich.`))}},{text:`Habt Ihr einen Apfel für Donnerhuf?`,show:()=>!e.flag(`c3_apfel`),run:async()=>{e.set(`c3_apfel`,!0),e.add(`apfel`),await D(e,`berta`,`Für dieses Biest? Einen. Und wenn er dich beißt, mir nicht die Schuld geben.`)}},{text:`Habt Ihr noch einen Apfel?`,show:()=>!!e.flag(`c3_apfel`)&&!e.has(`apfel`)&&!e.flag(`c3_pferd_ruhig`),run:async()=>{e.add(`apfel`),await D(e,`berta`,`Du hast ihn verloren? Du bist wie mein Mann. Hier.`)}},{text:`Ihr habt etwas verloren?`,show:()=>!e.flag(`c3_loeffel`),run:async()=>{await D(e,`berta`,`Mein Rührlöffel! Seit dem Dienstag weg. Pip bestreitet alles. Das ist ein Geständnis.`,`Der Kerl wohnt im Heu. Ich wette, er hat ihn zum Wenden benutzt.`)}},{text:`Habt Ihr noch Wein?`,show:()=>!!e.flag(`c3_loeffel`)&&!e.has(`wein`)&&!e.flag(`c3_knorr_asleep`),run:async()=>{e.add(`wein`),await D(e,`berta`,`Schon wieder? Du trinkst für zwei. Hier.`)}},{text:`Habt Ihr noch Schlafkraut?`,show:()=>!!e.flag(`c3_loeffel`)&&!e.has(`schlafkraut`)&&!e.flag(`c3_wein_praep`)&&!e.flag(`c3_knorr_asleep`),run:async()=>{e.add(`schlafkraut`),await D(e,`berta`,`Da. Aber wenn du den König damit einschläferst, bin ich es nicht gewesen.`)}},{text:`Wie geht's dem König?`,run:async()=>{await D(e,`berta`,`Er isst nichts mehr. Er trinkt nur Wein, den der Kanzler selbst einschenkt. Jeden Abend.`,`Das Fieber kommt immer gegen Mitternacht. Als hätte es einen Plan.`)}},{text:`Was haltet Ihr vom Kanzler?`,run:async()=>{await D(e,`berta`,`Ein Mann, der nie hungrig aussieht. Das ist verdächtig. Wer nicht isst, hat etwas anderes im Kopf.`)}},{text:`Was ist mit Ser Eduard?`,run:async()=>{await D(e,`berta`,`Der? Er isst alles, bezahlt nichts und lobt trotzdem nie. Wie ein Adliger.`)}},j(`Iss was, Junge. Der Orden braucht Ritter, keine Gespenster.`,`berta`,e,`Auf Wiedersehen.`)])}}),P({id:`eduard`,name:`Ser Eduard`,x:480,y:412,facing:1,frames:{idle:`brandt_idle`,talk:`brandt_talk`},look:`Ser Eduard, Knappe. Glänzende Stiefel, glänzende Zähne, glänzende Aussichten. Sein Vater hat Land und Meinungen.`,give:{silber:async e=>{if(!e.flag(`c3_bribed`))return D(e,`eduard`,`Silber? Du brauchst es dringender als ich. Das ist wahr, leider.`);e.remove(`silber`),e.honor(1),e.set(`c3_bribed`,!1),e.set(`c3_eduard_resolved`,!0),await D(e,`eduard`,`Du gibst es zurück? Das Geschäft ist geplatzt? Wie unhöflich!`),await O(e,`Ein Geschäft, das ich nie hätte machen sollen.`)}},talk:async e=>{await k(e,`c3_met_eduard`,async()=>{await D(e,`eduard`,`Du bist der Neue aus dem Dorf. Du riechst nach Erde. Das ist kein Vorwurf. Eher eine Beobachtung.`)}),await A(e,()=>[{text:`Wie kommt man hier zum Ritter?`,run:()=>D(e,`eduard`,`Mit Beziehungen. Und mit Geld. Und notfalls mit Talent, aber das ist teuer.`)},{text:`Was machst du hier?`,run:()=>D(e,`eduard`,`Ich warte auf die Rüstung, die mir mein Vater schickt. Die alte hat einen Kratzer. Einen. Skandalös.`)},{text:`Du hast mir was angeboten ...`,show:()=>!!e.flag(`c3_eduard_offered`)&&!e.flag(`c3_eduard_resolved`)&&!e.flag(`c3_bribed`),run:async()=>{await kn(e)}},{text:`Hast du die Aufgaben schon erledigt?`,run:()=>D(e,`eduard`,`Ich? Wozu gibt es Knechte? Ich lasse arbeiten, das nennt man Führung.`)},{text:`Was weißt du über den Kanzler?`,run:()=>D(e,`eduard`,`Malvor? Der will Burggraf werden, schätze ich. Oder König. Aber wer will das nicht?`)},j(`Kümmere dich nicht um mich, ich bin beschäftigt. Mit Nichtstun.`,`eduard`,e,`Auf Wiedersehen.`)])}}),P({id:`palaswache`,name:`Palaswache`,x:650,y:352,frames:{idle:`wache_idle`,talk:`wache_idle`},look:`Eine Wache am Fuß der Treppe. Sie steht seit Stunden so, dass die Sehnen knacken.`,talk:async e=>{await D(e,`palaswache`,e.flag(`c3_demut_done`)?`Ordensmeister Roderic hat dich angekündigt. Geh hinauf. Aber fass nichts an.`:`Der Thronsaal ist nur für Anwärter, die Demut bewiesen haben. Frag Roderic. Nicht mich. Ich bin nur eine Treppe mit Beinen.`)}}),{id:`uebungspuppe`,name:`Übungspuppe`,sprite:`uebungspuppe`,x:365,y:368,scale:.9,at:{x:365,y:392},primary:`use`,look:`Eine Strohpuppe mit Schild. Sie hat mehr Hiebe überlebt als ich Mahlzeiten.`,use:`Ich boxe sie. Das Stroh lacht nicht, aber ich bin sicher, es denkt es sich.`,useWith:{schwert:async e=>{let t=e.inc(`c3_hiebe`);e.sfx(`clank`),await e.pose(`swing`,600),t<3?await e.say(t===1?`Ein Hieb. Die Puppe wackelt. Ich auch.`:`Noch ein Hieb. Stroh fliegt. Ich habe Schwung.`):t===3?(await e.say(`Dritter Hieb. Ein Ding fällt aus dem Stroh. Die Puppe ist schwer beleidigt.`),e.set(`c3_puppe_auf`,!0)):await e.say(`Die Puppe hat sich ergeben. Ich auch, vor Müdigkeit.`)}}},M({id:`c3_puppe_schnalle`,item:`schnalle`,x:395,y:400,hidden:e=>!e.flag(`c3_puppe_auf`),say:`Eine Gürtelschnalle aus der Puppe. Sie hat gekämpft und Schmuck behalten.`}),{id:`suppenkessel`,name:`Suppenkessel`,sprite:`suppenkessel`,x:770,y:384,scale:.85,at:{x:770,y:408},primary:`use`,look:`Ein Kessel, in dem etwas brodelt. Es ist braun, riecht nach Kohl und Absicht.`,use:`Ich rühre mit dem Finger? Nein. Berta würde mich mit dem Löffel erschlagen.`,useWith:{zinnbecher:async e=>{if(!e.flag(`c3_berta_ok`))return D(e,`berta`,`Finger weg vom Kessel! Wenn du Suppe willst, sag, wofür.`);let t=yn(e);if(t===`suppe`)return e.say(`Der Becher ist voll. Suppe vom Feinsten. Fast.`);if(t===`wein`)return e.say(`Wein in die Suppe? Das würde sie süß machen. Ich lasse es.`);e.sfx(`splash`),await e.pose(`use`,500),e.set(`c3_becher`,`suppe`),await e.say(`Ich fülle den Becher. Die Suppe dampft, riecht nach Kohl und Resten. Ein Fest für Gefangene.`)}}},{id:`brunnen`,name:`Brunnen`,sprite:`brunnen_burg`,x:850,y:380,scale:.8,at:{x:850,y:404},primary:`use`,look:`Der Burgbrunnen. Das Wasser ist kalt, tief und gesprächig. Das Echo antwortet höflicher als der Kanzler.`,use:async e=>{e.sfx(`splash`),await e.say(e.inc(`c3_trunk`)>1?`Ich trinke noch einmal. Es schmeckt nach Stein und Demut.`:`Ich trinke einen Schluck. Das Wasser ist eiskalt und nach Stein schmeckt es.`)},take:`Den Brunnen nehme ich nicht mit. Er hat Wurzeln.`,useWith:{lappen:`Ich tauche den Lappen kurz ein. Er wird nass und gewinnt dadurch nicht an Würde.`,eimer:`Ich habe keinen Eimer mehr. Der Brunnen schon.`}},N({id:`futtertrog`,name:`Futtertrog`,x:215,y:356,sprites:{closed:`futtertrog`,open:`futtertrog`},scale:.9,contents:[`hufeisen`,`apfelrest`,`knochen`],title:`Futtertrog`,at:{x:215,y:392},look:`Ein Trog mit altem Heu. Man erkennt etwas Rundes, Glänzendes darin. Oder ist das nur die Hoffnung?`,emptyText:`Nur Heu und ein Mäuseskelett.`}),N({id:`werkbank_hof`,name:`Werkbank`,x:405,y:428,sprites:{closed:`werkbank`,open:`werkbank`},scale:.85,contents:[`hammer`,`nagel`,`eisenschluessel`,`rostiger_dolch`],title:`Werkbank`,at:{x:405,y:428},look:`Pips Werkbank. Hammer, Zangen, Nägel und ein Schlüssel an einem Haken. Alles in einer Unordnung, die System hat.`,emptyText:`Die Werkbank ist leer. Pip wird wütend.`}),N({id:`lumpenkorb`,name:`Lumpenkorb`,x:330,y:430,sprites:{closed:`lumpenkorb`,open:`lumpenkorb`},contents:[`lappen`,`tote_ratte`,`gaensefeder`],title:`Lumpenkorb`,at:{x:330,y:430},look:`Ein Korb voller Lumpen. Einer davon ist sauber. Das ist suspekt.`,emptyText:`Nur noch Staub.`}),N({id:`heukarren`,name:`Heukarren`,x:235,y:424,sprites:{closed:`heukarren`,open:`heukarren`},scale:.55,contents:[`holzloeffel`,`apfelrest`,`kamm`],title:`Heukarren`,at:{x:235,y:428},look:`Ein Heukarren. Im Heu steckt eine Forke und sonst alles, was Pip verloren glaubt.`,emptyText:`Nur Heu. Aber ich habe es gründlich durchwühlt.`}),{id:`besen`,name:`Besen`,sprite:`besen`,x:640,y:415,scale:.9,at:{x:625,y:424},primary:`use`,look:`Ein Besen aus Reisig. Er wartet darauf, jemanden zu demütigen. Heute: mich.`,use:async e=>{if(e.flag(`c3_t_hof`))return e.say(`Der Hof ist gefegt. Er sieht aus, als hätte ihn nie jemand betreten.`);let t=e.inc(`c3_fegen`);e.sfx(`creak`),await e.pose(`use`,500),t<3?await e.say(t===1?`Ich fege den Hof. Staub, Stroh, Stolz.`:`Noch eine Ecke. Der Hof ist größer, als er aussieht.`):(e.set(`c3_t_hof`,!0),await e.say(`Fertig. Im Staub lag ein Holzkreuz. Der Orden hat auch Dinge, die er nicht vermisst.`))},take:`Der Besen bleibt hier. Ich will den Hof nicht im Stich lassen.`},M({id:`c3_hof_kreuz`,item:`kreuzanhaenger`,x:560,y:426,hidden:e=>!e.flag(`c3_t_hof`),say:`Ein Holzkreuz vom Boden. Gefunden beim Fegen. Auch Demut wirft Beute ab.`}),M({id:`c3_hof_pilz`,item:`pilz`,x:870,y:424,say:`Ein Fliegenpilz am Brunnenrand. Hübsch und tödlich, wie der Hof.`}),B(`hof_stall`,`Stall`,[15,245,150,90],`Der Stall. Dunkel, warm, voller Heu und schlechter Laune.`),B(`hof_turm`,`Bibliotheksturm`,[740,190,145,140],`Der Turm der Bibliothek. Fenster, in denen nachts Licht brennt, das nicht von Kerzen kommt.`,{at:{x:800,y:405}}),B(`hof_palas`,`Palas`,[525,100,90,110],`Das Portal des Palas. Dahinter der Thronsaal und ein König, der nicht mehr aufsteht.`),B(`hof_banner_l`,`Banner`,[205,205,40,95],`Ein blaues Banner mit Raben. Offensichtlich lieben sie ihn hier.`),B(`hof_banner_r`,`Banner`,[680,130,45,70],`Noch ein Banner. Es hängt schief, damit man merkt, dass es echt ist.`)]},Nn={totenkopf:3,zinnbecher:2,knochen:1,rostiger_dolch:2,schnalle:1},Pn=5,Fn=e=>String(e.flag(`c3_waage_items`)??``).split(`,`).filter(Boolean),In=e=>Fn(e).reduce((e,t)=>e+(Nn[t]??0),0),Ln=e=>!!(e.flag(`c3_books_ok`)&&e.flag(`c3_tuer_offen`)&&e.flag(`c3_waage_ok`)),Rn=[[`rot`,`Rotes Buch`,`buch_rot`,`Das rote Buch: 'Vom Blut der Könige'. Es ist warm, als hätte es gerade jemand zugeklappt.`,636],[`schwarz`,`Schwarzes Buch`,`buch_schwarz`,`Das schwarze Buch: 'Nachtbuch der Raben'. Auf dem Einband ein Totenkopf, der freundlicher guckt als der Hausmeister.`,658],[`blau`,`Blaues Buch`,`buch_blau`,`Das blaue Buch: 'Himmelskunde für Anfänger'. Nur der Titel ist für Anfänger.`,680],[`gruen`,`Grünes Buch`,`buch_gruen`,`Das grüne Buch: 'Moos, Moder und Moral'. Es riecht nach Wald und Rechthaberei.`,702]],zn=`rot,schwarz,blau,gruen`;async function Bn(e,t,n){if(e.flag(`c3_books_ok`))return e.say(`Die Bücher sind eingerastet. Ich lasse sie in Ruhe, sie sind in Frieden.`);let r=String(e.flag(`c3_buch_seq`)??``),i=r?r+`,`+t:t;e.sfx(`drawer`),await e.pose(`use`,400),zn.startsWith(i)?(e.set(`c3_buch_seq`,i),i===zn?(e.set(`c3_books_ok`,!0),e.sfx(`unlock`),e.shake(300),await e.say(`Das vierte Buch klickt. In der Wand rastet etwas ein. Der große Bücherschrank hinten knackt wie ein altes Knie.`)):await e.say(`${n}: Es klickt, und es bleibt eingedrückt. Etwas in der Wand ist zufrieden.`)):(e.set(`c3_buch_seq`,``),e.sfx(`wrong`),await e.say(`Klack. Alle Bücher springen zurück, als hätte ich ihnen die Würde genommen.`),await D(e,`myrddin`,`Falsch herum, Junge. Bücher haben eine Ordnung. Wie Sterne und Steuern.`))}async function Vn(e,t){if(!(t in Nn))return e.say(`Das Ding wiegt weniger als ein Gedanke, oder mehr als ein Gewissen. Jedenfalls gehört es nicht auf die Waage.`);if(e.flag(`c3_waage_ok`)&&In(e)===Pn)return e.say(`Die Waage ist im Gleichgewicht. Wer jetzt noch etwas drauflegt, ist selber schuld.`);e.remove(t),e.set(`c3_waage_items`,[...Fn(e),t].join(`,`)),e.sfx(`clank`),await e.pose(`use`,400);let n=In(e);n===Pn?(e.set(`c3_waage_ok`,!0),e.sfx(`magic`),await e.say(`Die Schalen schwingen, zittern, und stehen still. Gleichgewicht. Auf dem Beutel links steht 'V' und rechts liegen genau fünf Pfund Wahrheit.`),await D(e,`myrddin`,`Die Waage ist zufrieden. Ich bin es ein bisschen auch.`)):n<Pn?await e.say(`Die linke Schale sinkt noch immer. Es fehlt etwas. (${t.replace(`_`,` `)}: ${Nn[t]})`):await e.say(`Zu viel! Die rechte Schale kippt. Bran, das ist keine Metzgerei.`)}var Hn={id:`bibliothek`,title:`Myrddins Bibliothek`,bg:`bibliothek`,walk:I.bibliothek.walk,scale:I.bibliothek.scale,ambient:`library`,fx:[{kind:`dust`,n:.7}],things:[Re(`right`,{id:`to_hof`,name:`Zum Burghof`,to:`burghof`,x:800,y:395,facing:-1}),P({id:`myrddin`,name:`Magier Myrddin`,x:305,y:386,frames:{idle:`myrddin_idle`,talk:`myrddin_talk`,cast:`myrddin_cast`},look:`Myrddin, Magier des Ordens. Ein Bart, in dem sich Spinnen und Sterne verirren. Seine Augen glühen leise, wenn er lügt. Oder nachdenkt.`,give:{gegengift:async e=>{await D(e,`myrddin`,`Ein Gegengift. Moorhexe, Schierlingsbann, ein Hauch Wehmut. Sehr gut gebraut.`),await D(e,`myrddin`,`Aber wie willst du es in den König bekommen? Der Kanzler reicht ihm jeden Abend den Kelch. Persönlich.`,`Lenke Malvor ab. Ein Mann, der liest, schaut nicht auf Kelche. Und Hexenzeug schreckt ihn ab, merk dir das.`),e.set(`c3_myrddin_tipp`,!0)},hexentalisman:`Myrddin: Ein Moortalisman! Er riecht nach Kröte. Behalte ihn. Ich brauche meine Nase noch.`,weisheitssiegel:`Myrddin: Mein Siegel. Es steht dir besser als mir.`,schwert:`Myrddin: Hübsch geschmiedet. Schief, aber ehrlich. Wie die meisten Wahrheiten.`},talk:async e=>{await k(e,`c3_met_myrddin`,async()=>{await D(e,`myrddin`,`Ah. Der Totengräberjunge. Roderic hat mich vorgewarnt. 'Schlicht, stur, vom Moor gezeichnet.' Ich mag solche.`),await D(e,`myrddin`,`Die Prüfung der Weisheit besteht aus drei Dingen: Ordne die Bücher, wiege die Wahrheit, beantworte die Tür.`)}),await A(e,()=>[{text:`Ich habe alle drei Prüfungen bestanden.`,show:()=>Ln(e)&&!e.flag(`c3_wissen_done`),run:async()=>{e.set(`c3_wissen_done`,!0),e.set(`c3_myrddin_malvor`,!0),await D(e,`myrddin`,`Bücher geordnet, Wahrheit gewogen, Tür beantwortet. Du bist weniger dumm, als du aussiehst.`),e.sfx(`fanfare`),e.add(`weisheitssiegel`),await D(e,`myrddin`,`Hier, das Siegel der Weisheit. Es trägt ein offenes Auge. Du solltest deins auch geöffnet halten.`),await D(e,`myrddin`,`Und etwas, das ich dir schulde: Kanzler Malvor vergiftet den König. Ich rieche es seit Wochen. Ich habe nur keinen Beweis.`),await D(e,`myrddin`,`Hinter dem Wandteppich im Thronsaal hat er ein Geheimfach. Mehr weiß ich nicht. Das Fach hat vier Runenknöpfe. Man müsste die Reihenfolge kennen.`)}},{text:`Wie funktioniert die Prüfung?`,run:async()=>{await D(e,`myrddin`,`Erstens: Vier Bücher liegen auf dem Tisch. Zieh sie in der richtigen Reihenfolge. Das öffnet den Geheimschrank.`,`Zweitens: Die Waage links. Gleiche die linke Schale mit Gewichten aus dem Messkasten aus.`,`Drittens: Der Geheimschrank stellt eine Frage. Antworte, und er öffnet sich. Ein Tipp: In der Bibliothek verbirgt sich alles in Büchern.`)}},{text:`Welche Reihenfolge haben die Bücher?`,done:()=>!!e.flag(`c3_books_ok`),run:async()=>{await D(e,`myrddin`,`Ich verrate nicht, nur: Lies das Zeitalter-Buch auf dem Pult. Und sieh dir den Globus an. Er weiß, wo die Welt anfängt.`,`Die Farben sind kein Zufall. Das Rot trägt Wärme, das Schwarz Kälte, das Blau Weite, das Grün Wucherung.`)}},{text:`Und die Waage?`,done:()=>!!e.flag(`c3_waage_ok`),run:async()=>{await D(e,`myrddin`,`Links der Beutel mit der Aufschrift. Rechts legst du Gewichte. Die Eichtafel daneben sagt, was ein Schädel wiegt.`,`Aber hüte dich: Ein Becher ist nicht nur ein Becher. Er wiegt etwas. Und ein Knochen auch.`)}},{text:`Zum Rätsel der Tür ...`,show:()=>!!e.flag(`c3_books_ok`)&&!e.flag(`c3_tuer_offen`),done:()=>!!e.flag(`c3_tuer_offen`),run:async()=>{await D(e,`myrddin`,`Die Tür fragt, was mehr wird, je mehr man nimmt. Ich sage nur: Ich gehe viel davon. Im Alter braucht man mehr davon.`,`Tipp: Wer geht, hinterlässt sie. Wer bleibt, hat sie nicht.`)}},{text:`Was wisst Ihr über den Kanzler?`,show:()=>!!e.flag(`c3_myrddin_malvor`),run:async()=>{await D(e,`myrddin`,`Malvor wollte schon früh Macht. Er misst alles in Gold und alle in Nützlichkeit.`,`Wenn er den König vergiftet hat, hat er das Gift selbst gemischt. Er rührt nur, was er selbst bereitet.`)}},{text:`Der König ist krank, nicht wahr?`,done:()=>!!e.flag(`c3_king_cured`),run:async()=>{await D(e,`myrddin`,`Er ist nicht krank, er wird kränker gemacht. Schierling, in kleinen Dosen. Jeden Abend im Wein.`,`Gegen Schierling hilft ein Trank aus Moorwasser, Rabenfeder und Alraune. Hast du so etwas?`),await O(e,`Ich hätte da etwas Türkisfarbenes. Eine Hexe hat es gebraut.`),await D(e,`myrddin`,`Dann zeig es mir. Gib es mir kurz in die Hand.`)}},{text:`Was ist das für ein Turm?`,run:async()=>{await D(e,`myrddin`,`Mein Turm. Hunderttausend Bücher, tausend Staubflocken pro Buch und eine Geschichte für jeden, der nicht schläft.`,`Der Orden bezahlt mich dafür, dass ich ihnen nicht erkläre, was ich weiß.`)}},j(`Gib auf die Sterne acht. Sie sind die einzigen, die nie lügen.`,`myrddin`,e,`Auf Wiedersehen.`)])}}),{id:`waage`,name:`Waage`,sprite:e=>{let t=In(e);return t===Pn?`waage_neutral`:t>Pn?`waage_rechts`:`waage_links`},x:195,y:394,scale:.95,at:{x:195,y:420},primary:`use`,look:bn(e=>e.flag(`c3_waage_ok`)?`Die Waage steht im Gleichgewicht. Links hängt ein Beutel mit einem 'V'. Rechts liegt die Lösung.`:`Eine Waage. Links hängt ein schwerer Beutel mit einem aufgestickten 'V'. Die linke Schale sinkt. Es fehlt etwas auf der rechten.`),use:e=>e.say(Fn(e).length?`Ich muss Gewichte auflegen oder wegnehmen. Mit der Hand wiegt man nur das Gewissen.`:`Ich lege Dinge auf die rechte Schale, bis sie zur linken passt. Der Messkasten hat Gewichte.`),take:async e=>{let t=Fn(e);if(!t.length)return e.say(`Es liegt nichts auf der Schale.`);for(let n of t)e.add(n);e.set(`c3_waage_items`,``),e.sfx(`pickup`),await e.say(e.flag(`c3_waage_ok`)?`Ich nehme alles wieder weg. Myrddin hat das Gleichgewicht schon gesehen. Es zählt.`:`Ich räume die Schale leer. Ordnung ist der Anfang der Weisheit. Oder des Mittagessens.`)},useWith:Object.fromEntries(Object.keys(Nn).map(e=>[e,t=>Vn(t,e)]))},B(`eichtafel`,`Eichtafel`,[230,330,60,38],`Eine kleine Messingtafel: 'Eichgewichte: Totenschädel III. Zinnbecher II. Knochen I.' Darunter, kleiner: 'Der Beutel V.'`,{at:{x:255,y:425}}),N({id:`messkasten`,name:`Messkasten`,x:262,y:430,sprites:{closed:`kohlekiste`,open:`kohlekiste_offen`},scale:.7,at:{x:262,y:432},contents:[`totenkopf`,`zinnbecher`,`knochen`,`schnalle`],title:`Messkasten`,look:`Ein Kasten mit Gewichten und Makabrem. Myrddin wiegt nichts mit Metall, wenn er einen Schädel haben kann.`,emptyText:`Alle Gewichte sind weg. Myrddin wird das bemerken.`}),{id:`tisch_bib`,name:`Lesetisch`,sprite:`tisch_bib`,x:668,y:374,at:{x:668,y:410},primary:`look`,look:`Ein langer Lesetisch mit Kerzen. Vier Bücher liegen aufgereiht. Man spürt, dass hier Reihenfolge gilt.`,take:`Ein Tisch. Zu schwer, zu festgeschraubt, zu viel Geschichte.`},...Rn.map(([e,t,n,r,i])=>({id:`buch_${e}`,name:t,sprite:n,x:i,y:342,scale:.9,z:343,hit:[i-15,306,30,42],at:{x:668,y:410},primary:`use`,look:r,use:n=>Bn(n,e,t),take:`Ich ziehe es. Es klickt. Wegnehmen geht nicht, es steckt in einem Mechanismus.`})),{id:`pult`,name:`Lesepult`,sprite:`pult_bibel`,x:590,y:418,scale:.85,at:{x:590,y:430},primary:`look`,look:`Ein Pult mit einem aufgeschlagenen Folianten: 'Das Buch der Zeitalter'. Eine Zeile ist unterstrichen: 'Am Anfang war das Blut, dann kam die Nacht, dann der Himmel, zuletzt das Moos.'`,use:`Ich blättere. Staub. Fußnoten. Eine Fußnote zu einer Fußnote. Weise Leute lieben das.`,take:`Das Pult bleibt. Der Foliant auch. Beide wiegen mehr als mein Mut.`},{id:`globus`,name:`Globus`,sprite:`globus`,x:405,y:390,scale:.9,at:{x:405,y:420},primary:`use`,look:`Ein alter Globus. Rot für die Feuerberge, schwarz für den Norden, blau für die Meere, grün für die Moore.`,use:async e=>{e.sfx(`creak`),await e.say(`Ich drehe den Globus. Auf dem Sockel kratzt eine Randnotiz in Myrddins Schrift: 'Glut, Nacht, Tiefe, Moos. So wurde die Welt.'`)},take:`Die Welt im Rucksack? Das bringt Unglück.`},{id:`geheimtuer`,name:`Bücherschrank`,sprite:e=>e.flag(`c3_tuer_offen`)?`geheimtuer_offen`:`geheimtuer_zu`,x:800,y:346,at:{x:800,y:380},primary:`use`,look:bn(e=>e.flag(`c3_tuer_offen`)?`Der Schrank steht offen. Eine Treppe führt in die Dunkelheit, wo sie vermutlich Myrddins Geheimnisse sammelt.`:e.flag(`c3_books_ok`)?`Der Bücherschrank ist entriegelt. Er scheint zu flüstern: eine Frage.`:`Ein Bücherschrank, etwas zu tief. Aus der Fuge zieht kalte Luft. Dahinter ist mehr als Pergament.`),take:`Zu schwer, zu groß, zu geheimnisvoll.`,use:async e=>{if(e.flag(`c3_tuer_offen`))return e.say(`Er steht offen. Ich muss nur noch hindurch. Dunkelheit, Staub und ein Fläschchen.`);if(!e.flag(`c3_books_ok`))return e.say(`Verschlossen. Ich schiebe, ich rüttle, ich flehe. Irgendwo muss ein Mechanismus sein. Die Bücher am Tisch vielleicht?`);for(await e.say(`Der Schrank knarzt. Eine Stimme aus dem Holz: 'Je mehr man nimmt, desto mehr bleibt zurück. Was ist es?'`);;){let t=await e.choose([`Schritte`,`Gold`,`Wein`,`Schulden`,`Zeit`,`Weg mit dem Schrank!`]);if(t===0){e.set(`c3_tuer_offen`,!0),e.sfx(`door`),await e.say(`'Schritte. Ja.' Der Schrank schwingt auf. Dahinter: eine Treppe, ein Fläschchen und ein Hauch Moder.`);return}let n=[,`'Gold? Je mehr man nimmt, desto weniger bleibt. Denk nach.'`,`'Wein? Nur bei mir.'`,`'Schulden? Ja, auch. Aber das ist nicht die Antwort.'`,`'Zeit? Fast schön. Aber nicht richtig.'`,`'Beleidigungen sind keine Antworten. Ich notiere es.'`][t];if(await e.say(n),t===5)return}}},M({id:`c3_weihwasser`,item:`weihwasser`,x:800,y:340,scale:.9,hidden:e=>!e.flag(`c3_tuer_offen`),say:`Ein Fläschchen Weihwasser, das Myrddin gegen Dämonen aufbewahrt. Er wird es nicht vermissen. Er hat Dämonen genug.`}),...Fe({id:`kommode_b`,name:`Apothekerschrank`,sprites:[`kommode_wk_zu`,`kommode_wk_oben`,`kommode_wk_unten`],x:500,y:362,scale:.7,at:{x:500,y:392},look:`Myrddins Apothekerschrank. Zwei Schubladen, in denen Dinge liegen, die einmal lebendig waren. Oder noch sind.`,drawers:[{hit:[.06,.12,.88,.38],contents:[`pilz`,`kerzenwachs`,`haarlocke`],name:`Obere Schublade`},{hit:[.06,.55,.88,.38],contents:[`flasche_leer`,`glasauge`,`fieberkraut`],name:`Untere Schublade`}]}),{id:`sessel`,name:`Sessel`,sprite:`sessel`,x:120,y:384,scale:.85,at:{x:120,y:410},primary:`use`,look:`Ein Ledersessel mit Mulde. Hier sitzt Myrddin und schläft, während er nachdenkt.`,use:async e=>{await e.say(`Ich setze mich. Der Sessel schluckt mich. Als ich aufstehe, habe ich sieben Minuten und eine Idee verloren.`)},take:`Ein Sessel. Den nehme ich höchstens im Traum.`},{id:`kamin`,name:`Kamin`,sprite:null,x:55,y:340,hit:[0,150,110,190],at:{x:150,y:420},primary:`look`,look:`Ein Kamin mit grünem Feuer. Es wärmt nicht, aber es leuchtet. Wie Hoffnung.`,use:`Ich halte die Hand ins Feuer. Es ist kalt. Das macht es noch unheimlicher.`,useWith:{pergamentfetzen:`Pergament ins grüne Feuer? Es wäre ein Mord an der Geschichte. Ich lasse es.`,kerzenstummel:`Ich zünde den Stummel an. Er brennt grün. Ich glaube, das ist nicht gut.`}},B(`bib_sphaere`,`Armillarsphäre`,[235,25,85,95],`Eine goldene Sphäre aus Ringen, die langsam kreist. Sie zeigt die Bahnen der Gestirne. Oder Myrddins Gedankengänge.`),B(`bib_sternenkarte`,`Sternenkarte`,[380,0,300,60],`Die Sternbilder an der Decke: Rabe, Drache, Waage, Schwert. Der Drache ist größer gemalt als die anderen.`),B(`bib_fenster`,`Fenster`,[440,80,90,220],`Ein hohes Fenster mit Blick auf Sterne und die Silhouette einer Burg. Ich bin froh, dass sie keine Gesichter hat.`),B(`bib_treppe`,`Wendeltreppe`,[885,20,75,190],`Eine Wendeltreppe, die in den Dachboden des Turms führt. Dort wohnen die Bücher, die zu gefährlich für unten sind.`),B(`bib_schaedel`,`Schädel im Regal`,[145,130,25,25],`Ein Schädel zwischen den Büchern. Er hat mehr gelesen als ich.`),B(`bib_regal`,`Bücherregale`,[225,100,160,210],`Tausend Bücher. Titel wie 'Von den Wirkungen des Nichtstuns' und 'Vierzig Arten, einen Trank zu verpfuschen'.`)]},Un=e=>!!e.flag(`c3_knorr_asleep`);async function Wn(e,t){if(yn(e)!==`suppe`)return e.flag(`c3_t_suppe`)?D(e,t,`Danke, ich bin satt. Das erste Mal seit Wochen.`):D(e,t,`Ein leerer Becher? Ich bin hungrig, nicht höflich.`);e.set(`c3_becher`,``),e.honor(1),e.set(`c3_t_suppe`,!0),await e.pose(`use`,400),await D(e,t,`Suppe! Kohl, Zwiebel und eine Ahnung von Fleisch. Ich habe Brot gesehen, das mir besser gefallen hat. Aber das hier ist ein Festmahl.`),await O(e,`Roderic hat mir aufgetragen, Gefangene zu speisen. Ich hätte nie gedacht, dass es um Euch geht.`)}async function Gn(e){e.sfx(`unlock`),await e.pose(`use`,600),e.set(`c3_aldric_free`,!0),e.set(`c3_aldric_story`,!0),await D(e,`aldric`,`Der Schlüssel! Bran, du Teufelskerl. Ich war schon dabei, mit der Ratte zu verhandeln.`),await D(e,`aldric`,`Hör zu: Malvor hat mich eingesperrt, weil ich ihn beim Gift-Mischen sah. Der König ist nicht krank, er wird vergiftet.`),await D(e,`aldric`,`Sein Versteck ist ein Geheimfach hinterm Wandteppich im Thronsaal. Die Knöpfe: 'Rabe, Kreuz, Rabe, Lamm', hat er im Suff gemurmelt.`),await D(e,`aldric`,`Ich gehe hinauf in den Thronsaal und warte dort. Wenn du ihn anklagst, bezeuge ich alles.`),await O(e,`Ein Zeuge, ein Spruch und ein Fach. Fehlt nur noch der Kelch.`),await e.say(`Aldric humpelt die Treppe hinauf. Der Kerker wirkt plötzlich leerer.`)}var Kn={id:`kerker`,title:`Kerker von Grauwacht`,bg:`kerker`,walk:I.kerker.walk,scale:I.kerker.scale,ambient:`dungeon`,fx:[{kind:`drips`,n:.8},{kind:`fog`,area:[0,300,960,140],n:.5}],things:[Re(`left`,{id:`to_hof`,name:`Treppe zum Burghof`,to:`burghof`,x:705,y:390,facing:-1}),P({id:`knorr`,name:`Wärter Knorr`,x:415,y:352,facing:-1,frames:{idle:`knorr_idle`,talk:`knorr_idle`,sleep:`knorr_sleep`},pick:(e,t)=>t.flag(`c3_knorr_asleep`)?`sleep`:null,look:bn(e=>Un(e)?`Knorr schnarcht wie ein Ochse im Winter. Aus dem Maul hängt ein Faden Spucke. Er träumt von Wein.`:`Wärter Knorr. Rund, rot und im Besitz eines Schlüsselbunds, das lauter klimpert als sein Gewissen.`),give:{wein:async e=>{if(Un(e))return e.say(`Er schläft. Man weckt keinen Wärter, der friedlich schläft. Das ist ein ungeschriebenes Gesetz.`);e.remove(`wein`),e.flag(`c3_wein_praep`)?(e.set(`c3_wein_praep`,!1),await D(e,`knorr`,`Wein! Für mich? Von wem? Egal. Prost auf den Kanzler, der uns alle ... hicks ... bezahlt.`),await e.say(`Knorr trinkt in einem Zug. Er blinzelt, schwankt, summt, und sackt langsam auf den Schemel. Dann kommt das Schnarchen.`),e.set(`c3_knorr_asleep`,!0),e.sfx(`magic`),await O(e,`Das Schlafkraut wirkt. Der Schlüssel am Haken gehört mir.`)):(e.set(`c3_knorr_drunk`,!0),await D(e,`knorr`,`Wein! Du bist ein Gentleman, Junge. Hicks. Ich sag dir was: Der Kanzler besucht den Gefangenen jede Woche.`),await D(e,`knorr`,`Er sagt, er kontrolliert die Haft. Ich sage: Er hat Angst vor einem Mann in Ketten. Hicks. Aber ich sage nichts.`),await O(e,`Er ist betrunken, aber nicht müde genug. Es muss etwas Stärkeres her. Berta hat Schlafkraut ...`))},schlafkraut:`Knorr: Kraut? Ich bin doch kein Kaninchen! Gib mir was zum Trinken, Junge.`,zinnbecher:async e=>{yn(e)===`wein`&&!Un(e)?(e.set(`c3_becher`,``),e.set(`c3_knorr_drunk`,!0),await D(e,`knorr`,`Wein im Becher! Ein Gentleman! Hicks. Aber das reicht nicht, um mich umzuhauen. Ich vertrage mehr als das Königshaus.`)):await D(e,`knorr`,`Ein leerer Becher? Ich bin Wärter, nicht Wasserträger.`)}},talk:async e=>{if(Un(e))return O(e,`Knorr schnarcht. Es ist das ehrlichste Gespräch, das ich seit Tagen hatte.`);await k(e,`c3_met_knorr`,async()=>{await D(e,`knorr`,`Wer kommt da? Besuch? Ich habe keine Besuchszeiten. Ich habe nur Zeiten, in denen ich nicht besoffen bin. Und die sind selten.`)}),await A(e,()=>[{text:`Wer ist im Kerker?`,run:()=>D(e,`knorr`,`Ein Ritter, den keiner kennt. Die Ratten sind meine Freunde. Und ein Skelett in der Zelle da hinten, das zahlt keine Miete.`)},{text:`Darf ich den Gefangenen Suppe bringen?`,done:()=>!!e.flag(`c3_t_suppe`),run:()=>D(e,`knorr`,`Suppe? Meinetwegen. Aber ich bekomme einen Schluck vom Kanzlerwein, wenn der Gefangene satt wird. Das ist Brauch.`)},{text:`Kann ich den Gefangenen sprechen?`,run:()=>D(e,`knorr`,`Von mir aus. Er kann nirgendwohin. Und ich will nicht wissen, was ihr redet.`)},{text:`Was ist das für ein Schlüsselbund?`,done:()=>!!e.flag(`c3_key_taken`),run:()=>D(e,`knorr`,`Hier? Der Schlüssel der Zelle hängt am Haken dort drüben, hinterm Tisch. Ich trage nur den Bund, damit ich wichtig aussehe.`)},{text:`Was trinkt Ihr da?`,run:()=>D(e,`knorr`,`Medizin. Gegen Langeweile, Nüchternheit und Familie. Hast du Medizin dabei? Ich würde sie nehmen.`)},{text:`Der Kanzler besucht den Gefangenen?`,show:()=>!!e.flag(`c3_knorr_drunk`),run:()=>D(e,`knorr`,`Hicks. Immer nachts. Er bringt Wein und Papiere. Und er geht ohne beides. Aber ich sage nichts.`)},j(`Wenn du Wein siehst, bring ihn mit. Wenn nicht, bring dich selbst. Hicks.`,`knorr`,e,`Auf Wiedersehen.`)])}}),{id:`schluesselhaken`,name:`Schlüsselhaken`,sprite:`schluesselhaken`,x:300,y:214,scale:.8,at:{x:330,y:380},primary:`take`,look:bn(e=>e.flag(`c3_key_taken`)?`Ein Schlüsselhaken mit vier Ringen. Drei Haken sind leer, der vierte auch.`:`Ein Brett mit vier riesigen Schlüsseln. Einer glänzt, der Zellenschlüssel. Knorr beobachtet ihn wie eine Henne ihr Ei.`),take:async e=>{if(e.flag(`c3_key_taken`))return e.say(`Der Haken ist leer. Ich habe schon alles, was ich wollte. Und noch ein Stück schlechtes Gewissen.`);if(!Un(e)){e.sfx(`wrong`),await D(e,`knorr`,`Pfoten weg vom Haken, Bursche! Die Schlüssel zähle ich jeden Abend. Zweimal.`),await O(e,`Er sieht aus, als wäre er betrunken, aber er hat Augen wie ein Habicht. Ich muss ihn erst ausschalten.`);return}await e.pose(`pick`,600),e.sfx(`pickup`),e.add(`zellenschluessel`),e.set(`c3_key_taken`,!0),await e.say(`Der Zellenschlüssel kommt mit einem leisen Klirren. Er ist schwer. Und für einen Moment auch ich.`)},use:e=>e.say(`Ich fasse an den Haken. Er hängt, wie Haken eben hängen.`)},{id:`zelle`,name:`Zelle`,sprite:null,x:548,y:300,hit:[480,60,135,240],at:{x:548,y:330},primary:`look`,look:bn(e=>e.flag(`c3_aldric_free`)?`Die Zelle steht offen. Das Stroh liegt noch, wo der Gefangene lag.`:`Eine Zelle mit Gitter und Schloss. Dahinter steht ein Mann in zerlumpter Rüstung.`),use:e=>e.say(e.flag(`c3_aldric_free`)?`Offen. Ein trauriger Raum, aber ein ehrlicher.`:`Verschlossen. Das Schloss hat die Größe meines Kopfes. Es braucht einen Schlüssel von gleichem Format.`),useWith:{zellenschluessel:e=>e.flag(`c3_aldric_free`)?e.say(`Offen ist offen.`):Gn(e),eisenstange:`Ich drücke die Stange gegen das Schloss. Es biegt sich. Nicht das Schloss.`}},Ie({id:`zelle_auf`,sprite:`zelle_offen`,x:640,y:306,scale:.9,hidden:e=>!e.flag(`c3_aldric_free`)}),P({id:`aldric`,name:`Ser Aldric`,x:548,y:312,facing:1,hidden:e=>!!e.flag(`c3_aldric_free`),frames:{idle:`aldric_idle`,talk:`aldric_talk`},look:`Ein Ritter in zerrissener Rüstung. Ketten an den Händen, aber sync e=>{await A(e,()=>[{text:`Geht es Euch gut?`,run:()=>D(e,`aldric_t`,`Ich lebe. Das ist mehr, als die meisten Gefangenen sagen können. Danke, Bran.`)},{text:`Wie war es im Kerker?`,run:()=>D(e,`aldric_t`,`Feucht, laut und sehr, sehr langweilig. Der Wärter sang jede Nacht dasselbe Lied. Ich kann es jetzt auswendig.`)},{text:`Wisst Ihr, wo Malvor das Gift versteckt?`,show:()=>!e.flag(`c3_fach_offen`),run:()=>D(e,`aldric_t`,`Hinter dem Wandteppich. Er murmelte immer den Spruch: Rabe, Kreuz, Rabe, Lamm.`)},j(`Ich bleibe hier. Und lasse Malvor nicht aus den Augen.`,`aldric_t`,e,`Auf Wiedersehen.`)])}}),P({id:`wache_l`,name:`Thronwache`,x:300,y:356,facing:1,frames:{idle:`wache_idle`,talk:`wache_idle`},look:`Eine Thronwache. Sie steht so steif, dass man ihr Staub vom Helm wischen könnte. Vermutlich bewegt sie sich nur, wenn der König niest.`,talk:async e=>{await D(e,`wache_l`,`Ich sehe nichts, höre nichts, sage nichts. Das ist mein Beruf. Die Bezahlung ist entsprechend.`)}}),P({id:`wache_r`,name:`Thronwache`,x:760,y:350,facing:-1,frames:{idle:`wache_idle`,talk:`wache_idle`},look:`Noch eine Wache. Sie schläft im Stehen, mit offenen Augen. Das ist eine Kunst.`,talk:async e=>{await D(e,`wache_r`,`Der Kanzler hat gesagt: Keiner geht durch die Tür dort. Ich weiß nicht, was dahinter ist. Ich bin glücklich damit.`)}}),B(`tapisserie`,`Wandteppich`,[90,10,125,150],bn(e=>e.flag(`c3_fach_sichtbar`)?`Der Wandteppich hängt schief. Dahinter schimmert ein Stein mit vier Knöpfen. Der Teppich zeigt einen Raben, ein Kreuz, ein Lamm. Die Reihenfolge ist verwischt.`:`Ein riesiger Wandteppich: Burg, Rabe, Kreuz, Lamm. Der Rahmen ist auffällig sauber. Als hätte ihn jemand regelmäßig angehoben.`),{at:{x:130,y:345},use:async e=>{if(e.flag(`c3_fach_sichtbar`))return e.say(`Der Teppich bleibt oben. Er ist froh, einmal Luft zu bekommen.`);e.set(`c3_fach_sichtbar`,!0),e.sfx(`creak`),await e.pose(`use`,500),await e.say(`Ich hebe den Teppich an. Dahinter: ein Steinfeld mit vier Runenknöpfen, ein Rabe, ein Kreuz, ein Lamm und noch ein Rabe. Ein Geheimfach!`)},take:`Der Teppich ist zu schwer und zu historisch. Ich würde ihn nicht tragen können.`}),{id:`geheimfach`,name:`Geheimfach`,sprite:e=>e.flag(`c3_fach_sichtbar`)?e.flag(`c3_fach_offen`)?`geheimfach_offen`:`geheimfach_zu`:null,x:120,y:244,at:{x:125,y:345},primary:`use`,z:300,hidden:e=>!e.flag(`c3_fach_sichtbar`),look:bn(e=>e.flag(`c3_fach_offen`)?`Das Geheimfach steht offen. Darin liegt, was Malvor vor aller Welt verbarg.`:`Eine Steinplatte mit vier Knöpfen: Rabe, Kreuz, Rabe, Lamm in dieser Anordnung? Nein, die Reihenfolge der Knöpfe ist es, nicht die Anordnung.`),take:`Das Fach ist fest im Stein. Aber ich kann es öffnen, wenn ich die Reihenfolge kenne.`,use:async e=>{if(!e.flag(`c3_fach_offen`))return e.say(`Vier Runenknöpfe. Ich muss sie in der richtigen Reihenfolge drücken. Aldric kennt vielleicht einen Spruch.`);if(!e.panelLeft(`c3_fach`,[`giftflasche`,`pergamentfetzen`]).length)return e.say(`Das Fach ist leer. Malvor hat nur noch Spinnweben.`);await e.openPanel(`Geheimfach`,`c3_fach`,[`giftflasche`,`pergamentfetzen`])}},...[`lamm`,`rabe`,`kreuz`,`rabe`].map((e,t)=>({id:`rune${t+1}`,name:`Rune (${e})`,sprite:`knopf_${e}`,x:[81,108,136,162][t],y:222,scale:.72,z:301,hit:[[81,108,136,162][t]-14,198,28,28],at:{x:125,y:345},primary:`use`,hidden:e=>!e.flag(`c3_fach_sichtbar`)||!!e.flag(`c3_fach_offen`),look:`Ein Runenknopf mit ${e===`rabe`?`einem Raben`:e===`kreuz`?`einem Kreuz`:`einem Lamm`}.`,use:t=>rr(t,e)})),N({id:`truhe_t`,name:`Hoftruhe`,x:215,y:392,sprites:{closed:`truhe_waffe_zu`,open:`truhe_waffe_offen`},scale:.85,at:{x:215,y:420},contents:[`rosenkranz`,`zinnring`,`spielfigur`],title:`Hoftruhe`,look:`Eine Hoftruhe mit Wappen. Hier verwahren Könige das, was sie nie wieder sehen wollen.`,emptyText:`Die Truhe ist leer, bis auf einen verzweifelten Silberfisch.`}),...Fe({id:`kommode_t`,name:`Schreibkommode`,sprites:[`kommode_wk_zu`,`kommode_wk_oben`,`kommode_wk_unten`],x:900,y:360,scale:.7,at:{x:880,y:395},look:`Malvors Schreibkommode. Alles in Reih und Glied, jede Schublade peinlich ordentlich. Das ist verdächtig.`,drawers:[{hit:[.06,.12,.88,.38],contents:[`gaensefeder`,`pergamentfetzen`,`haarlocke`],name:`Obere Schublade`},{hit:[.06,.55,.88,.38],contents:[`kerzenwachs`,`kreide`,`zahn`],name:`Untere Schublade`}]}),B(`thron`,`Thron`,[440,20,140,250],`Der Thron von Grauwacht. Zwei Raben thronen auf den Lehnen, grimmig, wie der Rest.`,{at:{x:505,y:345}}),B(`th_banner_l`,`Raben-Banner`,[300,40,70,200],`Ein schwarzes Banner mit weißem Raben. Der Stoff ist zerfetzt. Es wurde schon oft durch Feuer getragen.`),B(`th_banner_r`,`Raben-Banner`,[685,40,70,200],`Das Gegenstück des Banners. Der Rabe schaut nach links, also weg von Malvor.`),B(`th_korb_l`,`Feuerkorb`,[280,235,55,80],`Ein Feuerkorb mit lodernden Scheiten. Er wärmt den Saal und verbrennt gelegentlich ein Gerücht.`),B(`th_korb_r`,`Feuerkorb`,[718,235,55,80],`Der zweite Feuerkorb. Ein Funke fliegt heraus und stirbt auf dem Teppich.`),B(`th_gemach`,`Tür zu Malvors Gemach`,[835,120,100,185],bn(e=>e.flag(`c3_exposed`)?`Die Tür steht einen Spalt offen. Malvors Gemach ist leer, bis auf den Geruch von Schwefel.`:`Eine schwere Doppeltür. Dahinter liegt das Gemach des Kanzlers. Eine Wache steht davor, die nichts weiß.`),{at:{x:860,y:410},use:`Die Tür ist verschlossen. Die Wache lächelt freundlich. Es ist das Lächeln eines Mannes mit einer Hellebarde.`}),B(`th_fenster`,`Fenster`,[400,0,270,250],`Hohe Spitzbogenfenster. Dahinter liegt das verschneite Land, kalt und friedlich.`),B(`th_saeule`,`Säule`,[235,20,55,285],`Eine Steinsäule mit eingemeißelten Raben. Sie hält das Dach. Mehr kann man von Säulen nicht verlangen.`)]},sr=n({combos:()=>ur,default:()=>pr,hint:()=>fr,items:()=>lr,scenes:()=>cr,start:()=>dr}),cr=[Dn,Mn,Xn,Hn,or,Kn],lr={zinnbecher:{name:e=>yn(e)===`wein`?`Becher mit Wein`:yn(e)===`suppe`?`Becher mit Suppe`:`Zinnbecher`,look:`Ein verbeulter Zinnbecher. Er hat schon Wein, Suppe und Schlimmeres gesehen.`},wein:{name:e=>e.flag(`c3_wein_praep`)?`Gewürzter Weinkrug`:`Weinkrug`,look:`Ein Tonkrug mit schwerem, rotem Wein. Er riecht nach Pflaumen und Entschuldigungen.`}},ur={"sand+schild":async e=>{if(e.flag(`c3_schild_sand`))return e.say(`Der Schild ist blank gescheuert. Mehr Sand macht ihn nur ärgerlicher.`);e.set(`c3_schild_sand`,!0),e.sfx(`dig`),await e.pose(`use`,800),await e.say(`Ich scheuere den Schild mit Sand, bis der Rost nachgibt. Darunter blitzt Stahl. Jetzt noch glänzen.`)},"lappen+schild":async e=>{if(!e.flag(`c3_schild_sand`))return e.say(`Der Lappen verschmiert nur den Rost. Erst mit Sand scheuern, dann polieren.`);e.sfx(`magic`),await e.pose(`use`,900),e.remove(`schild`),e.add(`spiegelschild`),await e.say(`Ich poliere, bis ich mein Gesicht sehe. Ein bleicher Junge starrt zurück. Ein Spiegelschild! Der Drache wird sein eigenes Feuer lieben.`)},"lappen+sand":`Sand auf einen Lappen? Das gibt Schmirgel. Praktisch, aber ich brauche etwas, das ich polieren kann.`,"schlafkraut+wein":async e=>{if(e.flag(`c3_wein_praep`))return e.say(`Der Wein ist schon gewürzt. Mehr Kraut macht nur das Gewissen schwerer.`);e.remove(`schlafkraut`),e.set(`c3_wein_praep`,!0),await e.say(`Ich zerkrümele das Kraut im Krug und schüttle. Der Wein wird trüb und riecht nach Heu. Ein Opfer für jeden, der ihn trinkt.`)},"totenkopf+zinnbecher":`Ein Zinnbecher auf einem Totenkopf? Sehr stimmungsvoll. Aber Wilm würde lachen.`},dr={scene:`burgtor`,x:80,y:400,facing:1,inv:[`schwert`,`siegelbrief`,`halvard_brief`,`gegengift`,`hexentalisman`,`fackel`],flags:{chapter:3},intro:async e=>{await e.card(`Kapitel 3`,`Burg Grauwacht`),await O(e,`Burg Grauwacht. Mauern aus grauem Stein, Banner mit Raben, und ein Fallgitter, das aussieht, als hätte es Zähne.`,`Das Moor liegt hinter mir. Das Schlimmste kommt vermutlich noch.`)}},fr=e=>{if(!e.flag(`c3_gate_open`)){let t=e.flag(`c3_proof_schwert`)&&e.flag(`c3_proof_siegel`)&&e.flag(`c3_proof_brief`);return e.flag(`c3_winde_kurbel`)?e.flag(`c3_winde_fett`)?t?`Benutze die Torwinde und kurbele das Fallgitter hoch.`:`Zeige Hauptmann Grimm Schwert, Siegelbrief und Halvards Brief. Oder bring die Wache Wilm mit Wein dazu, den Hauptmann abzulenken.`:`Die Winde klemmt: Nimm Pech aus dem Pechfass und schmiere sie.`:`Das Fallgitter hängt an einer Winde ohne Kurbel. Such in der Schubkarre nach etwas Langem aus Eisen.`}return e.flag(`c3_exposed`)?e.flag(`c3_demut_done`)?e.has(`weisheitssiegel`)?e.has(`spiegelschild`)?`Sprich mit Ser Roderic im Thronsaal: Es geht zum Vulkan.`:`Poliere den Schild aus der Rüstkammer mit Sand und Lappen zum Spiegelschild.`:`Hol dir bei Myrddin im Bibliotheksturm das Siegel der Weisheit.`:`Schließe die Prüfung der Demut bei Ser Roderic im Burghof ab.`:e.flag(`c3_roderic_met`)?e.flag(`c3_demut_done`)?e.has(`weisheitssiegel`)?e.flag(`c3_king_cured`)?e.has(`spiegelschild`)?e.flag(`c3_aldric_free`)?!e.has(`giftflasche`)&&!e.flag(`c3_fach_offen`)?`Finde das Geheimfach hinter dem Wandteppich im Thronsaal. Die Runenfolge kennt Ser Aldric.`:e.flag(`c3_exposed`)?`Sprich mit Ser Roderic.`:`Klage Malvor an: Giftflasche, Aldrics Zeugnis und der genesene König.`:`Befreie Ser Aldric im Kerker: Wein mit Schlafkraut (Berta) macht Knorr müde, der Schlüssel hängt am Haken.`:`Poliere den Schild aus der Rüstkammer mit Sand und Lappen zum Spiegelschild.`:!e.flag(`c3_antidote`)&&!e.flag(`c3_malvor_away`)?`Lenke Kanzler Malvor ab (Halvards Brief oder der Hexentalisman) und träufle das Gegengift in den Weinkelch.`:`Gib im Thronsaal das Gegengift in den Kelch, solange Malvor abgelenkt ist.`:e.flag(`c3_books_ok`)?e.flag(`c3_tuer_offen`)?e.flag(`c3_waage_ok`)?`Sprich mit Myrddin: Du hast alle drei Prüfungen bestanden.`:`Bringe die Waage ins Gleichgewicht: Die linke Schale wiegt fünf. Gewichte liegen im Messkasten.`:`Beantworte das Rätsel des Bücherschranks: Was nimmt man, und es bleibt zurück?`:`Myrddins Prüfung: Zieh die Bücher in der Reihenfolge Rot, Schwarz, Blau, Grün.`:e.flag(`c3_t_pferd`)?e.flag(`c3_t_ruestung`)?e.flag(`c3_t_suppe`)?e.flag(`c3_t_hof`)?`Melde Ser Roderic, dass du alle Aufgaben erledigt hast. Gib Eduards Silber zurück, falls du es genommen hast.`:`Fege den Hof mit dem Besen.`:`Fülle einen Becher mit Suppe aus Bertas Kessel (erst mit ihr reden) und bringe ihn in den Kerker.`:`Setze in der Rüstkammer die Rüstung zusammen: Brustpanzer, Helm, Armschienen. Der Schlüssel liegt auf der Werkbank im Hof.`:`Beschlage das Pferd Donnerhuf: Hufeisen im Futtertrog, Hammer und Nagel an der Werkbank, Apfel von Berta.`:`Sprich im Burghof mit Ser Roderic, dem Ordensmeister.`},pr={scenes:cr,items:lr,combos:ur,start:dr,hint:fr},mr=n({default:()=>jr,hint:()=>Ar,scenes:()=>Or,start:()=>kr}),hr=I.vulkanpfad,gr=[{x:28,y:326},{x:500,y:326},{x:500,y:432},{x:28,y:432}];async function _r(e,t){if(e.flag(`c4_lava_cool`))return e.say(`Der Strom ist schon zu Stein erstarrt.`);e.remove(t),t===`eimer_wasser`&&e.add(`eimer`),e.sfx(`splash`),await e.pose(`use`,600),e.flash(`#ffffff`,450),e.shake(600),await e.say(t===`weihwasser`?`Das Weihwasser trifft die Lava mit einem Zischen, das fast wie ein Gebet klingt.`:`Ich kippe den Eimer aus. Eine Dampfwolke schießt in den Himmel, das Wasser schreit auf.`),await e.say(`Wo eben noch Glut floss, liegt jetzt dunkler, glasiger Stein. Er knackt, aber er hält.`),e.set(`c4_lava_cool`,!0),await O(e,`Ein Weg. Der Berg hat mich sicher nicht eingeladen. Aber er hat die Tür offen gelassen.`)}var vr=e=>e,yr=[`Ein Ritterskelett, noch in verkohlter Rüstung. Neben ihm liegt ein Ledertagebuch, die Seiten vom Ruß gebräunt.`,`„Tag 3. Der Lavastrom versperrt den Pfad. Wasser kühlt ihn. Hinter den Felsen kondensiert Dampf an kaltem Metall. Ein Eimer genügt.“`,`„Tag 6. Der Drache schläft. Er bewacht kein Gold. Ich sah ein Ei auf einem Altar. Es glühte. Es lebt.“`,`„Tag 7. Ein Mann in Schwarz bläst auf einem Horn. Der Drache erwacht und folgt ihm. Mein Schild war aus Stahl. Zu stumpf. Nur ein Spiegel hält den Atem.“`,`„Richte den Strahl auf den, der das Horn hält. Der Drache folgt dem Horn, nicht dem Herzen. Nicht vergessen: das Ei. Wer das Ei hat, hat den Drachen.“`],br={id:`vulkanpfad`,title:`Ascheweg am Kharn`,bg:`vulkanpfad`,walk:e=>e.flag(`c4_lava_cool`)?hr.walk:gr,scale:hr.scale,ambient:`volcano`,fx:[{kind:`ash`,n:1.2},{kind:`embers`,area:[0,150,960,250],n:.8}],things:[{id:`to_burg`,name:`Zurück nach Grauwacht`,sprite:null,x:43,y:424,hit:Ne.left,at:{x:38,y:400},primary:`walk`,look:`Weit hinter dem Aschefeld liegt Grauwacht. Ein König wartet. Und ein Kanzler flieht.`,walk:async e=>{await O(e,`Zurück? Nicht, solange Malvor mit dem Ei in diesem Berg ist.`)}},Re(`right`,{id:`to_hoehle`,name:`Zur Drachenhöhle`,to:`drachenhoehle`,x:80,y:400,facing:1,look:`Der Pfad führt zum Maul des Berges.`,guard:e=>e.flag(`c4_lava_cool`)?null:`Der Lavastrom versperrt den Weg. Hinüberspringen wäre mein letzter Sprung.`}),{id:`lavastrom`,name:`Lavastrom`,sprite:e=>e.flag(`c4_lava_cool`)?`lavastrom_erstarrt`:`lavastrom`,x:548,y:392,scale:1.65,hit:[514,220,72,180],at:{x:480,y:392},look:e=>e.say(e.flag(`c4_lava_cool`)?`Erstarrte Lava, schwarz und glasig. Darunter glimmt es noch leise.`:`Ein Strom aus flüssigem Feuer quert den Pfad. Die Hitze drückt mich zurück. Mit Wasser könnte man ihn bändigen.`),take:`Die Lava nehmen? Meine Hände sind keine Zangen.`,use:e=>e.say(e.flag(`c4_lava_cool`)?`Ich trete vorsichtig auf den Stein. Er hält.`:`Ich strecke die Hand aus. Meine Augenbrauen flüchten. Ich auch.`),useWith:{weihwasser:e=>_r(e,`weihwasser`),eimer_wasser:e=>_r(e,`eimer_wasser`),eimer:`Ein leerer Eimer vor einem Lavastrom. Mehr Verzweiflung geht nicht.`,seil:vr(`Ich werfe das Seilende hinein. Es fängt Feuer, bevor es die Lava berührt. Ich ziehe es schnell zurück.`),fackel:`Eine Fackel an einem Lavastrom. Das ist, als würde man einem Bären die Zähne zeigen.`,schwert:`Mein Schwert in der Lava härten? Das Eisen würde eher tanzen.`,spiegelschild:`Der Spiegelschild zeigt mir einen Jungen vor einem Meer aus Feuer. Er sieht nervös aus.`,flasche_leer:`Ein bisschen flüssiges Feuer in die Flasche füllen? Ich verzichte.`}},{id:`dampf`,name:`Dampfspalte`,sprite:`dampfschlot`,x:345,y:384,scale:1.7,look:`Ein Riss im Fels, aus dem heißer Dampf zischt. Ringsum perlt Wasser an kaltem Gestein.`,take:`Dampf lässt sich nicht einpacken.`,use:`Ich halte die Hand über die Spalte. Sie wärmt schön. Ich ziehe sie zurück, bevor sie kocht.`,useWith:{eimer:async e=>{e.sfx(`splash`),await e.pose(`use`,800),e.remove(`eimer`),e.add(`eimer_wasser`),await e.say(`Ich halte den kalten Eimer über den Dampf. Tropfen sammeln sich, einer nach dem anderen, bis der Eimer voll ist.`),await O(e,`Wasser aus Dampf. Selbst in der Hölle gibt es Haushaltstricks.`)},eimer_wasser:`Der Eimer ist schon voll. Eine Dampfspalte macht keinen Nachschlag.`,flasche_leer:`Eine Flasche voll Dampf? Ich sehe, wie es endet: mit einem Knall.`}},{id:`ritterskelett`,name:`Ritterskelett`,sprite:`ritterskelett`,x:160,y:390,scale:1.15,look:async e=>{e.set(`c4_diary`,!0);for(let t of yr)await e.say(t);await O(e,`Spiegel gegen Feuer. Das Ei nicht vergessen. Danke, alter Freund.`)},take:`Ich lasse die Gebeine in Ruhe. Ich bin Totengräber, ich weiß, wie sensibel Tote sind.`,use:async e=>{if(e.flag(`c4_pack`)||(e.set(`c4_pack`,!0),await e.pose(`use`,500),await e.say(`Ich hebe vorsichtig seinen verkohlten Rucksack an. Ein Eimer, ein paar Kleinigkeiten, ein Gebet in Fetzen.`)),!e.panelLeft(`ritterskelett`,[`eimer`,`rosenkranz`,`messingknopf`]).length)return e.say(`Nichts mehr. Der Ritter hatte nicht viel, und ich nehme ihm nicht den Rest.`);await e.openPanel(`Im Rucksack`,`ritterskelett`,[`eimer`,`rosenkranz`,`messingknopf`])},useWith:{seil:`Das Skelett an einem Seil ziehen? Ich bin nicht stolz auf diesen Gedanken.`},give:{weihwasser:`Ich segne die Gebeine mit einem Tropfen Weihwasser. Der Ritter wirkt zufriedener, soweit man das bei einem Skelett sagen kann.`}},M({id:`vp_zahn`,item:`zahn`,x:220,y:408,look:`Ein einzelner Zahn auf dem Aschepfad. Von einem Ritter, einem Wolf oder dem Berg selbst.`}),{id:`felsbrocken`,name:`Felsbrocken`,sprite:`felsbrocken`,x:262,y:392,scale:.85,hidden:e=>!!e.flag(`c4_fels`),look:`Ein mannshoher Felsbrocken. Dahinter, im Schatten, glimmt ein dunkler Spalt. Allein bewege ich ihn nicht.`,take:`Er wiegt mehr als eine Kuh. Und ich hatte ohnehin nie Rückenschmerzen.`,use:`Ich stemme mich gegen den Fels. Er bewegt sich um den Bruchteil einer Zwiebel. Mit Hebelwirkung ginge es besser.`,useWith:{seil:async e=>{e.sfx(`clank`),await e.pose(`use`,700),await e.say(`Ich lege das Seil um den Brocken, verkeile mich gegen die Felswand und ziehe mit allem, was ein Totengräber an Kreuz hat.`),e.shake(600),e.sfx(`creak`),e.set(`c4_fels`,!0),await e.say(`Der Fels löst sich, rollt polternd beiseite und bleibt in einer Aschewolke liegen. Dahinter öffnet sich eine kleine Nische.`)},schwert:`Mein Schwert als Hebel? Es würde brechen. Und dann hätte Roderic recht über mich.`}},Yt({id:`fels_nische`,name:`Felsnische`,hit:[225,330,90,60],at:{x:270,y:395},hidden:e=>!e.flag(`c4_fels`),contents:[`flasche_leer`,`kreuzanhaenger`,`spielfigur`],look:`Eine kleine Nische im Fels. Jemand hat hier etwas verstecken wollen. Vermutlich ein Pilger auf der Flucht.`,title:`In der Nische`}),{id:`schwefel`,name:`Schwefelkruste`,sprite:`steinhaufen`,x:420,y:402,scale:1.2,look:`Gelbe Kristalle, die nach faulen Eiern riechen. Der Berg schwitzt hier Schwefel aus. Man nennt es Höllenatem und lacht dabei nicht.`,take:`Der Schwefel klebt an den Fingern und stinkt. Ein Mitbringsel, das niemand will.`,use:`Ich kratze etwas Schwefel ab. Mein Taschentuch ist nun gelb. Es riecht wie ein Streit.`,useWith:{fackel:`Ich halte die Fackel an den Schwefel. Eine blaue Flamme tanzt, ich huste fürchterlich. Erkenntnis: Nicht noch einmal.`}},{id:`obsidian`,name:`Obsidian`,sprite:`obsidian`,x:585,y:420,scale:.9,hidden:e=>!e.flag(`c4_lava_cool`),look:`Schwarzes Vulkanglas, scharf wie ein Rasiermesser. Die Lava hat es hier geschmiedet.`,take:`Ich schneide mir fast den Daumen ab. Obsidian lässt sich nicht freiwillig tragen.`,useWith:{schwert:`Ich klopfe mit dem Schwert auf den Obsidian. Er klingt wie Glas, das sich für Stahl hält.`}},{id:`knochenpfahl`,name:`Warnpfahl`,sprite:`knochenpfahl`,x:700,y:372,hidden:e=>!e.flag(`c4_lava_cool`),look:`Ein Pfahl, behängt mit Schädeln und Fetzen. Auf einem Brett steht in Kohle: „Wer weitergeht, stirbt. Gezeichnet: alle, die weitergegangen sind.“`,take:`Ich ziehe den Pfahl nicht aus dem Boden. Er ist wohl das Einzige, was hier freiwillig steht.`},N({id:`vp_tierskelett`,name:`Verkohlter Kadaver`,x:790,y:410,sprites:{closed:`tierskelett`,open:`tierskelett`},scale:.9,hidden:e=>!e.flag(`c4_lava_cool`),contents:[`knochen`,`tonscherbe`],look:`Das Skelett eines Maultiers. Es trug einst ein Ritter. Zumindest bis zum Atem des Berges.`,title:`Zwischen den Knochen`}),z({id:`vulkan`,name:`Vulkan Kharn`,hit:[330,20,280,220],at:{x:480,y:360},look:`Der Kharn spuckt Rauch und Funken. Seine Hänge glühen wie ein offenes Herz. Wenn ein Berg schlafen kann, dann schläft dieser unruhig.`}),z({id:`drachenmaul`,name:`Höhlenöffnung`,hit:[800,15,150,150],at:{x:840,y:380},look:`Hoch in der Felswand klafft eine Öffnung mit steinernen Zähnen. Wer da hineingeht, wird gefressen. Oder berühmt. Das schließt einander nicht aus.`}),z({id:`toter_baum`,name:`Verbrannter Baum`,hit:[110,80,170,200],at:{x:190,y:380},look:`Ein verkohlter Baum, die Äste wie ein Gebet in den Himmel gestreckt. Das Gebet blieb unbeantwortet.`,take:`Ein Ast zerfällt zu Asche, sobald ich ihn berühre. Das Leben im Allgemeinen.`}),z({id:`lavafelder`,name:`Lavafelder`,hit:[250,195,220,100],at:{x:400,y:380},look:`Weit unten ziehen sich Lavaflüsse durchs Tal, wie die Adern des Berges. Kein Platz für Wanderer.`}),z({id:`skelett_rechts`,name:`Ferne Gebeine`,hit:[880,235,60,60],at:{x:840,y:380},hidden:e=>!e.flag(`c4_lava_cool`),look:`Noch ein Ritter, noch ein Schild, noch eine Lehre. Der Berg sammelt sie.`})]},xr=e=>Number(e.flag(`honor`)??0),Sr=e=>!e.flag(`c4_horn_taken`)&&!e.flag(`c4_horn_gone`);async function Cr(e,t){e.sfx(`roar`),e.shake(900),e.flash(`#ff7a2a`,900),await e.say(t),e.set(`c4_tries`,Number(e.flag(`c4_tries`)??0)+1),e.frame(`drache`,`idle`),e.set(`c4_wach`,!1),await D(e,`malvor`,`Hah! Der Drache braucht Schlaf, nicht Beschäftigung. Mach dich fort, bevor ich es mir anders überlege.`),await e.walk(100,400),await O(e,`Das war nicht klug. Der Atem hat mir die Brauen genommen und den Stolz gleich mit. Ich brauche etwas, das Feuer zurückwirft.`)}async function wr(e){Number(e.flag(`c4_tries`)??0)>0?await D(e,`malvor`,`Du schon wieder. Gut. Eine Lektion, die nicht bleibt, ist keine.`):await D(e,`malvor`,`Genug geredet. Ich habe die Macht, du hast ein Schwert. Siehst du den Unterschied?`),e.sfx(`bell`),e.frame(`malvor`,`cast`),await e.say(`Malvor setzt das Horn an. Ein tiefer Ton, fast ein Brüllen, rollt durch die Höhle. Die Lava schlägt Blasen.`),e.shake(800),e.flash(`#ffb050`,500),e.set(`c4_wach`,!0),e.frame(`drache`,`roar`),e.sfx(`roar`),await e.wait(600),await e.say(`Aschenschlund erhebt sich aus seiner Asche. Seine Augen glühen wie zwei Schmelzöfen. Das Horn spricht zu ihm, und er gehorcht.`),e.frame(`malvor`,`idle`),e.frame(`drache`,`idle`),await D(e,`malvor`,`Verbrenne ihn!`),await e.say(`Der Drache holt Luft. Die Höhle wird heiß, die Luft flimmert, dann öffnet er das Maul.`);let t=await e.choose([`Den Spiegelschild heben`,`Hinter den Altar werfen`,`Das Schwert ziehen und angreifen`]);if(t===0&&e.has(`spiegelschild`)){e.sfx(`magic`),await e.say(`Ich reiße den Spiegelschild hoch. Der Feuerstrahl prallt auf das blanke Metall, bricht sich und schießt zurück.`),e.flash(`#ffffff`,700),e.shake(900),e.sfx(`fire`),await D(e,`malvor`,`Nein! Nicht auf mich! Du Bestie, nicht auf mich!`),await e.say(`Das Feuer fegt über Malvors Talar. Er schreit, das Horn springt ihm aus der Hand und klirrt über den Boden.`),e.set(`c4_fire`,!0),e.frame(`malvor`,`idle`),e.moveNpc(`malvor`,540,392,600),await e.say(`Ohne den Ton des Horns zögert der Drache. Er senkt den Kopf, schnuppert, sieht Malvor an. Dann mich.`),await O(e,`Der Bann ist gebrochen. Aber ob er mich als Freund oder als Frühstück ansieht, weiß ich nicht.`);return}return t===0?Cr(e,`Ich greife nach dem Spiegelschild und finde nur leere Luft. Der Atem trifft mich mit voller Wucht.`):t===1?Cr(e,`Ich werfe mich hinter den Altar. Der Stein glüht rot, schmilzt und verbrennt mir die Sohlen. Das war keine Deckung, das war ein Backofen.`):Cr(e,`Ich ziehe das Schwert und renne los. Der Feuerstrahl trifft die Klinge, die Hitze reißt sie mir fast aus der Hand. Ich stürze rückwärts.`)}async function Tr(e){e.remove(`drachenei`),e.set(`c4_ei_zurueck`,!0),e.set(`c4_resolved`,!0),e.honor(1),e.sfx(`magic`),await e.say(`Ich trete vor den Drachen und halte ihm das Ei hin. Es glüht warm in meinen Händen, als schlüge ein winziges Herz.`),await O(e,`Es gehört dir. Es hat dir immer gehört. Er hat es nur gestohlen.`),e.frame(`drache`,`idle`),e.flash(`#ffd890`,700),await e.say(`Der Drache senkt den gewaltigen Kopf, sehr langsam, fast zärtlich. Ich lege das Ei auf den Altar zurück. Er atmet warm darüber.`),await D(e,`drache`,`Ein Mensch. Einer, der gibt, statt zu nehmen. Das ist selten. Ich werde mich daran erinnern.`),e.flag(`c4_malvor_tied`)?(await e.say(`Malvor liegt gefesselt am Boden, die Augen weit. Der Drache beachtet ihn nicht. Er hat Wichtigeres im Arm.`),e.honor(1)):Sr(e)?(await e.say(`Malvor kriecht zum Horn, packt es, setzt es an die Lippen, und bläst. Ein hässlicher, dünner Ton, ohne Macht.`),await D(e,`malvor`,`Gehorche! Gehorche mir, du Wurm!`),await e.say(`Der Drache dreht langsam den Kopf. Ein Schnappen, ein Schlucken, ein kurzer Schrei. Die Höhle ist wieder still.`),await O(e,`Er hat das Horn mit dem Falschen verwechselt. Das passiert Leuten, die nie fragen, wem etwas gehört.`)):await e.say(`Malvor stolpert Richtung Ausgang, die Hände verbrannt, den Talar zerfetzt. Ohne das Horn ist er nur ein Mann in schwarzen Lumpen.`),await Dr(e,`gnade`)}async function Er(e){if(e.set(`c4_resolved`,!0),e.honor(-2),e.sfx(`clank`),await e.say(`Ich ziehe das Schwert. Der Drache sieht mich an, ohne zu fliehen. Er weiß, was jetzt kommt, und er ist müde.`),await e.choose([`Zustoßen.`,`Das Schwert sinken lassen.`])===1){e.set(`c4_resolved`,!1),e.honor(2),await O(e,`Nein. Nicht so. Nicht vor einem Ei.`);return}e.frame(`drache`,`roar`),e.sfx(`roar`),e.shake(1200),e.flash(`#ff4400`,800),await e.say(`Ich stoße zu, genau dorthin, wo der Panzer die Lücke hat. Aschenschlund brüllt, einmal, so laut, dass die Lavafälle verstummen.`),e.set(`c4_dead`,!0),e.frame(`drache`,`idle`),await e.say(`Dann sackt er zusammen, still, in die Asche seines eigenen Nestes. Der Berg hält den Atem an.`),e.has(`drachenei`)?await e.say(`Das Ei in meinem Rucksack wird langsam kalt. Ich versuche, nicht daran zu denken.`):await e.say(`Auf dem Altar liegt das Ei und wird langsam kalt. Ich sehe nicht hin.`),e.flag(`c4_malvor_tied`)&&e.honor(1),await Dr(e,`rache`)}async function Dr(e,t){let n=xr(e),r=!!e.flag(`c4_malvor_tied`),i=e.has(`horn`)?`gehalten`:e.flag(`c4_horn_gone`)?`gone`:`left`;e.set(`c4_end`,t),await e.fade(1,600),await e.card(`Epilog`,t===`gnade`?`Das Nest`:`Der Preis`);let a=r?`Malvor wurde gefesselt vor den König geführt. Das Gericht war kurz. Die Rechtschaffenen nannten es Gerechtigkeit, die anderen Erleichterung.`:t===`gnade`&&Sr(e)&&!r?`Malvor blieb im Berg. Das Horn fand man nie wieder.`:`Malvor entkam in die Aschewüste. Wer ihn dort fand, sprach nie darüber.`,o=i===`gone`?`Das Horn ist zu Schlacke geworden. Kein Mensch befiehlt je wieder einen Drachen.`:i===`gehalten`?`Das Horn liegt in Roderics Schatzkammer, hinter drei Schlössern. Du hoffst, es bleibt ein Souvenir.`:``,s,c;t===`gnade`?(await e.card(`Epilog`,`Der König erwacht`),n>=0?(s=`Der wahre Ritter`,c=`Der König trank das Gegengift und stand drei Tage später wieder auf. Ser Roderic schlug Bran vor dem versammelten Orden zum Ritter des Raben, und die Klinge war leicht wie eine Feder auf seiner Schulter.

„Der Drache hätte Euch verbrennen können“, sagte der König. „Und Ihr gabt ihm sein Kind zurück.“ „Es gehörte nicht mir“, sagte Bran. „Das ist der ganze Eid.“

`+a+(o?` `+o:``)+`

In den Ascheländern wohnt seither ein Drache, der niemanden mehr frisst, solange man höflich bleibt. Und in Aschenfurt hängt, über der Tür des Totengräbers, ein Schild: „Ritter Bran. Bitte klopfen.“`):(s=`Ritter mit Schatten`,c=`Der König genas, der Drache blieb friedlich, und Bran wurde Ritter des Raben. Doch auf seinem Weg hatte er zu oft genommen, was ihm nicht gehörte, und der Orden vergaß es nicht.

`+a+(o?` `+o:``)+`

Er trug den Mantel mit Würde, aber nicht mit Frieden. Der Drache hat ihm vergeben. Die Menschen haben es nicht getan. Vielleicht lernt er, damit zu leben. Manche Gnade ist genau das.`)):(await e.card(`Epilog`,`Das Schweigen im Berg`),n>=0?(s=`Der Drachentöter`,c=`Bran kehrte nach Grauwacht zurück, mit dem Zahn des Drachen am Gürtel und Ruß auf dem Gesicht. Der König genas, Roderic schlug ihn zum Ritter, und das Volk jubelte vor dem Tor.

`+a+(o?` `+o:``)+`

In der Nacht danach hörte Bran das Schweigen im Berg. Das Ei in seinem Rucksack ist kalt. Er hat es nie mehr ausgepackt.

`+a+(o?` `+o:``)+`
