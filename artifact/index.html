der zu danken hat. Ein Totengräberjunge rettet einen König. Das wird die Barden ärgern: zu unwahrscheinlich.":`ข้าต่างหากที่ต้องขอบใจ เด็กขุดหลุมช่วยกษัตริย์ไว้ได้ พวกนักร้องกวีคงหงุดหงิด เพราะมันไม่น่าเชื่อเกินไป`,"Wie geht es Euch jetzt?":`ตอนนี้พระองค์เป็นอย่างไรบ้าง`,"Besser. Die Hände sind warm. Ich habe Hunger. Der Kanzler hat mich wochenlang ausgehungert, sagt Berta.":`ดีขึ้น มืออุ่นแล้ว ข้าหิว เสนาบดีให้ข้าอดอยากมาหลายสัปดาห์ Berta บอกอย่างนั้น`,"Geh, Junge. Und denke an das Ei.":`ไปเถอะ เจ้าหนู แล้วอย่าลืมเรื่องไข่`,Weinkelch:`ถ้วยไวน์`,"Der Tisch mit dem Kelch. Er ist leer und unschuldig.":`โต๊ะที่มีถ้วย ว่างเปล่าและดูไร้เดียงสา`,"Ein Tischchen mit Kelch und Weinkrug. Der Wein ist dunkel. Zu dunkel.":`โต๊ะเล็กๆ มีถ้วยกับเหยือกไวน์ ไวน์สีเข้ม เข้มเกินไป`,"Der Kelch ist leer. Das Gegengift wirkt schon.":`ถ้วยว่างแล้ว ยาแก้พิษเริ่มออกฤทธิ์แล้ว`,"Ich nippe nicht. Wer weiß, was darin ist.":`ข้าไม่จิบหรอก ใครจะไปรู้ว่าข้างในมีอะไร`,"Den Kelch des Königs klauen? Das wäre selbst für mich zu dreist.":`ขโมยถ้วยของกษัตริย์น่ะหรือ แม้แต่ข้ายังว่าบังอาจเกินไป`,"Das Gift zurück in den Kelch? Bran, was denkst du?":`เอายาพิษกลับใส่ถ้วยหรือ Bran เจ้าคิดอะไรอยู่`,"Noch mehr Wein? Das wäre ein Anschlag auf die Leber.":`ไวน์อีกหรือ นั่นมันลอบทำร้ายตับชัดๆ`,"Kanzler Malvor":`เสนาบดี Malvor`,"Kanzler Malvor. Schwarzer Talar, schmale Finger, ein Ring mit Rabenkopf. Er lächelt wie jemand, der gerade eine Rechnung beglichen hat.":`เสนาบดี Malvor ผ้าคลุมดำ นิ้วเรียว แหวนรูปหัวกา เขายิ้มเหมือนคนที่เพิ่งชำระหนี้ได้`,"Ich habe ihn schon gelesen. Ritter und ihre Briefe ...":`ข้าอ่านแล้ว อัศวินกับจดหมายของพวกเขา...`,"Ein Brief von Ser Halvard? Zeigt her. Hm, kaum lesbar. Ich muss ans Licht.":`จดหมายจาก Ser Halvard หรือ เอามาดูซิ อืม แทบอ่านไม่ออก ข้าต้องไปอ่านตรงที่สว่าง`,"Er liest am Fackelkorb. Der Kelch steht ungeschützt. Das wird nicht lange halten.":`เขาอ่านตรงตะกร้าไฟ ถ้วยตั้งอยู่โดยไม่มีใครเฝ้า คงอยู่ได้ไม่นาน`,"Wirf das Ding weg! Es stinkt nach Moor.":`โยนของนั่นทิ้งไป! มันเหม็นหนองน้ำ`,"Hexenzeug! Hier, im Thronsaal! Wachen, ich hole sofort den Bischof ... Bleibt weg mit dem Ding!":`ของแม่มด! ที่นี่ ในท้องพระโรง! ทหาร ข้าจะไปตามบิชอปเดี๋ยวนี้... อย่าเอาของนั่นมาใกล้!`,"Er hat sich in die Ecke geflüchtet. Der Kelch ist unbewacht.":`เขาหนีไปหลบมุมห้อง ถ้วยไม่มีใครเฝ้า`,"Ja? Was willst du, Bursche?":`ว่าไง เจ้าอยากได้อะไร เจ้าหนู`,"Ein Anwärter aus der Gosse. Wie rührend. Der Orden hat sich in den letzten Jahren offenbar sehr geöffnet.":`ผู้สมัครจากข้างถนน น่าซึ้งจริง ช่วงหลังๆ ภาคีคงเปิดกว้างขึ้นมากสินะ`,"Ich klage Euch an, Kanzler.":`ข้าขอฟ้องท่าน เสนาบดี`,"Wie geht es dem König wirklich?":`กษัตริย์ทรงเป็นอย่างไรจริงๆ`,"Er ist alt. Und krank. Und ich pflege ihn Tag und Nacht. Ein Jammer, dass niemand Dank kennt.":`ชรา แล้วก็ป่วย ข้าดูแลพระองค์ทั้งวันทั้งคืน น่าเสียดายที่ไม่มีใครรู้จักบุญคุณ`,"Ihr rührt den Kelch selbst?":`ท่านเป็นคนผสมถ้วยเองหรือ`,"Natürlich. Aus Sorge. Niemand außer mir darf an Seiner Majestät Wein. Man weiß ja nie.":`แน่นอน ด้วยความห่วงใย ไม่มีใครนอกจากข้าแตะไวน์ของพระองค์ได้ ใครจะไปรู้`,"Was lest Ihr da?":`ท่านอ่านอะไรอยู่`,"Berichte. Briefe. Verträge. Wer Briefe liest, der lenkt das Reich. Auch Ritter schreiben mir. Manchmal.":`รายงาน จดหมาย สัญญา ใครอ่านจดหมาย คนนั้นก็ชี้นำอาณาจักร อัศวินก็เขียนมาหาข้าเหมือนกัน บางครั้ง`,"Was habt Ihr mit Ser Aldric gemacht?":`ท่านทำอะไรกับ Ser Aldric`,"Aldric? Gefallen an der Grenze. Ein Held. Man weint noch um ihn.":`Aldric หรือ สิ้นชีพที่ชายแดน วีรบุรุษ ผู้คนยังร้องไห้ให้เขาอยู่เลย`,"Er lügt. Aldric ist unten im Kerker, am Leben.":`เขาโกหก Aldric อยู่ข้างล่างในคุกใต้ดิน ยังมีชีวิต`,"Verschwende nicht meine Zeit, Junge. Sie ist kostbarer als deine.":`อย่าเสียเวลาข้า เจ้าหนู เวลาข้ามีค่ากว่าของเจ้า`,"Ser Roderic ist hergeeilt. Sein Umhang weht noch. Der Ordensmeister sieht aus wie ein Mann, der heute viel zu früh aufgestanden ist.":`Ser Roderic รีบมาถึงแล้ว ผ้าคลุมยังปลิวอยู่เลย ปรมาจารย์ภาคีดูเหมือนคนที่ตื่นเช้าเกินไปในวันนี้`,"Ich bin bereit. Zum Vulkan!":`ข้าพร้อมแล้ว ไปภูเขาไฟ!`,"die Prüfung der Demut":`บททดสอบแห่งความถ่อมตน`,"das Siegel der Weisheit (Myrddin)":`ตราประทับแห่งปัญญา (Myrddin)`,"einen Spiegelschild gegen das Drachenfeuer (Rüstkammer)":`โล่กระจกกันไฟมังกร (คลังอาวุธ)`,"Noch nicht. Dir fehlt: ":`ยังไม่ได้ เจ้ายังขาด: `,"Hier, nimm das Ordensgeschenk. Die Feldflasche mit Weihwasser, ein Seil, eine Fackel. Wer zum Vulkan geht, braucht Gnade und Zubehör.":`นี่ รับของขวัญจากภาคีไป กระติกน้ำมนต์ เชือก คบเพลิง ใครไปภูเขาไฟต้องมีทั้งพระคุณและอุปกรณ์`,"Malvor ist vorausgeeilt. Folge ihm, Bran. Bring das Ei zurück, wenn du kannst. Und zerstöre das Horn, wenn du musst.":`Malvor รีบไปก่อนแล้ว ตามไป Bran เอาไข่กลับมาถ้าทำได้ แล้วทำลายเขาสัตว์ถ้าจำเป็น`,"Kapitel 4":`บทที่ 4`,"Der Vulkan":`ภูเขาไฟ`,"Was erwartet mich am Vulkan?":`อะไรรอข้าอยู่ที่ภูเขาไฟ`,"Asche, Schwefel, Lava. Und ein Drache, der seit hundert Jahren schlecht schläft. Der Mut ist keine Tugend, sondern eine Verpflichtung.":`เถ้า กำมะถัน ลาวา และมังกรที่นอนไม่หลับมาร้อยปี ความกล้าไม่ใช่คุณธรรม แต่เป็นภาระผูกพัน`,"Was habe ich noch zu tun?":`ข้าเหลืออะไรต้องทำอีก`,"Demut ist erledigt.":`ความถ่อมตนเสร็จแล้ว`,"Demut fehlt: Rede mit mir im Burghof.":`ขาดความถ่อมตน: มาคุยกับข้าที่ลานปราสาท`,"Weisheit hast du.":`ปัญญาเจ้ามีแล้ว`,"Weisheit fehlt: Myrddin wartet im Turm.":`ขาดปัญญา: Myrddin รออยู่ในหอคอย`,"Der Spiegelschild glänzt.":`โล่กระจกเงาวับ`,"Ein Spiegelschild fehlt. Sand, Lappen und ein alter Schild aus der Rüstkammer.":`ขาดโล่กระจก ทราย ผ้าขี้ริ้ว กับโล่เก่าจากคลังอาวุธ`,"Wo ist Malvor jetzt?":`ตอนนี้ Malvor อยู่ไหน`,"Er floh nach Osten. Zum Vulkan. Dort hat er ein Ei gestohlen und ein Horn gefunden. Mehr muss ich nicht wissen.":`เขาหนีไปทางตะวันออก ไปภูเขาไฟ ที่นั่นเขาขโมยไข่และเจอเขาสัตว์ ข้าไม่ต้องรู้มากกว่านี้`,"Komm zurück, wenn du alles hast.":`กลับมาเมื่อเจ้ามีครบทุกอย่าง`,"Ich gehe noch einmal los.":`ข้าขอออกไปอีกรอบ`,"Ser Aldric, frisch aus dem Kerker. Ausgemergelt, aber aufrecht. Der Stolz ist stärker als der Hunger.":`Ser Aldric เพิ่งออกจากคุก ผอมโซแต่ยืนตรง ศักดิ์ศรีแข็งแกร่งกว่าความหิว`,"Geht es Euch gut?":`ท่านสบายดีไหม`,"Ich lebe. Das ist mehr, als die meisten Gefangenen sagen können. Danke, Bran.":`ข้ายังมีชีวิต ซึ่งดีกว่านักโทษส่วนใหญ่จะพูดได้ ขอบใจ Bran`,"Wie war es im Kerker?":`ในคุกเป็นอย่างไรบ้าง`,"Feucht, laut und sehr, sehr langweilig. Der Wärter sang jede Nacht dasselbe Lied. Ich kann es jetzt auswendig.":`ชื้น เสียงดัง แล้วก็น่าเบื่อมาก มากๆ ผู้คุมร้องเพลงเดิมทุกคืน ตอนนี้ข้าร้องได้ขึ้นใจ`,"Wisst Ihr, wo Malvor das Gift versteckt?":`ท่านรู้ไหมว่า Malvor ซ่อนยาพิษไว้ที่ไหน`,"Hinter dem Wandteppich. Er murmelte immer den Spruch: Rabe, Kreuz, Rabe, Lamm.":`หลังผ้าทอแขวนผนัง เขาพึมพำคาถานี้อยู่เสมอ: กา กางเขน กา แกะ`,"Ich bleibe hier. Und lasse Malvor nicht aus den Augen.":`ข้าจะอยู่ที่นี่ และจะไม่ละสายตาจาก Malvor`,Thronwache:`ทหารรักษาบัลลังก์`,"Eine Thronwache. Sie steht so steif, dass man ihr Staub vom Helm wischen könnte. Vermutlich bewegt sie sich nur, wenn der König niest.":`ทหารรักษาบัลลังก์ ยืนตัวแข็งจนปัดฝุ่นจากหมวกเกราะได้ คงขยับก็ต่อเมื่อกษัตริย์จาม`,"Ich sehe nichts, höre nichts, sage nichts. Das ist mein Beruf. Die Bezahlung ist entsprechend.":`ข้าไม่เห็น ไม่ได้ยิน ไม่พูดอะไร นั่นคืออาชีพข้า ค่าจ้างก็สมกัน`,"Noch eine Wache. Sie schläft im Stehen, mit offenen Augen. Das ist eine Kunst.":`ทหารอีกคน หลับทั้งยืนโดยลืมตาอยู่ นี่มันศิลปะ`,"Der Kanzler hat gesagt: Keiner geht durch die Tür dort. Ich weiß nicht, was dahinter ist. Ich bin glücklich damit.":`เสนาบดีสั่งไว้ว่า ห้ามใครเข้าประตูนั่น ข้าไม่รู้ว่าข้างหลังมีอะไร ข้าสบายใจดีแล้ว`,Wandteppich:`ผ้าทอแขวนผนัง`,"Der Wandteppich hängt schief. Dahinter schimmert ein Stein mit vier Knöpfen. Der Teppich zeigt einen Raben, ein Kreuz, ein Lamm. Die Reihenfolge ist verwischt.":`ผ้าทอแขวนอยู่เอียงๆ ข้างหลังมีหินเปล่งแสงที่มีสี่ปุ่ม ผ้าทอรูปกา กางเขน แกะ ลำดับพร่าเลือน`,"Ein riesiger Wandteppich: Burg, Rabe, Kreuz, Lamm. Der Rahmen ist auffällig sauber. Als hätte ihn jemand regelmäßig angehoben.":`ผ้าทอผืนใหญ่: ปราสาท กา กางเขน แกะ กรอบสะอาดผิดปกติ เหมือนมีคนยกขึ้นอยู่เป็นประจำ`,"Der Teppich bleibt oben. Er ist froh, einmal Luft zu bekommen.":`ผ้าทอค้างอยู่ข้างบน มันคงดีใจที่ได้สูดอากาศสักครั้ง`,"Ich hebe den Teppich an. Dahinter: ein Steinfeld mit vier Runenknöpfen, ein Rabe, ein Kreuz, ein Lamm und noch ein Rabe. Ein Geheimfach!":`ข้ายกผ้าทอขึ้น ข้างหลัง: แผ่นหินที่มีปุ่มรูนสี่ปุ่ม กา กางเขน แกะ และกาอีกตัว ช่องลับ!`,"Der Teppich ist zu schwer und zu historisch. Ich würde ihn nicht tragen können.":`ผ้าทอหนักเกินไปและเก่าแก่เกินไป ข้าแบกไม่ไหวหรอก`,Geheimfach:`ช่องลับ`,"Das Geheimfach steht offen. Darin liegt, was Malvor vor aller Welt verbarg.":`ช่องลับเปิดอยู่ ข้างในมีสิ่งที่ Malvor ซ่อนจากทั้งโลก`,"Eine Steinplatte mit vier Knöpfen: Rabe, Kreuz, Rabe, Lamm in dieser Anordnung? Nein, die Reihenfolge der Knöpfe ist es, nicht die Anordnung.":`แผ่นหินสี่ปุ่ม: กา กางเขน กา แกะ ตามการจัดเรียงนี้หรือ ไม่ใช่ มันคือลำดับการกดปุ่ม ไม่ใช่การจัดเรียง`,"Das Fach ist fest im Stein. Aber ich kann es öffnen, wenn ich die Reihenfolge kenne.":`ช่องฝังแน่นในหิน แต่ข้าเปิดได้ถ้ารู้ลำดับ`,"Vier Runenknöpfe. Ich muss sie in der richtigen Reihenfolge drücken. Aldric kennt vielleicht einen Spruch.":`ปุ่มรูนสี่ปุ่ม ข้าต้องกดตามลำดับที่ถูกต้อง Aldric อาจรู้คาถา`,"Das Fach ist leer. Malvor hat nur noch Spinnweben.":`ช่องว่างเปล่า Malvor เหลือแค่ใยแมงมุม`,"einem Raben":`กา`,"einem Kreuz":`กางเขน`,"einem Lamm":`แกะ`,Hoftruhe:`หีบประจำราชสำนัก`,"Eine Hoftruhe mit Wappen. Hier verwahren Könige das, was sie nie wieder sehen wollen.":`หีบประจำราชสำนักที่มีตราประจำ ที่นี่กษัตริย์เก็บสิ่งที่ไม่อยากเห็นอีก`,"Die Truhe ist leer, bis auf einen verzweifelten Silberfisch.":`หีบว่างเปล่า เหลือแค่แมลงเงินที่กำลังสิ้นหวัง`,Schreibkommode:`ตู้เขียนหนังสือ`,"Malvors Schreibkommode. Alles in Reih und Glied, jede Schublade peinlich ordentlich. Das ist verdächtig.":`ตู้เขียนหนังสือของ Malvor ทุกอย่างเป็นระเบียบ ลิ้นชักเรียบร้อยจนน่าเจ็บใจ น่าสงสัยจริง`,Thron:`บัลลังก์`,"Der Thron von Grauwacht. Zwei Raben thronen auf den Lehnen, grimmig, wie der Rest.":`บัลลังก์แห่ง Grauwacht กาสองตัวนั่งอยู่บนที่เท้าแขน ดุร้ายเหมือนที่เหลือทั้งหมด`,"Raben-Banner":`ธงรูปกา`,"Ein schwarzes Banner mit weißem Raben. Der Stoff ist zerfetzt. Es wurde schon oft durch Feuer getragen.":`ธงสีดำรูปกาสีขาว ผ้าขาดวิ่น ผ่านไฟมาหลายครั้งแล้ว`,"Das Gegenstück des Banners. Der Rabe schaut nach links, also weg von Malvor.":`ธงคู่ของมัน กาหันหน้าไปทางซ้าย คือหันหนีจาก Malvor`,Feuerkorb:`ตะกร้าไฟ`,"Ein Feuerkorb mit lodernden Scheiten. Er wärmt den Saal und verbrennt gelegentlich ein Gerücht.":`ตะกร้าไฟที่มีฟืนลุกโชน ให้ความอบอุ่นแก่โถงและบางครั้งก็เผาข่าวลือทิ้ง`,"Der zweite Feuerkorb. Ein Funke fliegt heraus und stirbt auf dem Teppich.":`ตะกร้าไฟใบที่สอง ประกายไฟกระเด็นออกมาแล้วดับลงบนพรม`,"Tür zu Malvors Gemach":`ประตูห้องพักของ Malvor`,"Die Tür steht einen Spalt offen. Malvors Gemach ist leer, bis auf den Geruch von Schwefel.":`ประตูแง้มอยู่นิดหนึ่ง ห้องพักของ Malvor ว่างเปล่า เหลือแค่กลิ่นกำมะถัน`,"Eine schwere Doppeltür. Dahinter liegt das Gemach des Kanzlers. Eine Wache steht davor, die nichts weiß.":`ประตูคู่บานหนัก ข้างหลังคือห้องพักของเสนาบดี มีทหารยืนเฝ้าอยู่ที่ไม่รู้อะไรเลย`,"Die Tür ist verschlossen. Die Wache lächelt freundlich. Es ist das Lächeln eines Mannes mit einer Hellebarde.":`ประตูล็อกอยู่ ทหารยิ้มอย่างเป็นมิตร มันคือรอยยิ้มของคนที่ถือทวนขวาน`,"Hohe Spitzbogenfenster. Dahinter liegt das verschneite Land, kalt und friedlich.":`หน้าต่างโค้งแหลมสูง ข้างนอกคือแผ่นดินปกคลุมหิมะ เย็นยะเยือกและสงบ`,Säule:`เสา`,"Eine Steinsäule mit eingemeißelten Raben. Sie hält das Dach. Mehr kann man von Säulen nicht verlangen.":`เสาหินสลักรูปกา ค้ำหลังคาอยู่ จะขอจากเสามากกว่านี้ก็ไม่ได้`,"Der Strom ist schon zu Stein erstarrt.":`ธารลาวาแข็งเป็นหินไปแล้ว`,"Das Weihwasser trifft die Lava mit einem Zischen, das fast wie ein Gebet klingt.":`น้ำมนต์กระทบลาวาดังฉ่า เสียงคล้ายคำภาวนา`,"Ich kippe den Eimer aus. Eine Dampfwolke schießt in den Himmel, das Wasser schreit auf.":`ข้าเทถังออก ไอน้ำพุ่งขึ้นฟ้าเป็นกลุ่มใหญ่ น้ำกรีดร้อง`,"Wo eben noch Glut floss, liegt jetzt dunkler, glasiger Stein. Er knackt, aber er hält.":`ตรงที่เมื่อครู่ยังมีถ่านไหลอยู่ ตอนนี้เป็นหินมืดใสเหมือนแก้ว มันลั่นกึก แต่ก็ทนไหว`,"Ein Weg. Der Berg hat mich sicher nicht eingeladen. Aber er hat die Tür offen gelassen.":`ทางไปต่อ ภูเขาไม่ได้เชิญข้าแน่ๆ แต่ก็เปิดประตูทิ้งไว้ให้`,"Ein Ritterskelett, noch in verkohlter Rüstung. Neben ihm liegt ein Ledertagebuch, die Seiten vom Ruß gebräunt.":`โครงกระดูกอัศวิน ยังสวมเกราะไหม้เกรียม ข้างๆ มีสมุดบันทึกหนัง หน้ากระดาษเป็นสีน้ำตาลเพราะเขม่า`,"„Tag 3. Der Lavastrom versperrt den Pfad. Wasser kühlt ihn. Hinter den Felsen kondensiert Dampf an kaltem Metall. Ein Eimer genügt.“":`„วันที่ 3 ธารลาวาขวางทาง น้ำทำให้มันเย็นลง หลังก้อนหินมีไอน้ำกลั่นตัวบนโลหะเย็น ถังเดียวก็พอ“`,"„Tag 6. Der Drache schläft. Er bewacht kein Gold. Ich sah ein Ei auf einem Altar. Es glühte. Es lebt.“":`„วันที่ 6 มังกรหลับอยู่ มันไม่ได้เฝ้าทอง ข้าเห็นไข่บนแท่นบูชา มันเรืองแสง มันมีชีวิต“`,"„Tag 7. Ein Mann in Schwarz bläst auf einem Horn. Der Drache erwacht und folgt ihm. Mein Schild war aus Stahl. Zu stumpf. Nur ein Spiegel hält den Atem.“":`„วันที่ 7 ชายในชุดดำเป่าเขาสัตว์ มังกรตื่นและตามเขาไป โล่ข้าทำจากเหล็กกล้า ทื่อเกินไป มีแต่กระจกเท่านั้นที่ต้านลมหายใจมันได้“`,"„Richte den Strahl auf den, der das Horn hält. Der Drache folgt dem Horn, nicht dem Herzen. Nicht vergessen: das Ei. Wer das Ei hat, hat den Drachen.“":`„ส่องลำแสงไปที่คนถือเขาสัตว์ มังกรตามเขาสัตว์ ไม่ได้ตามหัวใจ อย่าลืม: ไข่ ใครมีไข่ ผู้นั้นมีมังกร“`,"Ascheweg am Kharn":`ทางเถ้าถ่านที่ Kharn`,"Zurück nach Grauwacht":`กลับไป Grauwacht`,"Weit hinter dem Aschefeld liegt Grauwacht. Ein König wartet. Und ein Kanzler flieht.":`Grauwacht อยู่ไกลเลยทุ่งเถ้าไป กษัตริย์รออยู่ และเสนาบดีหนีไป`,"Zurück? Nicht, solange Malvor mit dem Ei in diesem Berg ist.":`กลับน่ะหรือ ไม่ใช่ตอนที่ Malvor ยังอยู่ในภูเขานี้พร้อมไข่`,"Zur Drachenhöhle":`ไปถ้ำมังกร`,"Der Pfad führt zum Maul des Berges.":`ทางนำไปสู่ปากภูเขา`,"Der Lavastrom versperrt den Weg. Hinüberspringen wäre mein letzter Sprung.":`ธารลาวาขวางทาง กระโดดข้ามคงเป็นการกระโดดครั้งสุดท้ายของข้า`,Lavastrom:`ธารลาวา`,"Erstarrte Lava, schwarz und glasig. Darunter glimmt es noch leise.":`ลาวาแข็งตัว ดำและใสเหมือนแก้ว ข้างใต้ยังมีแสงริบหรี่`,"Ein Strom aus flüssigem Feuer quert den Pfad. Die Hitze drückt mich zurück. Mit Wasser könnte man ihn bändigen.":`ธารไฟเหลวพาดผ่านทาง ความร้อนผลักข้าถอยกลับ ถ้ามีน้ำก็คงเอาอยู่`,"Die Lava nehmen? Meine Hände sind keine Zangen.":`หยิบลาวาหรือ มือข้าไม่ใช่คีม`,"Ich trete vorsichtig auf den Stein. Er hält.":`ข้าก้าวขึ้นไปบนหินอย่างระวัง มันทนไหว`,"Ich strecke die Hand aus. Meine Augenbrauen flüchten. Ich auch.":`ข้ายื่นมือออกไป คิ้วข้าหนีไปก่อน ข้าก็ตามไป`,"Ein leerer Eimer vor einem Lavastrom. Mehr Verzweiflung geht nicht.":`ถังเปล่าหน้าธารลาวา สิ้นหวังกว่านี้ไม่มีอีกแล้ว`,"Ich werfe das Seilende hinein. Es fängt Feuer, bevor es die Lava berührt. Ich ziehe es schnell zurück.":`ข้าโยนปลายเชือกลงไป มันลุกไหม้ก่อนแตะลาวาด้วยซ้ำ ข้ารีบดึงกลับ`,"Eine Fackel an einem Lavastrom. Das ist, als würde man einem Bären die Zähne zeigen.":`คบเพลิงหน้าธารลาวา เหมือนยิงฟันใส่หมี`,"Mein Schwert in der Lava härten? Das Eisen würde eher tanzen.":`ตีดาบในลาวาหรือ เหล็กคงเต้นรำก่อน`,"Der Spiegelschild zeigt mir einen Jungen vor einem Meer aus Feuer. Er sieht nervös aus.":`โล่กระจกสะท้อนเด็กคนหนึ่งยืนหน้าทะเลไฟ เขาดูกังวล`,"Ein bisschen flüssiges Feuer in die Flasche füllen? Ich verzichte.":`ตักไฟเหลวใส่ขวดหน่อยไหม ข้าขอผ่าน`,Dampfspalte:`รอยแยกไอน้ำ`,"Ein Riss im Fels, aus dem heißer Dampf zischt. Ringsum perlt Wasser an kaltem Gestein.":`รอยแยกในหินที่ไอน้ำร้อนพ่นออกมาเสียงฉู่ รอบๆ มีหยดน้ำเกาะบนหินเย็น`,"Dampf lässt sich nicht einpacken.":`ไอน้ำเก็บใส่กระเป๋าไม่ได้`,"Ich halte die Hand über die Spalte. Sie wärmt schön. Ich ziehe sie zurück, bevor sie kocht.":`ข้าวางมือเหนือรอยแยก อุ่นสบาย ข้าดึงกลับก่อนมันลวก`,"Ich halte den kalten Eimer über den Dampf. Tropfen sammeln sich, einer nach dem anderen, bis der Eimer voll ist.":`ข้าถือถังเย็นไว้เหนือไอน้ำ หยดน้ำค่อยๆ รวมกัน ทีละหยด จนถังเต็ม`,"Wasser aus Dampf. Selbst in der Hölle gibt es Haushaltstricks.":`น้ำจากไอน้ำ แม้ในนรกก็ยังมีเคล็ดลับงานบ้าน`,"Der Eimer ist schon voll. Eine Dampfspalte macht keinen Nachschlag.":`ถังเต็มแล้ว รอยแยกไอน้ำไม่มีให้เติมอีก`,"Eine Flasche voll Dampf? Ich sehe, wie es endet: mit einem Knall.":`ขวดเต็มไอน้ำหรือ ข้าเห็นตอนจบแล้ว: เสียงระเบิดดังตูม`,"Spiegel gegen Feuer. Das Ei nicht vergessen. Danke, alter Freund.":`กระจกต้านไฟ อย่าลืมไข่ ขอบใจ สหายเก่า`,"Ich lasse die Gebeine in Ruhe. Ich bin Totengräber, ich weiß, wie sensibel Tote sind.":`ข้าปล่อยกระดูกไว้อย่างนั้น ข้าเป็นคนขุดหลุม รู้ว่าคนตายอ่อนไหวแค่ไหน`,"Ich hebe vorsichtig seinen verkohlten Rucksack an. Ein Eimer, ein paar Kleinigkeiten, ein Gebet in Fetzen.":`ข้ายกเป้ที่ไหม้เกรียมของเขาขึ้นอย่างระวัง ถังหนึ่งใบ ของจุกจิกไม่กี่ชิ้น คำภาวนาขาดวิ่น`,"Nichts mehr. Der Ritter hatte nicht viel, und ich nehme ihm nicht den Rest.":`ไม่มีอะไรแล้ว อัศวินมีไม่มาก และข้าไม่เอาส่วนที่เหลือของเขาไป`,"Im Rucksack":`ในเป้`,"Das Skelett an einem Seil ziehen? Ich bin nicht stolz auf diesen Gedanken.":`ลากโครงกระดูกด้วยเชือกหรือ ข้าไม่ภูมิใจกับความคิดนี้เลย`,"Ich segne die Gebeine mit einem Tropfen Weihwasser. Der Ritter wirkt zufriedener, soweit man das bei einem Skelett sagen kann.":`ข้าอวยพรกระดูกด้วยน้ำมนต์หยดหนึ่ง อัศวินดูพอใจขึ้น เท่าที่จะพูดได้กับโครงกระดูก`,"Ein einzelner Zahn auf dem Aschepfad. Von einem Ritter, einem Wolf oder dem Berg selbst.":`ฟันซี่เดียวบนทางเถ้า ของอัศวิน หมาป่า หรือตัวภูเขาเอง`,Felsbrocken:`ก้อนหิน`,"Ein mannshoher Felsbrocken. Dahinter, im Schatten, glimmt ein dunkler Spalt. Allein bewege ich ihn nicht.":`ก้อนหินใหญ่เท่าคน ข้างหลังในเงามีรอยแยกมืดเรืองแสง ข้าคนเดียวขยับมันไม่ได้`,"Er wiegt mehr als eine Kuh. Und ich hatte ohnehin nie Rückenschmerzen.":`มันหนักกว่าวัว และข้าก็ไม่เคยปวดหลังอยู่แล้ว`,"Ich stemme mich gegen den Fels. Er bewegt sich um den Bruchteil einer Zwiebel. Mit Hebelwirkung ginge es besser.":`ข้ายันตัวเข้ากับหิน มันขยับไปเท่าเศษหนึ่งส่วนหัวหอม ถ้ามีคานงัดคงดีกว่านี้`,"Ich lege das Seil um den Brocken, verkeile mich gegen die Felswand und ziehe mit allem, was ein Totengräber an Kreuz hat.":`ข้าคล้องเชือกรอบก้อนหิน ยันตัวกับผนังหิน แล้วดึงด้วยแรงทั้งหมดที่คนขุดหลุมมี`,"Der Fels löst sich, rollt polternd beiseite und bleibt in einer Aschewolke liegen. Dahinter öffnet sich eine kleine Nische.":`หินหลุดออก กลิ้งโครมครามไปด้านข้างและหยุดท่ามกลางกลุ่มเถ้า ข้างหลังเปิดเป็นช่องเล็กๆ`,"Mein Schwert als Hebel? Es würde brechen. Und dann hätte Roderic recht über mich.":`ใช้ดาบเป็นคานงัดหรือ มันจะหัก แล้ว Roderic ก็จะพูดถูกเรื่องข้า`,Felsnische:`ช่องในหิน`,"Eine kleine Nische im Fels. Jemand hat hier etwas verstecken wollen. Vermutlich ein Pilger auf der Flucht.":`ช่องเล็กๆ ในหิน มีคนอยากซ่อนอะไรที่นี่ คงเป็นผู้แสวงบุญที่หนีมา`,"In der Nische":`ในช่อง`,Schwefelkruste:`สะเก็ดกำมะถัน`,"Gelbe Kristalle, die nach faulen Eiern riechen. Der Berg schwitzt hier Schwefel aus. Man nennt es Höllenatem und lacht dabei nicht.":`ผลึกสีเหลืองกลิ่นไข่เน่า ภูเขาขับกำมะถันออกมาที่นี่ เรียกว่าลมหายใจนรก และไม่มีใครหัวเราะ`,"Der Schwefel klebt an den Fingern und stinkt. Ein Mitbringsel, das niemand will.":`กำมะถันติดนิ้วและเหม็น ของฝากที่ไม่มีใครอยากได้`,"Ich kratze etwas Schwefel ab. Mein Taschentuch ist nun gelb. Es riecht wie ein Streit.":`ข้าขูดกำมะถันเล็กน้อย ผ้าเช็ดหน้าข้าเหลืองไปแล้ว กลิ่นเหมือนการทะเลาะ`,"Ich halte die Fackel an den Schwefel. Eine blaue Flamme tanzt, ich huste fürchterlich. Erkenntnis: Nicht noch einmal.":`ข้าจ่อคบเพลิงที่กำมะถัน เปลวสีน้ำเงินเต้นรำ ข้าไอแทบตาย บทเรียน: ไม่ทำอีกแล้ว`,Obsidian:`หินออบซิเดียน`,"Schwarzes Vulkanglas, scharf wie ein Rasiermesser. Die Lava hat es hier geschmiedet.":`แก้วภูเขาไฟสีดำ คมเหมือนมีดโกน ลาวาตีมันขึ้นมาที่นี่`,"Ich schneide mir fast den Daumen ab. Obsidian lässt sich nicht freiwillig tragen.":`ข้าเกือบตัดนิ้วโป้งขาด ออบซิเดียนไม่ยอมให้ใครพกไปง่ายๆ`,"Ich klopfe mit dem Schwert auf den Obsidian. Er klingt wie Glas, das sich für Stahl hält.":`ข้าเคาะดาบกับออบซิเดียน เสียงเหมือนแก้วที่คิดว่าตัวเองเป็นเหล็กกล้า`,Warnpfahl:`เสาเตือน`,"Ein Pfahl, behängt mit Schädeln und Fetzen. Auf einem Brett steht in Kohle: „Wer weitergeht, stirbt. Gezeichnet: alle, die weitergegangen sind.“":`เสาที่แขวนด้วยกะโหลกและเศษผ้า บนแผ่นไม้เขียนด้วยถ่านว่า: „ใครเดินต่อ ตาย ลงชื่อ: ทุกคนที่เดินต่อไปแล้ว“`,"Ich ziehe den Pfahl nicht aus dem Boden. Er ist wohl das Einzige, was hier freiwillig steht.":`ข้าไม่ถอนเสาขึ้นจากพื้น มันคงเป็นสิ่งเดียวที่ยืนอยู่ที่นี่ด้วยความสมัครใจ`,"Verkohlter Kadaver":`ซากไหม้เกรียม`,"Das Skelett eines Maultiers. Es trug einst ein Ritter. Zumindest bis zum Atem des Berges.":`โครงกระดูกล่อ มันเคยแบกอัศวินคนหนึ่ง อย่างน้อยก็จนถึงลมหายใจของภูเขา`,"Zwischen den Knochen":`ระหว่างกระดูก`,"Vulkan Kharn":`ภูเขาไฟ Kharn`,"Der Kharn spuckt Rauch und Funken. Seine Hänge glühen wie ein offenes Herz. Wenn ein Berg schlafen kann, dann schläft dieser unruhig.":`Kharn พ่นควันและประกายไฟ ไหล่เขาเรืองเหมือนหัวใจที่เปิดอยู่ ถ้าภูเขาหลับได้ ลูกนี้ก็หลับไม่สนิท`,Höhlenöffnung:`ปากถ้ำ`,"Hoch in der Felswand klafft eine Öffnung mit steinernen Zähnen. Wer da hineingeht, wird gefressen. Oder berühmt. Das schließt einander nicht aus.":`สูงบนผาหินมีช่องเปิดที่มีฟันหิน ใครเข้าไปก็ถูกกิน หรือไม่ก็โด่งดัง สองอย่างนี้ไม่ได้ขัดกัน`,"Verbrannter Baum":`ต้นไม้ไหม้`,"Ein verkohlter Baum, die Äste wie ein Gebet in den Himmel gestreckt. Das Gebet blieb unbeantwortet.":`ต้นไม้ไหม้เกรียม กิ่งชูขึ้นฟ้าเหมือนคำภาวนา คำภาวนานั้นไม่มีใครตอบ`,"Ein Ast zerfällt zu Asche, sobald ich ihn berühre. Das Leben im Allgemeinen.":`กิ่งหนึ่งสลายเป็นเถ้าทันทีที่ข้าแตะ ชีวิตโดยรวมก็เป็นเช่นนี้`,Lavafelder:`ทุ่งลาวา`,"Weit unten ziehen sich Lavaflüsse durchs Tal, wie die Adern des Berges. Kein Platz für Wanderer.":`ไกลลงไปข้างล่าง แม่น้ำลาวาไหลผ่านหุบเขาเหมือนเส้นเลือดของภูเขา ไม่มีที่สำหรับนักเดินทาง`,"Ferne Gebeine":`กระดูกไกลๆ`,"Noch ein Ritter, noch ein Schild, noch eine Lehre. Der Berg sammelt sie.":`อัศวินอีกคน โล่อีกใบ บทเรียนอีกบท ภูเขาสะสมพวกมันไว้`,"Hah! Der Drache braucht Schlaf, nicht Beschäftigung. Mach dich fort, bevor ich es mir anders überlege.":`ฮ่า! มังกรต้องการนอน ไม่ใช่ความวุ่นวาย ไสหัวไปก่อนที่ข้าจะเปลี่ยนใจ`,"Das war nicht klug. Der Atem hat mir die Brauen genommen und den Stolz gleich mit. Ich brauche etwas, das Feuer zurückwirft.":`ไม่ฉลาดเลย ลมหายใจเอาคิ้วข้าไปและเอาศักดิ์ศรีไปด้วย ข้าต้องมีอะไรสักอย่างที่สะท้อนไฟกลับ`,"Genug geredet. Ich habe die Macht, du hast ein Schwert. Siehst du den Unterschied?":`พูดมามากพอแล้ว ข้ามีอำนาจ เจ้ามีดาบ เห็นความต่างไหม`,"Du schon wieder. Gut. Eine Lektion, die nicht bleibt, ist keine.":`เจ้าอีกแล้ว ดี บทเรียนที่ไม่ติดตัวก็ไม่ใช่บทเรียน`,"Malvor setzt das Horn an. Ein tiefer Ton, fast ein Brüllen, rollt durch die Höhle. Die Lava schlägt Blasen.":`Malvor ยกเขาสัตว์ขึ้นเป่า เสียงทุ้มลึกเกือบเป็นเสียงคำราม ก้องไปทั่วถ้ำ ลาวาเดือดเป็นฟอง`,"Aschenschlund erhebt sich aus seiner Asche. Seine Augen glühen wie zwei Schmelzöfen. Das Horn spricht zu ihm, und er gehorcht.":`Aschenschlund ลุกขึ้นจากเถ้าของมัน ดวงตาเรืองเหมือนเตาหลอมสองเตา เขาสัตว์พูดกับมัน และมันเชื่อฟัง`,"Verbrenne ihn!":`เผามันซะ!`,"Der Drache holt Luft. Die Höhle wird heiß, die Luft flimmert, dann öffnet er das Maul.":`มังกรสูดลมหายใจ ถ้ำร้อนขึ้น อากาศสั่นไหว แล้วมันก็อ้าปาก`,"Den Spiegelschild heben":`ยกโล่กระจก`,"Hinter den Altar werfen":`โยนตัวไปหลังแท่นบูชา`,"Das Schwert ziehen und angreifen":`ชักดาบและพุ่งเข้าโจมตี`,"Ich reiße den Spiegelschild hoch. Der Feuerstrahl prallt auf das blanke Metall, bricht sich und schießt zurück.":`ข้ากระชากโล่กระจกขึ้น ลำไฟกระทบโลหะเงาวับ แตกกระจายแล้วพุ่งกลับไป`,"Nein! Nicht auf mich! Du Bestie, nicht auf mich!":`ไม่! อย่าใส่ข้า! เจ้าสัตว์ร้าย อย่าใส่ข้า!`,"Das Feuer fegt über Malvors Talar. Er schreit, das Horn springt ihm aus der Hand und klirrt über den Boden.":`ไฟกวาดผ่านผ้าคลุมของ Malvor เขากรีดร้อง เขาสัตว์หลุดจากมือและกระทบพื้นดังกริ๊ง`,"Ohne den Ton des Horns zögert der Drache. Er senkt den Kopf, schnuppert, sieht Malvor an. Dann mich.":`เมื่อไม่มีเสียงเขาสัตว์ มังกรก็ลังเล มันก้มหัว ดมกลิ่น มอง Malvor แล้วมองข้า`,"Der Bann ist gebrochen. Aber ob er mich als Freund oder als Frühstück ansieht, weiß ich nicht.":`คำสาปแตกแล้ว แต่ข้าไม่รู้ว่ามันมองข้าเป็นเพื่อนหรืออาหารเช้า`,"Ich greife nach dem Spiegelschild und finde nur leere Luft. Der Atem trifft mich mit voller Wucht.":`ข้าคว้าโล่กระจกแล้วเจอแต่อากาศเปล่า ลมหายใจกระแทกข้าเต็มแรง`,"Ich werfe mich hinter den Altar. Der Stein glüht rot, schmilzt und verbrennt mir die Sohlen. Das war keine Deckung, das war ein Backofen.":`ข้าโยนตัวไปหลังแท่นบูชา หินเรืองแดง หลอมละลาย และไหม้พื้นรองเท้าข้า นั่นไม่ใช่ที่กำบัง มันคือเตาอบ`,"Ich ziehe das Schwert und renne los. Der Feuerstrahl trifft die Klinge, die Hitze reißt sie mir fast aus der Hand. Ich stürze rückwärts.":`ข้าชักดาบแล้ววิ่งเข้าไป ลำไฟกระทบใบดาบ ความร้อนเกือบกระชากมันหลุดจากมือ ข้าล้มหงายหลัง`,"Ich trete vor den Drachen und halte ihm das Ei hin. Es glüht warm in meinen Händen, als schlüge ein winziges Herz.":`ข้าก้าวไปหน้ามังกรและยื่นไข่ให้มัน มันเรืองอุ่นในมือข้า ราวกับมีหัวใจดวงจิ๋วเต้นอยู่`,"Es gehört dir. Es hat dir immer gehört. Er hat es nur gestohlen.":`มันเป็นของเจ้า เป็นของเจ้ามาตลอด เขาแค่ขโมยไป`,"Der Drache senkt den gewaltigen Kopf, sehr langsam, fast zärtlich. Ich lege das Ei auf den Altar zurück. Er atmet warm darüber.":`มังกรก้มหัวมหึมาลงอย่างช้าๆ เกือบอ่อนโยน ข้าวางไข่กลับบนแท่นบูชา มันหายใจอุ่นรดอยู่เหนือมัน`,"Ein Mensch. Einer, der gibt, statt zu nehmen. Das ist selten. Ich werde mich daran erinnern.":`มนุษย์ คนที่ให้แทนที่จะเอา หายากนัก ข้าจะจดจำไว้`,"Malvor liegt gefesselt am Boden, die Augen weit. Der Drache beachtet ihn nicht. Er hat Wichtigeres im Arm.":`Malvor นอนถูกมัดอยู่บนพื้น ตาเบิกกว้าง มังกรไม่สนใจเขา มันมีเรื่องสำคัญกว่าในอ้อมกอด`,"Malvor kriecht zum Horn, packt es, setzt es an die Lippen, und bläst. Ein hässlicher, dünner Ton, ohne Macht.":`Malvor คลานไปที่เขาสัตว์ คว้ามัน ยกขึ้นริมฝีปาก แล้วเป่า เสียงบางๆ น่าเกลียด ไร้พลัง`,"Gehorche! Gehorche mir, du Wurm!":`เชื่อฟัง! เชื่อฟังข้า เจ้าหนอน!`,"Der Drache dreht langsam den Kopf. Ein Schnappen, ein Schlucken, ein kurzer Schrei. Die Höhle ist wieder still.":`มังกรค่อยๆ หันหัวมา เสียงงับ เสียงกลืน เสียงร้องสั้นๆ ถ้ำกลับเงียบอีกครั้ง`,"Er hat das Horn mit dem Falschen verwechselt. Das passiert Leuten, die nie fragen, wem etwas gehört.":`เขาเอาเขาสัตว์ไปใช้กับผิดตัว เรื่องแบบนี้เกิดกับคนที่ไม่เคยถามว่าของเป็นของใคร`,"Malvor stolpert Richtung Ausgang, die Hände verbrannt, den Talar zerfetzt. Ohne das Horn ist er nur ein Mann in schwarzen Lumpen.":`Malvor เดินเซไปทางทางออก มือไหม้ ผ้าคลุมขาดวิ่น ไม่มีเขาสัตว์ เขาก็เป็นแค่ชายในผ้าขี้ริ้วสีดำ`,"Ich ziehe das Schwert. Der Drache sieht mich an, ohne zu fliehen. Er weiß, was jetzt kommt, und er ist müde.":`ข้าชักดาบ มังกรมองข้าโดยไม่หนี มันรู้ว่าต่อไปคืออะไร และมันเหนื่อยแล้ว`,"Zustoßen.":`แทงลงไป`,"Das Schwert sinken lassen.":`วางดาบลง`,"Nein. Nicht so. Nicht vor einem Ei.":`ไม่ ไม่ใช่แบบนี้ ไม่ต่อหน้าไข่`,"Ich stoße zu, genau dorthin, wo der Panzer die Lücke hat. Aschenschlund brüllt, einmal, so laut, dass die Lavafälle verstummen.":`ข้าแทงลงไปตรงช่องว่างของเกราะพอดี Aschenschlund คำรามครั้งเดียว ดังจนน้ำตกลาวาเงียบเสียง`,"Dann sackt er zusammen, still, in die Asche seines eigenen Nestes. Der Berg hält den Atem an.":`แล้วมันก็ทรุดลง เงียบ ลงในเถ้าถ่านของรังตัวเอง ภูเขากลั้นหายใจ`,"Das Ei in meinem Rucksack wird langsam kalt. Ich versuche, nicht daran zu denken.":`ไข่ในเป้ข้าค่อยๆ เย็นลง ข้าพยายามไม่คิดถึงมัน`,"Auf dem Altar liegt das Ei und wird langsam kalt. Ich sehe nicht hin.":`ไข่วางอยู่บนแท่นบูชาและค่อยๆ เย็นลง ข้าไม่มอง`,Epilog:`บทส่งท้าย`,"Das Nest":`รัง`,"Der Preis":`ราคา`,"Malvor wurde gefesselt vor den König geführt. Das Gericht war kurz. Die Rechtschaffenen nannten es Gerechtigkeit, die anderen Erleichterung.":`Malvor ถูกมัดนำตัวไปเฝ้ากษัตริย์ การพิจารณาคดีสั้นนิดเดียว คนชอบธรรมเรียกมันว่ายุติธรรม คนอื่นเรียกว่าโล่งอก`,"Malvor blieb im Berg. Das Horn fand man nie wieder.":`Malvor อยู่ในภูเขา เขาสัตว์ไม่มีใครพบอีกเลย`,"Malvor entkam in die Aschewüste. Wer ihn dort fand, sprach nie darüber.":`Malvor หนีเข้าทะเลทรายเถ้าถ่าน ใครที่พบเขาที่นั่นไม่เคยพูดถึงมันอีก`,"Das Horn ist zu Schlacke geworden. Kein Mensch befiehlt je wieder einen Drachen.":`เขาสัตว์กลายเป็นกากแร่ ไม่มีมนุษย์คนไหนสั่งมังกรได้อีก`,"Das Horn liegt in Roderics Schatzkammer, hinter drei Schlössern. Du hoffst, es bleibt ein Souvenir.":`เขาสัตว์อยู่ในคลังสมบัติของ Roderic หลังกุญแจสามชั้น เจ้าหวังว่ามันจะเป็นแค่ของที่ระลึก`,"Der König erwacht":`กษัตริย์ตื่น`,"Der wahre Ritter":`อัศวินที่แท้จริง`,"Der König trank das Gegengift und stand drei Tage später wieder auf. Ser Roderic schlug Bran vor dem versammelten Orden zum Ritter des Raben, und die Klinge war leicht wie eine Feder auf seiner Schulter.\n\n":`กษัตริย์ดื่มยาแก้พิษและลุกขึ้นอีกครั้งในสามวันต่อมา Ser Roderic แต่งตั้ง Bran เป็นอัศวินแห่งกาต่อหน้าภาคีที่ประชุมกัน และใบดาบเบาเหมือนขนนกบนไหล่เขา

`,"„Der Drache hätte Euch verbrennen können“, sagte der König. „Und Ihr gabt ihm sein Kind zurück.“ „Es gehörte nicht mir“, sagte Bran. „Das ist der ganze Eid.“\n\n":`„มังกรอาจเผาท่านได้“ กษัตริย์ตรัส „แล้วท่านก็คืนลูกให้มัน“ „มันไม่ใช่ของข้า“ Bran ตอบ „นั่นคือคำสาบานทั้งหมด“

`,"\n\nIn den Ascheländern wohnt seither ein Drache, der niemanden mehr frisst, solange man höflich bleibt. Und in Aschenfurt hängt, über der Tür des Totengräbers, ein Schild: „Ritter Bran. Bitte klopfen.“":`

นับแต่นั้น ในแดนเถ้าถ่านมีมังกรตัวหนึ่งที่ไม่กินใครอีก ตราบใดที่ยังสุภาพอยู่ และใน Aschenfurt เหนือประตูของคนขุดหลุม มีป้ายแขวนอยู่: „อัศวิน Bran กรุณาเคาะประตู“`,"Ritter mit Schatten":`อัศวินมีเงา`,"Der König genas, der Drache blieb friedlich, und Bran wurde Ritter des Raben. Doch auf seinem Weg hatte er zu oft genommen, was ihm nicht gehörte, und der Orden vergaß es nicht.\n\n":`กษัตริย์หายประชวร มังกรสงบ และ Bran ได้เป็นอัศวินแห่งกา แต่ระหว่างทางเขาเอาของที่ไม่ใช่ของเขามามากเกินไป และภาคีก็ไม่ลืม

`,"\n\nEr trug den Mantel mit Würde, aber nicht mit Frieden. Der Drache hat ihm vergeben. Die Menschen haben es nicht getan. Vielleicht lernt er, damit zu leben. Manche Gnade ist genau das.":`

เขาสวมเสื้อคลุมอย่างสง่า แต่ไม่สงบ มังกรให้อภัยเขา มนุษย์ไม่ให้ บางทีเขาอาจเรียนรู้ที่จะอยู่กับมัน ความเมตตาบางอย่างก็เป็นเช่นนั้น`,"Das Schweigen im Berg":`ความเงียบในภูเขา`,"Der Drachentöter":`ผู้สังหารมังกร`,"Bran kehrte nach Grauwacht zurück, mit dem Zahn des Drachen am Gürtel und Ruß auf dem Gesicht. Der König genas, Roderic schlug ihn zum Ritter, und das Volk jubelte vor dem Tor.\n\n":`Bran กลับ Grauwacht มีฟันมังกรห้อยที่เข็มขัดและเขม่าเปื้อนหน้า กษัตริย์หายประชวร Roderic แต่งตั้งเขาเป็นอัศวิน และผู้คนโห่ร้องยินดีหน้าประตู

`,"\n\nIn der Nacht danach hörte Bran das Schweigen im Berg. Das Ei in seinem Rucksack ist kalt. Er hat es nie mehr ausgepackt.\n\nEin Ritter ist, wer Mut hat. Ein wahrer Ritter ist, wer weiß, wann er ihn nicht braucht.":`

คืนต่อมา Bran ได้ยินความเงียบในภูเขา ไข่ในเป้ของเขาเย็นชืด เขาไม่เคยแกะมันออกมาอีก

อัศวินคือผู้ที่มีความกล้า อัศวินที่แท้จริงคือผู้ที่รู้ว่าเมื่อไหร่ไม่ต้องใช้มัน`,"Rache ohne Ehre":`แก้แค้นโดยไร้เกียรติ`,"Der Drache war tot, der König gerettet, und Bran stand mit blutiger Klinge vor einem Orden, der wusste, wie er dorthin gekommen war. Roderic schlug ihn zum Ritter. Er tat es mit abgewandtem Gesicht.\n\n":`มังกรตายแล้ว กษัตริย์รอดแล้ว และ Bran ยืนถือดาบเปื้อนเลือดอยู่หน้าคณะอัศวินที่รู้ดีว่าเขามาถึงตรงนี้ได้ยังไง Roderic แต่งตั้งเขาเป็นอัศวิน ด้วยใบหน้าที่เมินไปอีกทาง

`,"\n\nIn den Ascheländern ist es still. Kein Drache, kein Ei, keine Antwort. Nur ein Junge, der Ritter wurde, und die Frage, ob er es verdient hat.":`

ในดินแดนแอชแลนด์เงียบสงัด ไม่มีมังกร ไม่มีไข่ ไม่มีคำตอบ มีแค่เด็กหนุ่มที่ได้เป็นอัศวิน กับคำถามว่าเขาคู่ควรหรือเปล่า`,Rabenschwur:`Rabenschwur`,Ende:`จบ`,"Höhle des Aschenschlund":`ถ้ำ Aschenschlund`,"Die Höhle atmet. Heiße Luft strömt mir entgegen, und weit hinten, auf dem Knochenring, hebt und senkt sich ein Berg aus Schuppen.":`ถ้ำนี้หายใจได้ ลมร้อนพัดปะทะหน้า แล้วไกลลิบตรงวงกระดูก ภูเขาเกล็ดลูกหนึ่งกำลังพองขึ้นยุบลง`,"Aschenschlund. Er schläft. Und Malvor steht keine zehn Schritte neben ihm.":`Aschenschlund มันหลับอยู่ แล้ว Malvor ก็ยืนอยู่ห่างมันไม่ถึงสิบก้าว`,"Zurück zum Ascheweg":`กลับไปที่ทางเถ้า`,"Der Weg zurück. Der Ausgang ist weit, und Malvor wird mich beobachten.":`ทางกลับ ทางออกอยู่ไกล แล้ว Malvor ก็จะจ้องผมอยู่`,"Ich kehre keinem wachen Drachen den Rücken zu.":`ผมไม่หันหลังให้มังกรที่ยังตื่นอยู่หรอก`,Aschenschlund:`Aschenschlund`,"Der Drache liegt still. Selbst im Tod ist er größer als jeder König.":`มังกรนอนนิ่ง ต่อให้ตายแล้วก็ยังใหญ่กว่ากษัตริย์ทุกองค์`,"Aschenschlund. Er überragt mich um das Zehnfache, und seine Augen glühen wie Schmiedeessen. Er sieht nicht böse aus. Er sieht müde aus.":`Aschenschlund มันสูงกว่าผมสิบเท่า ดวงตาลุกโชนเหมือนเตาหลอม ดูไม่ชั่วร้ายเลย ดูเหนื่อยมากกว่า`,"Aschenschlund, der Drache des Kharn. Er schläft auf einem Bett aus Knochen und Asche, der Kopf unter einem Flügel. Sein Atem fegt Staub durch die Höhle.":`Aschenschlund มังกรแห่ง Kharn มันนอนบนที่นอนกระดูกกับเถ้า หัวซุกอยู่ใต้ปีก ลมหายใจพัดฝุ่นทั่วถ้ำ`,"Ich nehme einen Zahn, wenn er mir einen leiht. Er schläft.":`ผมจะเอาฟันซี่หนึ่งถ้ามันให้ยืม มันหลับอยู่`,"Anfassen? Er könnte mich missverstehen. Als Mahlzeit.":`แตะมันเหรอ เดี๋ยวมันเข้าใจผิด คิดว่าเป็นมื้ออาหาร`,"Ich lege die Hand auf eine Schuppe. Sie ist warm wie ein Ofen. Der Drache schnarcht auf. Ich ziehe die Hand zurück.":`ผมวางมือบนเกล็ดอันหนึ่ง อุ่นเหมือนเตาอบ มังกรสะดุ้งกรน ผมรีบดึงมือกลับ`,"Er antwortet nicht. Er wird es nie wieder.":`มันไม่ตอบ และจะไม่ตอบอีกแล้ว`,"Ich flüstere ihm zu. Der Drache schnarcht. Er ist nicht neugierig auf einen Totengräberlehrling.":`ผมกระซิบกับมัน มังกรกรนต่อ มันไม่สนใจลูกศิษย์คนขุดหลุมศพหรอก`,"Das Siegel der Weisheit glüht in meiner Tasche. Plötzlich verstehe ich das Grollen. Es sind Worte.":`ตราแห่งปัญญาเรืองแสงอยู่ในกระเป๋า ทันใดนั้นผมก็เข้าใจเสียงคำรามนั่น มันคือคำพูด`,"Kleiner Mensch. Du trägst einen Spiegel und ein Siegel. Du hättest mich auch ohne beides erschlagen können. Warum hast du es nicht?":`มนุษย์ตัวน้อย เจ้าถือกระจกกับตรา ต่อให้ไม่มีทั้งสองอย่างเจ้าก็ฆ่าข้าได้ แล้วทำไมเจ้าไม่ทำ`,"Was ist hier geschehen?":`ที่นี่เกิดอะไรขึ้น`,"Der Mann in Schwarz kam, als ich schlief. Er nahm mein Ei und ließ sein Horn zurück, das mich zwingt. Das Ei hielt mich fest: Solange er es hat, folge ich dem Ton.":`ชายชุดดำมาตอนข้าหลับ เขาเอาไข่ข้าไป ทิ้งเขาสัตว์ไว้ที่บังคับข้า ไข่นั่นคือสิ่งที่ตรึงข้าไว้ ตราบใดที่เขายังมีมัน ข้าก็ต้องตามเสียงนั้น`,"Ich habe Gold gesammelt, damit es warm liegt. Nicht aus Gier. Aus Liebe.":`ข้าสะสมทองไว้ให้ไข่นอนอุ่น ไม่ใช่เพราะโลภ แต่เพราะรัก`,"Wo ist dein Ei jetzt?":`ตอนนี้ไข่ของท่านอยู่ที่ไหน`,"In deinen Händen. Ich spüre es. Es ist warm. Es lebt.":`อยู่ในมือเจ้า ข้ารู้สึกได้ มันอุ่น มันมีชีวิต`,"Auf dem Altar dort. Er wollte es nutzen, um mich zu binden.":`บนแท่นบูชาตรงนั้น เขาจะใช้มันมัดข้า`,"Ich bringe dir dein Ei zurück.":`ผมจะเอาไข่มาคืนให้ท่าน`,"Nimm das Ei. Es liegt auf dem Altar.":`เอาไข่ไปสิ มันอยู่บนแท่นบูชา`,"Ich darf es nicht berühren, solange der Bann nicht gebrochen ist. Du musst es mir bringen. Du allein.":`ข้าแตะมันไม่ได้ตราบใดที่คำสาปยังไม่ถูกทำลาย เจ้าต้องเอามาให้ข้า เจ้าคนเดียวเท่านั้น`,"Ich bin gekommen, um dich zu erschlagen.":`ผมมาเพื่อฆ่าท่าน`,"Dann tu es. Ich bin müde. Aber das Ei stirbt dann mit mir.":`งั้นก็ลงมือสิ ข้าเหนื่อยแล้ว แต่ไข่ก็จะตายไปพร้อมข้า`,"Ich muss noch einmal nachdenken.":`ผมต้องคิดดูอีกที`,"Denke. Ich habe Zeit. Mein Kind nicht.":`คิดเถอะ ข้ามีเวลา ลูกข้าไม่มี`,"Ich halte den Spiegelschild vor mich. Der Drache sieht sein eigenes Auge darin. Er blinzelt irritiert, und ich fühle mich albern.":`ผมยกโล่กระจกขึ้นตรงหน้า มังกรเห็นดวงตาตัวเองในนั้น มันกะพริบตางง ๆ แล้วผมก็รู้สึกเหมือนคนโง่`,"Mit dem Ei vor einen schlafenden Drachen treten? Erst sollte ich mich um den Mann kümmern, der ihn besitzt.":`ถือไข่ไปยืนต่อหน้ามังกรที่หลับอยู่เนี่ยนะ ผมควรจัดการคนที่เป็นเจ้าของมันก่อนดีกว่า`,"Auf einen schlafenden Drachen einschlagen? Das wäre nicht mutig, nur laut. Und Malvor sieht zu.":`ฟาดมังกรที่หลับอยู่เหรอ นั่นไม่ใช่ความกล้า แค่เสียงดัง แล้ว Malvor ก็ดูอยู่ด้วย`,"Weihwasser auf einen Drachen. Er schnarcht weiter. Immerhin ein friedlicher Gläubiger.":`สาดน้ำมนต์ใส่มังกร มันกรนต่อ อย่างน้อยก็เป็นผู้ศรัทธาที่สงบเสงี่ยม`,"Ich halte das Horn hoch. Er sieht mich traurig an. Ich lasse es sinken, es fühlt sich falsch an.":`ผมชูเขาสัตว์ขึ้น มันมองผมอย่างเศร้า ๆ ผมลดมันลง รู้สึกผิดแปลก ๆ`,"Noch nicht. Erst muss Malvor den Bann verlieren.":`ยังก่อน ต้องให้ Malvor หมดอำนาจคำสาปก่อน`,"Malvor, gefesselt wie ein Paket. Der Talar ist verbrannt, der Stolz auch.":`Malvor ถูกมัดเหมือนพัสดุ เสื้อคลุมไหม้เกรียม ศักดิ์ศรีก็ด้วย`,"Malvor, der Talar verkohlt, die Hände verbrannt. Sein Blick hängt am Horn.":`Malvor เสื้อคลุมไหม้เป็นถ่าน มือพอง สายตาเขายังจ้องอยู่ที่เขาสัตว์`,"Kanzler Malvor. Der Mann, der den König vergiftete und jetzt einen Drachen befehligen will. Er hält das goldene Horn wie eine Reliquie.":`ท่านเสนาบดี Malvor ชายที่วางยาพิษกษัตริย์ แล้วตอนนี้อยากสั่งมังกร เขากำเขาสัตว์สีทองไว้เหมือนพระธาตุ`,"Warum das alles?":`ทำไมต้องทำทั้งหมดนี้`,"Macht. Ein König, der zögert, ist ein Hindernis. Ein Drache, der gehorcht, ist ein Heer. Ich wollte nur ein Land, das tut, was ich sage.":`อำนาจ กษัตริย์ที่ลังเลคืออุปสรรค มังกรที่เชื่อฟังคือกองทัพ ข้าแค่อยากได้แผ่นดินที่ทำตามที่ข้าสั่ง`,"Wo ist dein Gift jetzt?":`แล้วยาพิษของท่านอยู่ไหนล่ะตอนนี้`,"Es war nicht giftig genug. Das ist meine Lehre. Eine, die ich nicht mehr brauche.":`มันพิษไม่แรงพอ นั่นคือบทเรียนของข้า บทเรียนที่ข้าไม่ต้องใช้อีกแล้ว`,"Ich werde Euch binden.":`ผมจะมัดท่าน`,"Ich binde ihm die Hände mit meinem Seil. Er wehrt sich nicht mehr, sieht nur auf das Horn, das außer Reichweite liegt.":`ผมมัดมือเขาด้วยเชือกของผม เขาไม่ขัดขืนอีกแล้ว ได้แต่มองเขาสัตว์ที่วางอยู่เกินเอื้อม`,"Ein Seil. Welche Ironie. Ich wollte Drachen binden, und ein Totengräberjunge bindet mich.":`เชือกเหรอ ช่างน่าขัน ข้าอยากมัดมังกร แต่เด็กขุดหลุมศพมามัดข้าซะเอง`,"Du bist klüger, als du aussiehst, Junge. Das ist kein Kompliment.":`เจ้าฉลาดกว่าหน้าตาเจ้านะ เด็กน้อย ไม่ได้ชมหรอก`,"Genug.":`พอได้แล้ว`,"Bran. Der Totengräberjunge. Ich hätte nicht gedacht, dass du so weit kommst. Ich habe dich unterschätzt.":`Bran เด็กขุดหลุมศพ ข้าไม่นึกว่าเจ้าจะมาไกลขนาดนี้ ข้าประเมินเจ้าต่ำไป`,"Ihr habt den König vergiftet. Und das Ei gestohlen.":`ท่านวางยาพิษกษัตริย์ แล้วขโมยไข่ด้วย`,"Den König habe ich nicht vergiftet, ich habe ihm lediglich etwas zu trinken gegeben. Und das Ei? Das habe ich geliehen.":`กษัตริย์ข้าไม่ได้วางยาพิษหรอก แค่ให้เขาดื่มอะไรนิดหน่อย ส่วนไข่น่ะเหรอ ข้ายืมมา`,"Was habt Ihr mit dem Ei vor?":`ท่านจะทำอะไรกับไข่`,"Es ist der Schlüssel. Solange ich es habe, bindet das Horn den Drachen. Er wird für mich brennen, wo ich es will.":`มันคือกุญแจ ตราบใดที่ข้ามีมัน เขาสัตว์ก็ผูกมังกรไว้ มันจะพ่นไฟให้ข้าตามที่ข้าต้องการ`,"Das Horn. Was kann es?":`เขาสัตว์นั่น ทำอะไรได้`,"Es ruft. Und Drachen gehorchen dem, der ihr Kind besitzt. Die Alten haben es vergessen. Ich nicht.":`มันเรียก และมังกรเชื่อฟังผู้ที่ครอบครองลูกของมัน คนโบราณลืมไปแล้ว แต่ข้าไม่ลืม`,"Das Siegel der Weisheit zeigt mir etwas über das Horn.":`ตราแห่งปัญญาบอกอะไรบางอย่างเกี่ยวกับเขาสัตว์`,"Das Horn bindet nur, solange das Ei in Reichweite ist. Und es ist rund. Und es hat einen Besitzer.":`เขาสัตว์ผูกมังกรได้ก็ต่อเมื่อไข่อยู่ในระยะ และไข่มันกลม แถมมีเจ้าของด้วย`,"Du hast zu viel gelesen. Und wenig Verstand, das richtig zu nutzen.":`เจ้าอ่านมามากไป แต่สมองใช้ให้ถูกทางมีนิดเดียว`,"Was wollt Ihr von mir?":`ท่านต้องการอะไรจากผม`,"Dass du gehst. Nimm das Gold, das hier liegt, so viel du tragen kannst. Ich nenne dich Ritter, noch vor Roderic. Niemand erfährt, was du gesehen hast.":`ให้เจ้าไปซะ เอาทองที่กองอยู่นี่ไปเท่าที่แบกไหว ข้าจะแต่งตั้งเจ้าเป็นอัศวินก่อน Roderic ด้วยซ้ำ ไม่มีใครรู้ว่าเจ้าเห็นอะไร`,"Ich nehme Euer Angebot an.":`ผมรับข้อเสนอของท่าน`,"Niemals.":`ไม่มีทาง`,"Gold. Ein Titel. Und eine Nacht Ruhe. Das klingt nach einem schlechten Geschäft, das gut aussieht.":`ทอง ตำแหน่ง แล้วก็คืนสงบ ฟังดูเหมือนดีลแย่ ๆ ที่แต่งหน้าสวย`,"Ausgezeichnet. Nun, Zeugen sind lästig. Sieh zu, wie der Drache gehorcht.":`เยี่ยม งั้นพยานก็น่ารำคาญ ดูไว้ว่ามังกรเชื่อฟังยังไง`,"Schade. Ein Totengräber, der Prinzipien hat, ist wie ein Hund, der Latein spricht.":`น่าเสียดาย คนขุดหลุมศพที่มีหลักการก็เหมือนหมาที่พูดละติน`,"Ich halte Euch auf. Hier und jetzt.":`ผมจะหยุดท่านที่นี่ เดี๋ยวนี้`,"Du kommst nicht wieder, Junge. Aber geh nur.":`เจ้าไม่ได้กลับมาอีกแล้วนะ เด็กน้อย แต่ไปเถอะ`,"Malvor lacht. Silber von einem Totengräber? Er hält es für Spott.":`Malvor หัวเราะ เงินจากคนขุดหลุมศพเหรอ เขาคิดว่าเป็นการเยาะเย้ย`,"Malvor mit einem Seil fesseln, solange der Drache auf seinen Befehl lauscht? Ich wäre als Zunder wertvoller.":`มัด Malvor ด้วยเชือกทั้งที่มังกรกำลังฟังคำสั่งเขาอยู่เนี่ยนะ ผมเป็นเชื้อไฟยังมีค่ากว่า`,"Er ist schon gefesselt.":`เขาถูกมัดอยู่แล้ว`,"Ich binde Malvors Hände zusammen. Er wehrt sich nicht mehr. Das Horn liegt außer Reichweite.":`ผมมัดมือ Malvor เข้าด้วยกัน เขาไม่ขัดขืนอีกแล้ว เขาสัตว์วางอยู่เกินเอื้อม`,"Ich halte ihm die Klinge an die Kehle. Er rührt sich nicht. Ich habe keine Lust auf Mord.":`ผมจ่อคมดาบที่คอเขา เขาไม่ขยับ ผมไม่อยากฆ่าคน`,"Ich ziehe das Schwert, aber Malvor lächelt nur und hebt das Horn. Besser nicht.":`ผมชักดาบ แต่ Malvor แค่ยิ้มแล้วยกเขาสัตว์ขึ้น ไม่ดีกว่า`,"Ich hebe den Schild. Malvor sieht sein Gesicht darin und wendet den Blick ab. Er mag keinen Spiegel.":`ผมยกโล่ขึ้น Malvor เห็นหน้าตัวเองในนั้นแล้วเมินสายตาไป เขาไม่ชอบกระจก`,"Das Gegengift gehört dem König. Malvor bekommt höchstens den Geruch.":`ยาถอนพิษเป็นของกษัตริย์ Malvor ได้อย่างมากก็แค่กลิ่น`,"Nest-Altar":`แท่นรัง`,"Das Ei liegt wieder im Nest. Es leuchtet leise, wie eine kleine Sonne.":`ไข่กลับมาอยู่ในรังอีกครั้ง มันเรืองแสงอ่อน ๆ เหมือนดวงอาทิตย์เล็ก ๆ`,"Ein leeres Nest aus Asche und Gold. Der Abdruck des Eies ist noch warm.":`รังว่างเปล่าที่ทำจากเถ้ากับทอง รอยของไข่ยังอุ่นอยู่`,"Ein Steinaltar mit einem Nest aus Asche. Darin ruht ein glühendes Ei, so groß wie ein Kürbis. Etwas darin pocht.":`แท่นหินที่มีรังเถ้า ข้างในมีไข่เรืองแสงขนาดเท่าฟักทองนอนอยู่ มีบางอย่างในนั้นเต้นตุบ ๆ`,"Das Ei ist nicht mehr hier.":`ไข่ไม่อยู่ที่นี่แล้ว`,"Finger weg vom Altar, Junge!":`มือออกไปจากแท่นบูชานะ เด็กน้อย`,"Ich hebe das Ei vorsichtig auf. Es ist warm wie ein schlagendes Herz. Etwas scharrt leise gegen die Schale.":`ผมยกไข่ขึ้นเบา ๆ มันอุ่นเหมือนหัวใจที่เต้นอยู่ มีอะไรบางอย่างขูดเบา ๆ กับเปลือก`,"Kleiner Drache, ich bringe dich nach Hause.":`มังกรน้อย ผมจะพาเจ้ากลับบ้าน`,"Das Ei ruht. Ich lasse es in Frieden.":`ไข่พักอยู่ ผมปล่อยมันไว้อย่างสงบ`,"Ich streiche über den Rand des Altars. Er ist warm. Als würde etwas darunter atmen.":`ผมลูบขอบแท่นบูชา มันอุ่น เหมือนมีอะไรหายใจอยู่ข้างใต้`,"Noch nicht. Erst muss Malvor das Horn verlieren.":`ยังก่อน ต้องให้ Malvor เสียเขาสัตว์ไปก่อน`,"Ich halte das Schwert über das Ei. Der Gedanke, es zu zerschlagen, ist mir unerträglich. Ich stecke es weg.":`ผมถือดาบเหนือไข่ ความคิดที่จะทุบมันทำให้ผมทนไม่ไหว ผมเก็บดาบเข้าฝัก`,Drachenhorn:`เขามังกร`,"Das goldverzierte Drachenhorn. Es liegt da, wo Malvor es fallen ließ, und scheint noch zu summen.":`เขามังกรประดับทอง มันวางอยู่ตรงที่ Malvor ทำตก และดูเหมือนยังฮัมอยู่`,"Ich nehme das Horn an mich. Es ist schwerer, als es aussieht. Wer es hält, hört das Flüstern der Macht.":`ผมเก็บเขาสัตว์ไว้ มันหนักกว่าที่เห็น ใครถือมันจะได้ยินเสียงกระซิบของอำนาจ`,"Ich sollte es entweder zerstören oder sehr weit weg bringen.":`ผมควรทำลายมัน ไม่ก็เอาไปทิ้งให้ไกลที่สุด`,Goldhaufen:`กองทอง`,"Ein Hügel aus Münzen, Pokalen und Rüstungsresten. Der Drache liegt nicht auf dem Gold. Das Gold liegt auf dem Nest, wie eine Decke.":`กองเหรียญ ถ้วย และเศษเกราะ มังกรไม่ได้นอนทับทอง ทองต่างหากที่คลุมรังไว้เหมือนผ้าห่ม`,"Im Hort":`ในที่สะสมสมบัติ`,"Ich greife in den Haufen. Die Münzen sind alt, glatt und warm. Der Drache schnauft im Schlaf auf, und ich erstarre.":`ผมล้วงมือเข้าไปในกอง เหรียญเก่า เรียบ และอุ่น มังกรถอนหายใจขณะหลับ ผมแข็งทื่อ`,"Silber vom Hort des Drachen. Es fühlt sich warm an. Und schwer.":`เงินจากคลังสมบัติของมังกร รู้สึกอุ่น และหนัก`,"Alte Rüstungen":`เกราะเก่า`,"Ein Haufen verbeulter Rüstungen. Helme, Brustpanzer, ein Handschuh mit noch einem Knochen darin. Die Ritter, die es versuchten.":`กองเกราะบุบ หมวก เกราะอก ถุงมือที่ยังมีกระดูกอยู่ข้างใน อัศวินที่เคยลอง`,"Zwischen den Rüstungen":`ระหว่างเกราะ`,"Ein Haufen Knochen. Tiere, Ritter, ein Pferd. Der Drache war nicht wählerisch, bis er satt wurde.":`กองกระดูก สัตว์ อัศวิน ม้าตัวหนึ่ง มังกรไม่เลือกกินจนกว่าจะอิ่ม`,"Im Knochenhaufen":`ในกองกระดูก`,Lavasee:`ทะเลสาบลาวา`,"Ein See aus flüssigem Feuer, hinter dem Wasserfälle aus Lava herabstürzen. Es ist schön, auf eine Art, die ich nicht beschreiben will.":`ทะเลสาบไฟเหลว มีน้ำตกลาวาไหลลงมาด้านหลัง สวยในแบบที่ผมไม่อยากบรรยาย`,"Ich beuge mich vor. Die Hitze nimmt mir die Luft. Ich überlege es mir anders.":`ผมโน้มตัวไปข้างหน้า ความร้อนแย่งลมหายใจผมไป ผมเปลี่ยนใจ`,"Man nimmt kein Feuer mit. Man hat es oder man hat es nicht.":`ไม่มีใครเอาไฟไปได้ มีหรือไม่มีเท่านั้น`,"Ich werfe das Horn in den Lavasee. Es glüht auf, schmilzt, und ein letzter, tiefer Ton zittert durch die Höhle.":`ผมโยนเขาสัตว์ลงทะเลสาบลาวา มันลุกวาบ ละลาย และเสียงทุ้มสุดท้ายสั่นสะเทือนไปทั่วถ้ำ`,"Kein Mann wird je wieder einen Drachen auf diese Weise zwingen.":`จะไม่มีใครบังคับมังกรด้วยวิธีนี้ได้อีก`,"Das Seil in Lava tauchen? Es wäre das letzte, was ich brauche, und das Letzte, was es sieht.":`จุ่มเชือกลงลาวาเหรอ นั่นคือสิ่งสุดท้ายที่ผมต้องการ และสิ่งสุดท้ายที่มันจะได้เห็น`,"Mein Schwert in den Lavasee tauchen? Es würde glühen, aber danach nie wieder gerade sein.":`จุ่มดาบลงทะเลสาบลาวาเหรอ มันจะแดงเรือง แต่หลังจากนั้นจะไม่เคยตรงอีกเลย`,"Das bisschen Wasser würde verdampfen, bevor es den See erreicht.":`น้ำนิดเดียวระเหยไปก่อนถึงทะเลสาบ`,"Das Weihwasser verdampft, bevor es den See erreicht. Eine Verschwendung, auch für Gott.":`น้ำมนต์ระเหยไปก่อนถึงทะเลสาบ เปลืองของ แม้แต่สำหรับพระเจ้า`,Lavafälle:`น้ำตกลาวา`,"Zwei Wasserfälle aus Lava stürzen in den See. Die Hitze drückt auf meine Brust.":`น้ำตกลาวาสองสายพุ่งลงทะเลสาบ ความร้อนกดทับอกผม`,Knochensäule:`เสากระดูก`,"Eine Säule aus verschlungenen Drachenwirbeln. Am oberen Ende grinst ein Schädel. Die Architekten des Berges hatten Humor.":`เสาที่ทำจากกระดูกสันหลังมังกรพันกัน ยอดเสามีกะโหลกยิ้มกริ่ม สถาปนิกของภูเขานี้มีอารมณ์ขัน`,Knochenring:`วงกระดูก`,"Der Nestring aus Drachenrippen, in dem Aschenschlund schläft. Es ist größer als die Dorfkirche und hat bessere Akustik.":`วงรังที่ทำจากซี่โครงมังกรซึ่ง Aschenschlund นอนอยู่ ใหญ่กว่าโบสถ์ประจำหมู่บ้าน และเสียงก้องดีกว่า`,Tropfsteine:`หินย้อย`,"Glühende Stalaktiten hängen von der Decke. Sie sehen aus wie die Zähne einer sehr großen Falle.":`หินย้อยเรืองแสงห้อยลงจากเพดาน ดูเหมือนฟันของกับดักตัวใหญ่มาก`,"Der Kharn. Wenn die Hölle einen Vorgarten hat, dann ist das hier der.":`Kharn ถ้านรกมีสวนหน้าบ้าน ที่นี่แหละ`,"Malvor ist vor mir hier. Mit dem Ei. Und einem Horn. Und ich habe einen Spiegel, ein Siegel und ein Seil. Es gab schon schlechtere Pläne.":`Malvor มาถึงก่อนผม พร้อมไข่ และเขาสัตว์ ส่วนผมมีกระจก ตรา และเชือก เคยมีแผนแย่กว่านี้อีก`,"Es ist vollbracht.":`เสร็จสิ้นแล้ว`,"Gieße das Wasser auf den Lavastrom.":`เทน้ำลงบนธารลาวา`,"Der Eimer kann an der Dampfspalte Wasser sammeln. Oder das Weihwasser kühlt die Lava.":`ถังตักน้ำได้ที่ช่องไอน้ำ หรือไม่ก็ใช้น้ำมนต์ทำให้ลาวาเย็นลง`,"Der Lavastrom lässt sich mit Wasser kühlen. Das Weihwasser genügt, oder du suchst einen Eimer beim Ritterskelett.":`ธารลาวาทำให้เย็นลงได้ด้วยน้ำ น้ำมนต์ก็พอ หรือไม่ก็หาถังจากโครงกระดูกอัศวิน`,"Der Weg ist frei. Gehe nach rechts zur Drachenhöhle.":`ทางโล่งแล้ว ไปทางขวาสู่ถ้ำมังกร`,"Sprich mit Malvor. Gegen den Feuerstrahl des Drachen hilft dein Spiegelschild, und der Strahl muss Malvor treffen.":`คุยกับ Malvor โล่กระจกช่วยป้องกันไฟของมังกรได้ และไฟต้องพุ่งใส่ Malvor`,"Nimm das Ei vom Altar und bring es dem Drachen. Oder entscheide anders.":`หยิบไข่จากแท่นบูชาแล้วเอาไปให้มังกร หรือจะตัดสินใจเป็นอย่างอื่นก็ได้`,"Gib dem Drachen sein Ei zurück. Oder folge deiner Rache.":`คืนไข่ให้มังกร หรือจะไล่ตามความแค้นของตัวเองก็ได้`,"duplicate scene ":`duplicate scene `,Schaufel:`พลั่ว`,"Eine abgenutzte Totengräberschaufel. Sie hat mehr Menschen begraben als der Pfarrer gesegnet hat.":`พลั่วคนขุดหลุมศพที่สึกหรอ ฝังคนมามากกว่าที่พระอวยพรเสียอีก`,Eimer:`ถัง`,"Ein hölzerner Eimer mit Seilhenkel. Er riecht nach Brunnen und nassem Hund.":`ถังไม้หูหิ้วเชือก กลิ่นเหมือนบ่อน้ำกับหมาเปียก`,"Eimer Wasser":`ถังน้ำ`,"Ein voller Eimer. Das Wasser ist erstaunlich klar. Für Aschenfurt fast verdächtig.":`ถังเต็มน้ำ น้ำใสอย่างน่าประหลาด สำหรับ Aschenfurt ถือว่าน่าสงสัยเลย`,Seil:`เชือก`,"Ein langes Hanfseil. Man hat es von einem Galgen abgeschnitten. Ich frage lieber nicht, warum es dort hing.":`เชือกป่านยาว ตัดมาจากตะแลงแกง ผมไม่ถามดีกว่าว่าทำไมมันถึงไปห้อยอยู่ที่นั่น`,Schmiedehammer:`ค้อนตีเหล็ก`,"Ein schwerer Hammer. Der Stiel ist glatt vom Schweiß unzähliger Hände.":`ค้อนหนัก ด้ามเรียบลื่นจากเหงื่อของมือนับไม่ถ้วน`,"Nadel und Zwirn":`เข็มกับด้าย`,"Eine Knochennadel und eine Rolle derben Zwirn. Taugt zum Flicken. Oder zum Zunähen.":`เข็มกระดูกกับม้วนด้ายหยาบ ใช้ปะชุนได้ หรือเย็บปากก็ได้`,Feuerstein:`หินเหล็กไฟ`,"Feuerstein und Schlageisen. Der erste Funke ist ein Wunder, der zweite eine Gewohnheit.":`หินเหล็กไฟกับเหล็กตี ประกายแรกคือปาฏิหาริย์ ประกายที่สองคือความเคยชิน`,Holzstab:`ไม้เท้า`,Pechklumpen:`ก้อนยางสน`,"Klebriger, schwarzer Pech. Brennt schlecht, haftet gut. Wie die meisten Gerüchte.":`ยางสนเหนียวสีดำ ติดไฟไม่ดี ติดแน่นดี เหมือนข่าวลือส่วนใหญ่`,"Eine Fackel, in Pech getränkt. Das Licht wirft lange, unruhige Schatten.":`คบเพลิงชุบยางสน แสงทอดเงายาวและไม่นิ่ง`,Kohle:`ถ่าน`,"Drei Klumpen Schmiedekohle. Sie färben alles schwarz, was sie berühren. Auch Gewissen.":`ถ่านตีเหล็กสามก้อน ทำให้ทุกสิ่งที่แตะเป็นสีดำ รวมถึงจิตสำนึกด้วย`,Eisenstange:`แท่งเหล็ก`,"Ein schweres Brecheisen. Es öffnet Türen, Truhen und gelegentlich Köpfe.":`ชะแลงหนัก เปิดได้ทั้งประตู หีบ และบางครั้งก็หัวคน`,"Kleiner Schlüssel":`กุญแจเล็ก`,"Ein kleiner, schmutziger Eisenschlüssel. Er riecht nach Kohle und Verschlossenheit.":`กุญแจเหล็กเล็กสกปรก กลิ่นถ่านกับความปิดตาย`,"Eiserner Schlüssel":`กุญแจเหล็ก`,"Ein schlichter, rostiger Schlüssel. Er passt bestimmt irgendwo. Hoffentlich nicht in einen Sarg.":`กุญแจเรียบ ๆ ขึ้นสนิม ต้องไขอะไรสักอย่างได้แน่ ขอให้ไม่ใช่โลงศพ`,Gruftschlüssel:`กุญแจสุสาน`,"Ein silberner Schlüssel mit einem Rabenkopf. Er hat Jahrzehnte im Dunkeln gelegen und sieht noch eingebildet aus.":`กุญแจเงินหัวอีกา นอนอยู่ในความมืดมาหลายสิบปี แต่ก็ยังดูหยิ่งอยู่`,Zellenschlüssel:`กุญแจห้องขัง`,"Ein riesiger Eisenschlüssel am Ring. So schwer, dass er sich nach Verantwortung anfühlt.":`กุญแจเหล็กยักษ์คล้องห่วง หนักจนรู้สึกเหมือนเป็นความรับผิดชอบ`,Kreide:`ชอล์ก`,"Ein Stück weiße Kreide. Zum Zeichnen, Zählen oder Schuldenaufschreiben.":`ชอล์กสีขาวก้อนหนึ่ง ใช้วาด นับ หรือจดหนี้`,Lappen:`ผ้าขี้ริ้ว`,"Ein grauer Putzlumpen. Er hat schon bessere Tage gesehen. Und schlechtere Hände.":`ผ้าเช็ดสีเทา เคยผ่านวันที่ดีกว่านี้มาแล้ว และมือที่แย่กว่านี้`,Sandsack:`ถุงทราย`,"Ein kleiner Sack feiner Sand. Schleift Rost, Kruste und die gute Laune.":`ถุงเล็กใส่ทรายละเอียด ขัดสนิม ขัดคราบ และขัดอารมณ์ดีด้วย`,Kerze:`เทียน`,"Eine lange, ungebrannte Talgkerze. Ein Luxus in diesen Zeiten.":`เทียนไขยาวที่ยังไม่เคยจุด ของฟุ่มเฟือยในยุคนี้`,Bienenwachs:`ขี้ผึ้ง`,"Ein goldener Klumpen Bienenwachs. Weich, warm und erstaunlich gut gegen lautes Geschrei.":`ก้อนขี้ผึ้งสีทอง นุ่ม อุ่น และใช้อุดหูกันเสียงตะโกนได้ดีน่าประหลาด`,Weihrauch:`กำยาน`,"Ein Klumpen Weihrauch in einem kleinen Schälchen. Es riecht nach Kirche und schlechtem Gewissen.":`ก้อนกำยานในถ้วยเล็ก กลิ่นเหมือนโบสถ์กับความรู้สึกผิด`,Klingenbruch:`ดาบหัก`,"Die Hälfte eines Schwertes, vom Rost zerfressen. Irgendwer hat damit mehr Mut als Glück gehabt.":`ดาบครึ่งเล่มที่สนิมกินจนผุ ใครสักคนเคยใช้มันด้วยความกล้ามากกว่าโชค`,"Mein Schwert. Selbst geschmiedet. Es ist nicht schön, aber es ist ehrlich.":`ดาบของผม ตีเอง ไม่สวย แต่ซื่อสัตย์`,Stahlhelm:`หมวกเหล็ก`,"Ein Ritterhelm mit Visier. Von innen riecht er nach Angst.":`หมวกอัศวินมีบังหน้า ข้างในกลิ่นความกลัว`,Brustpanzer:`เกราะอก`,"Ein Brustpanzer aus kaltem Stahl. Er wiegt mehr als meine Zukunft.":`เกราะอกเหล็กเย็นเฉียบ หนักกว่าอนาคตของผม`,Armschienen:`เกราะแขน`,"Ein Paar Armschienen aus Stahl. Sie klirren, wenn ich nervös bin. Also ständig.":`เกราะแขนเหล็กคู่หนึ่ง ดังกรุ๊งกริ๊งเวลาผมประหม่า หรือก็คือตลอดเวลา`,Schild:`โล่`,"Ein runder Holzschild mit Eisenbuckel. Er hat Dellen, die Geschichten erzählen.":`โล่ไม้กลมมีปุ่มเหล็ก รอยบุบเล่าเรื่องราวได้`,Spiegelschild:`โล่กระจก`,"Der Schild glänzt wie ein Spiegel. Darin sehe ich einen bleichen Jungen, der Ritter werden will.":`โล่เงาวับเหมือนกระจก ผมเห็นเด็กหนุ่มหน้าซีดที่อยากเป็นอัศวินอยู่ในนั้น`,"Rostiger Dolch":`มีดสั้นขึ้นสนิม`,"Ein Dolch, so rostig, dass er nur noch Tetanus verspricht.":`มีดสั้นสนิมเขรอะจนสัญญาได้แค่บาดทะยัก`,"Trockenes Brot":`ขนมปังแห้ง`,"Ein hartes Brot. Man könnte damit Nägel einschlagen. Oder Wölfe vertreiben.":`ขนมปังแข็ง เอาไปตอกตะปูได้ หรือไล่หมาป่าก็ได้`,Räucherwurst:`ไส้กรอกรมควัน`,"Eine Räucherwurst. Woraus sie besteht, will niemand wissen. Sie duftet trotzdem himmlisch.":`ไส้กรอกรมควัน ทำจากอะไรไม่มีใครอยากรู้ แต่กลิ่นหอมเหมือนสวรรค์`,Apfel:`แอปเปิล`,"Ein roter Apfel. In diesen Zeiten ein kleines Wunder.":`แอปเปิลสีแดง ในยุคนี้ถือเป็นปาฏิหาริย์เล็ก ๆ`,Apfelrest:`เศษแอปเปิล`,"Ein angenagter Apfelrest. Der Wurm war zuerst da.":`เศษแอปเปิลที่ถูกแทะ หนอนมาก่อน`,Fieberkraut:`สมุนไพรแก้ไข้`,"Ein Bündel getrockneter Kräuter. Sie senken das Fieber, sagt man. Oder sie heben die Stimmung.":`สมุนไพรตากแห้งหนึ่งมัด ว่ากันว่าลดไข้ได้ หรือไม่ก็ทำให้อารมณ์ดีขึ้น`,Schlafkraut:`สมุนไพรกล่อมนอน`,"Violettes Kraut, das angenehm nach Heu duftet. Ein Hauch davon, und man schläft wie ein Stein.":`สมุนไพรสีม่วงกลิ่นหญ้าแห้งน่ารื่นรมย์ สูดนิดเดียวก็หลับเป็นตาย`,Fliegenpilz:`เห็ดแดง`,"Ein roter Pilz mit weißen Punkten. Wunderschön, giftig, ehrlich.":`เห็ดสีแดงมีจุดขาว สวยงาม มีพิษ ซื่อตรง`,"Leere Flasche":`ขวดเปล่า`,"Eine leere Glasflasche mit Korken. Sie wartet auf eine Bestimmung.":`ขวดแก้วเปล่ามีจุกไม้ก๊อก รอคอยจุดประสงค์ของมัน`,Weihwasser:`น้ำมนต์`,"Ein Fläschchen geweihtes Wasser. Es schimmert leicht und riecht nach Stein.":`ขวดเล็กใส่น้ำศักดิ์สิทธิ์ ส่องประกายอ่อน ๆ และกลิ่นเหมือนหิน`,"Trübes, grünes Wasser aus dem Moor. Es blubbert, ohne dass ich es schüttle.":`น้ำสีเขียวขุ่นจากหนองน้ำ มันเดือดปุด ๆ ทั้งที่ผมไม่ได้เขย่า`,Gegengift:`ยาถอนพิษ`,"Ein türkis leuchtender Trank. Er soll jedes Gift besiegen. Hoffentlich auch die Hexe.":`ยาเรืองแสงสีเทอร์ควอยซ์ ว่ากันว่าชนะพิษได้ทุกชนิด ขอให้ชนะแม่มดด้วย`,Giftflasche:`ขวดยาพิษ`,"Eine kleine schwarze Flasche mit einem Totenkopf. Beweis genug, dass hier jemand ehrlich war.":`ขวดดำเล็กมีรูปหัวกะโหลก พิสูจน์แล้วว่าที่นี่มีคนซื่อตรง`,"Roter Trank":`ยาแดง`,"Ein dunkelroter Trank in einer Kugelflasche. Er riecht nach Eisen und schlechten Ideen.":`ยาสีแดงเข้มในขวดกลม กลิ่นเหล็กกับความคิดแย่ ๆ`,Silbermünzen:`เหรียญเงิน`,"Ein paar stumpfe Silbermünzen. Für einen Totengräberlehrling ist das ein Vermögen.":`เหรียญเงินด้านไม่กี่เหรียญ สำหรับลูกศิษย์คนขุดหลุมศพ นี่คือเงินก้อนโต`,Münzbeutel:`ถุงเหรียญ`,"Ein Lederbeutel, schwer von fremdem Geld. Es riecht nach Grab. Ich sollte ihn besser nicht öffnen.":`ถุงหนังหนักด้วยเงินของคนอื่น กลิ่นเหมือนหลุมศพ ผมไม่เปิดมันดีกว่า`,Siegelbrief:`จดหมายตราประทับ`,"Eine Schriftrolle mit einem roten Wachssiegel. Der Segen der Kirche, schwarz auf weiß.":`ม้วนกระดาษประทับขี้ผึ้งแดง พรของคริสตจักร ขาวบนดำ`,Siegelring:`แหวนตราประทับ`,"Ein schwerer Ring mit einem Raben. Ein Ritter, der ihn trägt, hat Freunde, die zählen.":`แหวนหนักรูปอีกา อัศวินที่สวมมันมีเพื่อนที่นับได้`,"Halvards Brief":`จดหมายของ Halvard`,"Ein gefalteter Brief mit rotem Siegel. Ser Halvards Wort für mich. Er hat es mit zitternder Hand geschrieben.":`จดหมายพับประทับตราแดง คำของท่าน Halvard ถึงผม เขียนด้วยมือสั่น ๆ`,"Siegel der Weisheit":`ตราแห่งปัญญา`,"Ein goldenes Siegel mit einem offenen Auge. Es wiegt schwer, wie alles, was man sich verdient.":`ตราทองรูปตาเปิด หนักอึ้ง เหมือนทุกสิ่งที่ได้มาด้วยความพยายาม`,Hexentalisman:`เครื่องรางแม่มด`,"Ein winziger Rabenschädel an einer Lederschnur. Er hält die Geister des Moores fern. Behauptet er.":`หัวอีกาจิ๋วห้อยสายหนัง กันวิญญาณแห่งหนองน้ำได้ เขาว่าอย่างนั้น`,"Hildas Brosche":`เข็มกลัดของ Hilda`,"Eine silberne Rosenbrosche. Hilda hat sie jahrelang gehütet. Jetzt hütet sie mich.":`เข็มกลัดเงินรูปกุหลาบ Hilda เก็บรักษามันมาหลายปี ตอนนี้มันเก็บรักษาผมแทน`,Drachenei:`ไข่มังกร`,"Ein glühendes Ei, warm wie ein schlagendes Herz. Etwas darin scharrt leise.":`ไข่เรืองแสง อุ่นเหมือนหัวใจที่เต้นอยู่ มีอะไรข้างในขูดเบา ๆ`,"Ein goldverziertes Horn. Wer hineinbläst, beherrscht den Drachen. Wer es hält, beherrscht die Welt. Oder stirbt.":`เขาสัตว์ประดับทอง ใครเป่าก็บังคับมังกรได้ ใครถือก็ครองโลก หรือไม่ก็ตาย`,Rabenfeder:`ขนอีกา`,"Eine schwarze Rabenfeder. Glänzt wie dunkles Öl und bringt, sagt man, Unglück. Oder Tinte.":`ขนอีกาสีดำ มันวาวเหมือนน้ำมันดำ ว่ากันว่านำโชคร้ายมาให้ หรือหมึก`,"Eine menschenförmige Wurzel mit winzigen Blättchen. Sie wimmert leise, wenn man sie ansieht.":`รากไม้รูปคนมีใบเล็กจิ๋ว มันครางเบา ๆ เวลามีคนมอง`,Schlangenzunge:`ลิ้นงู`,"Eine getrocknete, gespaltene Zunge an einer Schnur. Ekelhaft, aber zutiefst medizinisch.":`ลิ้นแห้งแยกสองแฉกห้อยเชือก น่าขยะแขยง แต่ทางการแพทย์ล้ำลึก`,Totenkopf:`กะโหลก`,"Ein menschlicher Schädel. Er lächelt freundlicher als manche Dorfbewohner.":`กะโหลกมนุษย์ ยิ้มเป็นมิตรกว่าชาวบ้านบางคน`,Kerzenstummel:`เทียนตอ`,"Ein heruntergebrannter Kerzenstummel. Sein Licht war einst Hoffnung.":`เทียนที่ไหม้จนเหลือแค่ตอ แสงของมันเคยเป็นความหวัง`,"Ein verbeulter Zinnbecher. Man sieht, dass er nie geschont wurde.":`ถ้วยดีบุกบุบ ดูออกว่ามันไม่เคยได้รับการทะนุถนอม`,Holzlöffel:`ช้อนไม้`,"Ein Holzlöffel mit abgekautem Stiel. Ein Zeuge schwerer Zeiten.":`ช้อนไม้ด้ามถูกกัดแหว่ง พยานแห่งยุคลำบาก`,"Rostiger Nagel":`ตะปูสนิม`,"Ein krummer Nagel. Er hat schon Särge und Hoffnungen zusammengehalten.":`ตะปูคด เคยยึดทั้งโลงศพและความหวังไว้ด้วยกัน`,Tonscherbe:`เศษดินเผา`,"Eine Scherbe eines alten Kruges. Sie sagt nichts, aber sie weiß alles.":`เศษโถเก่า มันไม่พูดอะไร แต่รู้ทุกอย่าง`,Zahn:`ฟัน`,"Ein gelber Menschenzahn. Es fehlt der Rest. Besser, ich frage nicht.":`ฟันมนุษย์สีเหลือง ส่วนที่เหลือหายไป ผมไม่ถามดีกว่า`,Beinkamm:`หวีกระดูก`,"Ein kleiner Kamm aus Knochen. Hier steckt noch ein Haar drin. Ich sehe weg.":`หวีกระดูกเล็ก ๆ ยังมีเส้นผมติดอยู่เส้นหนึ่ง ผมมองไปทางอื่น`,Rosenkranz:`สายประคำ`,"Ein Rosenkranz aus Holzperlen. Jede Perle ein Gebet. Manche unerhört.":`สายประคำลูกปัดไม้ ลูกปัดแต่ละเม็ดคือคำอธิษฐาน บางเม็ดไม่มีใครฟัง`,Pergamentfetzen:`เศษกระดาษหนัง`,"Ein Fetzen Pergament. Man erkennt noch zwei Worte: „Sünden“ und „Schulden“.":`เศษกระดาษหนัง ยังอ่านออกสองคำ „บาป“ กับ „หนี้“`,Haarlocke:`ปอยผม`,"Eine Locke, mit einem Faden gebunden. Sie gehörte jemandem, der jemanden liebte.":`ปอยผมผูกด้วยเส้นด้าย เป็นของคนที่รักใครสักคน`,Holzkreuz:`ไม้กางเขน`,"Ein Kreuz an einer Schnur. Es hat vielen Menschen Trost gespendet. Und nicht gehalten, was es versprach.":`กางเขนห้อยเชือก ปลอบโยนผู้คนมามาก และไม่เคยทำได้อย่างที่สัญญา`,Holzritter:`อัศวินไม้`,"Ein winziger Ritter aus Holz. Der hat es gut: Er muss keine Prüfungen bestehen.":`อัศวินไม้จิ๋ว เขาสบายกว่าเรา ไม่ต้องสอบผ่านอะไรเลย`,Gänsefeder:`ขนห่าน`,"Eine weiße Feder. Als Schreibfeder zu gut für dieses Dorf.":`ขนสีขาว เป็นปากกาขนนกก็ดีเกินไปสำหรับหมู่บ้านนี้`,Rattenfalle:`กับดักหนู`,"Eine rostige Rattenfalle. Sie schnappt noch zu, aus Prinzip.":`กับดักหนูขึ้นสนิม ยังดีดปิดอยู่ เพราะหลักการ`,Messingknopf:`กระดุมทองเหลือง`,"Ein Messingknopf von einem Soldatenrock. Der Rock ist längst weg. Der Soldat auch.":`กระดุมทองเหลืองจากเสื้อทหาร เสื้อหายไปนานแล้ว ทหารก็ด้วย`,Glasauge:`ตาแก้ว`,"Ein Glasauge. Es starrt mich an, als wüsste es, was ich getan habe.":`ตาแก้วดวงหนึ่ง มันจ้องผมเหมือนรู้ว่าผมทำอะไรไว้`,Rabenkralle:`กรงเล็บอีกา`,"Eine gekrümmte schwarze Kralle. Sie kratzt nach Schicksal.":`กรงเล็บดำโค้ง ข่วนหาชะตากรรม`,Knochen:`กระดูก`,"Ein großer, abgenagter Knochen. Hunde würden dafür töten. Menschen auch.":`กระดูกชิ้นใหญ่ที่ถูกแทะแล้ว หมายอมฆ่าเพื่อมัน คนก็เหมือนกัน`,Würfel:`ลูกเต๋า`,"Zwei Knochenwürfel. Sie zeigen immer Pech. Selbst wenn man gewinnt.":`ลูกเต๋ากระดูกสองลูก ออกซวยตลอด แม้ตอนชนะ`,"Tote Ratte":`หนูตาย`,"Eine tote Ratte. Sie ist so steif wie die Pest. Ich fasse sie nur mit spitzen Fingern an.":`หนูตาย แข็งเป็นไม้เหมือนโรคระบาด ผมจับด้วยปลายนิ้วเท่านั้น`,Zinnring:`แหวนดีบุก`,"Ein billiger Zinnring. Das Herz, das ihn trug, war wertvoller.":`แหวนดีบุกราคาถูก หัวใจที่เคยสวมมันมีค่ากว่า`,Gürtelschnalle:`หัวเข็มขัด`,"Eine verbogene Bronzeschnalle. Sie hielt einst eine ganze Hose zusammen. Und ein Leben.":`หัวเข็มขัดสัมฤทธิ์บิดเบี้ยว เคยยึดกางเกงทั้งตัว และชีวิตหนึ่งไว้`,Spindel:`แกนปั่นด้าย`,"Eine Spindel mit Wollfaden. Vielleicht gehört sie zu einer Prinzessin. Eher nicht.":`แกนปั่นด้ายพร้อมเส้นขนแกะ บางทีอาจเป็นของเจ้าหญิง แต่คงไม่ใช่`,"Apfel und Wurst. Ein Festmahl, wenn man arm ist.":`แอปเปิลกับไส้กรอก งานเลี้ยงสำหรับคนจน`,"Totenkopf mit Kerzenstummel. Ein stimmungsvolles Lichtlein. Ich lasse es lieber.":`กะโหลกกับเทียนตอ แสงเทียนบรรยากาศดี ผมไม่ทำดีกว่า`,"Wein anzünden? Das wäre Verschwendung. Ich bin Ire im Herzen. Nein, Dorfbewohner.":`จุดไฟเผาไวน์เหรอ สิ้นเปลืองเปล่า ๆ ผมเป็นชาวไอริชในใจ ไม่สิ ชาวบ้าน`,"Ich werde nie wieder Wurst essen können.":`ผมคงกินไส้กรอกไม่ลงอีกแล้ว`,"Zahn und Knochen. Wir brauchen nur noch den Rest vom Mann.":`ฟันกับกระดูก เหลือแค่ส่วนที่เหลือของเจ้าของ`,"Totenkopf mit Rosenkranz. Der Mann ist jetzt gesegnet. Oder verspottet.":`กะโหลกกับสายประคำ ชายคนนั้นได้รับพรแล้ว หรือไม่ก็ถูกเยาะเย้ย`},le=`rabenschwur-lang`,ue=`de`,de=new Set;function fe(){try{let e=localStorage.getItem(le);(e===`th`||e===`de`)&&(ue=e)}catch{}return ue}var C=()=>ue;funct  e?JSON.parse(e):null}catch{return null}}function Ae(){return!!ke()}var je={schaufel:{name:`Schaufel`,look:`Eine abgenutzte Totengräberschaufel. Sie hat mehr Menschen begraben als der Pfarrer gesegnet hat.`},eimer:{name:`Eimer`,look:`Ein hölzerner Eimer mit Seilhenkel. Er riecht nach Brunnen und nassem Hund.`},eimer_wasser:{name:`Eimer Wasser`,look:`Ein voller Eimer. Das Wasser ist erstaunlich klar. Für Aschenfurt fast verdächtig.`},seil:{name:`Seil`,look:`Ein langes Hanfseil. Man hat es von einem Galgen abgeschnitten. Ich frage lieber nicht, warum es dort hing.`},hammer:{name:`Schmiedehammer`,look:`Ein schwerer Hammer. Der Stiel ist glatt vom Schweiß unzähliger Hände.`},nadel_zwirn:{name:`Nadel und Zwirn`,look:`Eine Knochennadel und eine Rolle derben Zwirn. Taugt zum Flicken. Oder zum Zunähen.`},feuerstein:{name:`Feuerstein`,look:`Feuerstein und Schlageisen. Der erste Funke ist ein Wunder, der zweite eine Gewohnheit.`},holzstab:{name:`Holzstab`,look:`Ein gerader Ast, so lang wie mein Arm. Noch kein Werkzeug, aber voller Hoffnung.`},pech:{name:`Pechklumpen`,look:`Klebriger, schwarzer Pech. Brennt schlecht, haftet gut. Wie die meisten Gerüchte.`},fackel:{name:`Fackel`,look:`Eine Fackel, in Pech getränkt. Das Licht wirft lange, unruhige Schatten.`},kohle:{name:`Kohle`,look:`Drei Klumpen Schmiedekohle. Sie färben alles schwarz, was sie berühren. Auch Gewissen.`},eisenstange:{name:`Eisenstange`,look:`Ein schweres Brecheisen. Es öffnet Türen, Truhen und gelegentlich Köpfe.`},kohlekiste_schluessel:{name:`Kleiner Schlüssel`,look:`Ein kleiner, schmutziger Eisenschlüssel. Er riecht nach Kohle und Verschlossenheit.`},eisenschluessel:{name:`Eiserner Schlüssel`,look:`Ein schlichter, rostiger Schlüssel. Er passt bestimmt irgendwo. Hoffentlich nicht in einen Sarg.`},gruftschluessel:{name:`Gruftschlüssel`,look:`Ein silberner Schlüssel mit einem Rabenkopf. Er hat Jahrzehnte im Dunkeln gelegen und sieht noch eingebildet aus.`},zellenschluessel:{name:`Zellenschlüssel`,look:`Ein riesiger Eisenschlüssel am Ring. So schwer, dass er sich nach Verantwortung anfühlt.`},kreide:{name:`Kreide`,look:`Ein Stück weiße Kreide. Zum Zeichnen, Zählen oder Schuldenaufschreiben.`},lappen:{name:`Lappen`,look:`Ein grauer Putzlumpen. Er hat schon bessere Tage gesehen. Und schlechtere Hände.`},sand:{name:`Sandsack`,look:`Ein kleiner Sack feiner Sand. Schleift Rost, Kruste und die gute Laune.`},kerze:{name:`Kerze`,look:`Eine lange, ungebrannte Talgkerze. Ein Luxus in diesen Zeiten.`},kerzenwachs:{name:`Bienenwachs`,look:`Ein goldener Klumpen Bienenwachs. Weich, warm und erstaunlich gut gegen lautes Geschrei.`},weihrauch:{name:`Weihrauch`,look:`Ein Klumpen Weihrauch in einem kleinen Schälchen. Es riecht nach Kirche und schlechtem Gewissen.`},klingenbruch:{name:`Klingenbruch`,look:`Die Hälfte eines Schwertes, vom Rost zerfressen. Irgendwer hat damit mehr Mut als Glück gehabt.`},schwert:{name:`Schwert`,look:`Mein Schwert. Selbst geschmiedet. Es ist nicht schön, aber es ist ehrlich.`},helm:{name:`Stahlhelm`,look:`Ein Ritterhelm mit Visier. Von innen riecht er nach Angst.`},brustpanzer:{name:`Brustpanzer`,look:`Ein Brustpanzer aus kaltem Stahl. Er wiegt mehr als meine Zukunft.`},armschienen:{name:`Armschienen`,look:`Ein Paar Armschienen aus Stahl. Sie klirren, wenn ich nervös bin. Also ständig.`},schild:{name:`Schild`,look:`Ein runder Holzschild mit Eisenbuckel. Er hat Dellen, die Geschichten erzählen.`},spiegelschild:{name:`Spiegelschild`,look:`Der Schild glänzt wie ein Spiegel. Darin sehe ich einen bleichen Jungen, der Ritter werden will.`},rostiger_dolch:{name:`Rostiger Dolch`,look:`Ein Dolch, so rostig, dass er nur noch Tetanus verspricht.`},brot_alt:{name:`Trockenes Brot`,look:`Ein hartes Brot. Man könnte damit Nägel einschlagen. Oder Wölfe vertreiben.`},wurst:{name:`Räucherwurst`,look:`Eine Räucherwurst. Woraus sie besteht, will niemand wissen. Sie duftet trotzdem himmlisch.`},apfel:{name:`Apfel`,look:`Ein roter Apfel. In diesen Zeiten ein kleines Wunder.`},apfelrest:{name:`Apfelrest`,look:`Ein angenagter Apfelrest. Der Wurm war zuerst da.`},wein:{name:`Weinkrug`,look:`Ein Tonkrug mit schwerem, rotem Wein. Er riecht nach Pflaumen und Entschuldigungen.`},fieberkraut:{name:`Fieberkraut`,look:`Ein Bündel getrockneter Kräuter. Sie senken das Fieber, sagt man. Oder sie heben die Stimmung.`},schlafkraut:{name:`Schlafkraut`,look:`Violettes Kraut, das angenehm nach Heu duftet. Ein Hauch davon, und man schläft wie ein Stein.`},pilz:{name:`Fliegenpilz`,look:`Ein roter Pilz mit weißen Punkten. Wunderschön, giftig, ehrlich.`},flasche_leer:{name:`Leere Flasche`,look:`Eine leere Glasflasche mit Korken. Sie wartet auf eine Bestimmung.`},weihwasser:{name:`Weihwasser`,look:`Ein Fläschchen geweihtes Wasser. Es schimmert leicht und riecht nach Stein.`},moorwasser:{name:`Moorwasser`,look:`Trübes, grünes Wasser aus dem Moor. Es blubbert, ohne dass ich es schüttle.`},gegengift:{name:`Gegengift`,look:`Ein türkis leuchtender Trank. Er soll jedes Gift besiegen. Hoffentlich auch die Hexe.`},giftflasche:{name:`Giftflasche`,look:`Eine kleine schwarze Flasche mit einem Totenkopf. Beweis genug, dass hier jemand ehrlich war.`},trank_rot:{name:`Roter Trank`,look:`Ein dunkelroter Trank in einer Kugelflasche. Er riecht nach Eisen und schlechten Ideen.`},silber:{name:`Silbermünzen`,look:`Ein paar stumpfe Silbermünzen. Für einen Totengräberlehrling ist das ein Vermögen.`},muenzbeutel:{name:`Münzbeutel`,look:`Ein Lederbeutel, schwer von fremdem Geld. Es riecht nach Grab. Ich sollte ihn besser nicht öffnen.`},siegelbrief:{name:`Siegelbrief`,look:`Eine Schriftrolle mit einem roten Wachssiegel. Der Segen der Kirche, schwarz auf weiß.`},siegelring:{name:`Siegelring`,look:`Ein schwerer Ring mit einem Raben. Ein Ritter, der ihn trägt, hat Freunde, die zählen.`},halvard_brief:{name:`Halvards Brief`,look:`Ein gefalteter Brief mit rotem Siegel. Ser Halvards Wort für mich. Er hat es mit zitternder Hand geschrieben.`},reliquie:{name:`Reliquie`,look:`Ein Fingerknochen in einem goldenen Schrein. Heilig, behauptet das Etikett. Der Knochen schweigt.`},weisheitssiegel:{name:`Siegel der Weisheit`,look:`Ein goldenes Siegel mit einem offenen Auge. Es wiegt schwer, wie alles, was man sich verdient.`},hexentalisman:{name:`Hexentalisman`,look:`Ein winziger Rabenschädel an einer Lederschnur. Er hält die Geister des Moores fern. Behauptet er.`},hildas_brosche:{name:`Hildas Brosche`,look:`Eine silberne Rosenbrosche. Hilda hat sie jahrelang gehütet. Jetzt hütet sie mich.`},drachenei:{name:`Drachenei`,look:`Ein glühendes Ei, warm wie ein schlagendes Herz. Etwas darin scharrt leise.`},horn:{name:`Drachenhorn`,look:`Ein goldverziertes Horn. Wer hineinbläst, beherrscht den Drachen. Wer es hält, beherrscht die Welt. Oder stirbt.`},rabenfeder:{name:`Rabenfeder`,look:`Eine schwarze Rabenfeder. Glänzt wie dunkles Öl und bringt, sagt man, Unglück. Oder Tinte.`},alraune:{name:`Alraune`,look:`Eine menschenförmige Wurzel mit winzigen Blättchen. Sie wimmert leise, wenn man sie ansieht.`},schlangenzunge:{name:`Schlangenzunge`,look:`Eine getrocknete, gespaltene Zunge an einer Schnur. Ekelhaft, aber zutiefst medizinisch.`},totenkopf:{name:`Totenkopf`,look:`Ein menschlicher Schädel. Er lächelt freundlicher als manche Dorfbewohner.`},kerzenstummel:{name:`Kerzenstummel`,look:`Ein heruntergebrannter Kerzenstummel. Sein Licht war einst Hoffnung.`},zinnbecher:{name:`Zinnbecher`,look:`Ein verbeulter Zinnbecher. Man sieht, dass er nie geschont wurde.`},holzloeffel:{name:`Holzlöffel`,look:`Ein Holzlöffel mit abgekautem Stiel. Ein Zeuge schwerer Zeiten.`},nagel:{name:`Rostiger Nagel`,look:`Ein krummer Nagel. Er hat schon Särge und Hoffnungen zusammengehalten.`},tonscherbe:{name:`Tonscherbe`,look:`Eine Scherbe eines alten Kruges. Sie sagt nichts, aber sie weiß alles.`},zahn:{name:`Zahn`,look:`Ein gelber Menschenzahn. Es fehlt der Rest. Besser, ich frage nicht.`},kamm:{name:`Beinkamm`,look:`Ein kleiner Kamm aus Knochen. Hier steckt noch ein Haar drin. Ich sehe weg.`},rosenkran en. Die Kurbel hängt ohne Seil, vom Eimer fehlt jede Spur. Jemand hat gründlich aufgeräumt, oder gründlich geplündert.`,take:async e=>{if(!et(e))return e.say(`Der Brunnen bleibt, wo er ist. Er hat Wurzeln.`);e.set(`c1_seil_am_brunnen`,!1),e.add(`seil`),e.sfx(`pickup`),await e.say(`Ich wickle das Seil von der Kurbel. Es hat dem Brunnen nichts gebracht, vielleicht bringt es mir etwas.`)},use:async e=>{if(!et(e))return e.say(`Die Kurbel dreht sich leer im Kreis. Ein Brunnen ohne Seil ist nur ein tiefes Loch mit Meinung.`);await e.say(`Die Kurbel läuft, das Seil sinkt. Ohne Eimer ziehe ich nur nasses Hanfseil nach oben. Ich brauche etwas zum Schöpfen.`)},useWith:{seil:async e=>{if(et(e))return e.say(`Das Seil hängt schon an der Kurbel.`);e.remove(`seil`),e.set(`c1_seil_am_brunnen`,!0),e.sfx(`creak`),await e.pose(`use`,500),await e.say(`Ich knote das Seil fest an die Kurbel. Es hält. Mehr kann man von einem Seil nicht verlangen.`)},eimer:async e=>{if(!et(e))return e.say(`Ein Eimer ohne Seil im Brunnen? Der Eimer fällt hinunter, ich sehe ihn nie wieder.`);await e.pose(`use`,700),e.sfx(`splash`),e.remove(`eimer`),e.add(`eimer_wasser`),await e.say(`Der Eimer taucht ein und kommt voll Wasser zurück. Es ist erstaunlich klar. Für Aschenfurt fast verdächtig.`)},eimer_wasser:`Ich schütte das Wasser zurück? Da hätte ich es nie hochholen müssen.`,flasche_leer:`Eine Flasche in den Brunnen tauchen? Das wäre nur Wasser. Für etwas Besonderes brauche ich das Weihwasserbecken in der Kapelle.`}},{id:`anschlagbrett`,name:`Anschlagbrett`,sprite:`anschlagbrett`,x:225,y:350,look:async e=>{e.set(`c1_dekret_gelesen`,!0),await e.say(`Das Anschlagbrett. Lauter Verordnungen, die niemand befolgt.`),await e.say(`„§1: Die Pest ist verboten. Zuwiderhandlungen werden mit dem Tod bestraft.“ Ich bin beeindruckt von der Logik.`),await e.say(`„§2: Wer stirbt, zahlt Leichensteuer. Hinterbliebene haften.“`),await e.say(`„§3: In jeder Sakristei des Reiches sind die Heiligen Zeichen mit Ehrfurcht zu betätigen l. In diesem auch noch etwas anderes.`,primary:`use`,take:e=>at(e),use:e=>at(e)},{id:`leichenkarren`,name:`Leichenkarren`,sprite:`leichenkarren`,x:345,y:426,look:`Der Leichenkarren von Aschenfurt. Darauf liegt Bertold, der Fuhrmann, unter einem fadenscheinigen Tuch. Ein Zipfel von einem Geldbeutel schaut hervor.`,take:e=>ot(e),use:e=>ot(e)},N({id:`kiste_dorf`,name:`Kiste`,x:510,y:408,sprites:{closed:`kiste_dorf`,open:`kiste_dorf_offen`},contents:[`brot_alt`,`wurst`,`wuerfel`,`apfelrest`],lock:{key:`eisenschluessel`,text:`Mit einem Vorhängeschloss gesichert. Ein Eisenschlüssel wäre schön.`,openText:`Das Schloss springt auf, als hätte es nur darauf gewartet.`},look:Ze(e=>L(e,`unlocked_kiste_dorf`)?`Kunz' Kiste. Offen und erstaunlich bescheiden.`:`Eine Kiste mit einem schweren Vorhängeschloss. Wem sie gehört, hat sie nicht mehr abgeholt.`)}),{id:`regentonne`,name:`Regentonne`,sprite:`regentonne`,x:790,y:418,look:`Eine Regentonne mit grünem Wasser. Mückenlarven schwimmen darin wie kleine, unzufriedene Fische.`,use:`Ich schaue hinein. Das Wasser schaut zurück und riecht nach Pestgrube. Das ist nichts zum Trinken, nicht einmal für Wölfe.`,take:`Ich nehme eine Tonne Wasser mit? Ich bin Totengräber, kein Brunnenbauer.`,useWith:{eimer:`Wasser aus der Regentonne? Das ist grün und lebt. Ich suche etwas Klareres, den Brunnen etwa.`,eimer_wasser:`Ich schütte das gute Wasser in die schlechte Tonne? Das wäre eine Verschwendung wie eine Beichte bei Brandt.`}},{id:`wohnhaus_tuer`,name:`Haustür`,sprite:null,x:321,y:300,hit:[300,248,42,56],at:{x:321,y:330},look:`Eine verschlossene Haustür. Dahinter hört man Husten. Ich klopfe lieber nicht.`,use:`Ich klopfe an. Von innen ruft jemand: „Wir sind alle tot! Kommt morgen wieder!“`},{id:`burg_fern`,name:`Burg Grauwacht`,sprite:null,x:585,y:120,hit:[524,25,120,120],at:{x:585,y:345},look:`Burg Grauwacht, hoch auf ihrem Felsen. Dort wohnt der König, und dort sitzt der Rabenorden. Weit weg, und doch zum Greifen nah.`,use:`Ich winke der Burg zu. ht heraus. Hier hängt sie gut.`:`Der Halter ist leer. Eine brennende Fackel würde ihn schmücken.`),useWith:{fackel:async e=>{if(!L(e,`c1_torch_lit`))return e.say(`Die Fackel ist nicht angezündet. In den Halter gesteckt bringt sie niemandem etwas.`);e.remove(`fackel`),e.set(`c1_torch_lit`,!1),e.set(`c1_halter_fackel`,!0),e.sfx(`fire`),await e.say(`Ich stecke die brennende Fackel in den Halter. Sie leuchtet stetig und brennt nicht ab, solange sie dort bleibt. Immerhin etwas.`)}}}),{id:`halter_licht`,name:``,sprite:null,x:610,y:260,decor:!0,hidden:e=>!L(e,`c1_halter_fackel`),light:{r:230,color:`rgba(255,170,70,0.55)`,flicker:.2,dy:10}},Xe({id:`spinnweben`,name:`Spinnweben`,sprite:null,x:235,y:110,hit:[190,70,120,120],at:{x:235,y:372},look:`Dichte Spinnweben, groß wie Fischernetze. Wer hier haust, hat hundert Augen und keinen Hunger. Hoffentlich.`}),Xe({id:`deckenloch`,name:`Lichtschacht`,sprite:null,x:585,y:40,hit:[545,0,80,120],at:{x:585,y:372},look:`Ein schmaler Schacht in der Decke, durch den ein bisschen Mondlicht fällt. Ein Gruß von oben, wo die Lebenden sind.`}),Xe(M({id:`g_rabenkralle`,item:`rabenkralle`,x:585,y:410,say:`Eine Rabenkralle. Vermutlich vom letzten Raben, der sich hierher verirrt hat. Ich frage nicht.`}))]},dt=(e,...t)=>D(e,`anselm`,...t),ft=(e,...t)=>D(e,`oswin`,...t),pt={R:`Rabe`,L:`Lamm`,K:`Kreuz`},mt={R:`den Raben`,L:`das Lamm`,K:`das Kreuz`},ht=e=>async t=>{if(L(t,`c1_rune_offen`))return t.say(`Die Runenknöpfe sind eingesunken. Der Schrank ist offen. Mehr gibt es hier nicht zu schieben.`);t.sfx(`clank`),await t.pose(`use`,350);let n=String(t.flag(`c1_rune_seq`)??``)+e;if(t.set(`c1_rune_seq`,n),n.length<3){await t.say(`Ich drücke ${mt[e]}. Der Knopf rastet ein. Das Schloss schweigt und wartet.`);return}if(t.set(`c1_rune_seq`,``),n===`RLK`){t.sfx(`unlock`),t.flash(`#ffe9a0`,500),t.set(`c1_rune_offen`,!0);for(let e of[1,2,3])t.set(`unlocked_sakristei_${e}`,!0);await t.say(`Ich drücke ${mt[e]}. Ein tiefes Klicken, ein Rumpeln: Die Knöpfe versinken, anselm_talk`,pray:`anselm_pray`},look:`Pater Anselm, hager, mit einem Schal vor dem Gesicht gegen die Pest. Er sieht aus wie ein Gebet auf zwei Beinen. Einem sehr müden Gebet.`,give:{reliquie:e=>_t(e),silber:`„Almosen? Wirf sie in den Opferstock, mein Sohn. Der Himmel führt Buch. Ich auch.“`,weihwasser:`„Das ist Weihwasser! Aus meinem Becken? Wunderbar! Nein, behalte es, du wirst es noch brauchen.“`},talk:async e=>{await k(e,`c1_met_anselm`,async()=>{await dt(e,`Ah, eine lebende Seele! Die erste seit Tagen, die nicht beichten will, weil es zu spät ist.`),await O(e,`Pater Anselm, ich bin Bran, Oswins Lehrling.`),await dt(e,`Der Totengräberjunge. Ja. Willkommen in der Kapelle von Aschenfurt. Bitte nicht atmen. Oder atmen, aber leise.`)}),await A(e,()=>[{text:`Ich brauche den Segen der Kirche.`,show:()=>!L(e,`have_blessing`),run:async()=>{await dt(e,`Den Segen für den Rabenorden. Natürlich. Der Orden ist streng, aber gerecht. Und ich bin geizig, aber großzügig.`),await dt(e,`Ich siegle dir den Brief, wenn du mir etwas zurückbringst: den Fingerknochen des heiligen Corvin.`),await dt(e,`Er lag im Reliquienschrein in der Gruft unter der Falltür. Räuber haben ihn gestohlen, aber sie fanden die Gruft nicht wieder und ließen ihn zurück. Eine lange Geschichte. Ich habe sie nie ganz geglaubt.`),e.set(`c1_anselm_quest`,!0)}},{text:`Wie komme ich in die Gruft?`,show:()=>!!e.flag(`c1_anselm_quest`)||L(e,`c1_met_anselm`),run:async()=>{await dt(e,`Die Falltür ist verschlossen. Den Schlüssel bewahre ich im Sakristeischrank auf, dem mit dem Runenschloss.`),await dt(e,`Die Zeichen müssen in der richtigen Reihenfolge gedrückt werden. Ich habe sie vergessen. Ich weiß nur, dass es auf einem Anschlag steht. Auf dem Dorfplatz.`),await dt(e,`In der Gruft ist es dunkel. Nimm Licht mit. Und denk an den Wächter. Er mag keine Diebe. Weihwasser, mein Sohn, Weihwasser besänftigt ihn.`),e.set(`c1_gruft_bekannt`,!0)}},{text:`Das Weihwasserbecken ist leer.`,done:()=>L(e,`c1_becken_voll`),run:async()
